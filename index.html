  }
  function personalBests(model, today) {
    const R0 = model.readings, out = [];
    const months = monthTotals(R0);
    const top = (arr, f) => arr.reduce((b, x) => (!b || f(x) > f(b) ? x : b), null);
    const mw = top(months, x => x.words);
    if (mw && mw.words) out.push({ key: 'monthWords', title: 'Biggest month by words', value: fmtK(mw.words) + ' words', sub: monthName(mw.month), date: mw.month, est: mw.est, target: { type: 'range', start: mw.month + '-01', end: mw.month + '-31' } });
    const mf = top(months, x => x.finished);
    if (mf && mf.finished) out.push({ key: 'monthFics', title: 'Biggest month by fics finished', value: `${mf.finished} fics`, sub: monthName(mf.month), date: mf.month, est: mf.est, target: { type: 'range', start: mf.month + '-01', end: mf.month + '-31' } });
    const fin = R0.filter(r => r.kind === 'Read');
    const lf = top(fin, r => r.fic.words);
    if (lf) out.push({ key: 'longest', title: 'Longest fic finished', value: fmtK(lf.fic.words) + ' words', sub: lf.fic.title, date: lf.date, est: lf.est, target: { type: 'fic', key: lf.ficKey } });
    const wk = new Map();
    for (const r of fin) { if (!r.date) continue; const k = weekStart(r.date), e = wk.get(k) || { week: k, n: 0, est: false }; e.n++; e.est = e.est || r.est; wk.set(k, e); }
    const bw = top([...wk.values()], x => x.n);
    if (bw) out.push({ key: 'week', title: 'Most fics finished in a week', value: `${bw.n} fics`, sub: `Week of ${fmtDay(bw.week, today)}`, date: bw.week, est: bw.est, target: { type: 'range', start: bw.week, end: addDays(bw.week, 6) } });
    const st = streaks(model, today);
    if (st.longestWeekly.len) out.push({ key: 'weekly', title: 'Longest weekly streak', value: `${st.longestWeekly.len} weeks`, sub: `${fmtDay(st.longestWeekly.start, today)} – ${fmtDay(st.longestWeekly.end, today)}`, date: st.longestWeekly.end, est: st.longestWeekly.est, target: { type: 'range', start: st.longestWeekly.start, end: st.longestWeekly.end } });
    if (st.longestDaily.len) out.push({ key: 'daily', title: 'Longest daily streak', value: `${st.longestDaily.len} day${st.longestDaily.len === 1 ? '' : 's'}`, sub: `${fmtDay(st.longestDaily.start, today)} – ${fmtDay(st.longestDaily.end, today)}`, date: st.longestDaily.end, est: st.longestDaily.est, target: { type: 'range', start: st.longestDaily.start, end: st.longestDaily.end } });
    const au = model.authors.find(a => a.fics >= MIN_RANK) || null;
    if (au) out.push({ key: 'author', title: 'Most-read author', value: au.author, sub: `${au.fics} fics · ${fmtK(au.words)} words`, date: null, est: false, target: { type: 'author', author: au.author } });
    const rr = rereadList(model).rows[0];
    if (rr) out.push({ key: 'reread', title: 'Most re-read fic', value: `${rr.times} reads`, sub: rr.fic.title, date: rr.latest, est: false, target: { type: 'fic', key: rr.fic.key } });
    const logged = fin.filter(r => r.date && isLogged(r) && r.started <= r.date);
    const ff = logged.reduce((b, r) => { const d = dayDiff(r.started, r.date); return !b || d < b.d || (d === b.d && r.fic.words > b.r.fic.words) ? { r, d } : b; }, null);
    // Fastest finish is logged-only: below MIN_LOGGED logged reads the card shows an empty state.
    const enoughLogged = logged.length >= MIN_LOGGED;
    out.push(ff && enoughLogged
      ? { key: 'fastest', title: 'Fastest finish', value: ff.d === 0 ? 'Same day' : `${ff.d} day${ff.d === 1 ? '' : 's'}`, sub: `${ff.r.fic.title} · ${fmtK(ff.r.fic.words)} words`, date: ff.r.date, est: false, logged: logged.length, enough: true, target: { type: 'fic', key: ff.r.ficKey } }
      : { key: 'fastest', title: 'Fastest finish', value: '—', sub: '', date: null, est: false, logged: logged.length, enough: false, target: null });
    const five = [...new Map(R0.filter(r => r.fic.enjoyment === 5).map(r => [r.ficKey, r])).values()].sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    if (five.length) out.push({ key: 'fives', title: 'Top-rated fics', value: `${five.length} rated 5/5`, sub: five.slice(0, 3).map(r => r.fic.title).join(' · '), date: five[0].date, est: false, list: five.map(r => ({ key: r.ficKey, title: r.fic.title, date: r.date })), target: { type: 'fic', key: five[0].ficKey } });
    return out;
  }

  // ---- YEAR IN READING ----------------------------------------------------------------------
  // scope: { type: 'year', year } or { type: 'month', month: 'YYYY-MM' }. Uses dated readings in the
  // scope. Each card needs enough data or is skipped with a reason.
  const WORD_YARDSTICKS = [   // approximate published word counts
    { words: 1084170, name: 'the entire Harry Potter series' },
    { words: 298000, name: 'A Game of Thrones' },
    { words: 76944, name: "Harry Potter and the Philosopher's Stone" },
  ];
  function yardstick(words) {
    for (const y of WORD_YARDSTICKS) if (words >= y.words * 1.5 || y === WORD_YARDSTICKS[WORD_YARDSTICKS.length - 1]) {
      const n = words / y.words;
      return { n, text: n >= 1.5 ? `about ${Math.round(n)} ${y.name === 'the entire Harry Potter series' ? 'times ' + y.name : 'copies of ' + y.name}` : `about ${Math.round(n * 100)}% of ${y.name}` };
    }
  }
  // PERSONA (rule-based; the strongest = largest value ÷ threshold among those that apply):
  //   The Binger      >= 50% of logged finished words from fics finished within 2 days of starting
  //                   (needs >= MIN_LOGGED logged finished reads, else skipped).
  //   The Loyalist    top 5 authors (by words) account for > 40% of words.
  //   The Explorer    > 60% of authors read are new (first ever read falls in this period).
  //   The Longhauler  median finished length > 100k words.
  //   The WIP Chaser  skipped: the apps track complete fics only.
  //   The Re-reader   > 25% of readings are re-reads (read number above 1, or Times Read above 1).
  //   The Eclectic    when none apply.
  function persona(rs, model, start) {
    const cands = [], skipped = [];
    const fin = rs.filter(r => r.kind === 'Read');
    const logged = fin.filter(r => isLogged(r) && r.started <= r.date);
    if (logged.length < MIN_LOGGED) skipped.push({ name: 'The Binger', reason: `only ${logged.length} logged finished read${logged.length === 1 ? '' : 's'} (needs ${MIN_LOGGED})` });
    else {
      const lw = sumWords(logged), quick = sumWords(logged.filter(r => dayDiff(r.started, r.date) <= 2)), v = lw ? quick / lw : 0;
      cands.push({ name: 'The Binger', value: v, threshold: 0.5, ok: v >= 0.5, rule: `${pct(v)}% of your logged words came from fics finished within 2 days of starting (rule: 50% or more; based on ${logged.length} logged reads)` });
    }
    const words = new Map();
    for (const r of rs) for (const a of realAuthors(r.fic.authors)) words.set(a, (words.get(a) || 0) + (r.words || 0));
    const total = sumWords(rs);
    const top5 = [...words].sort((a, b) => b[1] - a[1]).slice(0, 5).map(([a]) => a);
    const t5 = total ? sumWords(rs.filter(r => r.fic.authors.some(a => top5.includes(a)))) / total : 0;
    cands.push({ name: 'The Loyalist', value: t5, threshold: 0.4, ok: t5 > 0.4, rule: `your top 5 authors wrote ${pct(t5)}% of your words (rule: over 40%)` });
    const authors = [...words.keys()];
    const newA = authors.filter(a => { const d = model.authorFirst.get(a); return d && d >= start; }).length;
    const ex = authors.length ? newA / authors.length : 0;
    cands.push({ name: 'The Explorer', value: ex, threshold: 0.6, ok: ex > 0.6, rule: `${pct(ex)}% of the ${authors.length} authors you read were new to you (rule: over 60%)` });
    const med = median(fin.map(r => r.fic.words)) || 0;
    cands.push({ name: 'The Longhauler', value: med / 100000, threshold: 1, ok: med > 100000, rule: `your median finished fic was ${fmtK(med)} words (rule: over 100k)` });
    skipped.push({ name: 'The WIP Chaser', reason: 'the fandom apps track complete fics only' });
    const rr = rs.filter(r => r.readNumber > 1 || r.fic.timesRead > 1).length, rv = rs.length ? rr / rs.length : 0;
    cands.push({ name: 'The Re-reader', value: rv, threshold: 0.25, ok: rv > 0.25, rule: `${pct(rv)}% of your reads were re-reads (rule: over 25%)` });
    const qualifying = cands.filter(c => c.ok).sort((a, b) => b.value / b.threshold - a.value / a.threshold);
    const chosen = qualifying[0] || { name: 'The Eclectic', rule: 'none of the other personas’ rules applied, so you read a bit of everything' };
    return { name: chosen.name, rule: chosen.rule, candidates: cands, skipped, qualifying: qualifying.map(c => c.name) };
  }
  function availableRecaps(readings, today) {
    const years = yearsWithReads(readings);
    const months = [...new Set(readings.filter(r => r.date && r.date.slice(0, 7) < today.slice(0, 7)).map(r => r.date.slice(0, 7)))].sort().reverse();
    return { years, months };
  }
  function recap(model, scope, today, isVisible) {
    const isYear = scope.type === 'year';
    const start = isYear ? `${scope.year}-01-01` : `${scope.month}-01`;
    const end = isYear ? `${scope.year}-12-31` : `${scope.month}-31`;
    const current = isYear ? String(scope.year) === today.slice(0, 4) : scope.month === today.slice(0, 7);
    const label = isYear ? `${scope.year}${current ? ' so far' : ''}` : monthName(scope.month) + (current ? ' so far' : '');
    const rs = model.readings.filter(r => inRange(r.date, start, end));
    const fin = rs.filter(r => r.kind === 'Read'), dnf = rs.filter(r => r.kind === 'DNF');
    const words = sumWords(rs);
    const cards = [], skipped = [];
    const add = (c) => cards.push(c), skip = (n, title, reason) => skipped.push({ n, title, reason });
    // 1 words
    if (words > 0) add({ n: 1, type: 'words', words, yardstick: yardstick(words).text, dnfNoWords: dnf.filter(r => r.words === null).length });
    else skip(1, 'Total words', 'no words read in this period');
    // 2 finished + DNFs
    if (rs.length) add({ n: 2, type: 'counts', finished: fin.length, dnfs: dnf.length });
    else skip(2, 'Fics finished and DNFs', 'no dated reads in this period');
    // 3 top fandom + pairing
    const byF = new Map(), byP = new Map();
    for (const r of rs) { byF.set(r.fandom, (byF.get(r.fandom) || 0) + (r.words || 0)); byP.set(r.pairingKey, (byP.get(r.pairingKey) || 0) + (r.words || 0)); }
    const tf = [...byF].sort((a, b) => b[1] - a[1])[0], tp = [...byP].sort((a, b) => b[1] - a[1])[0];
    if (tf && tf[1] > 0) { const p = model.pairingByKey.get(tp[0]) || {}; add({ n: 3, type: 'fandom', fandom: tf[0], fandomShare: tf[1] / words, pairing: p.name, pairingFandom: p.fandom, pairingShare: tp[1] / words }); }
    else skip(3, 'Top fandom and pairing', 'no words read in this period');
    // 4 top tags
    const tags = [...tagTotals(rs, isVisible)].filter(([, v]) => v.readings >= MIN_RANK && v.words > 0).sort((a, b) => b[1].words - a[1].words).slice(0, 5).map(([tag, v]) => ({ tag, words: v.words, readings: v.readings }));
    if (tags.length) add({ n: 4, type: 'tags', tags }); else skip(4, 'Top 5 tags', 'no tag has 3 or more reads in this period');
    // 5 longest fic
    const lf = fin.reduce((b, r) => (!b || r.fic.words > b.fic.words ? r : b), null);
    if (lf) add({ n: 5, type: 'longest', fic: lf.fic, ficKey: lf.ficKey, date: lf.date }); else skip(5, 'Longest fic', 'no finished fics in this period');
    // 6 most-read author
    const ar = authorRanking(rs).filter(a => a.readings >= MIN_RANK);
    if (ar.length) add({ n: 6, type: 'author', author: ar[0].author, fics: ar[0].fics, words: ar[0].words }); else skip(6, 'Most-read author', 'no author has 3 or more reads in this period');
    // 7 biggest month
    const months = monthTotals(rs);
    if (!isYear) skip(7, 'Biggest month', 'this is a one-month recap');
    else if (months.length < 2) skip(7, 'Biggest month', 'reads in fewer than 2 months');
    else { const m = months.reduce((b, x) => (x.words > b.words ? x : b)); add({ n: 7, type: 'month', month: m.month, words: m.words, finished: m.finished, est: m.est }); }
    // 8 busiest weekday
    const wd = weekdayCounts(rs);
    if (wd.total >= MIN_RATE) { const i = wd.counts.indexOf(Math.max(...wd.counts)); add({ n: 8, type: 'weekday', day: WEEKDAYS[i], count: wd.counts[i], total: wd.total, counts: wd.counts }); }
    else skip(8, 'Busiest weekday', `only ${wd.total} dated finished read${wd.total === 1 ? '' : 's'} (needs ${MIN_RATE})`);
    // 9 completion rate
    if (rs.length >= MIN_RATE) add({ n: 9, type: 'completion', rate: fin.length / rs.length, finished: fin.length, closed: rs.length });
    else skip(9, 'Completion rate', `only ${rs.length} closed read${rs.length === 1 ? '' : 's'} (needs ${MIN_RATE})`);
    // 10 new obsession: biggest riser vs the 12 months before the period
    const ps = isYear ? `${scope.year - 1}-01-01` : (() => { const [y, m] = scope.month.split('-').map(Number); const [py, pm] = monthShift(y, m, -12); return `${py}-${String(pm).padStart(2, '0')}-01`; })();
    const prev = model.readings.filter(r => r.date && r.date >= ps && r.date < start);
    if (prev.length < MIN_RATE) skip(10, 'A new obsession', `only ${prev.length} dated read${prev.length === 1 ? '' : 's'} in the 12 months before, too few to compare`);
    else {
      const tN = tagTotals(rs, isVisible), tT = tagTotals(prev, isVisible), wP = sumWords(prev);
      const rise = [...tN].filter(([, v]) => v.readings >= MIN_RANK).map(([tag, v]) => ({ tag, now: words ? v.words / words : 0, then: wP ? ((tT.get(tag) || {}).words || 0) / wP : 0, readings: v.readings }))
        .map(x => ({ ...x, change: (x.now - x.then) * 100 })).filter(x => x.change > 0).sort((a, b) => b.change - a.change)[0];
      if (rise) add({ n: 10, type: 'riser', ...rise }); else skip(10, 'A new obsession', 'no tag grew its share');
    }
    // 11 highest rated
    const rated = [...new Map(fin.filter(r => r.fic.enjoyment >= 4).map(r => [r.ficKey, r])).values()];
    const topScore = Math.max(0, ...rated.map(r => r.fic.enjoyment));
    const best = rated.filter(r => r.fic.enjoyment === topScore).sort((a, b) => (b.date || '').localeCompare(a.date || '')).slice(0, 5);
    if (best.length) add({ n: 11, type: 'rated', score: topScore, fics: best.map(r => ({ key: r.ficKey, fic: r.fic })) });
    else skip(11, 'Highest-rated fics', 'no finished fic rated 4 or 5 in this period');
    // 12 persona
    let per = null;
    if (rs.length) { per = persona(rs, model, start); add({ n: 12, type: 'persona', ...per }); }
    else skip(12, 'Reading persona', 'no reads in this period');
    // 13 one year ago (the same calendar month a year before the recap's last month)
    const lastMonth = isYear ? (current ? today.slice(0, 7) : `${scope.year}-12`) : scope.month;
    const [ly, lm] = lastMonth.split('-').map(Number);
    const agoKey = `${ly - 1}-${String(lm).padStart(2, '0')}`;
    const ago = model.readings.filter(r => r.date && r.date.startsWith(agoKey)).sort((a, b) => (b.fic.enjoyment || 0) - (a.fic.enjoyment || 0) || b.fic.words - a.fic.words);
    if (ago.length) add({ n: 13, type: 'ago', month: agoKey, fics: ago.slice(0, 3).map(r => ({ key: r.ficKey, fic: r.fic, kind: r.kind })), count: ago.length });
    else skip(13, 'One year ago', `no reads dated in ${monthName(agoKey)}`);
    // 14 closing summary
    if (rs.length) add({ n: 14, type: 'summary', words, finished: fin.length, dnfs: dnf.length, fandom: tf && tf[0], persona: per && per.name });
    else skip(14, 'Summary', 'no reads in this period');
    const est = rs.filter(r => r.est).length;
    return { scope, label, start, end, current, readings: rs.length, est, cards, skipped };
  }

  // Volume / completion / authors / tags findings for the Phase 1 charts that moved into Trends.
  function volumeFindings(readings) {
    const months = monthTotals(readings).filter(m => m.words > 0);
    const bw = months.reduce((b, x) => (!b || x.words > b.words ? x : b), null);
    const bf = months.reduce((b, x) => (!b || x.finished > b.finished ? x : b), null);
    return {
      words: bw ? `Your biggest month was ${monthName(bw.month)}, with ${fmtK(bw.words)} words read.` : 'No dated reads yet.',
      fics: bf ? `You finished the most fics in ${monthName(bf.month)}: ${bf.finished}.` : 'No dated finished reads yet.',
    };
  }
  function completionMonthFinding(series) {
    const rows = series.keys.map((k, i) => ({ k, closed: series.finished[i] + series.dnfs[i], rate: series.completion[i] })).filter(x => x.closed >= MIN_RATE);
    if (!rows.length) return 'No month has 5 or more closed reads yet.';
    const hi = rows.reduce((b, x) => (x.rate > b.rate ? x : b)), lo = rows.reduce((b, x) => (x.rate < b.rate ? x : b));
    return hi === lo ? `You finished ${pct(hi.rate)}% of what you started in ${monthName(hi.k)}.` : `Completion peaked at ${pct(hi.rate)}% in ${monthName(hi.k)} and dipped to ${pct(lo.rate)}% in ${monthName(lo.k)}.`;
  }
  // Shelves by status finding: how much of the Data List has been read or DNF'd.
  function statusFinding(model) {
    const total = model.fics.length, closed = model.fics.filter(f => f.status === 'Read' || f.status === 'DNF').length;
    return total ? `${closed.toLocaleString('en-AU')} of your ${total.toLocaleString('en-AU')} listed fics (${pct(closed / total)}%) are Read or DNF.` : 'No fics loaded yet.';
  }
  const fmtK = (n) => (n >= 1e6 ? String(n >= 1e7 ? Math.round(n / 1e6) : parseFloat((n / 1e6).toFixed(2))) + 'M' : n >= 1000 ? Math.round(n / 1000) + 'k' : String(n));

  // ==========================================================================================
  // 9. PHASE 3: DIVERSITY, GOALS, BADGES, SESSIONS, REFLECTIONS
  // ==========================================================================================

  // ---- DIVERSITY ----------------------------------------------------------------------------
  // Diversity score (0–100) = normalised Shannon entropy of words read across the categories of
  // one dimension:
  //     score = 100 × ( −Σ p·ln p ) ÷ ln k
  // where p is each category's share of words and k is the number of categories read (with words).
  // k = 1 (or no words) scores 0, because ln 1 = 0. A dimension is scored in a year only with
  // >= MIN_DIVERSITY readings dated in that year. Words follow section 2 (DNFs without Chapters
  // Read add none). Dimensions:
  //   fandom   r.fandom                 pairing  r.pairingKey (pairing within its fandom)
  //   author   words split equally between a fic's real authors (anonymous/orphan excluded)
  //   tag      each visible freeform tag gets the reading's words; p = tag words ÷ all tag words
  //   length   LENGTH_BANDS by the fic's Words          rating   Rating (S), blank = "Not rated"
  const MIN_DIVERSITY = 10;
  const DIVERSITY_DIMS = [
    { key: 'fandom', label: 'Fandom' }, { key: 'pairing', label: 'Pairing' }, { key: 'author', label: 'Author' },
    { key: 'tag', label: 'Freeform tag' }, { key: 'length', label: 'Length' }, { key: 'rating', label: 'Rating' },
  ];
  function categoryWords(rs, dim, isVisible, model) {
    const m = new Map();
    const add = (k, w) => { if (w > 0) m.set(k, (m.get(k) || 0) + w); };
    for (const r of rs) {
      const w = r.words || 0;
      if (!w) continue;
      if (dim === 'fandom') add(r.fandom, w);
      else if (dim === 'pairing') add(r.pairingKey, w);
      else if (dim === 'author') { const as = realAuthors(r.fic.authors); as.forEach(a => add(a, w / as.length)); }
      else if (dim === 'tag') { for (const t of new Set(r.fic.tags)) if (!isVisible || isVisible(t)) add(t, w); }
      else if (dim === 'length') add(lengthBand(r.fic.words).label, w);
      else if (dim === 'rating') add(r.fic.rating || 'Not rated', w);
    }
    return m;
  }
  function entropyScore(map) {
    const vals = [...map.values()].filter(v => v > 0), total = vals.reduce((a, b) => a + b, 0), k = vals.length;
    if (!total || k <= 1) return { score: 0, k };
    const h = -vals.reduce((s, v) => { const p = v / total; return s + p * Math.log(p); }, 0);
    return { score: Math.round(100 * h / Math.log(k)), k };
  }
  function diversityBreakdown(dim, map, model) {
    const total = [...map.values()].reduce((a, b) => a + b, 0);
    if (!total) return 'No words read.';
    const sorted = [...map].sort((a, b) => b[1] - a[1]);
    const share = (n) => Math.round(sorted.slice(0, n).reduce((t, [, v]) => t + v, 0) / total * 100);
    const name = (k) => dim === 'pairing' ? ((model && model.pairingByKey.get(k)) || {}).name || k : dim === 'fandom' ? shortFandom(k) : k;
    if (dim === 'author') return `Top 5 authors = ${share(5)}% of words (${map.size} authors).`;
    if (dim === 'tag') return `Top 10 tags = ${share(10)}% of tag words (${map.size} tags).`;
    return `${name(sorted[0][0])} = ${share(1)}% of words${sorted.length > 1 ? ` (${sorted.length} ${dim === 'length' ? 'bands' : dim === 'rating' ? 'ratings' : dim + 's'})` : ''}.`;
  }
  function diversityYear(readings, isVisible, year, model) {
    const rs = readings.filter(r => r.date && r.date.startsWith(year + '-'));
    const enough = rs.length >= MIN_DIVERSITY;
    const dims = DIVERSITY_DIMS.map(d => {
      const map = categoryWords(rs, d.key, isVisible, model);
      const e = entropyScore(map);
      const top = [...map].sort((a, b) => b[1] - a[1])[0];
      const total = [...map.values()].reduce((a, b) => a + b, 0);
      const nameOf = (k) => d.key === 'pairing' ? ((model && model.pairingByKey.get(k)) || {}).name || k : d.key === 'fandom' ? shortFandom(k) : k;
      const rows = [...map].sort((x, y) => y[1] - x[1]).slice(0, 8).map(([k, v]) => ({ key: k, name: nameOf(k), words: v, share: total ? v / total : 0 }));
      return { ...d, score: enough ? e.score : null, k: e.k, breakdown: diversityBreakdown(d.key, map, model), top: top ? top[0] : null, topName: top ? nameOf(top[0]) : null, topShare: top && total ? top[1] / total : 0, rows };
    });
    return { year, readings: rs.length, enough, dims };
  }
  function diversityByYear(readings, isVisible, model) {
    return yearsWithReads(readings).map(y => diversityYear(readings, isVisible, y, model));
  }
  // Finding: the biggest rise and the biggest fall vs the previous year among scored dimensions.
  function diversityFinding(cur, prev, model) {
    if (!cur || !cur.enough) return `Not enough reads in ${cur ? cur.year : 'this year'} to score variety (needs ${MIN_DIVERSITY}).`;
    if (!prev || !prev.enough) return `Your most varied dimension in ${cur.year} is ${[...cur.dims].sort((a, b) => b.score - a.score)[0].label.toLowerCase()} (${[...cur.dims].sort((a, b) => b.score - a.score)[0].score}); there's no scored year before it to compare with.`;
    const ch = cur.dims.map((d, i) => ({ d, p: prev.dims[i], delta: d.score - prev.dims[i].score }));
    const up = ch.filter(x => x.delta > 0).sort((a, b) => b.delta - a.delta)[0];
    const down = ch.filter(x => x.delta < 0).sort((a, b) => a.delta - b.delta)[0];
    const nm = (x) => x.d.label.toLowerCase();
    const why = (x) => x.d.top && x.d.topShare > x.p.topShare ? ` as ${x.d.key === 'pairing' ? ((model.pairingByKey.get(x.d.top) || {}).name || x.d.top) : x.d.key === 'fandom' ? shortFandom(x.d.top) : x.d.top} took over` : '';
    const parts = [];
    if (up) parts.push(`Your ${nm(up)} variety rose from ${up.p.score} to ${up.d.score} this year`);
    if (down) parts.push(`${parts.length ? 'your' : 'Your'} ${nm(down)} variety fell from ${down.p.score} to ${down.d.score}${why(down)}`);
    return parts.length ? parts.join('; ') + '.' : `Your variety in ${cur.year} matches ${prev.year} across every dimension.`;
  }

  // ---- GOALS --------------------------------------------------------------------------------
  // A goal row: { id, type, scope, target, start, end, created, archived }. Progress uses the same
  // definitions as the stat tiles (periodStats over the goal's dates, Melbourne calendar days):
  //   words        words read                     finished   fics finished (Read readings)
  //   newAuthors   authors whose first dated read falls in the period (as the tile)
  //   scoped       fics finished in a fandom ("f:<fandom>") or pairing ("p:<pairing key>")
  //   long         finished fics of 100k+ words
  //   completion   completion rate (finished ÷ closed) at or above target %
  //   weeks        different Monday–Sunday weeks with a reading day (as in streaks)
  // Pace: expected = target × share of the period gone by (days elapsed incl. today ÷ days in
  // period). On pace when value >= expected. Needed per week = what's left ÷ weeks remaining.
  // Completion goals are "on pace" while the rate is at or above target.
  const GOAL_TYPES = [
    { key: 'words', label: 'Words read', unit: 'words' }, { key: 'finished', label: 'Fics finished', unit: 'fics' },
    { key: 'newAuthors', label: 'New authors', unit: 'authors' }, { key: 'scoped', label: 'Fics finished in a fandom or pairing', unit: 'fics' },
    { key: 'long', label: 'Finish fics of 100k+ words', unit: 'fics' }, { key: 'completion', label: 'Keep completion rate at or above', unit: '%' },
    { key: 'weeks', label: 'Read in different weeks', unit: 'weeks' },
  ];
  function goalPeriod(kind, today, custom) {
    const map = { month: 'thisMonth', quarter: 'thisQuarter', year: 'thisYear' };
    const p = kind === 'custom' ? makePeriod('custom', today, custom) : makePeriod(map[kind] || kind, today);
    return { start: p.start, end: p.end };
  }
  function goalProgress(goal, model, today) {
    const start = goal.start, end = goal.end, target = Number(goal.target) || 0;
    const p = { unit: 'days', type: 'custom', start, end };
    const rs = model.readings.filter(r => inRange(r.date, start, end));
    let value = 0, rate = null, closed = 0;
    if (goal.type === 'words' || goal.type === 'finished' || goal.type === 'newAuthors' || goal.type === 'completion') {
      const st = periodStats(model.readings, p, model.authorFirst);
      value = goal.type === 'words' ? st.words : goal.type === 'finished' ? st.finished : goal.type === 'newAuthors' ? st.newAuthors : Math.round((st.completion || 0) * 100);
      rate = st.completion; closed = st.finished + st.dnfs;
    } else if (goal.type === 'scoped') {
      const sc = String(goal.scope || '');
      value = rs.filter(r => r.kind === 'Read' && (sc.startsWith('p:') ? r.pairingKey === sc.slice(2) : r.fandom === sc.slice(2))).length;
    } else if (goal.type === 'long') value = rs.filter(r => r.kind === 'Read' && r.fic.words >= 100000).length;
    else if (goal.type === 'weeks') value = new Set([...readingDays(model, today).keys()].filter(d => d >= start && d <= end).map(weekStart)).size;
    const totalDays = dayDiff(start, end) + 1;
    const upTo = today < end ? today : end;
    const elapsed = today < start ? 0 : Math.min(totalDays, dayDiff(start, upTo) + 1);
    const share = totalDays ? elapsed / totalDays : 1;
    const ended = today > end, notStarted = today < start;
    const daysLeft = ended ? 0 : totalDays - elapsed;
    let onPace, needed = null, met;
    if (goal.type === 'completion') {
      met = rate !== null && closed >= 1 && value >= target;
      onPace = met;
    } else {
      met = value >= target;
      const expected = target * share;
      onPace = value >= expected;
      const weeksLeft = Math.max(1, daysLeft) / 7;
      needed = met || ended ? 0 : Math.ceil((target - value) / weeksLeft);
    }
    const pctDone = goal.type === 'completion' ? (target ? Math.min(1, value / target) : 0) : (target ? Math.min(1, value / target) : 0);
    const status = ended ? (met ? 'met' : 'missed') : notStarted ? 'upcoming' : met ? 'done' : onPace ? 'on pace' : 'behind pace';
    return { value, target, pct: pctDone, share, elapsed, totalDays, daysLeft, onPace, needed, met, ended, status, closed, rate };
  }
  function describeGoal(goal, model) {
    const t = GOAL_TYPES.find(x => x.key === goal.type) || { label: goal.type, unit: '' };
    const n = Number(goal.target) || 0;
    const scopeName = () => { const sc = String(goal.scope || ''); return sc.startsWith('p:') ? ((model.pairingByKey.get(sc.slice(2)) || {}).name || sc.slice(2)) : shortFandom(sc.slice(2)); };
    if (goal.type === 'words') return `Read ${fmtK(n)} words`;
    if (goal.type === 'finished') return `Finish ${n} fic${n === 1 ? '' : 's'}`;
    if (goal.type === 'newAuthors') return `Read ${n} new author${n === 1 ? '' : 's'}`;
    if (goal.type === 'scoped') return `Finish ${n} ${scopeName()} fic${n === 1 ? '' : 's'}`;
    if (goal.type === 'long') return `Finish ${n} fic${n === 1 ? '' : 's'} of 100k+ words`;
    if (goal.type === 'completion') return `Keep completion at ${n}%+`;
    if (goal.type === 'weeks') return `Read in ${n} different week${n === 1 ? '' : 's'}`;
    return `${t.label} ${n}`;
  }

  // ---- BADGES -------------------------------------------------------------------------------
  // Badges are computed, never stored. Progress counts ALL readings (matching All-time totals).
  // The earned date is found by walking DATED readings in date order: the date the running total
  // first crosses the threshold; est. when that crossing reading is est. A badge whose total is
  // crossed only with undated readings is earned with dateUnknown.
  function badges(model, today) {
    const all = model.readings;
    const dated = all.filter(r => r.date).slice().sort((a, b) => a.date.localeCompare(b.date) || a.readNumber - b.readNumber);
    const out = [];
    const walkCross = (thresholds, inc) => {   // inc(r, state) -> running value after r
      const res = {}; const state = {};
      let i = 0;
      for (const r of dated) {
        const v = inc(r, state);
        while (i < thresholds.length && v >= thresholds[i]) { res[thresholds[i]] = { date: r.date, est: !!r.est, ficKey: r.ficKey }; i++; }
        if (i >= thresholds.length) break;
      }
      return res;
    };
    const ladder = (group, key, label, unitFn, thresholds, total, inc, fmtVal) => {
      const cross = walkCross(thresholds, inc);
      thresholds.forEach(t => {
        const earned = total >= t, c = cross[t];
        out.push({ group, key: `${key}-${t}`, title: label(t), rule: unitFn(t), threshold: t, value: total, earned,
          date: earned && c ? c.date : null, est: !!(earned && c && c.est), dateUnknown: earned && !c, progressText: `${fmtVal(Math.min(total, t))} of ${fmtVal(t)}` });
      });
    };
    const fin = all.filter(r => r.kind === 'Read');
    const fmtInt = (n) => Math.round(n).toLocaleString('en-AU');
    ladder('Words', 'words', t => `${fmtK(t)} words`, t => `Read ${fmtK(t)} words`, [100000, 500000, 1000000, 5000000, 10000000, 25000000],
      sumWords(all), (r, s) => (s.v = (s.v || 0) + (r.words || 0)), fmtK);
    ladder('Fics finished', 'finished', t => `${t} fics`, t => `Finish ${t} fics`, [10, 50, 100, 250, 500, 1000],
      fin.length, (r, s) => (s.v = (s.v || 0) + (r.kind === 'Read' ? 1 : 0)), fmtInt);
    const authorsAll = new Set(all.flatMap(r => realAuthors(r.fic.authors)));
    ladder('Authors', 'authors', t => `${t} authors`, t => `Read ${t} different authors`, [50, 100, 250, 500],
      authorsAll.size, (r, s) => { s.set = s.set || new Set(); realAuthors(r.fic.authors).forEach(a => s.set.add(a)); return s.set.size; }, fmtInt);
    const fandomsAll = new Set(all.map(r => r.fandom));
    ladder('Range', 'fandoms', () => 'Three fandoms', () => 'Read in 3 fandoms', [3],
      fandomsAll.size, (r, s) => { s.set = s.set || new Set(); s.set.add(r.fandom); return s.set.size; }, fmtInt);
    [[200000, 'Epic'], [500000, 'Saga']].forEach(([w, nm]) => {
      const longest = Math.max(0, ...fin.map(r => r.fic.words));
      ladder('Range', `long${w}`, () => `${nm}: ${fmtK(w)}+`, () => `Finish a ${fmtK(w)}+ word fic`, [1],
        fin.filter(r => r.fic.words >= w).length, (r, s) => (s.v = (s.v || 0) + (r.kind === 'Read' && r.fic.words >= w ? 1 : 0)), () => '');
      const b = out[out.length - 1]; b.progressText = `Longest so far: ${fmtK(longest)} words`;
    });
    // Weekly streaks: the date of the first reading day in the Nth week of the first run that long.
    const days = readingDays(model, today);
    const weeks = [...new Set([...days.keys()].sort().map(weekStart))].sort();
    const runs = runsOf(weeks, w => addDays(w, 7));
    const longestRun = Math.max(0, ...runs.map(r => r.len));
    [10, 20].forEach(n => {
      const run = runs.find(r => r.len >= n);
      let date = null, est = false;
      if (run) {
        const wk = run.keys[n - 1];
        const d = Array.from({ length: 7 }, (_, i) => addDays(wk, i)).find(x => days.has(x));
        date = d; est = !days.get(d).logged;
      }
      out.push({ group: 'Streaks', key: `streak-${n}`, title: `${n}-week streak`, rule: `Read in ${n} weeks in a row`, threshold: n, value: longestRun, earned: !!run,
        date, est, dateUnknown: false, progressText: `Longest streak: ${longestRun} of ${n} weeks` });
    });
    // First re-read.
    const rr = dated.find(r => r.readNumber > 1);
    const rrFallback = !rr ? dated.find(r => r.fic.timesRead > 1) : null;
    out.push({ group: 'Habits', key: 'reread', title: 'First re-read', rule: 'Re-read a fic', threshold: 1, value: rr || rrFallback ? 1 : 0, earned: !!(rr || rrFallback || all.some(r => r.fic.timesRead > 1)),
      date: rr ? rr.date : rrFallback ? rrFallback.date : null, est: rr ? !!rr.est : !!rrFallback, dateUnknown: !rr && !rrFallback && all.some(r => r.fic.timesRead > 1), progressText: 'No re-reads yet' });
    // Logged reads.
    const loggedAll = all.filter(r => isLogged(r)).length;
    ladder('Habits', 'logged', t => t === 1 ? 'First logged read' : `${t} logged reads`, t => t === 1 ? 'Log a read with a start date in a fandom app' : `Log ${t} reads with a start date`, [1, 25],
      loggedAll, (r, s) => (s.v = (s.v || 0) + (isLogged(r) ? 1 : 0)), fmtInt);
    // A month with 80%+ completion and at least 10 closed reads (judged on the whole month; dated to the read that met it).
    const byMonth = new Map();
    for (const r of dated) { const k = r.date.slice(0, 7); if (!byMonth.has(k)) byMonth.set(k, []); byMonth.get(k).push(r); }
    let monthBadge = null, bestMonth = null;
    for (const [k, rs] of [...byMonth].sort()) {
      const f = rs.filter(r => r.kind === 'Read').length, rate = f / rs.length;
      if (rs.length >= 10 && (!bestMonth || rate > bestMonth.rate)) bestMonth = { k, rate, closed: rs.length };
      if (!monthBadge && rs.length >= 10 && rate >= 0.8) {
        let ff = 0, met = null;
        rs.forEach((r, i) => { if (r.kind === 'Read') ff++; if (!met && i + 1 >= 10 && ff / (i + 1) >= 0.8) met = r; });
        met = met || rs[rs.length - 1];
        monthBadge = { k, date: met.date, est: !!met.est };
      }
    }
    out.push({ group: 'Habits', key: 'month80', title: 'Finisher month', rule: 'A month with 80%+ completion and 10+ closed reads', threshold: 1, value: monthBadge ? 1 : 0, earned: !!monthBadge,
      date: monthBadge && monthBadge.date, est: !!(monthBadge && monthBadge.est), dateUnknown: false,
      progressText: bestMonth ? `Best month so far: ${Math.round(bestMonth.rate * 100)}% in ${monthName(bestMonth.k)} (${bestMonth.closed} closed)` : 'No month with 10+ closed reads yet' });
    // Read in all 12 months of a calendar year.
    let allYear = null, bestYear = null;
    for (const y of yearsWithReads(dated)) {
      const seen = new Set(); let hit = null;
      for (const r of dated) { if (!r.date.startsWith(y + '-')) continue; const m = r.date.slice(5, 7); if (!seen.has(m)) { seen.add(m); if (seen.size === 12) { hit = r; break; } } }
      if (!bestYear || seen.size > bestYear.n) bestYear = { y, n: seen.size };
      if (hit && !allYear) allYear = { date: hit.date, est: !!hit.est };
    }
    out.push({ group: 'Habits', key: 'allyear', title: 'Every month', rule: 'Read in all 12 months of a calendar year', threshold: 12, value: bestYear ? bestYear.n : 0, earned: !!allYear,
      date: allYear && allYear.date, est: !!(allYear && allYear.est), dateUnknown: false, progressText: bestYear ? `${bestYear.n} of 12 months in ${bestYear.y}` : '0 of 12 months' });
    // Rated 10 fics 5/5 (dated by each fic's finish date; Enjoyment has no date of its own).
    const fivesAll = new Set(fin.filter(r => r.fic.enjoyment === 5).map(r => r.ficKey));
    ladder('Habits', 'fives', () => 'Ten 5/5s', () => 'Rate 10 finished fics 5/5', [10],
      fivesAll.size, (r, s) => { s.set = s.set || new Set(); if (r.kind === 'Read' && r.fic.enjoyment === 5) s.set.add(r.ficKey); return s.set.size; }, fmtInt);
    const recent = out.filter(b => b.earned && b.date && b.date >= addDays(today, -6) && b.date <= today);
    return { list: out, recent };
  }

  // ---- SESSIONS -----------------------------------------------------------------------------
  // From "Session started" / "Session ended" Reading Log events (timestamps with a time of day).
  // A session runs from a start to the next end for the same fic, on the same day, lasting at
  // most 6 hours; a second start before an end replaces the first (unmatched starts are ignored).
  //   minutes  = end − start
  //   words    = fic Words × chapters progressed ÷ chapters (progressed = end − start Chapters Read, min 0)
  //   words per minute = median over sessions of 5+ minutes that moved forward at least a chapter (overall and per length band, bands need MIN_RANK)
  const MIN_SESSIONS = 5;
  const tsMinutes = (ts) => { const m = /^(\d{4}-\d{2}-\d{2})[ T](\d{1,2}):(\d{2})/.exec(ts || ''); return m ? { date: m[1], min: +m[2] * 60 + +m[3] } : null; };
  function sessions(model) {
    const out = [];
    for (const [key, list] of model.eventsByKey) {
      const fic = model.ficByKey.get(key); if (!fic) continue;
      let open = null;
      for (const e of list) {
        if (e.event === 'Session started') { const t = tsMinutes(e.ts); open = t ? { e, t } : null; }
        else if (e.event === 'Session ended' && open) {
          const t = tsMinutes(e.ts);
          if (t && t.date === open.t.date && t.min >= open.t.min && t.min - open.t.min <= 360) {
            const progressed = Math.max(0, (e.chaptersRead || 0) - (open.e.chaptersRead || 0));
            out.push({ ficKey: key, fic, date: t.date, startMin: open.t.min, minutes: t.min - open.t.min, progressed,
              words: fic.chapters ? Math.round(fic.words * progressed / fic.chapters) : 0 });
          }
          open = null;
        }
      }
