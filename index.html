const WEEKDAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
// DNF marker: a #111 "DNF" pill plus the DNR reason beside it.
function DnfPill({ fic }) {
  return html`<span className="row" style=${{ gap: 6, flexWrap: 'nowrap', display: 'inline-flex' }}><span className="badge dnf">DNF</span>${fic.dnrReason ? html`<span className="dnf-reason">${fic.dnrReason}</span>` : null}</span>`;
}
const fmtKudos = (n) => (n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1).replace(/\.0$/, '') + 'k' : String(n || 0));
function DiaryRow({ r, onOpen }) {
  const d = r.date ? r.date.split('-').map(Number) : null;
  const wd = d ? WEEKDAYS[new Date(Date.UTC(d[0], d[1] - 1, d[2])).getUTCDay()] : '';
  const c = fandomColor(r.fandom), dnf = r.kind === 'DNF';
  return html`<button className=${'drow' + (dnf ? ' is-dnf' : '')} onClick=${() => onOpen(r.ficKey)}>
    <div className="date-dot" style=${{ background: c, color: onFill(c) }}>${d ? html`<b className="num">${d[2]}</b><span>${wd}</span>` : html`<b>—</b>`}</div>
    <div style=${{ minWidth: 0 }}>
      <div className=${'dtitle' + (dnf ? ' struck' : '')}>${r.fic.title}</div>
      <div className="dmeta">
        <span style=${{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', maxWidth: '100%' }}>${r.fic.authors.join(', ') || '—'}</span>
        <span>·</span><span className="num">${dnf ? (r.words === null ? `${fmtWords(r.fic.words)} (not counted)` : `${fmtWords(r.words)} of ${fmtWords(r.fic.words)}`) : fmtWords(r.words)}</span>
        ${r.fic.enjoyment ? html`<span>·</span><span>★ ${r.fic.enjoyment}</span>` : null}
        <span>·</span><span className="num">${fmtKudos(r.fic.kudos)} kudos</span>
      </div>
      <${SourceLine} fic=${r.fic} mode="one" style=${{ marginTop: 4 }} />
      ${dnf || r.readNumber > 1 || (r.origin === 'dataList' && r.fic.timesRead > r.readNumber) || r.est || r.fic.kg || r.fic.bk ? html`<div className="dmeta">
        ${dnf ? html`<${DnfPill} fic=${r.fic} />` : null}
        ${r.readNumber > 1 ? html`<span className="badge plain">${ordinal(r.readNumber)} read</span>` : null}
        ${r.origin === 'dataList' && r.fic.timesRead > r.readNumber ? html`<span className="badge plain">Read ${r.fic.timesRead} times</span>` : null}
        ${r.est ? html`<${EstBadge} />` : null}
        <${KB} fic=${r.fic} />
      </div>` : null}
    </div>
  </button>`;
}

function Diary({ readings, onOpen, today }) {
  const [limit, setLimit] = useState(60);
  useEffect(() => setLimit(60), [readings]);
  const sorted = useMemo(() => R.sortDiary(readings), [readings]);
  const shown = sorted.slice(0, limit);
  const groups = [];
  for (const r of shown) {
    const key = r.date ? r.date.slice(0, 7) : 'undated';
    if (!groups.length || groups[groups.length - 1].key !== key) groups.push({ key, items: [] });
    groups[groups.length - 1].items.push(r);
  }
  const counts = useMemo(() => { const c = {}; sorted.forEach(r => { const k = r.date ? r.date.slice(0, 7) : 'undated'; c[k] = (c[k] || 0) + 1; }); return c; }, [sorted]);
  if (!sorted.length) return html`<div className="card empty" style=${{ marginTop: 14 }}>Nothing matches these filters.</div>`;
  return html`<div>
    ${groups.map(g => html`<div key=${g.key}>
      <div className="month-head"><span className="hl lime">${g.key === 'undated' ? 'No date' : `${R.MONTHS[+g.key.slice(5) - 1]} ${g.key.slice(0, 4)}`}</span><span className="faint">${counts[g.key]}</span></div>
      <div className="diary">${g.items.map(r => html`<${DiaryRow} key=${r.id} r=${r} onOpen=${onOpen} />`)}</div>
    </div>`)}
    ${limit < sorted.length ? html`<button className="big-btn ghost" style=${{ marginTop: 14 }} onClick=${() => setLimit(l => l + 80)}>Show more (${sorted.length - limit} left)</button>` : null}
  </div>`;
}

function Library({ readings, onOpen, today, view, setView }) {
  const [limit, setLimit] = useState(48);
  useEffect(() => setLimit(48), [readings]);
  const fics = useMemo(() => {
    const m = new Map();
    for (const r of readings) {
      const e = m.get(r.ficKey) || { fic: r.fic, n: 0, last: null, kinds: new Set(), est: false };
      e.n++; e.kinds.add(r.kind); if (r.est) e.est = true;
      if (r.date && (!e.last || r.date > e.last)) e.last = r.date;
      m.set(r.ficKey, e);
    }
    return [...m.values()].sort((a, b) => (b.last || '').localeCompare(a.last || '') || a.fic.title.localeCompare(b.fic.title));
  }, [readings]);
  const shown = fics.slice(0, limit);
  const statusOf = (e) => e.fic.status === 'Read' || e.fic.status === 'DNF' ? e.fic.status : (e.kinds.has('Read') ? 'Read' : 'DNF');
  if (!fics.length) return html`<div className="card empty" style=${{ marginTop: 14 }}>Nothing matches these filters.</div>`;
  return html`<div>
    <div className="row" style=${{ justifyContent: 'space-between', margin: '14px 2px 10px' }}>
      <span className="small muted">${fmtInt(fics.length)} fic${fics.length === 1 ? '' : 's'}</span>
      <div className="seg">
        <button className=${view === 'cards' ? 'on' : ''} onClick=${() => setView('cards')} aria-label="Cards"><${Icon} name="grid" size=${15} /></button>
        <button className=${view === 'table' ? 'on' : ''} onClick=${() => setView('table')} aria-label="Table"><${Icon} name="table" size=${15} /></button>
      </div>
    </div>
    ${view === 'cards' ? html`<div className="lib-grid">${shown.map(e => html`<button key=${e.fic.key} className=${'lcard' + (statusOf(e) === 'DNF' ? ' is-dnf' : '')} style=${{ '--fc': fandomColor(e.fic.fandom) }} onClick=${() => onOpen(e.fic.key)}>
        <div className="row" style=${{ gap: 6 }}><span className="badge rating">${e.fic.rating || '—'}</span>${statusOf(e) === 'DNF' ? html`<${DnfPill} fic=${e.fic} />` : null}${e.est ? html`<${EstBadge} />` : null}</div>
        <div className=${'mini-title' + (statusOf(e) === 'DNF' ? ' struck' : '')}>${e.fic.title}</div>
        <div className="small muted" style=${{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>${e.fic.authors.join(', ')}</div>
        <${SourceLine} fic=${e.fic} />
        <div className="row small faint" style=${{ gap: 8, marginTop: 'auto' }}>
          <span className="num">${fmtWords(e.fic.words)}</span><span>${e.fic.chapters} ch</span>
          ${Math.max(e.n, e.fic.timesRead) > 1 ? html`<span>Read ${Math.max(e.n, e.fic.timesRead)} times</span>` : null}
          <span>${e.last ? R.fmtDay(e.last, today) : 'no date'}</span>
          <${Enjoy} n=${e.fic.enjoyment} />
        </div>
      </button>`)}</div>`
    : html`<div className="table-wrap"><table>
        <thead><tr><th>Title</th><th>Fandom · Pairing</th><th>Status</th><th>Last</th><th>Words</th><th>Enjoy</th><th>Rating</th><th>Reads</th></tr></thead>
        <tbody>${shown.map(e => html`<tr key=${e.fic.key} className=${'click' + (statusOf(e) === 'DNF' ? ' is-dnf' : '')} onClick=${() => onOpen(e.fic.key)}>
          <td className="t"><span className=${statusOf(e) === 'DNF' ? 'struck' : ''}>${e.fic.title}</span><div className="tiny faint" style=${{ fontWeight: 600 }}>${e.fic.authors.join(', ')}</div></td>
          <td style=${{ whiteSpace: 'normal', minWidth: 190 }}><${SourceLine} fic=${e.fic} mode="full" /></td>
          <td>${statusOf(e) === 'Read' ? 'Finished' : html`<${DnfPill} fic=${e.fic} />`}${e.est ? ' · est.' : ''}</td>
          <td className="num">${e.last ? R.fmtDay(e.last, today) : '—'}</td>
          <td className="num">${fmtWords(e.fic.words)}</td>
          <td>${e.fic.enjoyment ? e.fic.enjoyment + '/5' : '—'}</td>
          <td>${e.fic.rating || '—'}</td>
          <td className="num">${Math.max(e.n, e.fic.timesRead || 0)}</td>
        </tr>`)}</tbody>
      </table></div>`}
    ${limit < fics.length ? html`<button className="big-btn ghost" style=${{ marginTop: 14 }} onClick=${() => setLimit(l => l + 60)}>Show more (${fics.length - limit} left)</button>` : null}
  </div>`;
}

function DiaryScreen({ model, filters, setFilters, onOpen, today, ui, setUi }) {
  const readings = useMemo(() => R.filterReadings(model.readings, filters), [model, filters]);
  const words = readings.reduce((t, r) => t + (r.words || 0), 0);
  const dnfNo = readings.filter(r => r.kind === 'DNF' && r.words === null).length;
  return html`<div>
    <div className="row" style=${{ justifyContent: 'space-between', margin: '10px 0 14px' }}>
      <div className="seg">
        <button className=${ui.sub === 'diary' ? 'on' : ''} onClick=${() => setUi(u => ({ ...u, sub: 'diary' }))}>Diary</button>
        <button className=${ui.sub === 'library' ? 'on' : ''} onClick=${() => setUi(u => ({ ...u, sub: 'library' }))}>Library</button>
      </div>
      <span className="small faint num">${fmtInt(readings.length)} reads · ${fmtWords(words)} words</span>
    </div>
    <${SearchAndFilters} filters=${filters} setFilters=${setFilters} model=${model} open=${ui.filtersOpen} setOpen=${v => setUi(u => ({ ...u, filtersOpen: v }))} />
    ${dnfNo ? html`<div className="tiny faint" style=${{ margin: '8px 4px 0' }}>Word totals leave out ${dnfNo} DNF${dnfNo === 1 ? '' : 's'} with no chapters read.</div>` : null}
    ${ui.sub === 'diary' ? html`<${Diary} readings=${readings} onOpen=${onOpen} today=${today} />`
      : html`<${Library} readings=${readings} onOpen=${onOpen} today=${today} view=${ui.libView} setView=${v => setUi(u => ({ ...u, libView: v }))} />`}
  </div>`;
}

// Relationship tags, then freeform tags. Hidden (sex-related) tags sit behind a "+N hidden" chip.
function DetailTags({ fic }) {
  const ctx = useContext(TagCtx);
  const [reveal, setReveal] = useState(false);
  const shown = fic.tags.filter(ctx.isVisible), hidden = fic.tags.filter(t => !ctx.isVisible(t));
  return html`<div className="section">
    <div className="section-head"><h3 className="section-title">Tags</h3><${SexTagToggle} compact /></div>
    <div>
      ${fic.ships.map(t => html`<span key=${'s' + t} className="tagchip ship">${t}</span>`)}
      ${shown.map(t => html`<span key=${t} className="tagchip">${t}</span>`)}
      ${hidden.length && !reveal ? html`<button className="tagchip more" onClick=${() => setReveal(true)} aria-label=${`Show ${hidden.length} hidden sex-related tags`}>+${hidden.length} hidden</button>` : null}
      ${hidden.length && reveal ? html`${hidden.map(t => html`<span key=${'h' + t} className="tagchip revealed">${t}</span>`)}<button className="tagchip more" onClick=${() => setReveal(false)}>Hide</button>` : null}
    </div>
  </div>`;
}

function FicDetail({ ficKey, model, onClose, loadSummary, onAuthor, today, p4 }) {
  const fic = model.ficByKey.get(ficKey);
  const isCand = !!(fic && p4 && R.UP_NEXT_STATUSES.includes(fic.status));
  const ficN = useFicNudges(isCand ? fic : null, p4 || { nctx: null, store: { nudgeTypes: {}, dismissed: {} }, today });
  const pick = isCand && p4.up ? p4.up.picks.find(x => x.key === fic.key) : null;
  const [sum, setSum] = useState({ state: 'loading', text: '' });
  useEffect(() => {
    let live = true;
    setSum({ state: 'loading', text: '' });
    if (fic) loadSummary(fic).then(t => live && setSum({ state: 'ok', text: t }), e => live && setSum({ state: e.needsAuth ? 'auth' : 'err', text: e.message }));
    return () => { live = false; };
  }, [ficKey]);
  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', onKey);
    document.body.style.overflow = 'hidden';
    return () => { document.removeEventListener('keydown', onKey); document.body.style.overflow = ''; };
  }, []);
  if (!fic) return null;
  const readings = model.readings.filter(r => r.ficKey === ficKey).sort((a, b) => a.readNumber - b.readNumber);
  const events = model.eventsByKey.get(ficKey) || [];
  const authorCtx = R.realAuthors(fic.authors).map(a => model.authors.find(x => x.author === a)).filter(Boolean);
  const meta = [
    ['Published', fic.datePublished || '—'], ['Words', fmtInt(fic.words)],
    ['Chapters', fic.chaptersPlanned === fic.chapters ? String(fic.chapters) : `${fic.chapters} / ${fic.chaptersPlanned ?? '?'}`], ['Rating', fic.rating || '—'],
    ['Category', fic.category], ['Status', fic.status || 'Unread'],
    ['Kudos', fmtInt(fic.kudos)], ['Bookmarks', fmtInt(fic.bookmarks)], ['Hits', fmtInt(fic.hits)], ['Comments', fmtInt(fic.comments)],
    ['Enjoyment', fic.enjoyment ? `${fic.enjoyment} / 5` : '—'], ['Kudos left · Bookmarked', `${fic.kg ? 'Yes' : 'No'} · ${fic.bk ? 'Yes' : 'No'}`],
    ['Date started', fic.dateStarted ? R.fmtDay(fic.dateStarted, today) : '—'], ['Date read', fic.dateRead ? R.fmtDay(fic.dateRead, today) : '—'],
    ['Last read', fic.lastRead || '—'], ['Times read', fic.timesRead ? String(fic.timesRead) : '—'],
  ];
  if (fic.dnrReason) meta.splice(6, 0, ['DNR reason', fic.dnrReason]);
  return html`<div className="sheet-back" onClick=${onClose}>
    <div className="sheet" onClick=${e => e.stopPropagation()} role="dialog" aria-modal="true" aria-label=${fic.title} style=${{ '--fc': fandomColor(fic.fandom) }}>
      <div className="grab"></div>
      <div className="row" style=${{ justifyContent: 'space-between', flexWrap: 'nowrap' }}>
        <div className="row" style=${{ gap: 6 }}><span className="badge rating">${fic.rating || '—'}</span>${readings.some(r => r.est) ? html`<${EstBadge} />` : null}</div>
        <button className="icon-btn" onClick=${onClose} aria-label="Close"><${Icon} name="close" size=${16} /></button>
      </div>
      <${SourceLine} fic=${fic} mode="full" style=${{ marginTop: 14, fontSize: 13.5 }} />
      <h2 className=${'detail-title' + (fic.status === 'DNF' ? ' struck' : '')}>${fic.title}</h2>
      ${fic.status === 'DNF' ? html`<div className="dnf-banner"><${DnfPill} fic=${fic} />${fic.lastReadDate ? html`<span className="tiny faint">${R.fmtDay(fic.lastReadDate, today)}</span>` : null}</div>` : null}
      <div className="muted">by ${fic.authors.length ? fic.authors.map((a, i) => html`<span key=${a}>${i ? ', ' : ''}<button className="link-btn" style=${{ fontSize: 15 }} onClick=${() => onAuthor(a)}>${a}</button></span>`) : '—'}</div>

      ${authorCtx.length ? html`<div className="card" style=${{ marginTop: 14, padding: 14 }}>
        ${authorCtx.map(a => html`<div key=${a.author} className="row" style=${{ justifyContent: 'space-between', flexWrap: 'nowrap', padding: '2px 0' }}>
          <span>${a.fics === 1 ? 'The only fic you’ve read by them' : a.rank === 1 ? 'Your most-read author' : `Your ${ordinal(a.rank)} most-read author`}${authorCtx.length > 1 ? html` <span className="faint">(${a.author})</span>` : null}</span>
          ${a.fics > 1 ? html`<button className="link-btn" onClick=${() => onAuthor(a.author)}>${a.fics} fics →</button>` : null}
        </div>`)}
      </div>` : null}

      <a className="big-btn" href=${fic.link} target="_blank" rel="noopener noreferrer" style=${{ marginTop: 14 }}>Open on AO3 <${Icon} name="ext" size=${16} /></a>

      <div className="section">
        <div className="section-head"><h3 className="section-title">Your reads</h3></div>
        <div className="card" style=${{ padding: '6px 16px' }}>
          ${readings.length ? readings.map(r => html`<div key=${r.id} className="row" style=${{ justifyContent: 'space-between', padding: '9px 0', borderTop: '1px solid var(--line)' }}>
            <span className="row" style=${{ gap: 8 }}><b style=${{ fontWeight: 600 }}>${ordinal(r.readNumber)} read</b>${r.kind === 'DNF' ? html`<span className="badge dnf">DNF</span>` : html`<span className="badge plain">Finished</span>`}${r.est ? html`<${EstBadge} />` : null}</span>
            <span className="small muted num">${r.started && r.started !== r.date ? `${R.fmtDay(r.started, today)} → ` : ''}${r.date ? R.fmtDay(r.date, today) : 'no date'} · ${r.words === null ? 'words not counted' : fmtWords(r.words) + ' words'}${r.dnfChapters ? ` (${r.dnfChapters}/${fic.chapters} ch)` : ''}</span>
          </div>`) : html`<div className="empty" style=${{ padding: 14 }}>Not finished or DNF'd yet.</div>`}
          ${fic.timesRead > readings.length && readings.length ? html`<div className="small muted" style=${{ padding: '9px 0', borderTop: '1px solid var(--line)' }}>Read ${fic.timesRead} times. The Reading Log doesn't show the earlier reads, so they're counted once.</div>` : null}
        </div>
      </div>

      <div className="section"><div className="section-head"><h3 className="section-title">Details</h3></div>
        <div className="card"><div className="meta-grid">${meta.map(([k, v]) => html`<div key=${k}><b>${k}</b><span className="num">${v}</span></div>`)}</div></div>
      </div>

      ${pick ? html`<div className="section"><div className="section-head"><h3 className="section-title">Up Next</h3><span className="small faint num">#${p4.up.picks.indexOf(pick) + 1} · score ${Math.round(pick.upNextScore)}</span></div>
        <div className="why-chips" style=${{ marginTop: 0 }}>${whyChips(pick).map(r => html`<span key=${r.key} className=${'why why-' + r.key}>${r.text}</span>`)}</div>
        ${ficN.length ? html`<div className="nudge-list" style=${{ marginTop: 10 }}>${ficN.map(n => html`<${NudgeCard} key=${n.id} n=${n} store=${p4.store} today=${today} compact=${true} />`)}</div>` : null}
        ${appFor(fic).appUrl ? html`<a className="pill-btn" style=${{ marginTop: 10 }} href=${appFor(fic).appUrl} target="_blank" rel="noopener">${appLabel(fic)}</a>` : null}
      </div>` : null}
      ${fic.ships.length || fic.tags.length ? html`<${DetailTags} fic=${fic} />` : null}

      <div className="section"><div className="section-head"><h3 className="section-title">Summary</h3></div>
        <div className="card">
          ${sum.state === 'loading' ? html`<span className="faint">Loading summary…</span>` : sum.state === 'ok' ? (sum.text ? html`<div className="summary">${sum.text}</div>` : html`<span className="faint">No summary in the sheet.</span>`) : html`<span className="faint">${sum.text}</span>`}
        </div>
      </div>

      <div className="section"><div className="section-head"><h3 className="section-title">Reading Log</h3><span className="small faint">${events.length} event${events.length === 1 ? '' : 's'}</span></div>
        ${events.length ? html`<div className="card"><div className="timeline">${events.map(e => html`<div key=${e.seq} className=${'tl-item' + (e.event === 'Finished' ? ' fin' : e.event === 'DNF' ? ' dnf' : '')}>
            <div style=${{ fontWeight: 600 }}>${e.event}${e.readNumber > 1 ? html` <span className="faint" style=${{ fontWeight: 400 }}>· ${ordinal(e.readNumber)} read</span>` : null}</div>
            <div className="small muted num">${e.ts || 'no time'}${e.chaptersRead !== null ? ` · ${e.chaptersRead} / ${fic.chapters} ch` : ''}</div>
          </div>`)}</div></div>`
          : html`<div className="card small faint">No Reading Log events for this fic${readings.some(r => r.est) ? ' — it was backfilled from AO3, so its date is an estimate.' : '.'}</div>`}
      </div>
    </div>
  </div>`;
}

const TREND_TABS = [['volume', 'Volume'], ['tastes', 'Tastes'], ['diversity', 'Diversity'], ['completion', 'Completion'], ['loyalty', 'Loyalty'], ['habits', 'Habits'], ['bests', 'Bests']];
// Chart series that aren't fandoms use the brand colours in a fixed order; series 6–10 reuse them
// with a dashed line, and every series is also named in its legend.
const CAT_VARS = ['--blue', '--coral', '--lime', '--pink', '--ink'];
const CAT = (i) => cssVar(CAT_VARS[i % CAT_VARS.length]);
function Finding({ text }) { return text ? html`<p className="finding">${text}</p>` : null; }
function TSection({ title, right, finding, children }) {
  return html`<div className="section">
    <div className="section-head"><h2 className="section-title">${title}</h2>${right || null}</div>
    <${Finding} text=${finding} />
    ${children}
  </div>`;
}
function LoggedEmpty({ n, what }) {
  return html`<div className="card logged-empty">
    <div className="title">This fills in as you log reads in the fandom apps</div>
    <div className="small muted" style=${{ marginTop: 6 }}>${what} needs reads with a start date${what.includes('clock') ? ' and time' : ''}. Backfilled reads only have a finish date.</div>
    <div className="tiny faint" style=${{ marginTop: 8 }}>Based on ${n} logged read${n === 1 ? '' : 's'} so far · shows from ${R.MIN_LOGGED}</div>
  </div>`;
}
const LoggedNote = ({ n }) => html`<div className="tiny faint" style=${{ marginTop: 8 }}>Based on ${n} logged read${n === 1 ? '' : 's'}</div>`;
const EstNote = ({ est, total, what }) => est ? html`<div className="tiny faint" style=${{ marginTop: 8 }}>${est === total ? 'All' : `${est} of ${total}`} ${what || 'dates'} ${est === 1 ? 'is' : 'are'} estimated (backfilled from AO3).</div>` : null;
function ScopeChips({ model, level, value, onChange }) {
  const opts = level === 'pairing'
    ? model.fandomList.flatMap(f => f.pairings.filter(p => p.readings >= R.MIN_RANK).map(p => ({ key: 'p:' + p.key, label: p.name, color: pairingColor(model, p.key), fill: fandomColor(f.name) })))
    : model.fandomList.filter(f => f.pairings.some(p => p.readings)).map(f => ({ key: 'f:' + f.name, label: f.short, color: fandomColor(f.name), fill: fandomColor(f.name) }));
  if (opts.length < 2 && level !== 'pairing') return null;
  return html`<div className="chips" style=${{ marginTop: 10 }}>
    <button className=${'chip sm' + (!value ? ' on' : '')} onClick=${() => onChange(null)}>All</button>
    ${opts.map(o => html`<button key=${o.key} className=${'chip sm' + (value === o.key ? ' on' : '')} style=${value === o.key ? chipOn(o.fill) : null} onClick=${() => onChange(o.key)}><span className="cdot" style=${{ background: o.color }}></span>${o.label}</button>`)}
  </div>`;
}
const scopeFilter = (scope) => !scope ? () => true : scope.startsWith('f:') ? (r) => r.fandom === scope.slice(2) : (r) => r.pairingKey === scope.slice(2);
function YearChips({ years, value, onChange }) {
  return html`<div className="chips">${years.slice().reverse().map(y => html`<button key=${y} className=${'chip sm' + (value === y ? ' on' : '')} onClick=${() => onChange(y)}>${y}</button>`)}</div>`;
}
const fmtDayShort = (iso, today) => iso ? R.fmtDay(iso, today) : '—';
function MiniBar({ value, max, color }) {
  return html`<div className="hbar-track" style=${{ gridColumn: 'auto', marginTop: 4 }}><div style=${{ width: Math.max(2, (value / (max || 1)) * 100) + '%', background: color || 'var(--blue)', borderRadius: 99 }}></div></div>`;
}
function ShowMore({ total, shown, onMore }) {
  return total > shown ? html`<button className="link-btn" style=${{ marginTop: 10 }} onClick=${onMore}>Show all ${total}</button>` : null;
}

// ---------- VOLUME ----------
function VolumeTab({ model, today, themeTick, groupBy, setGroupBy }) {
  const keys = useMemo(() => R.monthKeys((model.firstDate || today).slice(0, 7), today.slice(0, 7)), [model, today]);
  const groups = useMemo(() => {
    const totals = {}, present = new Set();
    for (const r of model.readings) { if (!r.date) continue; present.add(r.pairingKey); if (r.words !== null) totals[r.pairingKey] = (totals[r.pairingKey] || 0) + r.words; }
    return makeGroups(model, groupBy, totals, present);
  }, [model, groupBy, themeTick]);
  const s = useMemo(() => R.monthlySeries(model.readings, keys, groups.keys, groups.of), [model, keys, groups]);
  const multiYear = keys[0].slice(0, 4) !== keys[keys.length - 1].slice(0, 4);
  const labels = keys.map(k => R.monthLabel(k, multiYear));
  const f = useMemo(() => R.volumeFindings(model.readings), [model]);
  const wordsCfg = useMemo(() => {
    const t = chartTheme();
    return { type: 'bar',
      data: { labels, datasets: groups.keys.map((k, i) => ({ label: groups.short(k), data: s.words[k], backgroundColor: groups.color(k), borderRadius: topRadius(s.words, groups.keys, i), borderSkipped: false, stack: 'w', maxBarThickness: 26 })) },
      options: { responsive: true, maintainAspectRatio: false, animation: { duration: 250 }, interaction: { mode: 'index', intersect: false },
        plugins: { legend: { display: false }, tooltip: { ...tooltip(t, c => ` ${c.dataset.label}: ${fmtWords(c.parsed.y)}`), filter: c => c.parsed.y > 0 } }, scales: baseScales(t, v => fmtWords(v)) } };
  }, [s, groups, themeTick]);
  const ficsCfg = useMemo(() => {
    const t = chartTheme(); const sc = baseScales(t); sc.y.ticks.precision = 0;
    return { type: 'bar', data: { labels, datasets: [{ label: 'Fics finished', data: s.finished, backgroundColor: t.accent, borderRadius: 8, borderSkipped: false, maxBarThickness: 26 }] },
      options: { responsive: true, maintainAspectRatio: false, animation: { duration: 250 }, plugins: { legend: { display: false }, tooltip: tooltip(t, c => ` ${c.parsed.y} finished`) }, scales: sc } };
  }, [s, themeTick]);
  const undated = model.readings.filter(r => !r.date).length;
  return html`<div>
    <div className="small faint" style=${{ margin: '12px 2px 0' }}>Every dated read since ${model.firstDate ? R.fmtDay(model.firstDate, today) : '—'}.${undated ? ` ${undated} undated read${undated === 1 ? ' isn’t' : 's aren’t'} shown by month.` : ''}</div>
    <${TSection} title="Words per month" right=${html`<${GroupToggle} value=${groupBy} onChange=${setGroupBy} />`} finding=${f.words}>
      <div className="card"><${ChartBox} config=${wordsCfg} height=${210} /><${GroupLegend} groups=${groups} /></div>
    </${TSection}>
    <${TSection} title="Fics finished per month" finding=${f.fics}>
      <div className="card"><${ChartBox} config=${ficsCfg} height=${160} /></div>
    </${TSection}>
    <${TSection} title="Shelves by status" finding=${R.statusFinding(model)}>
      <div className="table-wrap wrap-th"><table>
        <thead><tr><th>Status</th>${model.fandomList.map(fd => html`<th key=${fd.name}>${fd.short}</th>`)}</tr></thead>
        <tbody>${Object.keys(model.statusCounts).sort((a, b) => model.statusCounts[b] - model.statusCounts[a]).map(st => html`<tr key=${st}>
          <td>${st}${st !== '(blank)' && !R.KNOWN_STATUSES.includes(st) ? html` <span className="badge est">other</span>` : null}</td>
          ${model.fandomList.map(fd => html`<td key=${fd.name} className="num">${fmtInt(model.fics.filter(x => x.fandom === fd.name && (x.status || '(blank)') === st).length)}</td>`)}
        </tr>`)}</tbody>
      </table></div>
    </${TSection}>
  </div>`;
}

// ---------- TASTES ----------
function BumpChart({ bump, onTag, themeTick }) {
  const CAP = 15;
  const config = useMemo(() => {
    const t = chartTheme();
    return { type: 'line',
      data: { labels: bump.labels, datasets: bump.tags.map((x, i) => {
        const color = CAT(i);
        return { label: x.tag, data: x.ranks.map(r => r === null ? null : Math.min(r, CAP + 1)), borderColor: color, backgroundColor: color,
          borderWidth: 2.5, pointRadius: 4, pointHoverRadius: 6, pointBorderColor: t.surface, pointBorderWidth: 2, borderDash: i < 5 ? [] : [6, 4], spanGaps: false, tension: 0 };
      }) },
      options: { responsive: true, maintainAspectRatio: false, animation: { duration: 250 },
        interaction: { mode: 'nearest', intersect: false },
        onClick: (evt, els, chart) => { const el = chart.getElementsAtEventForMode(evt, 'nearest', { intersect: false }, true)[0]; if (el) onTag(bump.tags[el.datasetIndex].tag); },
        plugins: { legend: { display: false }, tooltip: tooltip(t, c => ` #${bump.tags[c.datasetIndex].ranks[c.dataIndex]} ${c.dataset.label}`) },
        scales: {
          x: { grid: { display: false }, border: { display: false }, ticks: { color: t.ink3, font: { size: 11 }, maxRotation: 0, autoSkip: true } },
          y: { reverse: true, min: 1, max: CAP + 1, grid: { color: t.line }, border: { display: false },
            ticks: { color: t.ink3, font: { size: 11 }, stepSize: 1, callback: v => (v === CAP + 1 ? `${CAP}+` : [1, 5, 10, 15].includes(v) ? '#' + v : '') } } } } };
  }, [bump, themeTick]);
  if (!bump.tags.length) return html`<div className="card empty">No tag has 3 or more reads in the last 8 quarters yet.</div>`;
  return html`<div className="card">
    <${ChartBox} config=${config} height=${260} />
    <div className="bump-legend">${bump.tags.map((x, i) => {
      const now = x.ranks.filter(r => r !== null).slice(-1)[0];
      return html`<button key=${x.tag} onClick=${() => onTag(x.tag)}><svg width="18" height="6" aria-hidden="true"><line x1="1" y1="3" x2="17" y2="3" stroke=${CAT(i)} strokeWidth="3" strokeLinecap="round" strokeDasharray=${i < 5 ? null : '4 3'} /></svg><span>${x.tag}</span><b className="num">${now ? '#' + now : '—'}</b></button>`;
    })}</div>
    <div className="tiny faint" style=${{ marginTop: 8 }}>Rank by words read each quarter, among tags with 3+ reads that quarter. Tap a line or a tag to see those reads.</div>
  </div>`;
}
function DriftTable({ rows, kind, year, onTag }) {
  if (!rows.length) return html`<div className="card empty small">${kind === 'risers' ? 'No tag with 3+ reads grew its share.' : `No tag with 3+ reads in ${year - 1} lost share.`}</div>`;
  return html`<div className="table-wrap"><table>
    <thead><tr><th>Tag</th><th>${year - 1}</th><th>${year}</th><th>Change</th></tr></thead>
    <tbody>${rows.map(r => html`<tr key=${r.tag} className="click" onClick=${() => onTag(r.tag)}>
      <td className="t" style=${{ fontWeight: 500 }}>${r.tag}</td><td className="num">${Math.round(r.shareThen * 100)}%</td><td className="num">${Math.round(r.shareNow * 100)}%</td>
      <td className="num" style=${{ fontWeight: 800 }}>${r.change > 0 ? '▲ +' : '▼ −'}${Math.abs(r.change).toFixed(1)} pts</td>
    </tr>`)}</tbody>
  </table></div>`;
}
function TastesTab({ model, today, themeTick, onTag, groupBy, setGroupBy }) {
  const ctx = useContext(TagCtx);
  const [scope, setScope] = useState(null);
  const years = R.yearsWithReads(model.readings);
  const [year, setYear] = useState(+today.slice(0, 4));
  const [newAll, setNewAll] = useState(false);
  useEffect(() => setScope(null), [groupBy]);
  const rs = useMemo(() => model.readings.filter(scopeFilter(scope)), [model, scope]);
  const bump = useMemo(() => R.tagBump(rs, ctx.isVisible, today), [rs, ctx.isVisible, today]);
  const drift = useMemo(() => R.tagDrift(rs, ctx.isVisible, year), [rs, ctx.isVisible, year]);
  const top = useMemo(() => R.topTags(rs, ctx.isVisible, 15, R.MIN_RANK), [rs, ctx.isVisible]);
  const topFinding = top.length ? `${top[0].tag} leads your all-time tags with ${fmtWords(top[0].words)} words across ${top[0].fics} fics.` : 'No tag has 3 or more reads yet.';
  return html`<div>
    <div className="row" style=${{ justifyContent: 'space-between', marginTop: 12 }}>
      <${SexTagToggle} compact />
      <${GroupToggle} value=${groupBy} onChange=${setGroupBy} />
    </div>
    <${ScopeChips} model=${model} level=${groupBy} value=${scope} onChange=${setScope} />
    <${TSection} title="Tag ranks by quarter" finding=${bump.finding}><${BumpChart} bump=${bump} onTag=${onTag} themeTick=${themeTick} /></${TSection}>
    <${TSection} title="Risers and fallers" finding=${drift.finding}>
      ${years.length > 1 ? html`<${YearChips} years=${years} value=${year} onChange=${setYear} />` : null}
      <div className="tiny faint" style=${{ margin: '6px 2px 8px' }}>Share of words read in ${year}${String(year) === today.slice(0, 4) ? ' so far' : ''} vs the 12 months before (${year - 1}).</div>
      <div className="flabel" style=${{ marginTop: 6 }}>Top risers</div>
      <${DriftTable} rows=${drift.risers} kind="risers" year=${year} onTag=${onTag} />
      <div className="flabel" style=${{ marginTop: 14 }}>Top fallers</div>
      <${DriftTable} rows=${drift.fallers} kind="fallers" year=${year} onTag=${onTag} />

    <${TSection} title=${`New in ${year}`} finding=${drift.newFinding}>
      ${drift.newTags.length ? html`<div className="card"><div className="wrap-chips">${(newAll ? drift.newTags : drift.newTags.slice(0, 20)).map(t => html`<button key=${t.tag} className="chip sm" onClick=${() => onTag(t.tag)}>${t.tag} <span className="faint">${t.readingsNow}</span></button>`)}</div>
        ${drift.newTags.length > 20 && !newAll ? html`<${ShowMore} total=${drift.newTags.length} shown=${20} onMore=${() => setNewAll(true)} />` : null}</div>` : null}
    </${TSection}>
    <${TSection} title="Top tags by words read" right=${html`<span className="small faint">all time</span>`} finding=${topFinding}>
      <${TopTags} readings=${rs} dnfNoWords=${rs.filter(r => r.kind === 'DNF' && r.words === null).length} onTag=${onTag} limit=${15} minFics=${R.MIN_RANK} />
    </${TSection}>
  </div>`;
}

// ---------- COMPLETION ----------
function CompletionTab({ model, today, themeTick, onTag }) {
  const ctx = useContext(TagCtx);
  const [allTags, setAllTags] = useState(false);
  const keys = useMemo(() => R.monthKeys((model.firstDate || today).slice(0, 7), today.slice(0, 7)), [model, today]);
  const s = useMemo(() => R.monthlySeries(model.readings, keys, [], () => undefined), [model, keys]);
  const multiYear = keys[0].slice(0, 4) !== keys[keys.length - 1].slice(0, 4);
  const labels = keys.map(k => R.monthLabel(k, multiYear));
  // Completion rate only for months with >= MIN_RATE closed reads.
  const rateData = s.completion.map((c, i) => (s.finished[i] + s.dnfs[i] >= R.MIN_RATE ? c : null));
  const compCfg = useMemo(() => {
    const t = chartTheme(); const sc = baseScales(t, v => Math.round(v * 100) + '%');
    sc.y.min = 0; sc.y.max = 1; sc.x.stacked = false; sc.y.stacked = false;
    return { type: 'line', data: { labels, datasets: [{ label: 'Completion', data: rateData, borderColor: t.accent, backgroundColor: t.accent, pointRadius: 4, pointBorderColor: t.surface, pointBorderWidth: 2, borderWidth: 2, cubicInterpolationMode: 'monotone', spanGaps: true }] },
      options: { responsive: true, maintainAspectRatio: false, animation: { duration: 250 },
        plugins: { legend: { display: false }, tooltip: tooltip(t, c => ` ${Math.round(c.parsed.y * 100)}% · ${s.finished[c.dataIndex]} finished, ${s.dnfs[c.dataIndex]} DNF`) }, scales: sc } };
  }, [s, themeTick]);
  const bands = useMemo(() => R.completionByBand(model.readings), [model]);
  const reasons = useMemo(() => R.dnfReasonsByQuarter(model.readings, today), [model, today]);
  const pred = useMemo(() => R.dnfPredictorTags(model.readings, ctx.isVisible), [model, ctx.isVisible]);
  const ab = useMemo(() => R.abandonPoints(model.readings), [model]);
  const reasonsCfg = useMemo(() => {
    const t = chartTheme(); const sc = baseScales(t); sc.y.ticks.precision = 0;
    const colorOf = (x, i) => (x === 'No reason' ? t.surface2 : CAT(i));
    return { type: 'bar', data: { labels: reasons.labels, datasets: reasons.reasons.map((x, i) => ({ label: x, data: reasons.counts[x], backgroundColor: colorOf(x, i), borderRadius: 8, borderSkipped: false, stack: 'r', maxBarThickness: 28 })) },
      options: { responsive: true, maintainAspectRatio: false, animation: { duration: 250 }, interaction: { mode: 'index', intersect: false },
        plugins: { legend: { display: false }, tooltip: { ...tooltip(t, c => ` ${c.dataset.label}: ${c.parsed.y}`), filter: c => c.parsed.y > 0 } }, scales: sc } };
  }, [reasons, themeTick]);
  const abCfg = useMemo(() => {
    const t = chartTheme(); const sc = baseScales(t); sc.y.ticks.precision = 0; sc.x.stacked = false; sc.y.stacked = false;
    return { type: 'bar', data: { labels: ab.labels, datasets: [{ label: 'DNFs', data: ab.buckets, backgroundColor: t.dnf, borderRadius: 8, borderSkipped: false }] },
      options: { responsive: true, maintainAspectRatio: false, animation: { duration: 250 }, plugins: { legend: { display: false }, tooltip: tooltip(t, c => ` ${c.parsed.y} DNF${c.parsed.y === 1 ? '' : 's'}`) }, scales: sc } };
  }, [ab, themeTick]);
  const bandMax = 1;
  return html`<div>
    <${TSection} title="Completion rate by month" finding=${R.completionMonthFinding(s)}>
      <div className="card"><${ChartBox} config=${compCfg} height=${180} /><div className="tiny faint" style=${{ marginTop: 8 }}>Months with fewer than ${R.MIN_RATE} closed reads are left out.</div></div>
    </${TSection}>
    <${TSection} title="Completion by length" finding=${bands.finding}>
      <div className="card">${bands.rows.map(b => html`<div key=${b.key} className="band-row">
        <div className="row" style=${{ justifyContent: 'space-between', flexWrap: 'nowrap' }}>
          <b style=${{ fontWeight: 600 }}>${b.label}</b>
          <span className="small muted num">${!b.shown ? `${b.readings} read${b.readings === 1 ? '' : 's'} · not enough to show` : b.rate === null ? `${b.readings} reads · rate from ${R.MIN_RATE}` : `${Math.round(b.rate * 100)}% · ${b.finished} of ${b.readings}`}</span>
        </div>
        ${b.rate !== null ? html`<${MiniBar} value=${b.rate} max=${bandMax} />` : null}
      </div>`)}</div>
    </${TSection}>
    <${TSection} title="DNF reasons by quarter" finding=${reasons.finding}>
      <div className="card">${reasons.inWindow ? html`<${ChartBox} config=${reasonsCfg} height=${190} />
        <div className="legend">${reasons.reasons.map((x, i) => html`<span key=${x}><i style=${{ background: x === 'No reason' ? 'var(--surface-2)' : CAT(i) }}></i>${x}</span>`)}</div>` : html`<div className="empty">No dated DNFs in the last 8 quarters.</div>`}</div>
    </${TSection}>
    <${TSection} title="Tags that predict a DNF" finding=${pred.finding}>
      ${pred.rows.length ? html`<div className="table-wrap"><table>
        <thead><tr><th>Tag</th><th>Reads</th><th>DNF rate</th><th>Overall</th></tr></thead>
        <tbody>${(allTags ? pred.rows : pred.rows.slice(0, 10)).map(r => html`<tr key=${r.tag} className="click" onClick=${() => onTag(r.tag)}>
          <td className="t" style=${{ fontWeight: 500 }}>${r.tag}</td><td className="num">${r.readings}</td><td className="num" style=${{ fontWeight: 700 }}>${Math.round(r.rate * 100)}%</td><td className="num faint">${Math.round(pred.overall * 100)}%</td>
        </tr>`)}</tbody></table></div>
        ${!allTags ? html`<${ShowMore} total=${pred.rows.length} shown=${10} onMore=${() => setAllTags(true)} />` : null}
        <div className="tiny faint" style=${{ marginTop: 6 }}>Tags with ${R.MIN_PREDICT}+ reads and a DNF rate at least 15 points above your overall rate. AO3 placeholder tags are left out.</div>` : null}
    </${TSection}>
    <${TSection} title="Abandon point" finding=${ab.finding}>
      <div className="card">${ab.covered ? html`<${ChartBox} config=${abCfg} height=${170} />` : html`<div className="small muted">Fill in Chapters Read when you DNF a fic in the fandom apps to see where you tend to stop.</div>`}
        <div className="tiny faint" style=${{ marginTop: 8 }}>Covers ${ab.covered} of ${ab.total} DNFs (those with Chapters Read).</div></div>
    </${TSection}>
  </div>`;
}

// ---------- LOYALTY ----------

  const [allGo, setAllGo] = useState(false);
  const go = useMemo(() => R.goToAuthors(model.readings), [model]);

  const top = useMemo(() => model.authors.filter(a => a.readings >= R.MIN_RANK).slice().sort((a, b) => by === 'fics' ? b.fics - a.fics || b.words - a.words : b.words - a.words || b.fics - a.fics).slice(0, 10), [model, by]);
  const max = top.length ? (by === 'fics' ? top[0].fics : top[0].words) : 1;
  const topFinding = top.length ? (by === 'fics' ? `${top[0].author} is your most-read author, with ${top[0].fics} fics.` : `${top[0].author} has given you the most words: ${fmtWords(top[0].words)}.`) : 'No author has 3 or more reads yet.';
  return html`<div>
    <${TSection} title="Go-to authors" finding=${go.finding}>
      ${go.rows.length ? html`<div className="table-wrap"><table>
        <thead><tr><th>Author</th><th>Fics</th><th>Words</th><th>First</th><th>Latest</th><th>Avg ★</th></tr></thead>
        <tbody>${(allGo ? go.rows : go.rows.slice(0, 15)).map(a => html`<tr key=${a.author} className="click" onClick=${() => onAuthor(a.author)}>
          <td className="t" style=${{ minWidth: 130 }}>${a.author}</td><td className="num">${a.fics}</td><td className="num">${fmtWords(a.words)}</td>
          <td className="num">${fmtDayShort(a.first, today)}</td><td className="num">${fmtDayShort(a.latest, today)}</td>
          <td className="num">${a.avgEnjoyment === null ? '—' : a.avgEnjoyment.toFixed(1)}${a.rated && a.rated < a.fics ? html`<span className="tiny faint"> (${a.rated})</span>` : null}</td>
        </tr>`)}</tbody></table></div>${!allGo ? html`<${ShowMore} total=${go.rows.length} shown=${15} onMore=${() => setAllGo(true)} />` : null}
        <div className="tiny faint" style=${{ marginTop: 6 }}>Avg ★ is Enjoyment over the rated fics (count in brackets when not all are rated).</div>` : null}
    </${TSection}>
    <${TSection} title="Return rate and top-5 share" finding=${ly.finding}>
      <div className="card">${ly.years.map(y => html`<div key=${y.year} className="band-row">
        <div className="row" style=${{ justifyContent: 'space-between' }}><b style=${{ fontWeight: 600 }}>${y.year}</b><span className="tiny faint">${y.authors} authors · ${y.readings} reads</span></div>
        ${y.returnRate === null ? html`<div className="small faint">Fewer than ${R.MIN_RATE} authors that year.</div>` : html`
          <div className="row small" style=${{ justifyContent: 'space-between', marginTop: 4 }}><span className="muted">Went back to</span><span className="num">${Math.round(y.returnRate * 100)}% of authors</span></div><${MiniBar} value=${y.returnRate} max=${1} />
          <div className="row small" style=${{ justifyContent: 'space-between', marginTop: 6 }}><span className="muted">Top 5 authors’ share of words</span><span className="num">${Math.round(y.top5Share * 100)}%</span></div><${MiniBar} value=${y.top5Share} max=${1} color="var(--coral)" />`}
      </div>`)}
      <div className="tiny faint" style=${{ marginTop: 8 }}>Return rate: authors with 2+ different fics read that year.</div></div>
    </${TSection}>
    <${TSection} title="Re-reads" finding=${rr.finding}>
      ${rr.rows.length ? html`<div className="card" style=${{ padding: '6px 16px' }}>${rr.rows.slice(0, 15).map(x => html`<button key=${x.fic.key} className="set-row" onClick=${() => onOpen(x.fic.key)}>
        <span style=${{ minWidth: 0 }}><b style=${{ fontWeight: 600 }}>${x.fic.title}</b><div className="tiny faint">${x.fic.authors.join(', ')}${x.latest ? ' · latest ' + R.fmtDay(x.latest, today) : ''}</div></span>
        <span className="badge plain">${x.times}×</span></button>`)}</div>` : html`<div className="card small muted">Re-reads show here once a fic has Times Read above 1, or a re-read is logged in the fandom apps.</div>`}
    </${TSection}>
    <${TSection} title="Top authors" right=${html`<div className="seg"><button className=${by === 'fics' ? 'on' : ''} onClick=${() => setBy('fics')}>By fics</button><button className=${by === 'words' ? 'on' : ''} onClick=${() => setBy('words')}>By words</button></div>`} finding=${topFinding}>
      <div className="card">
        ${top.length ? top.map((a, i) => html`<div className="hbar-row" key=${a.author} onClick=${() => onAuthor(a.author)} style=${{ cursor: 'pointer' }}>
          <span className="hbar-label"><span className="faint num" style=${{ display: 'inline-block', width: 22 }}>${i + 1}</span>${a.author}</span>
          <span className="hbar-val num">${by === 'fics' ? `${a.fics} fic${a.fics === 1 ? '' : 's'} · ${fmtWords(a.words)}` : `${fmtWords(a.words)} · ${a.fics} fic${a.fics === 1 ? '' : 's'}`}</span>
          <div className="hbar-track"><div style=${{ width: Math.max(2, (by === 'fics' ? a.fics : a.words) / max * 100) + '%', background: 'var(--blue)', borderRadius: 99 }}></div></div>

// ---------- HABITS ----------
const heat = (level) => level <= 0 ? 'var(--surface-2)' : `color-mix(in srgb, var(--blue) ${[0, 28, 50, 74, 100][level]}%, var(--surface-2))`;
function StreakTile({ label, s, unit, today }) {
  return html`<div className="tile">
    <div className="tile-label">${label}</div>
    <div className="tile-value serif num">${s.len}<span className="small muted" style=${{ fontWeight: 600, letterSpacing: 0 }}> ${unit}${s.len === 1 ? '' : 's'}</span></div>
    <div className="tile-note">${s.len ? `${R.fmtDay(s.start, today)} – ${R.fmtDay(s.end, today)}` : 'None yet'}</div>
    <div>${s.est ? html`<${EstBadge} />` : null}</div>
  </div>`;
}
function CalendarHeat({ cal, year, today }) {
  const ref = useRef(null);
  const start = R.weekStart(`${year}-01-01`);
  const weeks = [];
  for (let w = start; w <= `${year}-12-31`; w = R.addDays(w, 7)) weeks.push(w);
  const levels = (words) => { if (!words) return 0; const q = words / (cal.max || 1); return q > 0.75 ? 4 : q > 0.45 ? 3 : q > 0.2 ? 2 : 1; };
  useEffect(() => { if (ref.current) ref.current.scrollLeft = ref.current.scrollWidth; }, [year]);
  return html`<div className="card">
    <div className="cal-scroll" ref=${ref}>
      <div className="cal-grid" style=${{ gridTemplateColumns: `repeat(${weeks.length}, 11px)` }}>
        ${weeks.map(w => html`<div key=${w} className="cal-col">
          ${[0, 1, 2, 3, 4, 5, 6].map(i => { const d = R.addDays(w, i); const inYear = d.startsWith(year + '-') && d <= today; const e = cal.days.get(d);
            return html`<i key=${d} title=${inYear ? `${R.fmtDay(d)}: ${e ? `${fmtWords(e.words)} words, ${e.fics} fic${e.fics === 1 ? '' : 's'}${e.est ? ' (est.)' : ''}` : 'nothing finished'}` : ''} style=${{ background: inYear ? heat(levels(e && e.words)) : 'transparent' }}></i>`; })}
        </div>`)}
      </div>
    </div>
    <div className="row tiny faint" style=${{ justifyContent: 'flex-end', gap: 4, marginTop: 8 }}>Less ${[0, 1, 2, 3, 4].map(l => html`<i key=${l} className="cal-key" style=${{ background: heat(l) }}></i>`)} More</div>
  </div>`;
}
function HabitsTab({ model, today, themeTick, p4 }) {
  const habitN = p4 ? p4.nudges.filter(n => n.where.includes('habits') && R.nudgeVisible(n, p4.store.nudgeTypes, p4.store.dismissed, today)) : [];
  const st = useMemo(() => R.streaks(model, today), [model, today]);
  const wd = useMemo(() => R.weekdayCounts(model.readings), [model]);
  const clock = useMemo(() => R.readingClock(model), [model]);
  const ss = useMemo(() => R.sessions(model), [model]);
  const sst = useMemo(() => R.sessionStats(ss), [ss]);
  const pace = useMemo(() => R.paceByBand(model.readings), [model]);
  const years = R.yearsWithReads(model.readings);
  const [year, setYear] = useState(+today.slice(0, 4));
  const cal = useMemo(() => R.calendarYear(model.readings, year), [model, year]);
  const wdCfg = useMemo(() => {
    const t = chartTheme(); const sc = baseScales(t); sc.y.ticks.precision = 0; sc.x.stacked = false; sc.y.stacked = false;
    return { type: 'bar', data: { labels: wd.labels, datasets: [{ label: 'Finished', data: wd.counts, backgroundColor: t.accent, borderRadius: 8, borderSkipped: false, maxBarThickness: 34 }] },
      options: { responsive: true, maintainAspectRatio: false, animation: { duration: 250 }, plugins: { legend: { display: false }, tooltip: tooltip(t, c => ` ${c.parsed.y} finished`) }, scales: sc } };
  }, [wd, themeTick]);
  // Once there are MIN_SESSIONS timed sessions, the clock shows session minutes instead of events.
  const bySessions = sst.enough;
  const clockGrid = bySessions ? sst.grid : clock.grid;
  const clockMax = Math.max(1, ...clockGrid.flat());
  const clockFinding = bySessions && sst.peak ? `You read most on ${R.WEEKDAYS[sst.peak.d]}s around ${sst.peak.h % 12 || 12}${sst.peak.h < 12 ? 'am' : 'pm'} (${fmtMins(sst.peak.v)} of sessions).` : clock.finding;
  return html`<div>
    ${habitN.length ? html`<div className="nudge-list" style=${{ marginTop: 16 }}>${habitN.map(n => html`<${NudgeCard} key=${n.id} n=${n} store=${p4.store} today=${today} />`)}</div>` : null}
    <${TSection} title="Streaks" finding=${st.finding}>
      <div className="tiles">
        <${StreakTile} label="Current weekly streak" s=${st.currentWeekly} unit="week" today=${today} />
        <${StreakTile} label="Longest weekly streak" s=${st.longestWeekly} unit="week" today=${today} />
        <${StreakTile} label="Current daily streak" s=${st.currentDaily} unit="day" today=${today} />
        <${StreakTile} label="Longest daily streak" s=${st.longestDaily} unit="day" today=${today} />
      </div>
      <div className="tiny faint" style=${{ marginTop: 8 }}>A reading day is any day with a Reading Log event or a finish/DNF date. Weeks run Monday to Sunday.</div>
    </${TSection}>
    <${TSection} title="Finished by weekday" finding=${wd.finding}>
      <div className="card"><${ChartBox} config=${wdCfg} height=${170} /><${EstNote} est=${wd.est} total=${wd.total} what="finish dates" /></div>
    </${TSection}>
    <${TSection} title="Reading clock" finding=${clockFinding}>
      ${bySessions || clock.enough ? html`<div className="card"><div className="clock-grid">
          <span></span>${Array.from({ length: 24 }, (_, h) => html`<span key=${'h' + h} className="tiny faint" style=${{ textAlign: 'center' }}>${h % 6 === 0 ? h : ''}</span>`)}
          ${clockGrid.map((row, d) => html`<${React.Fragment} key=${d}><span className="tiny faint">${R.WEEKDAYS[d].slice(0, 3)}</span>${row.map((c, h) => html`<i key=${h} title=${`${R.WEEKDAYS[d]} ${h}:00 — ${bySessions ? fmtMins(c) + ' of sessions' : `${c} event${c === 1 ? '' : 's'}`}`} style=${{ background: heat(c ? Math.max(1, Math.ceil(c / clockMax * 4)) : 0) }}></i>`)}</${React.Fragment}>`)}
        </div>${bySessions ? html`<div className="tiny faint" style=${{ marginTop: 8 }}>Session minutes · based on ${sst.count} sessions</div>` : html`<${LoggedNote} n=${clock.loggedReads} />`}</div>` : html`<${LoggedEmpty} n=${clock.loggedReads} what="The reading clock" />`}
    </${TSection}>
    <${SessionsSection} ss=${ss} st=${sst} />
    <${TSection} title=${`Calendar ${year}`} finding=${cal.finding}>
      ${years.length > 1 ? html`<div style=${{ marginBottom: 8 }}><${YearChips} years=${years} value=${year} onChange=${setYear} /></div>` : null}
      <${CalendarHeat} cal=${cal} year=${year} today=${today} />
    </${TSection}>
    <${TSection} title="Pace" finding=${pace.finding}>
      ${pace.enough ? html`<div className="card">${pace.rows.map(b => html`<div key=${b.key} className="row" style=${{ justifyContent: 'space-between', padding: '7px 0', borderTop: '1px solid var(--line)' }}>
          <b style=${{ fontWeight: 600 }}>${b.label}</b><span className="small muted num">${b.median === null ? `${b.n} read${b.n === 1 ? '' : 's'} · not enough` : `${b.median} day${b.median === 1 ? '' : 's'} median · ${b.n} reads`}</span></div>`)}
        <${LoggedNote} n=${pace.loggedReads} /></div>` : html`<${LoggedEmpty} n=${pace.loggedReads} what="Pace" />`}
    </${TSection}>
  </div>`;
}

// ---------- BESTS ----------
const BEST_TONES = ['lime', 'pink', 'coral', 'blue'];
function BestsTab({ model, today, onOpen, onRange, onAuthor }) {
  const bests = useMemo(() => R.personalBests(model, today), [model, today]);
  const tap = (b) => { const t = b.target; if (!t) return; if (t.type === 'fic') onOpen(t.key); else if (t.type === 'range') onRange(t.start, t.end); else if (t.type === 'author') onAuthor(t.author); };
  const estN = bests.filter(b => b.est).length;
  return html`<div>
    <${Finding} text=${bests.length ? `${bests.length} personal bests so far${estN ? `; ${estN} rest on estimated dates` : ''}.` : 'Personal bests appear once you have dated reads.'} />
    <div className="bests">${bests.map((b, bi) => b.key === 'fastest' && !b.enough
      ? html`<div key=${b.key} className="best-card"><div className="tile-label">${b.title}</div><div className="small muted" style=${{ marginTop: 6 }}>This fills in as you log reads in the fandom apps.</div><div className="tiny faint" style=${{ marginTop: 6 }}>Based on ${b.logged} logged read${b.logged === 1 ? '' : 's'} so far · shows from ${R.MIN_LOGGED}</div></div>`
      : html`<button key=${b.key} className="best-card" onClick=${() => tap(b)}>
        <div className="row" style=${{ justifyContent: 'space-between', flexWrap: 'nowrap' }}><span className="tile-label">${b.title}</span>${b.est ? html`<${EstBadge} />` : null}</div>
        <span className=${'value-chip' + (BEST_TONES[bi % 4] === 'blue' ? ' blue' : '')} style=${{ background: `var(--${BEST_TONES[bi % 4]})` }}>${b.value}</span>
        <div className="small muted best-sub">${b.sub}</div>
        ${b.list ? html`<div className="tiny faint" style=${{ marginTop: 4 }}>${b.list.length > 3 ? `+${b.list.length - 3} more · ` : ''}tap for the latest</div>` : null}
        ${b.logged ? html`<div className="tiny faint" style=${{ marginTop: 4 }}>Based on ${b.logged} logged reads</div>` : null}
      </button>`)}</div>
  </div>`;
}

function TrendsScreen({ model, today, themeTick, onAuthor, onTag, onOpen, onRange, groupBy, setGroupBy, tab, setTab, openRecap, p4 }) {
  const barRef = useRef(null);
  useEffect(() => { const el = barRef.current && barRef.current.querySelector('.on'); if (el && el.scrollIntoView) el.scrollIntoView({ inline: 'center', block: 'nearest' }); }, [tab]);
  const props = { model, today, themeTick, onAuthor, onTag, onOpen, onRange, groupBy, setGroupBy, p4 };
  return html`<div>
    <h1 className="page-title">Trends</h1>
    <${RecapLauncher} model=${model} today=${today} openRecap=${openRecap} />
    <div className="trend-tabs" role="tablist" ref=${barRef}>
      ${TREND_TABS.map(([k, l]) => html`<button key=${k} role="tab" aria-selected=${tab === k} className=${tab === k ? 'on' : ''} onClick=${() => setTab(k)}>${l}</button>`)}
    </div>

    ${tab === 'tastes' ? html`<${TastesTab} ...${props} />` : null}
    ${tab === 'diversity' ? html`<${DiversityTab} ...${props} />` : null}
    ${tab === 'completion' ? html`<${CompletionTab} ...${props} />` : null}
    ${tab === 'loyalty' ? html`<${LoyaltyTab} ...${props} />` : null}
    ${tab === 'habits' ? html`<${HabitsTab} ...${props} />` : null}
    ${tab === 'bests' ? html`<${BestsTab} ...${props} />` : null}

}

// ============================================================================================
// YEAR IN READING: a full-screen, story-style recap. Cards come from R.recap(); redaction only
// changes what's displayed/saved. Each card is designed at 360×640 and saved at 3× = 1080×1920.
// ============================================================================================
// Every Year in Reading card is full blue (#2D5BFF) with white text; value chips are lime, pink or coral.
function RecapCard({ card, rc, redact, model, ctx, total, index }) {
  const titleOf = (fic) => (redact.hideE && fic.rating === 'E' ? 'An E-rated fic' : fic.title);
  const authorOf = (a) => (redact.hideAuthors ? 'An author you love' : a);
  const authorsOf = (fic) => (redact.hideAuthors ? '' : fic.authors.join(', '));
  const tagHidden = (t) => redact.hideSex && ctx.hidden.has(t);
  const TONES = ['lime', 'pink', 'coral'];
  const big = (txt, size) => html`<div className="rc-big num" style=${size ? { fontSize: size } : null}>${txt}</div>`;
  const hl = (txt) => html`<span className="rc-hl">${txt}</span>`;
  // Stats as stacked white rows: label on the left, a coloured value chip on the right.
  const rows = (items) => html`<div className="rc-rows">${items.filter(Boolean).map(([label, value], i) => html`<div key=${i} className="rc-row"><span>${label}</span><span className=${'rc-val ' + TONES[i % 3]}>${value}</span></div>`)}</div>`;
  let body;
  switch (card.type) {
    case 'words': body = html`<div className="rc-kicker">You read</div>${big(fmtWords(card.words))}<div className="rc-unit">words</div>
      <div className="rc-line">That’s ${hl(card.yardstick)}.</div>`; break;
    case 'counts': body = html`<div className="rc-kicker">You finished</div>${big(card.finished)}<div className="rc-unit">${hl(`fic${card.finished === 1 ? '' : 's'}`)}</div>
      ${rows([['DNFs', card.dnfs], ['Started', card.finished + card.dnfs]])}`; break;
    case 'fandom': body = html`<div className="rc-kicker">Your top fandom</div><div className="rc-title">${hl(card.fandom)}</div>
      ${rows([['Share of your words', Math.round(card.fandomShare * 100) + '%'], ['Top pairing', card.pairing], ['Pairing’s share', Math.round(card.pairingShare * 100) + '%']])}`; break;
    case 'tags': { const tags = card.tags.filter(t => !tagHidden(t.tag));
      body = html`<div className="rc-kicker">Your top tags</div>${tags.length ? rows(tags.map((t, i) => [`${i + 1}. ${t.tag}`, fmtWords(t.words)])) : html`<div className="rc-line">${hl('Kept private.')}</div>`}
        ${tags.length < card.tags.length ? html`<div className="rc-small">${card.tags.length - tags.length} sex-related tag${card.tags.length - tags.length === 1 ? '' : 's'} hidden</div>` : null}`; break; }
    case 'longest': body = html`<div className="rc-kicker">Your longest fic</div><div className="rc-title">${hl(titleOf(card.fic))}</div>
      ${rows([['Words', fmtWords(card.fic.words)], authorsOf(card.fic) ? ['Author', authorsOf(card.fic)] : null])}`; break;
    case 'author': body = html`<div className="rc-kicker">Your most-read author</div><div className="rc-title">${hl(authorOf(card.author))}</div>
      ${rows([['Fics', card.fics], ['Words', fmtWords(card.words)]])}`; break;
    case 'month': body = html`<div className="rc-kicker">Your biggest month</div><div className="rc-title" style=${{ fontSize: 44 }}>${hl(R.MONTHS[+card.month.slice(5) - 1])}</div>
      ${rows([['Words', fmtWords(card.words)], ['Finished', card.finished]])}`; break;
    case 'weekday': { const max = Math.max(...card.counts);
      body = html`<div className="rc-kicker">You finish the most on</div><div className="rc-title" style=${{ fontSize: 44 }}>${hl(card.day + 's')}</div><div className="rc-line">${card.count} of ${card.total} finished fics</div>
        <div className="rc-bars">${card.counts.map((c, i) => html`<div key=${i}><i className=${c === max ? 'top' : ''} style=${{ height: Math.max(4, c / max * 90) + 'px' }}></i><span>${R.WEEKDAYS[i][0]}</span></div>`)}</div>`; break; }
    case 'completion': body = html`<div className="rc-kicker">Completion rate</div>${big(Math.round(card.rate * 100) + '%')}
      ${rows([['Finished', card.finished], ['Started', card.closed]])}`; break;
    case 'riser': body = html`<div className="rc-kicker">A new obsession</div><div className="rc-title">${hl(tagHidden(card.tag) ? 'A tag kept private' : card.tag)}</div>
      ${rows([['Share of your words before', Math.round(card.then * 100) + '%'], ['Share now', Math.round(card.now * 100) + '%']])}`; break;
    case 'rated': body = html`<div className="rc-kicker">Your highest-rated</div><div className="rc-stars" aria-label=${`${card.score} out of 5`}>${'★'.repeat(card.score)}</div>
      ${rows(card.fics.map(f => [titleOf(f.fic), authorsOf(f.fic) || `${card.score}/5`]))}`; break;
    case 'persona': body = html`<div className="rc-kicker">Your reading persona</div><div className="rc-title" style=${{ fontSize: 40 }}>${hl(card.name)}</div><div className="rc-line">Because ${card.rule}.</div>`; break;
    case 'ago': body = html`<div className="rc-kicker">One year ago you were reading…</div><div className="rc-title" style=${{ fontSize: 26 }}>${hl(R.monthName(card.month))}</div>
      ${rows(card.fics.map(f => [titleOf(f.fic), f.kind === 'DNF' ? 'DNF' : fmtWords(f.fic.words)]))}`; break;
    case 'note': body = html`<div className="rc-kicker">In your words</div>${redact.hideNotes ? html`<div className="rc-title">${hl('Kept private.')}</div>` : html`<div className="rc-quote">“${card.text}”</div>`}`; break;
    case 'summary': body = html`<div className="rc-kicker">${rc.label}</div><div className="rc-title" style=${{ fontSize: 40 }}>${hl('That’s a wrap')}</div>
      ${rows([['Words', fmtWords(card.words)], ['Finished', card.finished], ['DNFs', card.dnfs], card.persona ? ['Persona', card.persona] : null, card.fandom ? ['Mostly', R.shortFandom(card.fandom)] : null])}`; break;
    default: body = null;
  }
  return html`<div className="rc-card">
    <div className="rc-seg" aria-hidden="true">${Array.from({ length: total }, (_, k) => html`<i key=${k} className=${k <= index ? 'on' : ''}></i>`)}</div>
    <div className="rc-top"><span>Shelf Life</span><span>${rc.label}</span></div>
    <div className="rc-body">${body}</div>
    <div className="rc-foot"><span>${rc.est ? 'est. dates included' : ''}</span><span>${index + 1} / ${total}</span></div>
  </div>`;
}
async function cardToPng(node) {
  const opts = { width: 360, height: 640, pixelRatio: 3, cacheBust: true };
  try { return await htmlToImage.toPng(node, opts); }
  catch (e) { return await htmlToImage.toPng(node, { ...opts, skipFonts: true }); }
}
const dataUrlToFile = async (url, name) => new File([await (await fetch(url)).blob()], name, { type: 'image/png' });
function RecapStory({ model, scope, today, onClose, store }) {
  const ctx = useContext(TagCtx);
  const rc = useMemo(() => R.recap(model, scope, today, ctx.isVisible), [model, scope, today, ctx.isVisible]);
  // "In your words": your note for this year/month, as a card just before the summary. It adds a
  // card only; every recap number is unchanged.
  const period = scope.type === 'year' ? String(scope.year) : scope.month;
  const note = store ? store.notes.find(n => n.period === period) : null;
  const cards = useMemo(() => {
    if (!note || !rc.cards.length) return rc.cards;
    const at = rc.cards.findIndex(c => c.type === 'summary');
    const nc = { n: 14, type: 'note', text: R.noteExcerpt(note.text, 280) };
    return at < 0 ? [...rc.cards, nc] : [...rc.cards.slice(0, at), nc, ...rc.cards.slice(at)];
  }, [rc, note && note.text]);
  const [i, setI] = useState(0);
  const [panel, setPanel] = useState(false);
  const [ask, setAsk] = useState(() => scope.type === 'year' && !!store && store.status === 'ready' && !note && rc.cards.length > 0);
  const [redact, setRedact] = useState({ hideE: false, hideSex: !ctx.include, hideAuthors: false, hideNotes: false });
  const [busy, setBusy] = useState('');
  const [stageAll, setStageAll] = useState(false);
  const stageRef = useRef(null);
  const down = useRef(null);
  const viewRef = useRef(null);
  const [fit, setFit] = useState({ w: 360, h: 640, k: 1 });
  useEffect(() => {
    const el = viewRef.current; if (!el) return;
    const measure = () => { const w = el.clientWidth, h = el.clientHeight; const fw = Math.min(w, h * 9 / 16); setFit({ w: fw, h: fw * 16 / 9, k: fw / 360 }); };
    measure();
    const ro = window.ResizeObserver ? new ResizeObserver(measure) : null;
    if (ro) ro.observe(el); else window.addEventListener('resize', measure);
    return () => { if (ro) ro.disconnect(); else window.removeEventListener('resize', measure); };
  }, []);
  const next = useCallback(() => setI(x => Math.min(cards.length - 1, x + 1)), [cards.length]);
  const prev = useCallback(() => setI(x => Math.max(0, x - 1)), []);
  useEffect(() => {
    const onKey = (e) => { if (panel || ask) return; if (e.key === 'ArrowRight' || e.key === ' ') next(); else if (e.key === 'ArrowLeft') prev(); else if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', onKey); document.body.style.overflow = 'hidden';
    return () => { document.removeEventListener('keydown', onKey); document.body.style.overflow = ''; };
  }, [next, prev, panel, ask]);
  const onDown = (e) => { down.current = { x: e.clientX, y: e.clientY }; };
  const onUp = (e) => {
    const d = down.current; down.current = null; if (!d) return;
    const dx = e.clientX - d.x, dy = e.clientY - d.y;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) { dx < 0 ? next() : prev(); return; }
    const box = e.currentTarget.getBoundingClientRect();
    (e.clientX - box.left) < box.width * 0.3 ? prev() : next();
  };
  const fileName = (c) => `shelf-life-${rc.label.replace(/\s+/g, '-').toLowerCase()}-${String(c.n).padStart(2, '0')}-${c.type}.png`;
  const saveOne = async () => {
    setBusy('Saving…');
    try { await new Promise(r => setTimeout(r, 60)); const node = stageRef.current.querySelector(`[data-card="${i}"] .rc-card`); downloadDataUrl(fileName(cards[i]), await cardToPng(node)); setBusy('Saved.'); }
    catch (e) { setBusy('Couldn’t save the image: ' + (e && e.message || e)); }
  };
  const saveAll = async () => {
    setBusy('Preparing ' + cards.length + ' images…'); setStageAll(true);
    try {
      await new Promise(r => setTimeout(r, 150));
      const urls = [];
      for (let k = 0; k < cards.length; k++) { setBusy(`Saving ${k + 1} of ${cards.length}…`); urls.push(await cardToPng(stageRef.current.querySelector(`[data-card="${k}"] .rc-card`))); }
      const files = await Promise.all(urls.map((u, k) => dataUrlToFile(u, fileName(cards[k]))));
      if (navigator.canShare && navigator.canShare({ files })) { try { await navigator.share({ files, title: `Shelf Life · ${rc.label}` }); setBusy('Shared.'); return; } catch (e) { if (e && e.name === 'AbortError') { setBusy(''); return; } } }
      for (let k = 0; k < urls.length; k++) { downloadDataUrl(fileName(cards[k]), urls[k]); await new Promise(r => setTimeout(r, 350)); }
      setBusy(`Saved ${urls.length} images.`);
    } catch (e) { setBusy('Couldn’t save the images: ' + (e && e.message || e)); }
    finally { setStageAll(false); }
  };
  if (!cards.length) return html`<div className="rc-overlay"><div className="rc-empty"><p>Not enough dated reads for this recap yet.</p><button className="rc-next" style=${{ minHeight: 48, padding: '0 24px', borderRadius: 999 }} onClick=${onClose}>Close</button></div></div>`;
  const card = cards[i];
  return html`<div className="rc-overlay" role="dialog" aria-modal="true" aria-label=${`Year in Reading: ${rc.label}`}>
    <div className="rc-bar">
      <span className="rc-label">Year in Reading · ${rc.label}</span>
      <button className="rc-close" onClick=${onClose} aria-label="Close recap"><${Icon} name="close" size=${18} /></button>
    </div>
    <div className="rc-stage" ref=${viewRef} onPointerDown=${onDown} onPointerUp=${onUp}>
      <div className="rc-fit" style=${{ width: fit.w, height: fit.h }}><div className="rc-scale" style=${{ transform: `scale(${fit.k})` }}><${RecapCard} card=${card} rc=${rc} redact=${redact} model=${model} ctx=${ctx} total=${cards.length} index=${i} /></div></div>
    </div>
    <div className="rc-actions">
      <button className="rc-save" onClick=${() => { setPanel(true); setBusy(''); }} aria-label="Save images">Save image</button>
      <button className="rc-next" onClick=${() => (i < cards.length - 1 ? next() : onClose())}>${i < cards.length - 1 ? 'Next' : 'Done'}</button>
    </div>
    ${panel ? html`<div className="rc-panel-back" onClick=${() => setPanel(false)}><div className="rc-panel" onClick=${e => e.stopPropagation()}>
      <div className="rc-panel-title">Save as images</div>
      <div className="small muted" style=${{ margin: '4px 0 12px' }}>1080 × 1920 PNG. Choose what to hide first.</div>
      ${[['hideE', 'Hide E-rated fic titles'], ['hideSex', 'Hide sex-related tags'], ['hideAuthors', 'Hide author names'], ...(note ? [['hideNotes', 'Hide my notes']] : [])].map(([k, l]) => html`<label key=${k} className="switch-row" style=${{ padding: '9px 0' }}><span>${l}</span><input type="checkbox" role="switch" className="switch" checked=${redact[k]} onChange=${e => setRedact(r => ({ ...r, [k]: e.target.checked }))} /></label>`)}
      ${rc.est ? html`<div className="tiny faint" style=${{ marginTop: 4 }}>Images include an “est. dates included” note, because ${rc.est} of ${rc.readings} reads have estimated dates.</div>` : null}
      <div className="row" style=${{ marginTop: 14, flexWrap: 'nowrap' }}>
        <button className="big-btn" onClick=${saveOne} disabled=${!!busy && busy.endsWith('…')}>Save this card</button>
        <button className="big-btn ghost" onClick=${saveAll} disabled=${!!busy && busy.endsWith('…')}>Save all ${cards.length}</button>
      </div>
      ${busy ? html`<div className="small muted" style=${{ marginTop: 10 }}>${busy}</div>` : null}
    </div></div>` : null}
    ${ask ? html`<div className="rc-panel-back" onClick=${() => setAsk(false)}><div className="rc-panel" onClick=${e => e.stopPropagation()}>
      <div className="rc-panel-title">${R.yearPrompt(scope.year)}</div>
      <div className="small muted" style=${{ margin: '4px 0 12px' }}>A few words for your ${scope.year} recap. It’s saved to Shelf Life Data and shows as an “In your words” card. You can skip this.</div>
      <${NoteEditor} store=${store} period=${period} prompt=${R.yearPrompt(scope.year)} onDone=${() => setAsk(false)} autoFocus=${true} cancelLabel="Skip" />
    </div></div>` : null}
    <div className="rc-export" ref=${stageRef} aria-hidden="true">
      ${(stageAll ? cards : [card]).map((c) => { const k = stageAll ? cards.indexOf(c) : i;
        return html`<div key=${k} data-card=${k}><${RecapCard} card=${c} rc=${rc} redact=${redact} model=${model} ctx=${ctx} total=${cards.length} index=${k} /></div>`; })}
    </div>
  </div>`;
}

// ---------- storage status (shared by Goals, Notes and the dashboard) ----------
function StorageNotice({ store, compact }) {

// ---------- Goals ----------
function Ring({ pct, color, size = 64, stroke = 7, children, faded }) {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r, p = Math.max(0, Math.min(1, pct || 0));
  return html`<div className="ring" style=${{ width: size, height: size, opacity: faded ? .55 : 1 }}>
    <svg width=${size} height=${size} viewBox=${`0 0 ${size} ${size}`} aria-hidden="true">
      <circle cx=${size / 2} cy=${size / 2} r=${r} fill="none" stroke="var(--surface-2)" stroke-width=${stroke} />
      <circle cx=${size / 2} cy=${size / 2} r=${r} fill="none" stroke=${color} stroke-width=${stroke} stroke-linecap="round"
        stroke-dasharray=${`${c * p} ${c}`} transform=${`rotate(-90 ${size / 2} ${size / 2})`} />
    </svg>
    <div className="ring-in">${children}</div>
  </div>`;
}
const goalColor = (goal, model) => {
  const sc = String(goal.scope || '');
  if (goal.type === 'scoped' && sc.startsWith('f:')) return fandomColor(sc.slice(2)) || 'var(--blue)';
  if (goal.type === 'scoped' && sc.startsWith('p:')) return pairingColor(model, sc.slice(2)) || 'var(--blue)';
  return 'var(--blue)';
};
const goalVal = (goal, v) => goal.type === 'words' ? fmtWords(v) : goal.type === 'completion' ? `${v}%` : fmtInt(v);
const GOAL_UNIT = { words: 'words', finished: 'fics', newAuthors: 'new authors', scoped: 'fics', long: 'long fics', completion: '%', weeks: 'weeks' };
function goalPace(goal, pr, today) {
  const of = `${goalVal(goal, pr.value)} of ${goalVal(goal, pr.target)}`;
  if (pr.status === 'upcoming') return `Starts ${R.fmtDay(goal.start, today)}`;
  if (pr.status === 'met') return `Met · ${of}`;
  if (pr.status === 'missed') return `Missed · ${of}`;
  if (goal.type === 'completion') return `${pr.rate === null ? 'No closed reads yet' : `${pr.value}% now`} · aiming for ${pr.target}%+ · ${pr.daysLeft} day${pr.daysLeft === 1 ? '' : 's'} left`;
  if (pr.status === 'done') return `Done · ${of}`;
  const left = `${pr.daysLeft} day${pr.daysLeft === 1 ? '' : 's'} left`;
  if (pr.onPace) return `On pace · ${of} · ${left}`;
  const need = goal.type === 'words' ? fmtWords(pr.needed) : fmtInt(pr.needed);
  return `Behind pace · ${of} · about ${need} ${GOAL_UNIT[goal.type]} a week to make it`;
}
const goalPeriodLabel = (goal, today) => R.rangeLabel(goal.start, goal.end, today);
const ringInner = (goal, pr) => goal.type === 'completion' ? `${pr.value}%` : `${Math.round(pr.pct * 100)}%`;

function GoalRings({ model, today, store, openGoals }) {

        <${Ring} pct=${pr.pct} color=${goalColor(g, model)} size=${58}><span className="num">${ringInner(g, pr)}</span></${Ring}>
        <div style=${{ minWidth: 0 }}><div className="goal-name">${R.describeGoal(g, model)}</div>

      </button>`)}</div>`
      : store.status === 'ready' ? html`<div className="card small muted">No goal running right now. ${html`<button className="link-btn" style=${{ minHeight: 0 }} onClick=${openGoals}>Add one</button>`}</div>` : null}
