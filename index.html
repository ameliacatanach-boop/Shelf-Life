<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F6F6F9" />
<title>Shelf Life</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" />
<!-- Libraries, pinned to exact versions. No in-browser Babel: the app is written with htm so it starts fast on a phone. -->
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.13/dist/html-to-image.js" defer></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  /* ==========================================================================================
     DESIGN TOKENS. Light is the default; dark follows the system setting or the manual toggle.
     ========================================================================================== */
  :root {
    --bg: #F6F6F9; --surface: #FFFFFF; --surface-2: #E8E8EF; --line: #ECECF2;
    --ink: #111111; --ink-2: #3E3E48;
    --blue: #2D5BFF; --lime: #D4F55B; --coral: #FF6B4A; --pink: #FFA8D8;
    --dnf-tint: #FFE4DD; --dnf-strike: #E2401F;
    --on-blue: #FFFFFF; --on-bright: #111111;
    --solid: #111111; --on-solid: #FFFFFF;   /* active segment / primary button */
    --shadow-card: 0 8px 24px rgba(17, 17, 40, .10);
    --shadow-nav: 0 8px 24px rgba(17, 17, 40, .14);
    --shadow-chip: 0 2px 8px rgba(17, 17, 40, .08);
    --r-card: 26px; --r-row: 22px; --r-chip-val: 14px; --r-nav: 28px;
    --font: 'Plus Jakarta Sans', sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121218; --solid: #F4F4F8; --on-solid: #111111; --surface: #1E1E27; --surface-2: #2A2A35; --line: #2E2E3A;
      --ink: #F4F4F8; --ink-2: #B4B4C2;
      --dnf-tint: #3A2220; --dnf-strike: #FF6B4A;
      --shadow-card: none; --shadow-nav: none; --shadow-chip: none;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121218; --solid: #F4F4F8; --on-solid: #111111; --surface: #1E1E27; --surface-2: #2A2A35; --line: #2E2E3A;
    --ink: #F4F4F8; --ink-2: #B4B4C2;
    --dnf-tint: #3A2220; --dnf-strike: #FF6B4A;
    --shadow-card: none; --shadow-nav: none; --shadow-chip: none;
    color-scheme: dark;
  }

  /* ---------- base + type ---------- */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); }
  body { font-family: var(--font); font-size: 13px; font-weight: 500; line-height: 1.45; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; outline: none; }
  input, select { outline: none; }
  :focus-visible { outline: none; box-shadow: 0 0 0 3px var(--blue) !important; }
  a { color: inherit; }
  .serif { font-family: var(--font); font-weight: 800; letter-spacing: -0.02em; }
  .num { font-variant-numeric: tabular-nums; }
  .muted { color: var(--ink-2); }
  .faint { color: var(--ink-2); }
  .small { font-size: 12.5px; }
  .tiny { font-size: 11.5px; font-weight: 600; }

  /* Highlighter: a marker band in light mode; coloured text in dark mode. */
  .hl { padding: 0 2px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  .hl.lime { background: linear-gradient(transparent 52%, var(--lime) 52%, var(--lime) 92%, transparent 92%); }
  .hl.pink { background: linear-gradient(transparent 52%, var(--pink) 52%, var(--pink) 92%, transparent 92%); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .hl { background: none; } :root:not([data-theme="light"]) .hl.lime { color: var(--lime); } :root:not([data-theme="light"]) .hl.pink { color: var(--pink); } }
  :root[data-theme="dark"] .hl { background: none; }
  :root[data-theme="dark"] .hl.lime { color: var(--lime); }
  :root[data-theme="dark"] .hl.pink { color: var(--pink); }

  /* ---------- layout ---------- */
  .shell { max-width: 760px; margin: 0 auto; padding: 0 20px calc(120px + env(safe-area-inset-bottom)); }
  .topbar { position: sticky; top: 0; z-index: 20; background: var(--bg); }
  .topbar-inner { max-width: 760px; margin: 0 auto; padding: calc(10px + env(safe-area-inset-top)) 20px 10px; display: flex; align-items: center; gap: 10px; }
  .wordmark { font-size: 22px; font-weight: 800; letter-spacing: -0.4px; display: flex; align-items: center; gap: 8px; }
  .wordmark .mark { width: 24px; height: 24px; border-radius: 8px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 4px; background: var(--ink); }
  .wordmark .mark span { border-radius: 2px; }
  .sync { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
  .icon-btn { width: 44px; height: 44px; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow-chip); display: inline-grid; place-items: center; color: var(--ink); flex-shrink: 0; }
  .pill-btn { min-height: 44px; border-radius: 999px; padding: 0 16px; font-size: 12.5px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; background: var(--surface); box-shadow: var(--shadow-chip); color: var(--ink); }
  .pill-btn.primary { background: var(--blue); color: var(--on-blue); }
  .pill-btn:disabled, .big-btn:disabled { opacity: .5; }
  .spin { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }

  /* Floating pill nav */
  .nav { position: fixed; left: 14px; right: 14px; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 30; }
  .nav-inner { max-width: 732px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-radius: var(--r-nav); box-shadow: var(--shadow-nav); padding: 8px 6px; }
  .nav button { background: none; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 600; color: var(--ink-2); }
  .nav button .nav-ic { width: 40px; height: 30px; border-radius: 999px; display: grid; place-items: center; }
  .nav button.on { color: var(--ink); font-weight: 800; }
  .nav button.on .nav-ic { background: var(--blue); color: var(--on-blue); }

  /* ---------- sections + cards ---------- */
  .section { margin-top: 24px; }
  .section-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 2px 10px; }
  .section-title { font-size: 17px; font-weight: 800; letter-spacing: -0.2px; color: var(--ink); margin: 0; }
  .card { background: var(--surface); border-radius: var(--r-card); box-shadow: var(--shadow-card); padding: 14px; }
  .banner { border-radius: 999px; padding: 10px 16px; font-size: 12.5px; font-weight: 600; margin-top: 10px; color: var(--on-bright); }
  .banner.warn { background: var(--lime); }
  .banner.err { background: var(--coral); border-radius: 20px; }
  .finding { margin: -2px 2px 12px; font-size: 13px; font-weight: 600; line-height: 1.45; color: var(--ink); }

  /* ---------- headline + period picker ---------- */
  .headline { font-size: 23px; font-weight: 700; letter-spacing: -0.3px; line-height: 1.3; margin: 10px 2px 6px; text-wrap: balance; }
  .page-title { font-size: 30px; font-weight: 800; letter-spacing: -0.6px; line-height: 1.15; margin: 10px 2px 6px; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 8px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex-shrink: 0; min-height: 44px; background: var(--surface); box-shadow: var(--shadow-chip); border-radius: 999px; padding: 0 16px; font-size: 12.5px; font-weight: 700; white-space: nowrap; color: var(--ink); display: inline-flex; align-items: center; }
  .chip.on { background: var(--blue); color: var(--on-blue); }
  .chip .faint { margin-left: 5px; color: inherit; opacity: .7; }
  .chip.sm { padding: 0 13px; }
  .chip .x { margin-left: 6px; opacity: .8; }
  .chip .cdot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 7px; flex-shrink: 0; }
  .chip.on .cdot { box-shadow: 0 0 0 2px rgba(255,255,255,.85); }
  .seg { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 4px; gap: 2px; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
  .seg::-webkit-scrollbar { display: none; }
  .seg button { flex-shrink: 0; background: none; border-radius: 999px; min-height: 44px; padding: 0 14px; font-size: 12.5px; font-weight: 700; color: var(--ink-2); white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .seg button.on { background: var(--solid); color: var(--on-solid); }
  .seg.full { display: flex; width: 100%; }
  .seg.full button { flex: 1 0 auto; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .date-input { background: var(--surface); box-shadow: var(--shadow-chip); border-radius: 999px; padding: 0 14px; font-size: 13px; font-weight: 600; min-height: 44px; border: 0; }
  .text-input { width: 100%; background: var(--surface); box-shadow: var(--shadow-chip); border: 0; border-radius: 999px; padding: 0 16px 0 42px; min-height: 48px; font-size: 13.5px; font-weight: 600; }
  .search-wrap { position: relative; flex: 1; min-width: 0; }
  .search-wrap svg { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--ink-2); }

  /* ---------- stat tiles ---------- */
  .tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .tile { background: var(--surface); color: var(--ink); border-radius: var(--r-card); box-shadow: var(--shadow-card); padding: 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .tile.c-blue { background: var(--blue); color: var(--on-blue); box-shadow: 0 8px 20px rgba(45, 91, 255, .25); }
  .tile.c-lime { background: var(--lime); color: var(--on-bright); box-shadow: 0 8px 20px rgba(212, 245, 91, .25); }
  .tile.c-coral { background: var(--coral); color: var(--on-bright); box-shadow: 0 8px 20px rgba(255, 107, 74, .25); }
  .tile.c-pink { background: var(--pink); color: var(--on-bright); box-shadow: 0 8px 20px rgba(255, 168, 216, .25); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tile { box-shadow: none !important; } }
  :root[data-theme="dark"] .tile { box-shadow: none !important; }
  .tile-label { font-size: 12.5px; font-weight: 700; }
  .tile-value { font-size: 30px; font-weight: 800; letter-spacing: -0.8px; line-height: 1.05; }
  .tile-foot { display: flex; align-items: center; justify-content: space-between; gap: 6px; min-height: 22px; }
  .tile-note { font-size: 11.5px; font-weight: 600; line-height: 1.3; opacity: .85; }
  .delta { font-size: 12px; font-weight: 800; white-space: nowrap; }

  /* ---------- currently reading / recently finished ---------- */
  .hscroll { display: flex; gap: 12px; overflow-x: auto; padding: 4px 20px 14px; margin: 0 -20px; scroll-snap-type: x proximity; scrollbar-width: none; }
  .hscroll::-webkit-scrollbar { display: none; }
  .mini { flex: 0 0 auto; width: 250px; scroll-snap-align: start; background: var(--surface); border-radius: var(--r-card); box-shadow: var(--shadow-card); padding: 14px; text-align: left; display: flex; flex-direction: column; gap: 8px; color: var(--ink); }
  .mini-title { font-weight: 700; font-size: 14.5px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .reading-top { display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 12px; align-items: center; }
  .fandom-square { width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; font-weight: 800; font-size: 14px; letter-spacing: -0.2px; }
  .bar-track { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 999px; }

  /* ---------- badges, chips, small bits ---------- */
  .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; border-radius: 999px; padding: 3px 9px; white-space: nowrap; }
  .badge .dot { width: 7px; height: 7px; border-radius: 50%; }
  .badge.est { background: var(--surface-2); color: var(--ink-2); }
  .badge.dnf { background: var(--solid); color: var(--on-solid); }
  .badge.plain { background: var(--surface-2); color: var(--ink); }
  .badge.rating { background: var(--surface-2); color: var(--ink); min-width: 26px; justify-content: center; }
  .dnf-reason { font-size: 11.5px; font-weight: 700; color: var(--ink-2); }
  .enjoy { display: inline-flex; gap: 2.5px; vertical-align: middle; }
  .enjoy i { width: 7px; height: 7px; border-radius: 50%; background: var(--surface-2); display: block; }
  .enjoy i.on { background: var(--blue); }
  .hbar-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 8px 0; min-height: 44px; }
  .hbar-row + .hbar-row { border-top: 1px solid var(--line); }
  .hbar-label { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hbar-val { font-size: 12px; font-weight: 600; color: var(--ink-2); }
  .hbar-track { grid-column: 1 / -1; height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; display: flex; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 12px; font-weight: 600; color: var(--ink-2); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .srcline { display: flex; align-items: flex-start; gap: 7px; font-size: 12px; font-weight: 600; color: var(--ink-2); min-width: 0; line-height: 1.35; }
  .srcline > i { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 4px; }
  .srcline > span { min-width: 0; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .srcline.one > span { -webkit-line-clamp: 1; }
  .srcline.full > span { display: block; -webkit-line-clamp: unset; }
  .srcline b { font-weight: 700; color: var(--ink); }

  /* ---------- Diary ---------- */
  .month-head { font-size: 17px; font-weight: 800; margin: 22px 4px 10px; display: flex; justify-content: space-between; align-items: baseline; }
  .month-head .faint { font-size: 12.5px; font-weight: 700; }
  .diary { background: var(--surface); border-radius: var(--r-card); box-shadow: var(--shadow-card); overflow: hidden; }
  .drow { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; padding: 12px 14px; width: 100%; text-align: left; background: none; color: var(--ink); align-items: start; }
  .drow + .drow { border-top: 1px solid var(--line); }
  .drow.is-dnf { background: var(--dnf-tint); }
  .date-dot { width: 44px; height: 44px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }
  .date-dot b { font-size: 16px; font-weight: 800; }
  .date-dot span { font-size: 9px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; margin-top: 2px; }
  .dtitle { font-weight: 700; font-size: 14.5px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .struck { text-decoration: line-through; text-decoration-color: var(--dnf-strike); text-decoration-thickness: 2.5px; }
  .dmeta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-top: 5px; font-size: 12px; font-weight: 600; color: var(--ink-2); }
  .kb { display: inline-flex; gap: 4px; color: var(--ink-2); }

  /* ---------- Library ---------- */
  .lib-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .lcard { background: var(--surface); border-radius: var(--r-card); box-shadow: var(--shadow-card); padding: 14px; text-align: left; display: flex; flex-direction: column; gap: 7px; color: var(--ink); }
  .lcard.is-dnf { background: var(--dnf-tint); }
  .table-wrap { overflow-x: auto; background: var(--surface); border-radius: var(--r-card); box-shadow: var(--shadow-card); }
  table { border-collapse: collapse; width: 100%; font-size: 12.5px; font-weight: 600; }
  th, td { padding: 11px 12px; text-align: left; white-space: nowrap; }
  tbody tr { border-top: 1px solid var(--line); }
  tbody tr.is-dnf { background: var(--dnf-tint); }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-2); font-weight: 800; }
  td.t { white-space: normal; min-width: 180px; font-weight: 700; }
  tr.click { cursor: pointer; }
  .wrap-th th { white-space: normal; min-width: 104px; vertical-align: bottom; text-transform: none; letter-spacing: 0; font-size: 12px; }

  /* ---------- filters + panels ---------- */
  .panel { background: var(--surface); border-radius: var(--r-card); box-shadow: var(--shadow-card); padding: 16px 14px; margin-top: 12px; display: flex; flex-direction: column; gap: 16px; }
  .flabel { font-size: 12.5px; font-weight: 800; color: var(--ink); margin-bottom: 8px; }
  .wrap-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .wrap-chips .chip { white-space: normal; text-align: left; flex-shrink: 1; max-width: 100%; padding-top: 6px; padding-bottom: 6px; }
  .panel .chip { box-shadow: none; background: var(--surface-2); }
  .panel .chip.on { box-shadow: none; }
  .plain-input { width: 100%; background: var(--surface-2); border: 0; border-radius: 999px; padding: 0 16px; min-height: 44px; font-size: 13px; font-weight: 600; }
  .panel .date-input { background: var(--surface-2); box-shadow: none; }

  /* ---------- fic detail sheet ---------- */
  .sheet-back { position: fixed; inset: 0; z-index: 50; background: rgba(10, 10, 20, .45); display: flex; align-items: flex-end; justify-content: center; animation: fade .18s ease; }
  .sheet { background: var(--bg); width: 100%; max-width: 760px; max-height: 92vh; overflow-y: auto; border-radius: 28px 28px 0 0; padding: 8px 20px calc(28px + env(safe-area-inset-bottom)); animation: up .22s cubic-bezier(.2,.8,.2,1); }
  @media (min-width: 760px) { .sheet-back { align-items: center; } .sheet { border-radius: 28px; max-height: 88vh; } }
  .grab { width: 40px; height: 5px; border-radius: 9px; background: var(--surface-2); margin: 4px auto 10px; }
  @keyframes fade { from { opacity: 0; } }
  @keyframes up { from { transform: translateY(30px); opacity: .6; } }
  .detail-title { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; line-height: 1.2; margin: 8px 0 4px; }
  .dnf-banner { background: var(--dnf-tint); border-radius: 18px; padding: 10px 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .meta-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; }
  .meta-grid div b { display: block; font-size: 11px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-2); }
  .tagchip { display: inline-block; font-size: 12px; font-weight: 600; padding: 6px 11px; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow-chip); color: var(--ink); margin: 0 6px 8px 0; }
  .tagchip.ship { background: var(--surface); }
  .tagchip.ship::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--fc); margin-right: 6px; }
  .tagchip.revealed { background: var(--surface-2); box-shadow: none; }
  button.tagchip { font: inherit; font-size: 12px; font-weight: 700; min-height: 32px; }
  button.tagchip.more { background: var(--blue); color: var(--on-blue); }
  .timeline { position: relative; padding-left: 18px; }
  .timeline::before { content: ''; position: absolute; left: 5px; top: 6px; bottom: 6px; width: 2px; background: var(--line); border-radius: 2px; }
  .tl-item { position: relative; padding: 4px 0 10px; }
  .tl-item::before { content: ''; position: absolute; left: -17px; top: 8px; width: 10px; height: 10px; border-radius: 50%; background: var(--surface-2); }
  .tl-item.fin::before { background: var(--blue); }
  .tl-item.dnf::before { background: var(--coral); }
  .summary { white-space: pre-line; font-size: 13.5px; font-weight: 500; line-height: 1.6; color: var(--ink); }
  .big-btn { width: 100%; min-height: 48px; padding: 0 16px; border-radius: 999px; background: var(--solid); color: var(--on-solid); font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
  .big-btn.ghost { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-chip); }
  .link-btn { background: none; padding: 0; min-height: 44px; color: var(--blue); font-weight: 700; font-size: 13px; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .link-btn { color: #8FA6FF; } }
  :root[data-theme="dark"] .link-btn { color: #8FA6FF; }
  .empty { text-align: center; color: var(--ink-2); padding: 28px 12px; font-size: 13px; font-weight: 600; }
  .notes li { margin-bottom: 6px; }
  .check { display: flex; align-items: center; gap: 10px; font-size: 13.5px; font-weight: 600; min-height: 44px; }

    }

  }

      const rest = m[2].trim(), lower = rest.toLowerCase();

      if (FULL_NAME_RE.test(rest)) return { role: m[1], name: rest };
    }

  }
  const cap = (w) => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase();

  function vagueWhole(tag, names) {

})();

<script>
// ============================================================================================
// <shelf-rules>
// SHELF LIFE DATA RULES
// Everything that decides what a "reading" is, which day it counts on, how many words it adds
// and whether it gets the "est." badge lives in this one module. Every screen, chart and export
// calls into it, so the numbers always agree with each other. Plain JS (no DOM, no React) so it
// can be run and tested on its own in Node.
// ============================================================================================
const ShelfRules = (() => {
  const TZ = 'Australia/Melbourne';
  const MONTH_MAP = { Jan: 0, Feb: 1, Mar: 2, Apr: 3, May: 4, Jun: 5, Jul: 6, Aug: 7, Sep: 8, Oct: 9, Nov: 10, Dec: 11 };
  const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  // ------------------------------------------------------------------------------------------
  // 1. CELL PARSING — copied from the fandom apps so every cell reads exactly as it does there.
  // ------------------------------------------------------------------------------------------

  // Numbers (Words, Kudos, Chapters...): strip commas, then parseInt. "24,200 " -> 24200.
  const num = (v) => { const n = parseInt(String(v ?? '').replace(/,/g, ''), 10); return isNaN(n) ? 0 : n; };

  const splitList = (s) => { const t = String(s || '').trim(); return t ? t.split(',').map(x => x.trim()).filter(Boolean) : []; };

  // Same as the apps' normIsoDate: ISO, d/m/yyyy (Australian order) or d-Mon-yy; anything else is kept as typed.
  function normIsoDate(raw) {
    const s = String(raw || '').trim();
    if (!s) return '';
    let m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s);
    if (m) return `${m[1]}-${m[2]}-${m[3]}`;
    m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(s);
    if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
    m = /^(\d{1,2})-([A-Za-z]{3})-(\d{2,4})$/.exec(s);
    if (m) {
      const mon = m[2][0].toUpperCase() + m[2].slice(1).toLowerCase();
      if (MONTH_MAP[mon] !== undefined) {

        if (y < 100) y += 2000;
        return `${y}-${String(MONTH_MAP[mon] + 1).padStart(2, '0')}-${m[1].padStart(2, '0')}`;
      }

    return s;
  }

  // Dates are plain Melbourne calendar dates already (the apps write Melbourne time), so no timezone maths here.
  function cellDate(raw) {
    if (typeof raw === 'number') return serialToIso(raw);
    const s = String(raw || '').trim();
    if (!s) return null;
    const d = normIsoDate(s.split(/\s+/)[0]);
    if (isIso(d)) return d;
    return looseDate(s);
  }
  // Google Sheets date serials (days since 30 Dec 1899) -> 'YYYY-MM-DD'. Used for real date cells,
  // which Shelf Life asks the API for as serials so the sheet's display format can't confuse it.
  function serialToIso(n) {
    if (typeof n !== 'number' || !isFinite(n) || n < 1 || n > 2958465) return null;
    return new Date(Date.UTC(1899, 11, 30) + Math.floor(n) * 86400000).toISOString().slice(0, 10);
  }

    const d = serialToIso(n); if (!d) return '';

  //     The one exception: a re-read in progress whose earlier read the log shows.
  // Words: Read = full Words. DNF = Words × Chapters Read ÷ chapters (capped at 100%) when Chapters Read
  //   is filled in (above 0); otherwise words = null and the reading is left out of word totals.
  // ------------------------------------------------------------------------------------------
  const IS_READING = new Set(['Read', 'DNF']);

  // origin: where the reading came from — 'dataList' (the row itself) or 'log' (an earlier read the log shows).
  function makeReading(fic, readNumber, kind, date, est, dnfChapters, origin, started, events) {
    let words = null;
    if (kind === 'Read') words = fic.words;
    else if (dnfChapters && dnfChapters > 0 && fic.chapters > 0) words = Math.round(fic.words * Math.min(1, dnfChapters / fic.chapters));
    return {
      id: fic.key + '#' + readNumber, ficKey: fic.key, source: fic.source, fandom: fic.fandom, pairing: fic.pairing, pairingKey: fic.pairingKey, fic, readNumber, kind,
      date: date || null, est: !!est, dnfChapters: kind === 'DNF' ? (dnfChapters || null) : null,
      words, origin, started: started || null, events: events || [],
    };
  }

  function buildReadings(fics, events) {
    const byKey = new Map();
    for (const e of events) { if (!byKey.has(e.key)) byKey.set(e.key, []); byKey.get(e.key).push(e); }
    const readings = [];
    let logNotStatus = 0;
    for (const fic of fics) {
      const evs = (byKey.get(fic.key) || []).slice().sort((a, b) => a.seq - b.seq);
      const isReading = IS_READING.has(fic.status);
      const maxLogRead = evs.reduce((m, e) => Math.max(m, e.readNumber), 0);
      const logShowsReread = evs.some(e => e.event === 'Re-read started' || e.readNumber > 1);
      // Which read the Data List row describes: the log's read number when it shows a re-read, else 1.
      const current = logShowsReread ? Math.max(maxLogRead, 2) : 1;
      if (!isReading && !(logShowsReread && IN_PROGRESS.has(fic.status))) {
        if (!IN_PROGRESS.has(fic.status) && evs.some(e => e.event === 'Finished' || e.event === 'DNF')) logNotStatus++;
        continue;
      }
      const forRead = (r) => logShowsReread ? evs.filter(e => e.readNumber === r) : evs; // no re-read: every event is this read's
      const last = (list, name) => { for (let i = list.length - 1; i >= 0; i--) if (list[i].event === name) return list[i]; return null; };
      const startOf = (list) => { const e = list.find(x => x.event === 'Started' || x.event === 'Re-read started'); return e ? e.date : null; };

      // Earlier reads the log shows (re-reads only).
      for (let r = 1; r < current; r++) {
        const list = forRead(r);
        const fin = last(list, 'Finished'), dnf = last(list, 'DNF');
        const end = fin && dnf ? (fin.seq > dnf.seq ? fin : dnf) : (fin || dnf);
        if (end) {
          const kind = end.event === 'Finished' ? 'Read' : 'DNF';
          readings.push(makeReading(fic, r, kind, end.date, false, kind === 'DNF' ? end.chaptersRead : null, 'log', startOf(list), list));
        } else {
          // The log shows a later read, so this one happened, but it has no Finished event. While the
          // re-read is still under way, Date Read still holds this read's finish date.
          const date = r === current - 1 && !isReading ? fic.dateRead : null;
          readings.push(makeReading(fic, r, 'Read', date, true, null, 'log', startOf(list), list));
        }
      }

      // The read the Data List row describes.
      if (isReading) {
        const list = forRead(current);
        if (fic.status === 'Read') {
          const fin = last(list, 'Finished');
          readings.push(makeReading(fic, current, 'Read', fic.dateRead || (fin && fin.date), !fin, null, 'dataList', startOf(list) || fic.dateStarted, list));
        } else {
          const dnf = last(list, 'DNF');
          readings.push(makeReading(fic, current, 'DNF', fic.lastReadDate || (dnf && dnf.date), !dnf, fic.chaptersRead || null, 'dataList', startOf(list) || fic.dateStarted, list));
        }
      }
    }
    readings.logNotStatus = logNotStatus;
    return readings;
  }

  // ------------------------------------------------------------------------------------------
  // 3. PERIODS — calendar periods in Australia/Melbourne. A reading counts toward the period that
  // contains its date. Undated readings only appear in "All time".
  // ------------------------------------------------------------------------------------------
  function melbourneToday(d) {
    const p = {};
    new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' })
      .formatToParts(d || new Date()).forEach(x => { if (x.type !== 'literal') p[x.type] = x.value; });
    return `${p.year}-${p.month}-${p.day}`;
  }
  const pad = (n) => String(n).padStart(2, '0');
  const ymd = (y, m, d) => `${y}-${pad(m)}-${pad(d)}`;
  const isoToUTC = (s) => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); };
  const utcToIso = (t) => new Date(t).toISOString().slice(0, 10);
  const addDays = (s, n) => utcToIso(isoToUTC(s) + n * 86400000);
  const dim = (y, m) => new Date(Date.UTC(y, m, 0)).getUTCDate();
  const monthShift = (y, m, k) => { const t = y * 12 + (m - 1) + k; return [Math.floor(t / 12), (t % 12 + 12) % 12 + 1]; };
  function monthsPeriod(y, m, len, unit) {
    const [ey, em] = monthShift(y, m, len - 1);
    return { unit, y, m, len, start: ymd(y, m, 1), end: ymd(ey, em, dim(ey, em)) };
  }
  // type: thisMonth | lastMonth | thisQuarter | thisYear | lastYear | all | custom
  function makePeriod(type, today, custom) {
    const [y, m] = today.split('-').map(Number);
    if (type === 'thisMonth') return { ...monthsPeriod(y, m, 1, 'month'), type, partial: true };
    if (type === 'lastMonth') { const [py, pm] = monthShift(y, m, -1); return { ...monthsPeriod(py, pm, 1, 'month'), type }; }
    if (type === 'thisQuarter') return { ...monthsPeriod(y, Math.floor((m - 1) / 3) * 3 + 1, 3, 'quarter'), type, partial: true };
    if (type === 'thisYear') return { ...monthsPeriod(y, 1, 12, 'year'), type, partial: true };
    if (type === 'lastYear') return { ...monthsPeriod(y - 1, 1, 12, 'year'), type };
    if (type === 'custom') {
      let start = custom && isIso(custom.start) ? custom.start : ymd(y, m, 1);
      let end = custom && isIso(custom.end) ? custom.end : today;
      if (start > end) [start, end] = [end, start];
      return { unit: 'days', type, start, end };
    }
    return { unit: 'all', type: 'all', start: null, end: null };
  }
  function shiftPeriod(p, k) {
    if (!p || p.unit === 'all') return null;
    if (p.unit === 'days') {
      const n = Math.round((isoToUTC(p.end) - isoToUTC(p.start)) / 86400000) + 1;
      return { ...p, start: addDays(p.start, k * n), end: addDays(p.end, k * n), partial: false };
    }
    const [ny, nm] = monthShift(p.y, p.m, k * p.len);
    return { ...monthsPeriod(ny, nm, p.len, p.unit), type: p.type, partial: false };
  }
  function sameLastYear(p) {
    if (!p || p.unit === 'all') return null;
    if (p.unit === 'days') {
      const back = (s) => { const [y, m, d] = s.split('-').map(Number); return ymd(y - 1, m, Math.min(d, dim(y - 1, m))); };
      return { ...p, start: back(p.start), end: back(p.end), partial: false };
    }
    return { ...monthsPeriod(p.y - 1, p.m, p.len, p.unit), type: p.type, partial: false };
  }
  const inPeriod = (date, p) => !p || p.unit === 'all' ? true : !!date && date >= p.start && date <= p.end;

  function fmtDay(iso, today) {
    if (!isIso(iso)) return '';
    const [y, m, d] = iso.split('-').map(Number);
    return `${d} ${MON[m - 1]}${today && String(y) === today.slice(0, 4) ? '' : ' ' + y}`;
  }
  function periodName(p, today) {
    if (!p) return '';
    const cy = today ? +today.slice(0, 4) : 0;
    if (p.unit === 'all') return 'all time';
    if (p.unit === 'month') return MONTHS[p.m - 1] + (p.y !== cy ? ' ' + p.y : '');
    if (p.unit === 'quarter') return `Q${Math.floor((p.m - 1) / 3) + 1} ${p.y}`;
    if (p.unit === 'year') return String(p.y);
    if (p.type === 'likeForLike') return rangeLabel(p.start, p.end, today);
    return `${fmtDay(p.start, today)} – ${fmtDay(p.end, today)}`;
  }

  // Compact date range: "1–11 Sep", "1 Jul – 11 Sep", "1 Jan – 11 Oct 2025", "28 Dec 2025 – 3 Jan".
  // The year is shown only when it isn't the current year.
  function rangeLabel(start, end, today) {
    if (!isIso(start) || !isIso(end)) return '';
    const [y1, m1, d1] = start.split('-').map(Number), [y2, m2, d2] = end.split('-').map(Number);
    const yr = (y) => (today && String(y) === today.slice(0, 4) ? '' : ' ' + y);
    if (start === end) return `${d1} ${MON[m1 - 1]}${yr(y1)}`;
    if (y1 === y2 && m1 === m2) return `${d1}–${d2} ${MON[m1 - 1]}${yr(y1)}`;
    if (y1 === y2) return `${d1} ${MON[m1 - 1]} – ${d2} ${MON[m2 - 1]}${yr(y1)}`;
    return `${fmtDay(start, today)} – ${fmtDay(end, today)}`;
  }

  // LIKE-FOR-LIKE COMPARISON for a period still in progress (This month / quarter / year).
  // Compares the days elapsed so far with the SAME NUMBER OF DAYS from the start of the comparison
  // period (previous period, or the same period last year), capped at that period's end.
  //   1–11 Oct vs previous period -> 1–11 Sep; vs same time last year -> 1–11 Oct 2025;
  //   31 Oct vs September -> capped at 30 Sep.
  // Completed periods, Custom ranges and All time are returned unchanged (no trimming).
  // Only the dashboard's comparison (tile deltas, headline, "compared with" line) uses this;
  // sparklines and charts keep using full periods.
  function likeForLike(p, cp, today) {
    if (!p || !cp || !p.partial || p.unit === 'all' || p.unit === 'days' || !isIso(today)) return cp;
    const upTo = today < p.end ? today : p.end;
    if (upTo < p.start) return cp;
    const days = Math.round((isoToUTC(upTo) - isoToUTC(p.start)) / 86400000) + 1;
    let end = addDays(cp.start, days - 1);
    if (end > cp.end) end = cp.end;
    return { ...cp, unit: 'days', type: 'likeForLike', start: cp.start, end, partial: false, days, full: cp };
  }

  // ------------------------------------------------------------------------------------------
  // 4. STATS for a period
  //   words     = sum of reading words (DNFs without Chapters Read add nothing; counted in dnfNoWords)
  //   finished  = Read readings; dnfs = DNF readings
  //   completion = finished ÷ (finished + dnfs), for readings dated in the period
  //   median    = median full length (Words) of finished readings — shown instead of a mean
  //   newAuthors = authors whose first dated reading falls in the period (all time: every author read)
  // ------------------------------------------------------------------------------------------
  function median(values) {
    if (!values.length) return null;
    const s = values.slice().sort((a, b) => a - b);
    const mid = Math.floor(s.length / 2);
    return s.length % 2 ? s[mid] : Math.round((s[mid - 1] + s[mid]) / 2);
  }
  function authorFirstDates(readings) {
    const first = new Map();
    for (const r of readings) for (const a of realAuthors(r.fic.authors)) {
      if (!first.has(a)) first.set(a, null);
      if (r.date && (first.get(a) === null || r.date < first.get(a))) first.set(a, r.date);
    }
    return first;
  }
  function periodStats(readings, p, authorFirst) {
    const rs = readings.filter(r => inPeriod(r.date, p));
    let words = 0, finished = 0, dnfs = 0, dnfNoWords = 0, est = 0;
    const lens = [], byFandom = {}, byPairing = {}, countFandom = {}, countPairing = {};
    for (const r of rs) {
      countFandom[r.fandom] = (countFandom[r.fandom] || 0) + 1;
      countPairing[r.pairingKey] = (countPairing[r.pairingKey] || 0) + 1;
      if (r.words !== null) {
        words += r.words;
        byFandom[r.fandom] = (byFandom[r.fandom] || 0) + r.words;
        byPairing[r.pairingKey] = (byPairing[r.pairingKey] || 0) + r.words;
      }
      if (r.kind === 'Read') { finished++; lens.push(r.fic.words); if (r.est) est++; }
      else { dnfs++; if (r.words === null) dnfNoWords++; }
    }
    let newAuthors = 0;
    if (authorFirst) for (const [, d] of authorFirst) if (p && p.unit === 'all' ? true : (d && inPeriod(d, p))) newAuthors++;
    return {
      readings: rs, words, finished, dnfs, dnfNoWords, est, byFandom, byPairing, countFandom, countPairing,
      completion: finished + dnfs ? finished / (finished + dnfs) : null,
      median: median(lens), newAuthors,
    };
  }

  // Month keys "YYYY-MM" from a to b inclusive.
  function monthKeys(a, b) {
    const out = [];
    let [y, m] = a.split('-').map(Number);
    const [by, bm] = b.split('-').map(Number);
    while (y < by || (y === by && m <= bm)) { out.push(`${y}-${pad(m)}`); [y, m] = monthShift(y, m, 1); }
    return out;
  }
  // Per-month totals across all dated readings (for charts). Undated readings are left out.
  // groupOf maps a reading to its series key (fandom by default; pairing, or a folded "other" group).
  function monthlySeries(readings, keys, groupKeys, groupOf) {
    const of = groupOf || (r => r.fandom);
    const idx = new Map(keys.map((k, i) => [k, i]));
    const words = {}; groupKeys.forEach(f => { words[f] = keys.map(() => 0); });
    const finished = keys.map(() => 0), dnfs = keys.map(() => 0);
    for (const r of readings) {
      if (!r.date) continue;
      const i = idx.get(r.date.slice(0, 7));
      if (i === undefined) continue;
      const g = of(r);
      if (r.words !== null && g !== undefined && words[g]) words[g][i] += r.words;
      if (r.kind === 'Read') finished[i]++; else dnfs[i]++;
    }
    const completion = keys.map((_, i) => finished[i] + dnfs[i] ? finished[i] / (finished[i] + dnfs[i]) : null);
    return { keys, words, finished, dnfs, completion };
  }
  function monthLabel(key, withYear) { const [y, m] = key.split('-').map(Number); return MON[m - 1] + (withYear ? ' ' + String(y).slice(2) : ''); }

  // Tags ranked by words read (DNFs without Chapters Read add no words). isVisible(tag) decides which
  // tags may appear (the sex-related tag toggle); it never changes which fics or words are counted.
  function topTags(readings, isVisible, limit, minFics) {
    const m = new Map();
    for (const r of readings) {
      if (r.words === null) continue;
      for (const t of new Set(r.fic.tags)) {
        if (isVisible && !isVisible(t)) continue;
        const e = m.get(t) || { tag: t, words: 0, fics: new Set() };
        e.words += r.words; e.fics.add(r.ficKey); m.set(t, e);
      }
    }
    return [...m.values()].map(e => ({ tag: e.tag, words: e.words, fics: e.fics.size })).filter(e => e.fics >= (minFics || 0))
      .sort((a, b) => b.words - a.words || b.fics - a.fics).slice(0, limit || 10);
  }
  // Authors ranked by distinct fics read, then words. Anonymous / orphan_account are left out.
  function authorRanking(readings) {
    const m = new Map();
    for (const r of readings) for (const a of realAuthors(r.fic.authors)) {
      const e = m.get(a) || { author: a, fics: new Set(), words: 0, readings: 0 };
      e.fics.add(r.ficKey); e.readings++; if (r.words !== null) e.words += r.words; m.set(a, e);
    }
    const list = [...m.values()].map(e => ({ author: e.author, fics: e.fics.size, words: e.words, readings: e.readings }));
    list.sort((a, b) => b.fics - a.fics || b.words - a.words || a.author.localeCompare(b.author));
    // Rank by fics read; authors with the same number of fics share a rank (1, 2, 2, 4).
    list.forEach((e, i) => { e.rank = i > 0 && list[i - 1].fics === e.fics ? list[i - 1].rank : i + 1; });
    return list;
  }

  // ------------------------------------------------------------------------------------------
  // 5. FILTERS (Library, Diary and Export all use this)
  // ------------------------------------------------------------------------------------------
  function emptyFilters() {
    return { q: '', fandoms: [], pairings: [], kinds: [], ratings: [], categories: [], tagsInc: [], tagsExc: [], author: '', enjoyment: [], from: '', to: '', est: 'all' };
  }
  function filterCount(f) {
    return f.fandoms.length + (f.pairings || []).length + f.kinds.length + f.ratings.length + f.categories.length + f.tagsInc.length + f.tagsExc.length +
      (f.author ? 1 : 0) + f.enjoyment.length + (f.from ? 1 : 0) + (f.to ? 1 : 0) + (f.est !== 'all' ? 1 : 0);
  }
  function filterReadings(readings, f, opts) {
    const q = (f.q || '').trim().toLowerCase();
    const author = (f.author || '').trim().toLowerCase();
    return readings.filter(r => {
      const fic = r.fic;
      if (opts && opts.excludeE && fic.rating === 'E') return false;
      if (f.fandoms.length && !f.fandoms.includes(r.fandom)) return false;
      if (f.pairings && f.pairings.length && !f.pairings.includes(r.pairingKey)) return false;
      if (f.kinds.length && !f.kinds.includes(r.kind)) return false;
      if (f.ratings.length && !f.ratings.includes(fic.rating || '—')) return false;
      if (f.categories.length && !fic.categories.some(c => f.categories.includes(c))) return false;
      if (f.tagsInc.length && !f.tagsInc.every(t => fic.tags.includes(t) || fic.ships.includes(t))) return false;
      if (f.tagsExc.length && f.tagsExc.some(t => fic.tags.includes(t) || fic.ships.includes(t))) return false;
      if (author && !fic.authors.some(a => a.toLowerCase() === author)) return false;
      if (f.enjoyment.length && !f.enjoyment.includes(fic.enjoyment)) return false;
      if (f.from && !(r.date && r.date >= f.from)) return false;
      if (f.to && !(r.date && r.date <= f.to)) return false;
      if (f.est === 'est' && !r.est) return false;
      if (f.est === 'logged' && r.est) return false;
      if (q) {
        const hit = fic.title.toLowerCase().includes(q) || fic.authors.some(a => a.toLowerCase().includes(q)) ||
          fic.tags.some(t => t.toLowerCase().includes(q)) || fic.ships.some(t => t.toLowerCase().includes(q));
        if (!hit) return false;
      }
      return true;
    });
  }
  // Newest first; undated readings go last.
  function sortDiary(readings) {
    return readings.slice().sort((a, b) => {
      if (a.date && b.date) return b.date.localeCompare(a.date) || b.readNumber - a.readNumber || a.fic.title.localeCompare(b.fic.title);
      if (a.date) return -1; if (b.date) return 1;
      return a.fic.title.localeCompare(b.fic.title);
    });
  }

  // ------------------------------------------------------------------------------------------
  // 6. EXPORT rows (a flat diary: one row per reading)
  // ------------------------------------------------------------------------------------------
  function exportRow(r) {
    const f = r.fic;
    return {
      'Date': r.date || '', 'Fandom': f.fandom, 'Pairing': f.pairing, 'Title': f.title, 'Author': f.authors.join(', '),
      'Result': r.kind === 'Read' ? 'Finished' : 'DNF', 'Read #': r.readNumber, 'Estimated': r.est ? 'Y' : '',
      'Words read': r.words === null ? '' : r.words, 'Words': f.words, 'Chapters': f.chapters,
      'DNF chapters read': r.dnfChapters || '', 'Enjoyment': f.enjoyment || '', 'K': f.kg ? 'Y' : '', 'B': f.bk ? 'Y' : '',
      'Rating': f.rating, 'Category': f.category, 'Tags': f.tags.join(', '), 'Relationships': f.ships.join(', '),
      'Date Published': f.datePublished, 'Status now': f.status, 'Times Read': f.timesRead || '', 'Link': f.link, 'Work ID': f.id,
    };
  }
  function toCSV(rows) {
    if (!rows.length) return '';
    const cols = Object.keys(rows[0]);
    const esc = (v) => { const s = String(v ?? ''); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    return [cols.join(','), ...rows.map(r => cols.map(c => esc(r[c])).join(','))].join('\r\n');
  }

  // ------------------------------------------------------------------------------------------
  // 7. MODEL: everything the screens need, built once per sync.
  // ------------------------------------------------------------------------------------------
  const REQUIRED_COLS = ['Status', 'Title', 'Link', 'Author', 'Words', 'Chapters', 'Date Read', 'Last Read', 'Chapters Read', 'Times Read'];
  // sourceData: { [source id]: loaded sheet }. sources: the SOURCES list.
  function buildModel(sourceData, sources) {
    const fics = [], events = [], notes = [];
    for (const src of sources) {
      const d = sourceData[src.id];
      const name = `${sourceLabel(src, sources)} sheet`;
      if (!d) { notes.push(`${name}: not loaded yet.`); continue; }
      assignGroups(d.fics, src);
      fics.push(...d.fics); events.push(...d.log);
      if (d.logMissing) notes.push(`${name}: no "Reading Log" tab, so every reading there counts as estimated.`);
      if (d.missingCols && d.missingCols.length) notes.push(`${name}: no column named ${d.missingCols.map(c => `"${c}"`).join(', ')}.`);
      if (src.pairingMode === 'perFic' && d.header && !d.header.includes('Relationships')) notes.push(`${name}: pairings come from a "Relationships" column, but there isn't one, so every fic shows "${NO_PAIRING}".`);
      if (d.duplicateHeaders && d.duplicateHeaders.length) notes.push(`${name}: more than one column is headed ${d.duplicateHeaders.map(c => `"${c}"`).join(', ')}; Shelf Life uses the right-most one, like the fandom apps.`);
      if (d.stale) notes.push(`${name}: the last sync failed, so this is the copy from the sync before.`);
    }
    const ficByKey = new Map(fics.map(f => [f.key, f]));
    const eventsByKey = new Map();
    let unmatched = 0;
    for (const e of events) {
      if (!ficByKey.has(e.key)) { unmatched++; continue; }
      if (!eventsByKey.has(e.key)) eventsByKey.set(e.key, []);
      eventsByKey.get(e.key).push(e);
    }
    for (const list of eventsByKey.values()) list.sort((a, b) => a.seq - b.seq);
    const readings = buildReadings(fics, events.filter(e => ficByKey.has(e.key)));
    const inProgress = fics.filter(f => IN_PROGRESS.has(f.status))
      .sort((a, b) => (b.lastRead || '').localeCompare(a.lastRead || '') || (b.dateStarted || '').localeCompare(a.dateStarted || ''));

    // Data notes (shown under Export, so it's always clear what the numbers rest on).
    const undatedRead = readings.filter(r => r.kind === 'Read' && !r.date).length;
    const undatedDnf = readings.filter(r => r.kind === 'DNF' && !r.date).length;
    const dnfNoWords = readings.filter(r => r.kind === 'DNF' && r.words === null).length;
    const est = readings.filter(r => r.est).length;
    const badDates = fics.flatMap(f => f.badDates.map(b => ({ ...b, title: f.title })));
    const statusCounts = {};
    for (const f of fics) { const s = f.status || '(blank)'; statusCounts[s] = (statusCounts[s] || 0) + 1; }
    const unknown = Object.keys(statusCounts).filter(s => s !== '(blank)' && !KNOWN_STATUSES.includes(s));
    if (est) notes.push(`${est} reading${est === 1 ? ' has' : 's have'} no matching Finished or DNF event in the Reading Log (backfilled), so ${est === 1 ? "it's" : "they're"} marked est.`);
    if (undatedRead) notes.push(`${undatedRead} finished reading${undatedRead === 1 ? ' has' : 's have'} no date, so ${undatedRead === 1 ? 'it counts' : 'they count'} in All time only.`);
    if (undatedDnf) notes.push(`${undatedDnf} DNF${undatedDnf === 1 ? ' has' : 's have'} no Last Read date, so ${undatedDnf === 1 ? 'it counts' : 'they count'} in All time only.`);
    if (dnfNoWords) notes.push(`${dnfNoWords} DNF${dnfNoWords === 1 ? ' has' : 's have'} no Chapters Read, so ${dnfNoWords === 1 ? 'its' : 'their'} words aren't in any word total.`);
    if (readings.logNotStatus) notes.push(`${readings.logNotStatus} fic${readings.logNotStatus === 1 ? ' has' : 's have'} a Finished or DNF event in the Reading Log but a Status other than Read or DNF now, so ${readings.logNotStatus === 1 ? "it isn't" : "they aren't"} counted (the Data List decides).`);
    const multi = fics.filter(f => f.timesRead > 1 && IS_READING.has(f.status) && readings.filter(r => r.ficKey === f.key).length < f.timesRead).length;
    if (multi) notes.push(`${multi} fic${multi === 1 ? ' has' : 's have'} Times Read above 1 without Reading Log entries for the earlier reads, so each counts once and shows "Read N times".`);
    if (unmatched) notes.push(`${unmatched} Reading Log row${unmatched === 1 ? " doesn't" : "s don't"} match any fic in Data List (by work ID), so ${unmatched === 1 ? "it's" : "they're"} ignored.`);
    if (badDates.length) notes.push(`${badDates.length} date cell${badDates.length === 1 ? '' : 's'} couldn't be read, e.g. ${badDates.slice(0, 3).map(b => `${b.col} "${b.value}" on "${b.title}"`).join('; ')}.`);
    if (unknown.length) notes.push(`Other statuses found: ${unknown.map(s => `"${s}" (${statusCounts[s]})`).join(', ')}. They're kept as their own status.`);

    const vocab = { tags: new Map(), categories: new Set(), ratings: new Set(), authors: new Set() };
    for (const r of readings) {
      for (const t of r.fic.tags) vocab.tags.set(t, (vocab.tags.get(t) || 0) + 1);
      for (const t of r.fic.ships) vocab.tags.set(t, (vocab.tags.get(t) || 0) + 1);
      r.fic.categories.forEach(c => vocab.categories.add(c));
      vocab.ratings.add(r.fic.rating || '—');
      realAuthors(r.fic.authors).forEach(a => vocab.authors.add(a));
    }
    const dated = readings.filter(r => r.date).map(r => r.date).sort();

    // Fandoms (in SOURCES order, merged by name), each with its pairings ranked by all-time words read.
    const fandomList = [];
    for (const src of sources) {
      let f = fandomList.find(x => x.name === src.fandom);
      if (!f) { f = { name: src.fandom, short: shortFandom(src.fandom), sourceIds: [], pairings: [] }; fandomList.push(f); }
      f.sourceIds.push(src.id);
    }
    const pairingByKey = new Map();
    const touch = (fandom, pairing) => {
      const key = pairingKey(fandom, pairing);
      if (!pairingByKey.has(key)) pairingByKey.set(key, { key, name: pairing, fandom, words: 0, readings: 0, rank: 0 });
      return pairingByKey.get(key);
    };
    for (const src of sources) if (src.pairingMode !== 'perFic') touch(src.fandom, pairingFor(src, []));
    for (const f of fics) if (IS_READING.has(f.status) || IN_PROGRESS.has(f.status)) touch(f.fandom, f.pairing);
    for (const r of readings) { const p = touch(r.fandom, r.pairing); p.readings++; if (r.words !== null) p.words += r.words; }
    for (const fd of fandomList) {
      fd.pairings = [...pairingByKey.values()].filter(p => p.fandom === fd.name)
        .sort((a, b) => (a.name === NO_PAIRING) - (b.name === NO_PAIRING) || b.words - a.words || b.readings - a.readings || a.name.localeCompare(b.name));
      fd.pairings.forEach((p, i) => { p.rank = i; });
    }

    // Tag classes (TAG_CLASSES), once per tag, with how many fics carry it across all Sheets.
    const names = TAG_CLASSES.namesFrom([...sources.filter(x => x.pairingMode !== 'perFic').map(x => x.pairing), ...fics.flatMap(f => f.ships)]);
    const tagCount = new Map();
    for (const f of fics) for (const t of f.tags) tagCount.set(t, (tagCount.get(t) || 0) + 1);
    const tagInfo = new Map();
    for (const [tag, count] of tagCount) tagInfo.set(tag, { tag, count, ...TAG_CLASSES.classify(tag, names) });

    // Per-Sheet counts, to check against the Sheets (Export → Readings per Sheet).
    const counts = sources.map(src => {
      const rs = readings.filter(r => r.source === src.id);
      const fs = fics.filter(f => f.source === src.id);
      return {
        key: src.id, name: sourceLabel(src, sources), loaded: !!sourceData[src.id],
        statusRead: fs.filter(f => f.status === 'Read').length, statusDnf: fs.filter(f => f.status === 'DNF').length,
        readings: rs.length, read: rs.filter(r => r.kind === 'Read').length, dnf: rs.filter(r => r.kind === 'DNF').length,
        logged: rs.filter(r => !r.est).length, est: rs.filter(r => r.est).length, undated: rs.filter(r => !r.date).length,
        rereads: rs.filter(r => r.readNumber > 1).length, logEvents: events.filter(e => e.source === src.id).length,
      };
    });
    return {
      fics, ficByKey, eventsByKey, readings, inProgress, notes, statusCounts, counts, fandomList, pairingByKey, tagInfo,
      authorFirst: authorFirstDates(readings), authors: authorRanking(readings), vocab,
      firstDate: dated[0] || null, lastDate: dated[dated.length - 1] || null,
    };
  }

  // ==========================================================================================
  // 8. PHASE 2 ANALYTICS
  // Shared definitions (every Phase 2 screen uses these):
  //   reading         as in section 2: each Data List row with Status Read or DNF, plus earlier
  //                   re-reads the Reading Log shows. Every reading is "closed" (finished or DNF).
  //   logged reading  a reading with a start date (a Started / Re-read started event, or the Data
  //                   List's Date Started). Backfilled (est.) reads have no start date, so any
  //                   metric needing one uses logged readings only and says "Based on N logged reads".
  //   timed event     a Reading Log event whose timestamp includes a time of day.
  //   week            Monday to Sunday, in Melbourne dates.
  //   tag words       a reading's words count toward each of its visible tags (sex-tag toggle and
  //                   overrides respected; archive warnings were removed at parse time). DNFs with
  //                   no Chapters Read add no words, exactly as in topTags.
  //   MIN_RANK        fewest readings before a tag, author or length band is ranked or charted (3).
  //   MIN_RATE        fewest closed readings before a completion / DNF rate is shown (5).
  //   MIN_LOGGED      fewest logged reads before a logged-only metric is shown (5).
  //   MIN_PREDICT     fewest readings before a tag can appear in "Tags that predict a DNF" (10).
  // ==========================================================================================
  const MIN_RANK = 3, MIN_RATE = 5, MIN_LOGGED = 5, MIN_PREDICT = 10;
  const LENGTH_BANDS = [
    { key: 'lt20', label: 'Under 20k', min: 0, max: 20000 },
    { key: '20-50', label: '20–50k', min: 20000, max: 50000 },
    { key: '50-100', label: '50–100k', min: 50000, max: 100000 },
    { key: '100-200', label: '100–200k', min: 100000, max: 200000 },
    { key: '200plus', label: '200k+', min: 200000, max: Infinity },
  ];
  const lengthBand = (w) => LENGTH_BANDS.find(b => w >= b.min && w < b.max) || LENGTH_BANDS[0];
  const dayDiff = (a, b) => Math.round((isoToUTC(b) - isoToUTC(a)) / 86400000);
  const WEEKDAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
  const weekdayOf = (iso) => (new Date(isoToUTC(iso)).getUTCDay() + 6) % 7;   // 0 = Monday
  const weekStart = (iso) => addDays(iso, -weekdayOf(iso));
  const quarterKey = (iso) => `${iso.slice(0, 4)}-Q${Math.floor((+iso.slice(5, 7) - 1) / 3) + 1}`;
  const quarterLabel = (k) => `Q${k.slice(-1)} ’${k.slice(2, 4)}`;
  function quarterKeys(endIso, n) {
    let y = +endIso.slice(0, 4), q = Math.floor((+endIso.slice(5, 7) - 1) / 3) + 1;
    const out = [];
    for (let i = 0; i < n; i++) { out.unshift(`${y}-Q${q}`); q--; if (q === 0) { q = 4; y--; } }
    return out;
  }
  const monthName = (key, withYear = true) => { const [y, m] = key.split('-').map(Number); return MONTHS[m - 1] + (withYear ? ' ' + y : ''); };
  const inRange = (d, a, b) => !!d && d >= a && d <= b;
  const isLogged = (r) => !!r.started && isIso(r.started);
  const sumWords = (rs) => rs.reduce((t, r) => t + (r.words || 0), 0);
  const pct = (x) => Math.round(x * 100);
  const yearsWithReads = (readings) => [...new Set(readings.filter(r => r.date).map(r => +r.date.slice(0, 4)))].sort((a, b) => a - b);

  // Tag totals over a set of readings: Map tag -> { words, readings, finished, dnfs }.
  function tagTotals(readings, isVisible) {
    const m = new Map();
    for (const r of readings) for (const t of new Set(r.fic.tags)) {
      if (isVisible && !isVisible(t)) continue;
      const e = m.get(t) || { words: 0, readings: 0, finished: 0, dnfs: 0 };
      e.readings++; if (r.words !== null) e.words += r.words;
      if (r.kind === 'Read') e.finished++; else e.dnfs++;
      m.set(t, e);
    }
    return m;
  }

  // ---- TASTES -------------------------------------------------------------------------------
  // BUMP CHART: the 10 tags with most words read over the last 8 quarters (ending this quarter),
  // each needing >= MIN_RANK readings in that window. For each quarter, a tag's rank is its
  // position by words among all tags with >= MIN_RANK readings THAT quarter; null = not ranked.
  function tagBump(readings, isVisible, today, nQuarters = 8, top = 10) {
    const quarters = quarterKeys(today, nQuarters);
    const qset = new Set(quarters);
    const win = readings.filter(r => r.date && qset.has(quarterKey(r.date)));
    const totals = tagTotals(win, isVisible);
    const chosen = [...totals].filter(([, v]) => v.readings >= MIN_RANK && v.words > 0)
      .sort((a, b) => b[1].words - a[1].words || a[0].localeCompare(b[0])).slice(0, top).map(([t]) => t);
    const ranks = Object.fromEntries(chosen.map(t => [t, []]));
    for (const q of quarters) {
      const tq = tagTotals(win.filter(r => quarterKey(r.date) === q), isVisible);
      const ranked = [...tq].filter(([, v]) => v.readings >= MIN_RANK && v.words > 0)
        .sort((a, b) => b[1].words - a[1].words || a[0].localeCompare(b[0]));
      const pos = new Map(ranked.map(([t], i) => [t, i + 1]));
      chosen.forEach(t => ranks[t].push(pos.get(t) || null));
    }
    const tags = chosen.map(t => ({ tag: t, words: totals.get(t).words, readings: totals.get(t).readings, ranks: ranks[t] }));
    // Finding: the biggest climb from a tag's first ranked quarter to its latest ranked quarter.
    let best = null;
    for (const t of tags) {
      const idx = t.ranks.map((r, i) => r ? i : -1).filter(i => i >= 0);
      if (idx.length < 2) continue;
      const a = idx[0], b = idx[idx.length - 1], climb = t.ranks[a] - t.ranks[b];
      if (!best || climb > best.climb) best = { tag: t.tag, from: t.ranks[a], to: t.ranks[b], fromQ: quarters[a], toQ: quarters[b], climb };
    }
    let finding;
    if (!tags.length) finding = 'No tag has 3 or more readings in the last 8 quarters yet.';
    else if (best && best.climb > 0) finding = `${best.tag} rose from your #${best.from} tag in ${quarterLabel(best.fromQ)} to #${best.to} in ${quarterLabel(best.toQ)}.`;
    else finding = `${tags[0].tag} is your top tag over the last 8 quarters, with ${fmtK(tags[0].words)} words read.`;
    return { quarters, labels: quarters.map(quarterLabel), tags, finding };
  }

  // RISERS AND FALLERS: a tag's share = words carrying that tag ÷ all words read in the window
  // (shares add up to more than 100% because fics have many tags). "Now" is the selected year
  // (Jan–Dec; the current year runs to today); "then" is the 12 months before it (the previous
  // calendar year). Risers need >= MIN_RANK readings now; fallers >= MIN_RANK readings then.
  // NEW THIS YEAR: tags with >= MIN_RANK readings in the year and no dated reading before it.
  function tagDrift(readings, isVisible, year) {
    const a = `${year}-01-01`, b = `${year}-12-31`, pa = `${year - 1}-01-01`, pb = `${year - 1}-12-31`;
    const nowR = readings.filter(r => inRange(r.date, a, b)), thenR = readings.filter(r => inRange(r.date, pa, pb));
    const totNow = sumWords(nowR), totThen = sumWords(thenR);
    const tN = tagTotals(nowR, isVisible), tT = tagTotals(thenR, isVisible);
    const before = new Set();
    for (const r of readings) if (r.date && r.date < a) for (const t of r.fic.tags) before.add(t);
    const rows = [];
    for (const tag of new Set([...tN.keys(), ...tT.keys()])) {
      const n = tN.get(tag) || { words: 0, readings: 0 }, t = tT.get(tag) || { words: 0, readings: 0 };
      const shareNow = totNow ? n.words / totNow : 0, shareThen = totThen ? t.words / totThen : 0;
      rows.push({ tag, shareNow, shareThen, change: (shareNow - shareThen) * 100, readingsNow: n.readings, readingsThen: t.readings, wordsNow: n.words });
    }
    const risers = rows.filter(r => r.readingsNow >= MIN_RANK && r.change > 0).sort((x, y) => y.change - x.change).slice(0, 5);
    const fallers = rows.filter(r => r.readingsThen >= MIN_RANK && r.change < 0).sort((x, y) => x.change - y.change).slice(0, 5);
    const newTags = rows.filter(r => r.readingsNow >= MIN_RANK && !before.has(r.tag)).sort((x, y) => y.wordsNow - x.wordsNow);
    const thinBaseline = thenR.length < MIN_RATE;
    let finding;
    if (!nowR.length) finding = `No dated reads in ${year}.`;
    else if (thinBaseline) finding = `Only ${thenR.length} dated read${thenR.length === 1 ? '' : 's'} in ${year - 1}, so these shifts are measured against a very small baseline.`;
    else if (risers.length) finding = `${risers[0].tag} grew the most: ${pct(risers[0].shareThen)}% of your words in ${year - 1} to ${pct(risers[0].shareNow)}% in ${year}.`;
    else finding = `Your tag mix in ${year} is close to ${year - 1}.`;
    return { year, totNow, totThen, readingsNow: nowR.length, readingsThen: thenR.length, risers, fallers, newTags, thinBaseline, finding,
      newFinding: newTags.length ? `${newTags.length} tag${newTags.length === 1 ? ' is' : 's are'} new to you in ${year}; ${newTags[0].tag} leads with ${newTags[0].readingsNow} reads.` : `No tag with 3+ reads in ${year} is new to you.` };
  }

  // ---- COMPLETION ---------------------------------------------------------------------------
  // COMPLETION BY LENGTH: finished ÷ (finished + DNF) per length band (fic Words). A band is shown
  // with >= MIN_RANK readings; its rate only with >= MIN_RATE.
  function completionByBand(readings) {
    const rows = LENGTH_BANDS.map(b => {
      const rs = readings.filter(r => r.fic.words >= b.min && r.fic.words < b.max);
      const finished = rs.filter(r => r.kind === 'Read').length, dnfs = rs.length - finished;
      return { ...b, readings: rs.length, finished, dnfs, rate: rs.length >= MIN_RATE ? finished / rs.length : null, shown: rs.length >= MIN_RANK };
    });
    const rated = rows.filter(r => r.rate !== null);
    let finding = 'Not enough readings in any length band yet.';
    if (rated.length >= 2) {
      const hi = rated.reduce((x, y) => (y.rate > x.rate ? y : x)), lo = rated.reduce((x, y) => (y.rate < x.rate ? y : x));
      finding = `You finish ${pct(hi.rate)}% of ${hi.label.toLowerCase()} fics but only ${pct(lo.rate)}% of ${lo.label.toLowerCase()} ones.`;
    } else if (rated.length === 1) finding = `You finish ${pct(rated[0].rate)}% of ${rated[0].label.toLowerCase()} fics.`;
    return { rows, finding };
  }

  // DNF REASONS: DNF readings per quarter by DNR Reason. "Content…" values (e.g. "Content/Tags")
  // count as Content; blank is "No reason"; any other value is kept as its own reason.
  const DNF_REASONS = ['Writing/Pacing', 'Content', 'Other', 'No reason'];
  function dnfReasonOf(fic) {
    const s = String(fic.dnrReason || '').trim();
    if (!s) return 'No reason';
    if (/^content/i.test(s)) return 'Content';
    if (/writing|pacing/i.test(s)) return 'Writing/Pacing';
    if (/^other$/i.test(s)) return 'Other';
    return s;
  }
  function dnfReasonsByQuarter(readings, today, n = 8) {
    const quarters = quarterKeys(today, n), qi = new Map(quarters.map((q, i) => [q, i]));
    const dnfs = readings.filter(r => r.kind === 'DNF');
    const reasons = [...DNF_REASONS];
    dnfs.forEach(r => { const x = dnfReasonOf(r.fic); if (!reasons.includes(x)) reasons.splice(reasons.length - 1, 0, x); });
    const counts = Object.fromEntries(reasons.map(x => [x, quarters.map(() => 0)]));
    let inWindow = 0;
    for (const r of dnfs) { if (!r.date) continue; const i = qi.get(quarterKey(r.date)); if (i === undefined) continue; counts[dnfReasonOf(r.fic)][i]++; inWindow++; }
    const totals = reasons.map(x => [x, counts[x].reduce((a, b) => a + b, 0)]).filter(([x, c]) => c > 0 && x !== 'No reason').sort((a, b) => b[1] - a[1]);
    const finding = !inWindow ? 'No dated DNFs in the last 8 quarters.'
      : totals.length ? `${totals[0][0]} is your most common DNF reason: ${totals[0][1]} of ${inWindow} DNFs in the last 8 quarters.`
      : `None of your ${inWindow} DNFs in the last 8 quarters has a reason recorded.`;
    return { quarters, labels: quarters.map(quarterLabel), reasons: reasons.filter(x => counts[x].some(c => c > 0)), counts, inWindow, finding };
  }

  // TAGS THAT PREDICT A DNF: overall DNF rate = DNFs ÷ all readings. A tag qualifies with >= MIN_PREDICT
  // readings and a DNF rate at least 15 points above the overall rate. AO3 placeholder tags are left
  // out: "Other Additional Tags to Be Added" and any tag ending in " - Freeform" or " - Relationship".
  const isPlaceholderTag = (t) => /^other additional tags to be added$/i.test(t.trim()) || / - (freeform|relationship)$/i.test(t.trim());
  function dnfPredictorTags(readings, isVisible) {
    const dnfs = readings.filter(r => r.kind === 'DNF').length;
    const overall = readings.length ? dnfs / readings.length : 0;
    const rows = [...tagTotals(readings, isVisible)].filter(([t, v]) => v.readings >= MIN_PREDICT && !isPlaceholderTag(t))
      .map(([tag, v]) => ({ tag, readings: v.readings, dnfs: v.dnfs, rate: v.dnfs / v.readings }))
      .filter(r => r.rate - overall >= 0.15).sort((a, b) => b.rate - a.rate || b.readings - a.readings);
    const finding = !readings.length ? 'No readings yet.' : rows.length
      ? `You DNF ${pct(rows[0].rate)}% of fics tagged ${rows[0].tag}, against ${pct(overall)}% overall.`
      : `No tag with ${MIN_PREDICT}+ reads has a DNF rate 15 points above your overall ${pct(overall)}%.`;
    return { overall, rows, finding };
  }

  // ABANDON POINT: how far through a DNF stopped = Chapters Read ÷ chapters (capped at 100%),
  // in 10% buckets. Only DNFs with Chapters Read filled in.
  function abandonPoints(readings) {
    const dnfs = readings.filter(r => r.kind === 'DNF');
    const withCh = dnfs.filter(r => r.dnfChapters && r.dnfChapters > 0 && r.fic.chapters > 0);
    const buckets = Array.from({ length: 10 }, () => 0);
    for (const r of withCh) buckets[Math.min(9, Math.floor(Math.min(1, r.dnfChapters / r.fic.chapters) * 10))]++;
    const fr = withCh.map(r => Math.min(1, r.dnfChapters / r.fic.chapters));
    const finding = !withCh.length ? `None of your ${dnfs.length} DNFs has Chapters Read filled in yet.`
      : `Half of your DNFs stop by ${pct(median(fr.map(x => Math.round(x * 1000))) / 1000)}% of the way through (based on ${withCh.length} of ${dnfs.length} DNFs).`;
    return { buckets, labels: buckets.map((_, i) => `${i * 10}–${i * 10 + 10}%`), covered: withCh.length, total: dnfs.length, finding };
  }

  // ---- LOYALTY ------------------------------------------------------------------------------
  // GO-TO AUTHORS: authors with 3+ distinct fics read (anonymous / orphan_account excluded). Words
  // count every reading; average Enjoyment is over that author's rated fics.
  function goToAuthors(readings) {
    const m = new Map();
    for (const r of readings) for (const a of realAuthors(r.fic.authors)) {
      const e = m.get(a) || { author: a, fics: new Map(), words: 0, first: null, latest: null };
      e.fics.set(r.ficKey, r.fic); if (r.words !== null) e.words += r.words;
      if (r.date) { if (!e.first || r.date < e.first) e.first = r.date; if (!e.latest || r.date > e.latest) e.latest = r.date; }
      m.set(a, e);
    }
    const rows = [...m.values()].filter(e => e.fics.size >= MIN_RANK).map(e => {
      const rated = [...e.fics.values()].filter(f => f.enjoyment);
      return { author: e.author, fics: e.fics.size, words: e.words, first: e.first, latest: e.latest,
        avgEnjoyment: rated.length ? Math.round(rated.reduce((t, f) => t + f.enjoyment, 0) / rated.length * 10) / 10 : null, rated: rated.length };
    }).sort((a, b) => b.fics - a.fics || b.words - a.words || a.author.localeCompare(b.author));
    const finding = rows.length ? `You've read ${rows.length} author${rows.length === 1 ? '' : 's'} 3+ times; ${rows[0].author} leads with ${rows[0].fics} fics.` : 'No author has 3 or more of your reads yet.';
    return { rows, finding };
  }

  // PER-YEAR LOYALTY (dated readings in each calendar year):
  //   return rate  = authors with 2+ different fics read that year ÷ all authors read that year
  //                  (shown with >= MIN_RATE authors).
  //   top-5 share  = words from readings by that year's 5 most-read authors (by words) ÷ all words.
  function loyaltyByYear(readings) {
    const out = [];
    for (const y of yearsWithReads(readings)) {
      const rs = readings.filter(r => r.date && r.date.startsWith(y + '-'));
      const fics = new Map(), words = new Map();
      for (const r of rs) for (const a of realAuthors(r.fic.authors)) {
        if (!fics.has(a)) fics.set(a, new Set()); fics.get(a).add(r.ficKey);
        words.set(a, (words.get(a) || 0) + (r.words || 0));
      }
      const authors = fics.size, returning = [...fics.values()].filter(s => s.size >= 2).length;
      const top5 = [...words].sort((a, b) => b[1] - a[1]).slice(0, 5).map(([a]) => a);
      const total = sumWords(rs), top5Words = sumWords(rs.filter(r => r.fic.authors.some(a => top5.includes(a))));
      out.push({ year: y, readings: rs.length, authors, returning, returnRate: authors >= MIN_RATE ? returning / authors : null,
        top5, top5Share: authors >= MIN_RATE && total ? top5Words / total : null });
    }
    const last = out.filter(x => x.returnRate !== null).slice(-1)[0];
    const finding = last ? `In ${last.year} you went back to ${pct(last.returnRate)}% of the authors you read, and your top 5 wrote ${pct(last.top5Share)}% of your words.` : 'Not enough authors per year yet.';
    return { years: out, finding };
  }

  // RE-READS: fics with Times Read above 1, readings with read number above 1, or a "Re-read
  // started" event. times = the largest of Times Read, readings counted and read numbers seen.
  function rereadList(model) {
    const out = [];
    for (const fic of model.fics) {
      const rs = model.readings.filter(r => r.ficKey === fic.key);
      const evs = model.eventsByKey.get(fic.key) || [];
      const maxRn = Math.max(0, ...rs.map(r => r.readNumber), ...evs.map(e => e.readNumber));
      const times = Math.max(fic.timesRead || 0, rs.length, maxRn);
      if (times > 1 || evs.some(e => e.event === 'Re-read started')) {
        const latest = rs.map(r => r.date).filter(Boolean).sort().slice(-1)[0] || null;
        out.push({ fic, times: Math.max(times, 2), latest, logged: rs.length > 1 || maxRn > 1 });
      }
    }
    out.sort((a, b) => b.times - a.times || (b.latest || '').localeCompare(a.latest || ''));
    return { rows: out, finding: out.length ? `${out.length} fic${out.length === 1 ? '' : 's'} read more than once; ${out[0].fic.title} leads at ${out[0].times} reads.` : 'No re-reads yet.' };
  }

  // ---- HABITS -------------------------------------------------------------------------------
  // WEEKDAYS: finished reads by day of the week, from every dated finished reading (est. included).
  function weekdayCounts(readings) {
    const counts = [0, 0, 0, 0, 0, 0, 0];
    const fin = readings.filter(r => r.kind === 'Read' && r.date);
    fin.forEach(r => counts[weekdayOf(r.date)]++);
    const est = fin.filter(r => r.est).length;
    const top = counts.indexOf(Math.max(...counts));
    const finding = fin.length ? `You finish the most fics on ${WEEKDAYS[top]}s: ${counts[top]} of ${fin.length} (${pct(counts[top] / fin.length)}%).` : 'No dated finished reads yet.';
    return { counts, labels: WEEKDAYS.map(d => d.slice(0, 3)), total: fin.length, est, finding };
  }

  // READING CLOCK: timed Reading Log events by weekday × hour. loggedReads = distinct readings
  // (fic + read number) with a timed event.
  function readingClock(model) {
    const grid = Array.from({ length: 7 }, () => Array(24).fill(0));
    const reads = new Set(); let events = 0;
    for (const list of model.eventsByKey.values()) for (const e of list) {
      const m = /^(\d{4}-\d{2}-\d{2})[ T](\d{1,2}):(\d{2})/.exec(e.ts || '');
      if (!m) continue;
      grid[weekdayOf(m[1])][+m[2]]++; events++; reads.add(e.key + '#' + e.readNumber);
    }
    let best = null;
    grid.forEach((row, d) => row.forEach((c, h) => { if (c && (!best || c > best.c)) best = { d, h, c }; }));
    const enough = reads.size >= MIN_LOGGED;
    const finding = !enough ? '' : `Your busiest reading hour is ${WEEKDAYS[best.d]} around ${best.h % 12 || 12}${best.h < 12 ? 'am' : 'pm'} (${best.c} events).`;
    return { grid, events, loggedReads: reads.size, enough, finding };
  }

  // READING DAYS AND STREAKS: a reading day is any day with a Reading Log event, or a finish or
  // DNF date. A day is "logged" if it has a log event or a non-est. reading; a streak that
  // includes any day without that is marked est.
  //   daily streak  consecutive reading days. The current streak counts back from today, or
  //                 from yesterday if today has nothing yet.
  //   weekly streak consecutive Monday–Sunday weeks with at least one reading day; the current
  //                 one counts back from this week, or last week if this week has nothing yet.
  function readingDays(model, today) {
    const days = new Map();   // date -> { logged }; dates after today (typos) are ignored
    const mark = (d, logged) => { if (!d || (today && d > today)) return; const e = days.get(d) || { logged: false }; e.logged = e.logged || logged; days.set(d, e); };
    for (const r of model.readings) mark(r.date, !r.est);
    for (const list of model.eventsByKey.values()) for (const e of list) mark(e.date, true);
    return days;
  }
  function runsOf(sortedKeys, nextOf) {
    const runs = [];
    for (const k of sortedKeys) {
      const last = runs[runs.length - 1];
      if (last && nextOf(last.end) === k) { last.end = k; last.len++; last.keys.push(k); }

  }
  function streaks(model, today) {
    const days = readingDays(model, today);

    const dRuns = runsOf(dayKeys, d => addDays(d, 1));
    const weeks = [...new Set(dayKeys.map(weekStart))].sort();
    const wRuns = runsOf(weeks, w => addDays(w, 7));
    const estRun = (run, toDays) => run.keys.some(k => toDays(k).some(d => days.has(d) && !days.get(d).logged));
    const dayList = (d) => [d];
    const weekDays = (w) => Array.from({ length: 7 }, (_, i) => addDays(w, i));
    const pick = (runs, anchorA, anchorB) => runs.find(r => r.end === anchorA) || runs.find(r => r.end === anchorB) || null;
    const longestOf = (runs) => runs.reduce((b, r) => (!b || r.len > b.len || (r.len === b.len && r.end > b.end) ? r : b), null);
    const curD = pick(dRuns, today, addDays(today, -1)), longD = longestOf(dRuns);
    const curW = pick(wRuns, weekStart(today), addDays(weekStart(today), -7)), longW = longestOf(wRuns);
    const pack = (r, toDays, unit) => r ? { len: r.len, start: r.start, end: unit === 'week' ? addDays(r.end, 6) : r.end, est: estRun(r, toDays) } : { len: 0, start: null, end: null, est: false };
    const res = {
      currentDaily: pack(curD, dayList, 'day'), longestDaily: pack(longD, dayList, 'day'),
      currentWeekly: pack(curW, weekDays, 'week'), longestWeekly: pack(longW, weekDays, 'week'),
      readingDays: days.size,
    };
    res.finding = res.currentWeekly.len
      ? `You're on a ${res.currentWeekly.len}-week reading streak; your longest is ${res.longestWeekly.len} weeks.`
      : res.longestWeekly.len ? `Your longest weekly streak is ${res.longestWeekly.len} weeks; read anything this week to start a new one.` : 'No reading days yet.';
    return res;
  }

  // CALENDAR: words finished per day in a year (finished readings only; DNFs add nothing here).
  function calendarYear(readings, year) {
    const days = new Map();
    for (const r of readings) {
      if (r.kind !== 'Read' || !r.date || !r.date.startsWith(year + '-')) continue;
      const e = days.get(r.date) || { words: 0, fics: 0, est: true };
      e.words += r.words || 0; e.fics++; e.est = e.est && r.est; days.set(r.date, e);
    }
    const vals = [...days.values()].map(e => e.words);
    let best = null; for (const [d, e] of days) if (!best || e.words > best.words) best = { date: d, ...e };
    const finding = days.size ? `${days.size} day${days.size === 1 ? '' : 's'} with a finished read in ${year}; your biggest was ${fmtDay(best.date)} with ${fmtK(best.words)} words.` : `No finished reads dated in ${year}.`;
    return { year, days, max: vals.length ? Math.max(...vals) : 0, finding };
  }

  // PACE: days from start to finish (finish date − start date; same day = 0) for logged finished
  // readings, median per length band (bands need >= MIN_RANK).
  function paceByBand(readings) {
    const logged = readings.filter(r => r.kind === 'Read' && r.date && isLogged(r) && r.started <= r.date);
    const rows = LENGTH_BANDS.map(b => {
      const ds = logged.filter(r => r.fic.words >= b.min && r.fic.words < b.max).map(r => dayDiff(r.started, r.date));
      return { ...b, n: ds.length, median: ds.length >= MIN_RANK ? median(ds) : null };
    });
    const enough = logged.length >= MIN_LOGGED;
    const shown = rows.filter(r => r.median !== null);
    const dur = (d) => (d === 0 ? 'the same day you start them' : `${d} day${d === 1 ? '' : 's'}`);
    const finding = !enough ? '' : shown.length ? `You usually finish ${shown[0].label.toLowerCase()} fics ${shown[0].median === 0 ? 'the same day you start them' : 'in ' + dur(shown[0].median)}.` : 'Not enough logged reads in any one length band yet.';
    return { rows, loggedReads: logged.length, enough, finding };
  }

  // ---- PERSONAL BESTS -----------------------------------------------------------------------
  // Each best has a date (or range), a tap target and est: true when it rests on estimated dates
  // (any contributing reading is est.). Counts that don't depend on dates (most-read author,
  // most re-read fic) are never est.
  function monthTotals(readings) {
    const m = new Map();
    for (const r of readings) {
      if (!r.date) continue;
      const k = r.date.slice(0, 7), e = m.get(k) || { month: k, words: 0, finished: 0, est: false };
      e.words += r.words || 0; if (r.kind === 'Read') e.finished++; e.est = e.est || r.est; m.set(k, e);
