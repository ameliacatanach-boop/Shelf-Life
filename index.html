<style>

      --accent: #A08FFF; --accent-soft: #2A2547; --accent-ink: #15131F;
      --pos: #52C690; --pos-soft: #183326; --neg: #F07D66; --neg-soft: #3A1E19; --neutral-soft: #26262D;

      --dnf: #A797CC;

  :root[data-theme="dark"] {
    --bg: #111114; --surface: #1B1B20; --surface-2: #24242B; --surface-3: #2E2E36;
    --ink: #F1F0F4; --ink-2: #ADA9B6; --ink-3: #7D7987; --line: #2C2C34;
    --accent: #A08FFF; --accent-soft: #2A2547; --accent-ink: #15131F;
    --pos: #52C690; --pos-soft: #183326; --neg: #F07D66; --neg-soft: #3A1E19; --neutral-soft: #26262D;
    --est: #E8B654; --est-soft: #3A2E12;
    --dnf: #A797CC;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }

  body { font-family: 'DM Sans', system-ui, -apple-system, sans-serif; font-size: 15px; line-height: 1.45; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; }

  .seg { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 3px; gap: 2px; }
  .seg button { border: 0; background: none; border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
  .seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .date-input { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 10px; font-size: 14px; min-height: 38px; }
  .text-input { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 10px 14px 10px 38px; font-size: 15px; outline: none; }

  @media (min-width: 620px) { .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .tile { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .tile-label { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
  .tile-value { font-size: 28px; font-weight: 600; line-height: 1.05; }
  .tile-foot { display: flex; align-items: center; justify-content: space-between; gap: 6px; min-height: 22px; }
  .tile-note { font-size: 11px; color: var(--ink-3); line-height: 1.3; }
  .delta { font-size: 11.5px; font-weight: 700; border-radius: 999px; padding: 2px 7px; white-space: nowrap; }
  .delta.pos { background: var(--pos-soft); color: var(--pos); }
  .delta.neg { background: var(--neg-soft); color: var(--neg); }
  .delta.flat { background: var(--neutral-soft); color: var(--ink-2); }

  .hscroll { display: flex; gap: 10px; overflow-x: auto; padding: 2px 2px 8px; margin: 0 -16px; padding-left: 16px; padding-right: 16px; scroll-snap-type: x proximity; scrollbar-width: none; }
  .hscroll::-webkit-scrollbar { display: none; }
  .mini { flex: 0 0 auto; width: 228px; scroll-snap-align: start; background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; text-align: left; border: 0; display: flex; flex-direction: column; gap: 6px; }
  .mini-title { font-weight: 600; font-size: 15px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .bar-track { height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 99px; }

  .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; letter-spacing: .02em; border-radius: 999px; padding: 2px 8px; white-space: nowrap; }
  .badge .dot { width: 7px; height: 7px; border-radius: 50%; }
  .badge.est { background: var(--est-soft); color: var(--est); }
  .badge.dnf { background: color-mix(in srgb, var(--dnf) 16%, transparent); color: var(--dnf); }
  .badge.plain { background: var(--surface-2); color: var(--ink-2); }
  .badge.rating { background: var(--surface-2); color: var(--ink-2); min-width: 24px; justify-content: center; }
  .enjoy { display: inline-flex; gap: 2.5px; vertical-align: middle; }
  .enjoy i { width: 7px; height: 7px; border-radius: 50%; background: var(--surface-3); display: block; }
  .enjoy i.on { background: var(--accent); }

  .hbar-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 6px 0; }
  .hbar-row + .hbar-row { border-top: 1px solid var(--line); }
  .hbar-label { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hbar-val { font-size: 12.5px; color: var(--ink-2); }
  .hbar-track { grid-column: 1 / -1; height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; display: flex; }

  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 12.5px; color: var(--ink-2); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }

  .month-head { font-size: 13px; font-weight: 700; color: var(--ink-2); margin: 20px 4px 8px; display: flex; justify-content: space-between; }
  .diary { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .drow { display: grid; grid-template-columns: 44px 4px minmax(0, 1fr); gap: 12px; padding: 12px 14px; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); }
  .drow:first-child { border-top: 0; }
  .drow:active { background: var(--surface-2); }
  .dday { text-align: center; }
  .dday b { display: block; font-size: 21px; font-weight: 600; line-height: 1.1; }
  .dday span { font-size: 11px; font-weight: 600; color: var(--ink-3); text-transform: uppercase; letter-spacing: .05em; }
  .dstripe { border-radius: 4px; }
  .dtitle { font-weight: 600; font-size: 15px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .dmeta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin-top: 4px; font-size: 12.5px; color: var(--ink-2); }
  .kb { display: inline-flex; gap: 4px; color: var(--ink-2); }

  .lib-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
  .lcard { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; text-align: left; border: 0; display: flex; flex-direction: column; gap: 6px; position: relative; overflow: hidden; }
  .lcard::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--fc); }
  .table-wrap { overflow-x: auto; background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); font-weight: 700; }
  td.t { white-space: normal; min-width: 180px; font-weight: 600; }
  tr.click { cursor: pointer; }

  .panel { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px; margin-top: 10px; display: flex; flex-direction: column; gap: 14px; }
  .flabel { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 7px; }
  .wrap-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .plain-input { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 9px 12px; font-size: 14px; outline: none; }

  .sheet-back { position: fixed; inset: 0; z-index: 50; background: rgba(10, 8, 20, .42); display: flex; align-items: flex-end; justify-content: center; animation: fade .18s ease; }
  .sheet { background: var(--bg); width: 100%; max-width: 760px; max-height: 92vh; overflow-y: auto; border-radius: 24px 24px 0 0; padding: 8px 16px calc(28px + env(safe-area-inset-bottom)); animation: up .22s cubic-bezier(.2,.8,.2,1); }
  @media (min-width: 760px) { .sheet-back { align-items: center; } .sheet { border-radius: 24px; max-height: 88vh; } }
  .grab { width: 40px; height: 5px; border-radius: 9px; background: var(--surface-3); margin: 4px auto 10px; }
  @keyframes fade { from { opacity: 0; } }
  @keyframes up { from { transform: translateY(30px); opacity: .6; } }
  .meta-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; }
  .meta-grid div b { display: block; font-size: 11.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); }
  .tagchip { display: inline-block; font-size: 12.5px; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); margin: 0 6px 6px 0; }
  .tagchip.ship { background: color-mix(in srgb, var(--fc) 15%, transparent); color: var(--ink); }
  .timeline { position: relative; padding-left: 18px; }
  .timeline::before { content: ''; position: absolute; left: 5px; top: 6px; bottom: 6px; width: 2px; background: var(--line); border-radius: 2px; }
  .tl-item { position: relative; padding: 4px 0 10px; }
  .tl-item::before { content: ''; position: absolute; left: -17px; top: 9px; width: 10px; height: 10px; border-radius: 50%; background: var(--surface); border: 2px solid var(--ink-3); }
  .tl-item.fin::before { background: var(--pos); border-color: var(--pos); }
  .tl-item.dnf::before { background: var(--dnf); border-color: var(--dnf); }
  .summary { white-space: pre-line; font-size: 14.5px; line-height: 1.55; color: var(--ink); }
  .big-btn { width: 100%; padding: 13px; border-radius: 14px; border: 0; background: var(--ink); color: var(--bg); font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
  .big-btn.ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
  .link-btn { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; font-size: 13.5px; }
  .empty { text-align: center; color: var(--ink-3); padding: 28px 12px; font-size: 14px; }
  .notes li { margin-bottom: 6px; }
  .check { display: flex; align-items: center; gap: 10px; font-size: 14.5px; }
  .check input { width: 20px; height: 20px; accent-color: var(--accent); }
  .srcline { display: flex; align-items: flex-start; gap: 7px; font-size: 12.5px; color: var(--ink-2); min-width: 0; line-height: 1.35; }
  .srcline > i { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 4px; }
  .srcline > span { min-width: 0; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .srcline.one > span { -webkit-line-clamp: 1; }
  .srcline.full > span { display: block; -webkit-line-clamp: unset; }
  .srcline b { font-weight: 600; color: var(--ink); }
  .wrap-chips .chip { white-space: normal; text-align: left; flex-shrink: 1; max-width: 100%; }
  .chip .cdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
  .wrap-th th { white-space: normal; min-width: 104px; vertical-align: bottom; text-transform: none; letter-spacing: 0; font-size: 12px; }
  .group-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 22px 2px 0; }
  .switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13.5px; font-weight: 500; cursor: pointer; }
  .switch-row.compact { font-size: 12.5px; color: var(--ink-2); justify-content: flex-start; }
  .switch { appearance: none; -webkit-appearance: none; flex-shrink: 0; width: 38px; height: 22px; border-radius: 99px; background: var(--surface-3); position: relative; margin: 0; cursor: pointer; transition: background .15s; }
  .switch::before { content: ''; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
  .switch:checked { background: var(--accent); }
  .switch:checked::before { transform: translateX(16px); }
  .switch:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tagchip.revealed { background: transparent; border: 1px dashed var(--line); }
  button.tagchip { border: 0; cursor: pointer; font: inherit; font-size: 12.5px; }
  button.tagchip.more { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .seg.sm button { padding: 5px 10px; font-size: 12.5px; }
  .seg button.on.cls-sexual { background: var(--neg-soft); color: var(--neg); }
  .seg button.on.cls-unsure { background: var(--est-soft); color: var(--est); }
  .tr-row { padding: 12px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
  .tr-row:first-child { border-top: 0; }
  .tr-tag { font-weight: 600; font-size: 14.5px; line-height: 1.3; word-break: break-word; }
  .set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; background: none; border: 0; padding: 12px 0; text-align: left; border-top: 1px solid var(--line); }
  .set-row:first-child { border-top: 0; padding-top: 2px; }
  .center-screen { min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center; }
</style>
</head>
<body>
<div id="root"></div>
<script>
// ============================================================================================
// SOURCES — one entry per Google Sheet. Adding a Sheet = adding one entry here. Nothing else.
//   id          internal only, never shown (caching, and matching Reading Log rows to fics)
//   sheetId     from the Sheet's link: docs.google.com/spreadsheets/d/<sheetId>/edit
//   fandom      shown everywhere. Sheets with exactly the same fandom text merge into one fandom.
//   pairing     'fixed': the pairing of every fic in the Sheet.
//               'perFic': a label for the Sheet only; each fic's pairing is the FIRST tag in its
//               Relationships column, and fics with none show "Gen / no pairing".
//   pairingMode 'fixed' | 'perFic'
//   color       the fandom's accent: '#RRGGBB' (dark mode gets a lighter version automatically),
//               or { light: '#RRGGBB', dark: '#RRGGBB' }. Pairings use shades of it. When two
//               Sheets share a fandom, the first one's colour is used.
// ============================================================================================
const SOURCES = [
  {
    id: 'hollanov',
    sheetId: '1vsJxSpJFZaiBh540318Jq_yqIYG9h9ucTR_7AZ87L2I',
    fandom: 'Game Changers (All)',
    pairing: 'Ilya Rozanov/Shane Hollander',
    pairingMode: 'fixed',
    color: { light: '#2C79BE', dark: '#64A9E8' },
  },
  {
    id: 'asoiaf',
    sheetId: '1SQIBxxO8XgpvpR5vjSJS1Nu3l5Pq0z2v2W0uSYx_aMI',
    fandom: 'A Song of Ice and Fire (All)',
    pairing: 'Multiple pairings',
    pairingMode: 'perFic',
    color: { light: '#C24E36', dark: '#EF8068' },
  },
  {
    id: 'drarry',
    sheetId: '1XDO0bKnLPmeURufZ4mwyifeJynwFVszCfayA_FEtKPY',

// <tag-classes>
// TAG CLASSES — every freeform tag is "sexual", "unsure" or "general".

//            tags" is off (fic detail pages show them behind a "+N hidden" chip).

//   general  everything else.
//

// phrases, so "Sex" matches "Rough Sex" but not "Sexuality" or "Bisexual". Inside a phrase a space
// or hyphen also matches the other or nothing ("Blow Jobs" = "Blowjobs" = "Blow-Jobs"), and a
// trailing "s", "es" or "ing" is allowed ("Bareback" also matches "Barebacking").
// Steps run top to bottom and the first match wins. Your manual overrides
// (Settings → Tag review) beat every rule.
// ============================================================================================

  //    screen, count, chart, filter or export ever sees them. Exact match, ignoring case.

    'Creator Chose Not To Use Archive Warnings',
    'Graphic Depictions Of Violence',
    'Major Character Death',

  //    "Implied Sexual Content" contains "Sexual Content").

  const UNSURE_PREFIXES = ['Implied', 'Referenced', 'Mentioned', 'Off-screen'];

  //     "Rough Sex" or "Shower Sex", still goes on to the sexual keywords below.

    'Knotting', 'Bareback', 'Condoms', 'Lube', 'Sex Toys', 'Strap-Ons', 'Threesome', 'Foursome', 'Sex Pollen',
    'Subspace', 'Subdrop', 'Domdrop', 'Cock Warming', 'Cock Rings', 'Cock Cages', 'Nipple Play', 'Anal Play', 'Anal Plug', 'Anal', 'Choking',

  //    "Bottom Shane Hollander", "Top Ilya Rozanov", "Power Bottom Shane Hollander".
  //    A name is a character from your pairings / Relationships columns, or two or three
  //    Capitalised words ("Bottom Luca Haas"). "Top Gun" is not a name, so it doesn't count.
  const ROLE_WORDS = ['Top', 'Bottom', 'Switch', 'Versatile'];
  //    Also "Bottom/Top" style tags: two role words joined by "/" ("Top/Bottom Versatile"),
  //    or a role word joined to a name with "!" ("Top!Draco").

  // 5. Unsure: about sex or intimacy, not explicit. ("Mating Cycles", "In Heat", "Omega Verse"
  //    and "Alpha/Omega" are the spellings AO3 uses for heat cycles and the omegaverse.)
  const UNSURE_KEYWORDS = ['Omegaverse', 'Omega Verse', 'Alpha/Beta/Omega Dynamics', 'Alpha/Omega', 'Heat Cycles', 'Mating Cycles', 'In Heat', 'Ruts', 'Consent'];

  //     "Fluff and Smut", "Explicit Sexual Content", "Porn with Plot", "Porn with Feelings").
  //     General, unless the tag also names an act or kink from step 3 or a role from step 4
  //     ("Smut and Kink" stays sexual).

  //    "Sexual Assault"). "Sexuality" and "Bisexual" are different words, so they stay general.

  // 7. Everything else is general.

  // ------------------------------------------------------------------------------------------
  // Engine (no need to edit below this line)
  // ------------------------------------------------------------------------------------------
  const esc = (x) => x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  function phraseSource(p) {
    let base = p.trim();
    if (/[a-z]s$/i.test(base) && !/ss$/i.test(base)) base = base.slice(0, -1);
    const words = base.split(/[\s-]+/).map(w => w.split('/').map(esc).join('\\s*/\\s*'));
    return words.join('[\\s-]?') + '(?:s|es|ing)?';
  }
  // One regex per list; each phrase is its own group so we can tell which one matched.
  function listMatcher(list) {
    const ordered = list.slice().sort((a, b) => b.length - a.length);
    const re = new RegExp('(?:^|[^a-z0-9])(?:' + ordered.map(p => '(' + phraseSource(p) + ')').join('|') + ')(?=$|[^a-z0-9])', 'i');
    return (tag) => { const m = re.exec(tag); if (!m) return null; const i = m.slice(1).findIndex(x => x !== undefined); return ordered[i]; };
  }
  const isGeneral = listMatcher(ALWAYS_GENERAL);
  const unsurePhrase = listMatcher(UNSURE_PHRASES);
  const sexualKeyword = listMatcher(SEXUAL_KEYWORDS);
  const unsureKeyword = listMatcher(UNSURE_KEYWORDS);
  const vagueKeyword = listMatcher(VAGUE_KEYWORDS);
  const VAGUE_WHOLE_ORDERED = VAGUE_WHOLE_TAGS.slice().sort((a, b) => b.length - a.length);
  const VAGUE_WHOLE_RE = new RegExp('^(?:' + VAGUE_WHOLE_ORDERED.map(p => '(' + phraseSource(p) + ')').join('|') + ')(?:\\s+(.+))?$', 'i');
  const prefixRe = (list) => new RegExp('^(' + list.map(phraseSource).join('|').replace(/\(\?:s\|es\|ing\)\?/g, '') + ')(?=$|[^a-z0-9])', 'i');
  const GENERAL_PREFIX_RE = prefixRe(GENERAL_PREFIXES);
  const PREFIX_RE = new RegExp('^(' + UNSURE_PREFIXES.map(phraseSource).join('|').replace(/\(\?:s\|es\|ing\)\?/g, '') + ')(?=$|[^a-z0-9])', 'i');
  const ROLES = ROLE_WORDS.map(esc).join('|');
  const ROLE_PAIR_RE = new RegExp('(?:^|[^a-z0-9])(' + ROLES + ')\\s*(?:/\\s*(' + ROLES + ')(?=$|[^a-z0-9])|!\\s*[a-z])', 'i');
  const ROLE_NAME_RE = new RegExp('(?:^|[^a-z0-9])(' + ROLES + ')\\s+([^/|(),&]+)', 'gi');
  const NAME_WORD = "[A-Z\\u00C0-\\u024F][a-z\\u00DF-\\u024F'\\u2019.\\-]+";
  const FULL_NAME_RE = new RegExp('^' + NAME_WORD + '(?:\\s+' + NAME_WORD + '){1,2}$');
  const SEXUAL_WORD_RE = /(?:^|[^a-z0-9])sexual(?=$|[^a-z0-9])/i;
  const WARNING_SET = new Set(ARCHIVE_WARNINGS.map(w => w.toLowerCase()));

  // Existing tag normalisation: trim and collapse spaces. Classification runs on this form.
  const canonicalTag = (t) => String(t || '').replace(/\s+/g, ' ').trim();
  const isArchiveWarning = (t) => WARNING_SET.has(canonicalTag(t).toLowerCase());

  // Character names from pairing / relationship tags ("Ilya Rozanov/Shane Hollander",
  // "Arya Stark & Sansa Stark"): each full name, plus each first name of 3+ letters.
  const NOT_FIRST_NAMES = new Set(['original', 'other', 'minor', 'background', 'unnamed', 'reader', 'you', 'implied', 'past', 'the']);
  function namesFrom(pairingTags) {
    const names = new Set();
    for (const p of pairingTags || []) for (const part of String(p).split(/[\/&]/)) {
      const n = part.replace(/\([^)]*\)/g, '').replace(/\s+/g, ' ').trim().toLowerCase();
      if (n.length < 3) continue;
      names.add(n);
      const first = n.split(' ')[0];
      if (first.length >= 3 && !NOT_FIRST_NAMES.has(first)) names.add(first);
    }
    return names;
  }
  function roleName(tag, names) {
    ROLE_NAME_RE.lastIndex = 0;
    let m;
    while ((m = ROLE_NAME_RE.exec(tag))) {
      const rest = m[2].trim(), lower = rest.toLowerCase();
      for (const n of names || []) if (lower === n || lower.startsWith(n + ' ')) return { role: m[1], name: rest };
      if (FULL_NAME_RE.test(rest)) return { role: m[1], name: rest };
    }
    return null;
  }
  const cap = (w) => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase();
  const isName = (rest, names) => { const lower = rest.toLowerCase(); for (const n of names || []) if (lower === n || lower.startsWith(n + ' ')) return true; return FULL_NAME_RE.test(rest); };
  function vagueWhole(tag, names) {
    const m = VAGUE_WHOLE_RE.exec(tag);
    if (!m) return null;
    const rest = m[m.length - 1];
    if (rest && !isName(rest.trim(), names)) return null;
    return VAGUE_WHOLE_ORDERED[m.slice(1, -1).findIndex(x => x !== undefined)];
  }

  // classify(tag, names) -> { cls: 'sexual' | 'unsure' | 'general', rule: 'what matched' }
  function classify(rawTag, names) {
    const tag = canonicalTag(rawTag);
    let k;
    if ((k = isGeneral(tag))) return { cls: 'general', rule: `never-sexual list: "${k}"` };
    const gp = GENERAL_PREFIX_RE.exec(tag);
    if (gp) { const rest = classify(tag.slice(gp[0].length), names); if (rest.cls !== 'general') return { cls: 'general', rule: `starts with "${gp[1]}" (would be ${rest.cls}: ${rest.rule})` }; }
    if ((k = unsurePhrase(tag))) return { cls: 'unsure', rule: `unsure phrase: "${k}"` };
    if ((k = vagueWhole(tag, names))) return { cls: 'general', rule: `vague "sex" tag: "${k}"` };
    let hit = null;
    if ((k = sexualKeyword(tag))) hit = `keyword: "${k}"`;
    else { const rn = roleName(tag, names); if (rn) hit = `role tag: "${cap(rn.role)}" + name`; }
    if (!hit) { const rp = ROLE_PAIR_RE.exec(tag); if (rp) hit = `role tag: "${rp[2] ? cap(rp[1]) + '/' + cap(rp[2]) : cap(rp[1]) + '!'}"`; }
    if (hit) {
      const pre = PREFIX_RE.exec(tag);
      if (pre) return { cls: 'unsure', rule: `starts with "${pre[1]}" (${hit})` };
      return { cls: 'sexual', rule: hit };
    }
    if ((k = unsureKeyword(tag))) return { cls: 'unsure', rule: `unsure keyword: "${k}"` };
    if ((k = vagueKeyword(tag))) return { cls: 'general', rule: `vague content reference: "${k}"` };
    if (SEXUAL_WORD_RE.test(tag)) return { cls: 'unsure', rule: 'contains "sexual"' };
    return { cls: 'general', rule: '' };
  }

  return { ARCHIVE_WARNINGS, canonicalTag, isArchiveWarning, namesFrom, classify };
})();
// </tag-classes>
</script>

<script>
// ============================================================================================
// <shelf-rules>
// SHELF LIFE DATA RULES
// Everything that decides what a "reading" is, which day it counts on, how many words it adds
// and whether it gets the "est." badge lives in this one module. Every screen, chart and export
// calls into it, so the numbers always agree with each other. Plain JS (no DOM, no React) so it
// can be run and tested on its own in Node.
// ============================================================================================
const ShelfRules = (() => {
  const TZ = 'Australia/Melbourne';
  const MONTH_MAP = { Jan: 0, Feb: 1, Mar: 2, Apr: 3, May: 4, Jun: 5, Jul: 6, Aug: 7, Sep: 8, Oct: 9, Nov: 10, Dec: 11 };
  const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  // ------------------------------------------------------------------------------------------
  // 1. CELL PARSING — copied from the fandom apps so every cell reads exactly as it does there.
  // ------------------------------------------------------------------------------------------

  // Numbers (Words, Kudos, Chapters...): strip commas, then parseInt. "24,200 " -> 24200.
  const num = (v) => { const n = parseInt(String(v ?? '').replace(/,/g, ''), 10); return isNaN(n) ? 0 : n; };
  // Comma-separated cells (Tags, Author, Category, Relationships).
  const splitList = (s) => { const t = String(s || '').trim(); return t ? t.split(',').map(x => x.trim()).filter(Boolean) : []; };

  // Same as the apps' normIsoDate: ISO, d/m/yyyy (Australian order) or d-Mon-yy; anything else is kept as typed.
  function normIsoDate(raw) {
    const s = String(raw || '').trim();
    if (!s) return '';
    let m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s);
    if (m) return `${m[1]}-${m[2]}-${m[3]}`;
    m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(s);
    if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
    m = /^(\d{1,2})-([A-Za-z]{3})-(\d{2,4})$/.exec(s);
    if (m) {
      const mon = m[2][0].toUpperCase() + m[2].slice(1).toLowerCase();
      if (MONTH_MAP[mon] !== undefined) {
        let y = parseInt(m[3], 10);
        if (y < 100) y += 2000;
        return `${y}-${String(MONTH_MAP[mon] + 1).padStart(2, '0')}-${m[1].padStart(2, '0')}`;
      }
    }
    return s;
  }
  const isIso = (s) => /^\d{4}-\d{2}-\d{2}$/.test(s || '');
  // A cell as a date, or null. Last Read holds "YYYY-MM-DD HH:MM", so only the first token is the date.
  // Dates are plain Melbourne calendar dates already (the apps write Melbourne time), so no timezone maths here.
  function cellDate(raw) {
    if (typeof raw === 'number') return serialToIso(raw);
    const s = String(raw || '').trim();
    if (!s) return null;
    const d = normIsoDate(s.split(/\s+/)[0]);
    if (isIso(d)) return d;
    return looseDate(s);
  }
  // Google Sheets date serials (days since 30 Dec 1899) -> 'YYYY-MM-DD'. Used for real date cells,
  // which Shelf Life asks the API for as serials so the sheet's display format can't confuse it.
  function serialToIso(n) {
    if (typeof n !== 'number' || !isFinite(n) || n < 1 || n > 2958465) return null;
    return new Date(Date.UTC(1899, 11, 30) + Math.floor(n) * 86400000).toISOString().slice(0, 10);
  }
  function serialToStamp(n) {
    const d = serialToIso(n); if (!d) return '';
    const mins = Math.round((n - Math.floor(n)) * 1440);
    return mins ? `${d} ${String(Math.floor(mins / 60) % 24).padStart(2, '0')}:${String(mins % 60).padStart(2, '0')}` : d;
  }
  // Other display formats a date cell can come back in: d/m/yy, d.m.yyyy, "8 Dec 2025", "Dec 8, 2025",
  // "Monday, 8 December 2025". Day-first for slashes (Australian order), as in the apps.
  function looseDate(s) {
    const mon = (t) => MONTH_MAP[t.slice(0, 1).toUpperCase() + t.slice(1, 3).toLowerCase()];
    const year = (y) => { y = parseInt(y, 10); return y < 100 ? y + 2000 : y; };
    const ok = (y, m, d) => (m >= 0 && m < 12 && d >= 1 && d <= 31) ? `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}` : null;
    let m = /^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2}|\d{4})(?:\s.*)?$/.exec(s);
    if (m) return ok(year(m[3]), parseInt(m[2], 10) - 1, parseInt(m[1], 10));
    m = /(\d{1,2})(?:st|nd|rd|th)?[\s\-]+([A-Za-z]{3,})\.?,?[\s\-]+(\d{2,4})/.exec(s);
    if (m && mon(m[2]) !== undefined) return ok(year(m[3]), mon(m[2]), parseInt(m[1], 10));
    m = /([A-Za-z]{3,})\.?\s+(\d{1,2})(?:st|nd|rd|th)?,?\s+(\d{4})/.exec(s);
    if (m && mon(m[1]) !== undefined) return ok(year(m[3]), mon(m[1]), parseInt(m[2], 10));
    return null;
  }
  // Same as the apps' parseFicDate, for Date Published ("30-Oct-25").
  function parseFicDate(str) {
    if (!str) return 0;
    const s = String(str).trim();
    const m = /^(\d{1,2})-([A-Za-z]{3})-(\d{2,4})$/.exec(s);
    if (m) {
      const month = MONTH_MAP[m[2]];
      let year = parseInt(m[3], 10);
      if (year < 100) year += 2000;
      if (month === undefined) return 0;
      return new Date(year, month, parseInt(m[1], 10)).getTime();
    }
    const t = Date.parse(s);
    return isNaN(t) ? 0 : t;
  }
  // The AO3 work ID is the key. Same fallback as the apps for a missing link.
  function workIdFromLink(link, rowNumber) {
    const m = /\/works\/(\d+)/.exec(link || '');
    return m ? m[1] : 'row-' + rowNumber;
  }
  const ANONYMOUS_AUTHORS = new Set(['anonymous', 'orphan_account', 'orphan account']);
  const realAuthors = (authors) => (authors || []).filter(a => !ANONYMOUS_AUTHORS.has(a.trim().toLowerCase()));

  // Chapters: the apps use parseInt, so "14/22" reads as 14 published chapters (the total used for DNF words).
  // Right now the column holds one number for complete works, so planned = published (shown as "14 / 14").
  function parseChapters(raw) {
    const s = String(raw || '').trim();
    const m = /^([\d,]+)\s*\/\s*([\d,]+|\?)$/.exec(s);
    if (m) return { published: num(m[1]) || 1, planned: m[2] === '?' ? null : num(m[2]) };
    const p = num(s) || 1;
    return { published: p, planned: p };
  }

  // The statuses the apps know about. Anything else is kept as its own status, never treated as an error.
  const KNOWN_STATUSES = ['Read', 'DNF', 'Currently Reading', 'Paused', 'TBR', 'Skipped', 'Not Interested'];
  const IN_PROGRESS = new Set(['Currently Reading', 'Paused']);

  // One Data List row -> one fic. Columns are found by header name only, never by position.
  // Rows with no Title are skipped, exactly as the apps skip them.
  // `source` is the SOURCES id. Fandom and pairing are attached later by buildModel, from SOURCES,
  // so editing a fandom or pairing name takes effect without re-syncing.
  function ficFromRow(headerIndex, row, rowNumber, source) {
    const get = (name) => { const i = headerIndex[name]; return i !== undefined ? String(row[i] ?? '') : ''; };
    const title = get('Title').trim();
    if (!title) return null;
    const link = get('Link').trim();
    const id = workIdFromLink(link, rowNumber);
    const ch = parseChapters(get('Chapters'));
    const enjoymentRaw = parseInt(get('Enjoyment').trim(), 10);
    const badDates = [];
    const dateCol = (col, raw) => { const d = cellDate(raw); if (!d && String(raw).trim()) badDates.push({ col, value: String(raw).trim() }); return d; };
    const lastReadRaw = get('Last Read').trim();
    return {
      key: source + '|' + id, source, id, rowNumber, title, link,
      authors: splitList(get('Author')),
      datePublished: get('Date Published').trim(),
      publishedMs: parseFicDate(get('Date Published')),
      rating: get('Rating (S)').trim(),
      category: get('Category').trim() || 'Uncategorized',
      categories: splitList(get('Category')).length ? splitList(get('Category')) : ['Uncategorized'],
      words: num(get('Words')),
      chapters: ch.published,
      chaptersPlanned: ch.planned,
      // Freeform tags: normalised, AO3 archive warnings removed, duplicates dropped (see TAG_CLASSES).
      tags: [...new Set(splitList(get('Tags')).map(TAG_CLASSES.canonicalTag).filter(t => t && !TAG_CLASSES.isArchiveWarning(t)))],
      ships: splitList(get('Relationships')),
      kudos: num(get('Kudos')), bookmarks: num(get('Bookmarks')), hits: num(get('Hits')), comments: num(get('Comments')),
      status: get('Status').trim(),              // raw text: '' (unread) or any status, known or not
      dnrReason: get('DNR Reason').trim(),
      enjoyment: (enjoymentRaw >= 1 && enjoymentRaw <= 5) ? enjoymentRaw : 0,
      kg: get('K').trim().toUpperCase() === 'Y',
      bk: get('B').trim().toUpperCase() === 'Y',
      dateStarted: dateCol('Date Started', get('Date Started')),
      dateRead: dateCol('Date Read', get('Date Read')),            // "Date Read (old)" is never read
      lastRead: lastReadRaw,
      lastReadDate: dateCol('Last Read', lastReadRaw),
      chaptersRead: num(get('Chapters Read')),   // blank and 0 both read as 0, as in the apps
      timesRead: num(get('Times Read')),
      badDates,
    };
  }

  // Reading Log rows -> events. Columns found by header name when there's a header row; otherwise the
  // apps' own write order (Timestamp, Link, Title, Event, Chapters Read, Read Number).
  function parseLogRows(rows, source) {
    if (!rows || !rows.length) return [];

    let col = { ts: 0, link: 1, title: 2, event: 3, ch: 4, rn: 5 };
    const h = (rows[0] || []).map(x => String(x || '').trim().toLowerCase());
    if (h.includes('timestamp') || h.includes('event')) {
      start = 1;
      const f = (n, d) => { const i = h.indexOf(n); return i >= 0 ? i : d; };
      col = { ts: f('timestamp', 0), link: f('link', 1), title: f('title', 2), event: f('event', 3), ch: f('chapters read', 4), rn: f('read number', 5) };
    }
    const out = [];
    for (let i = start; i < rows.length; i++) {
      const r = rows[i] || [];
      const link = String(r[col.link] ?? '').trim();
      const event = String(r[col.event] ?? '').trim();
      const m = /\/works\/(\d+)/.exec(link);
      if (!m || !event) continue;
      const ts = String(r[col.ts] ?? '').trim();
      const chRaw = String(r[col.ch] ?? '').trim();
      out.push({
        source, key: source + '|' + m[1], seq: i, ts, date: cellDate(ts), event,
        title: String(r[col.title] ?? '').trim(),
        chaptersRead: chRaw === '' ? null : num(chRaw),
        readNumber: num(r[col.rn]) || 1,
      });
    }
    return out;
  }

  // ------------------------------------------------------------------------------------------
  // 1b. FANDOM + PAIRING — two levels, both taken from SOURCES.
  //   fandom:  the source's fandom text. Sources with the same text are one fandom.
  //   pairing: 'fixed' sources -> the source's pairing; 'perFic' -> first Relationships tag,
  //            or "Gen / no pairing" when there isn't one.
  //   pairingKey identifies a pairing WITHIN a fandom (the same pairing name in two fandoms is two pairings).

  const NO_PAIRING = 'Gen / no pairing';
  const pairingKey = (fandom, pairing) => fandom + ' \u203A ' + pairing;
  function pairingFor(source, ships) {
    if (source && source.pairingMode === 'perFic') return (ships && ships[0]) || NO_PAIRING;
    return (source && source.pairing) || NO_PAIRING;
  }
  function assignGroups(fics, source) {
    for (const f of fics) {
      f.fandom = source.fandom;
      f.pairing = pairingFor(source, f.ships);
      f.pairingKey = pairingKey(f.fandom, f.pairing);
    }
  }
  // Fandom names drop a trailing "(…)" where space is tight: "Harry Potter", "A Song of Ice and Fire".
  const shortFandom = (name) => String(name || '').replace(/\s*\([^)]*\)\s*$/, '') || String(name || '');
  // How a source is named in data notes and the per-Sheet counts (never its internal id).
  function sourceLabel(src, sources) {
    const shared = (sources || []).filter(x => x.fandom === src.fandom).length > 1;
    return shared ? `${shortFandom(src.fandom)} · ${src.pairing}` : shortFandom(src.fandom);
  }

  // ------------------------------------------------------------------------------------------
  // 2. READINGS — the Data List is the source; the Reading Log only adds detail.
  //   - Every Data List row with Status Read or DNF is one reading, logged or not.
  //       Read -> dated by Date Read (falls back to its Finished event's date).
  //       DNF  -> dated by Last Read (falls back to its DNF event's date).
  //       No date at all -> "All time" and the library only, never a dated period.
  //   - Log events are matched to the fic by the work ID in Link and enrich that reading
  //     (start date, timeline). They never create a second copy of it.
  //   - Extra readings for re-reads exist only where the log shows them: "Re-read started" or any
  //     event with Read Number > 1. The Data List row is then the latest read; earlier read numbers
  //     become their own readings, dated by their Finished/DNF event when the log has one, else undated.
  //   - Times Read > 1 with no log evidence: still ONE reading. The fic shows "Read N times".
  //   - est.: a Read with no Finished event for that read, or a DNF with no DNF event.
  //   - Currently Reading / Paused are not readings (they're the "Currently reading" strip).
  //     The one exception: a re-read in progress whose earlier read the log shows.
  // Words: Read = full Words. DNF = Words × Chapters Read ÷ chapters (capped at 100%) when Chapters Read
  //   is filled in (above 0); otherwise words = null and the reading is left out of word totals.
  // ------------------------------------------------------------------------------------------
  const IS_READING = new Set(['Read', 'DNF']);

  // origin: where the reading came from — 'dataList' (the row itself) or 'log' (an earlier read the log shows).
  function makeReading(fic, readNumber, kind, date, est, dnfChapters, origin, started, events) {
    let words = null;
    if (kind === 'Read') words = fic.words;
    else if (dnfChapters && dnfChapters > 0 && fic.chapters > 0) words = Math.round(fic.words * Math.min(1, dnfChapters / fic.chapters));
    return {
      id: fic.key + '#' + readNumber, ficKey: fic.key, source: fic.source, fandom: fic.fandom, pairing: fic.pairing, pairingKey: fic.pairingKey, fic, readNumber, kind,
      date: date || null, est: !!est, dnfChapters: kind === 'DNF' ? (dnfChapters || null) : null,
      words, origin, started: started || null, events: events || [],
    };
  }

  function buildReadings(fics, events) {
    const byKey = new Map();
    for (const e of events) { if (!byKey.has(e.key)) byKey.set(e.key, []); byKey.get(e.key).push(e); }
    const readings = [];
    let logNotStatus = 0;
    for (const fic of fics) {
      const evs = (byKey.get(fic.key) || []).slice().sort((a, b) => a.seq - b.seq);
      const isReading = IS_READING.has(fic.status);
      const maxLogRead = evs.reduce((m, e) => Math.max(m, e.readNumber), 0);
      const logShowsReread = evs.some(e => e.event === 'Re-read started' || e.readNumber > 1);
      // Which read the Data List row describes: the log's read number when it shows a re-read, else 1.
      const current = logShowsReread ? Math.max(maxLogRead, 2) : 1;
      if (!isReading && !(logShowsReread && IN_PROGRESS.has(fic.status))) {
        if (!IN_PROGRESS.has(fic.status) && evs.some(e => e.event === 'Finished' || e.event === 'DNF')) logNotStatus++;
        continue;
      }
      const forRead = (r) => logShowsReread ? evs.filter(e => e.readNumber === r) : evs; // no re-read: every event is this read's
      const last = (list, name) => { for (let i = list.length - 1; i >= 0; i--) if (list[i].event === name) return list[i]; return null; };
      const startOf = (list) => { const e = list.find(x => x.event === 'Started' || x.event === 'Re-read started'); return e ? e.date : null; };

      // Earlier reads the log shows (re-reads only).
      for (let r = 1; r < current; r++) {
        const list = forRead(r);
        const fin = last(list, 'Finished'), dnf = last(list, 'DNF');
        const end = fin && dnf ? (fin.seq > dnf.seq ? fin : dnf) : (fin || dnf);
        if (end) {
          const kind = end.event === 'Finished' ? 'Read' : 'DNF';
          readings.push(makeReading(fic, r, kind, end.date, false, kind === 'DNF' ? end.chaptersRead : null, 'log', startOf(list), list));
        } else {
          // The log shows a later read, so this one happened, but it has no Finished event. While the
          // re-read is still under way, Date Read still holds this read's finish date.
          const date = r === current - 1 && !isReading ? fic.dateRead : null;
          readings.push(makeReading(fic, r, 'Read', date, true, null, 'log', startOf(list), list));
        }
      }

      // The read the Data List row describes.
      if (isReading) {
        const list = forRead(current);
        if (fic.status === 'Read') {
          const fin = last(list, 'Finished');
          readings.push(makeReading(fic, current, 'Read', fic.dateRead || (fin && fin.date), !fin, null, 'dataList', startOf(list) || fic.dateStarted, list));
        } else {
          const dnf = last(list, 'DNF');
          readings.push(makeReading(fic, current, 'DNF', fic.lastReadDate || (dnf && dnf.date), !dnf, fic.chaptersRead || null, 'dataList', startOf(list) || fic.dateStarted, list));
        }
      }
    }
    readings.logNotStatus = logNotStatus;
    return readings;
  }

  // ------------------------------------------------------------------------------------------
  // 3. PERIODS — calendar periods in Australia/Melbourne. A reading counts toward the period that
  // contains its date. Undated readings only appear in "All time".
  // ------------------------------------------------------------------------------------------
  function melbourneToday(d) {
    const p = {};
    new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' })
      .formatToParts(d || new Date()).forEach(x => { if (x.type !== 'literal') p[x.type] = x.value; });
    return `${p.year}-${p.month}-${p.day}`;
  }
  const pad = (n) => String(n).padStart(2, '0');
  const ymd = (y, m, d) => `${y}-${pad(m)}-${pad(d)}`;
  const isoToUTC = (s) => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); };
  const utcToIso = (t) => new Date(t).toISOString().slice(0, 10);
  const addDays = (s, n) => utcToIso(isoToUTC(s) + n * 86400000);
  const dim = (y, m) => new Date(Date.UTC(y, m, 0)).getUTCDate();
  const monthShift = (y, m, k) => { const t = y * 12 + (m - 1) + k; return [Math.floor(t / 12), (t % 12 + 12) % 12 + 1]; };
  function monthsPeriod(y, m, len, unit) {
    const [ey, em] = monthShift(y, m, len - 1);
    return { unit, y, m, len, start: ymd(y, m, 1), end: ymd(ey, em, dim(ey, em)) };
  }
  // type: thisMonth | lastMonth | thisQuarter | thisYear | lastYear | all | custom
  function makePeriod(type, today, custom) {
    const [y, m] = today.split('-').map(Number);
    if (type === 'thisMonth') return { ...monthsPeriod(y, m, 1, 'month'), type, partial: true };
    if (type === 'lastMonth') { const [py, pm] = monthShift(y, m, -1); return { ...monthsPeriod(py, pm, 1, 'month'), type }; }
    if (type === 'thisQuarter') return { ...monthsPeriod(y, Math.floor((m - 1) / 3) * 3 + 1, 3, 'quarter'), type, partial: true };
    if (type === 'thisYear') return { ...monthsPeriod(y, 1, 12, 'year'), type, partial: true };
    if (type === 'lastYear') return { ...monthsPeriod(y - 1, 1, 12, 'year'), type };
    if (type === 'custom') {
      let start = custom && isIso(custom.start) ? custom.start : ymd(y, m, 1);
      let end = custom && isIso(custom.end) ? custom.end : today;
      if (start > end) [start, end] = [end, start];
      return { unit: 'days', type, start, end };
    }
    return { unit: 'all', type: 'all', start: null, end: null };
  }
  function shiftPeriod(p, k) {
    if (!p || p.unit === 'all') return null;
    if (p.unit === 'days') {
      const n = Math.round((isoToUTC(p.end) - isoToUTC(p.start)) / 86400000) + 1;
      return { ...p, start: addDays(p.start, k * n), end: addDays(p.end, k * n), partial: false };
    }
    const [ny, nm] = monthShift(p.y, p.m, k * p.len);
    return { ...monthsPeriod(ny, nm, p.len, p.unit), type: p.type, partial: false };
  }
  function sameLastYear(p) {
    if (!p || p.unit === 'all') return null;
    if (p.unit === 'days') {
      const back = (s) => { const [y, m, d] = s.split('-').map(Number); return ymd(y - 1, m, Math.min(d, dim(y - 1, m))); };
      return { ...p, start: back(p.start), end: back(p.end), partial: false };
    }
    return { ...monthsPeriod(p.y - 1, p.m, p.len, p.unit), type: p.type, partial: false };
  }
  const inPeriod = (date, p) => !p || p.unit === 'all' ? true : !!date && date >= p.start && date <= p.end;

  function fmtDay(iso, today) {
    if (!isIso(iso)) return '';
    const [y, m, d] = iso.split('-').map(Number);
    return `${d} ${MON[m - 1]}${today && String(y) === today.slice(0, 4) ? '' : ' ' + y}`;
  }
  function periodName(p, today) {
    if (!p) return '';
    const cy = today ? +today.slice(0, 4) : 0;
    if (p.unit === 'all') return 'all time';
    if (p.unit === 'month') return MONTHS[p.m - 1] + (p.y !== cy ? ' ' + p.y : '');
    if (p.unit === 'quarter') return `Q${Math.floor((p.m - 1) / 3) + 1} ${p.y}`;
    if (p.unit === 'year') return String(p.y);
    return `${fmtDay(p.start, today)} – ${fmtDay(p.end, today)}`;
  }

  // ------------------------------------------------------------------------------------------
  // 4. STATS for a period
  //   words     = sum of reading words (DNFs without Chapters Read add nothing; counted in dnfNoWords)
  //   finished  = Read readings; dnfs = DNF readings
  //   completion = finished ÷ (finished + dnfs), for readings dated in the period
  //   median    = median full length (Words) of finished readings — shown instead of a mean
  //   newAuthors = authors whose first dated reading falls in the period (all time: every author read)
  // ------------------------------------------------------------------------------------------
  function median(values) {
    if (!values.length) return null;
    const s = values.slice().sort((a, b) => a - b);
    const mid = Math.floor(s.length / 2);
    return s.length % 2 ? s[mid] : Math.round((s[mid - 1] + s[mid]) / 2);
  }
  function authorFirstDates(readings) {
    const first = new Map();
    for (const r of readings) for (const a of realAuthors(r.fic.authors)) {
      if (!first.has(a)) first.set(a, null);
      if (r.date && (first.get(a) === null || r.date < first.get(a))) first.set(a, r.date);
    }
    return first;
  }
  function periodStats(readings, p, authorFirst) {
    const rs = readings.filter(r => inPeriod(r.date, p));
    let words = 0, finished = 0, dnfs = 0, dnfNoWords = 0, est = 0;
    const lens = [], byFandom = {}, byPairing = {}, countFandom = {}, countPairing = {};
    for (const r of rs) {
      countFandom[r.fandom] = (countFandom[r.fandom] || 0) + 1;
      countPairing[r.pairingKey] = (countPairing[r.pairingKey] || 0) + 1;
      if (r.words !== null) {
        words += r.words;
        byFandom[r.fandom] = (byFandom[r.fandom] || 0) + r.words;
        byPairing[r.pairingKey] = (byPairing[r.pairingKey] || 0) + r.words;
      }
      if (r.kind === 'Read') { finished++; lens.push(r.fic.words); if (r.est) est++; }
      else { dnfs++; if (r.words === null) dnfNoWords++; }
    }
    let newAuthors = 0;
    if (authorFirst) for (const [, d] of authorFirst) if (p && p.unit === 'all' ? true : (d && inPeriod(d, p))) newAuthors++;
    return {
      readings: rs, words, finished, dnfs, dnfNoWords, est, byFandom, byPairing, countFandom, countPairing,
      completion: finished + dnfs ? finished / (finished + dnfs) : null,
      median: median(lens), newAuthors,
    };
  }

  // Month keys "YYYY-MM" from a to b inclusive.
  function monthKeys(a, b) {
    const out = [];
    let [y, m] = a.split('-').map(Number);
    const [by, bm] = b.split('-').map(Number);
    while (y < by || (y === by && m <= bm)) { out.push(`${y}-${pad(m)}`); [y, m] = monthShift(y, m, 1); }
    return out;
  }
  // Per-month totals across all dated readings (for charts). Undated readings are left out.
  // groupOf maps a reading to its series key (fandom by default; pairing, or a folded "other" group).
  function monthlySeries(readings, keys, groupKeys, groupOf) {
    const of = groupOf || (r => r.fandom);
    const idx = new Map(keys.map((k, i) => [k, i]));
    const words = {}; groupKeys.forEach(f => { words[f] = keys.map(() => 0); });
    const finished = keys.map(() => 0), dnfs = keys.map(() => 0);
    for (const r of readings) {
      if (!r.date) continue;
      const i = idx.get(r.date.slice(0, 7));
      if (i === undefined) continue;
      const g = of(r);
      if (r.words !== null && g !== undefined && words[g]) words[g][i] += r.words;
      if (r.kind === 'Read') finished[i]++; else dnfs[i]++;
    }
    const completion = keys.map((_, i) => finished[i] + dnfs[i] ? finished[i] / (finished[i] + dnfs[i]) : null);
    return { keys, words, finished, dnfs, completion };
  }
  function monthLabel(key, withYear) { const [y, m] = key.split('-').map(Number); return MON[m - 1] + (withYear ? ' ' + String(y).slice(2) : ''); }

  // Tags ranked by words read (DNFs without Chapters Read add no words). isVisible(tag) decides which
  // tags may appear (the sex-related tag toggle); it never changes which fics or words are counted.
  function topTags(readings, isVisible, limit) {
    const m = new Map();
    for (const r of readings) {
      if (r.words === null) continue;
      for (const t of new Set(r.fic.tags)) {
        if (isVisible && !isVisible(t)) continue;
        const e = m.get(t) || { tag: t, words: 0, fics: new Set() };
        e.words += r.words; e.fics.add(r.ficKey); m.set(t, e);
      }
    }
    return [...m.values()].map(e => ({ tag: e.tag, words: e.words, fics: e.fics.size }))
      .sort((a, b) => b.words - a.words || b.fics - a.fics).slice(0, limit || 10);
  }
  // Authors ranked by distinct fics read, then words. Anonymous / orphan_account are left out.
  function authorRanking(readings) {
    const m = new Map();
    for (const r of readings) for (const a of realAuthors(r.fic.authors)) {
      const e = m.get(a) || { author: a, fics: new Set(), words: 0, readings: 0 };
      e.fics.add(r.ficKey); e.readings++; if (r.words !== null) e.words += r.words; m.set(a, e);
    }
    const list = [...m.values()].map(e => ({ author: e.author, fics: e.fics.size, words: e.words, readings: e.readings }));
    list.sort((a, b) => b.fics - a.fics || b.words - a.words || a.author.localeCompare(b.author));
    // Rank by fics read; authors with the same number of fics share a rank (1, 2, 2, 4).
    list.forEach((e, i) => { e.rank = i > 0 && list[i - 1].fics === e.fics ? list[i - 1].rank : i + 1; });
    return list;
  }

  // ------------------------------------------------------------------------------------------
  // 5. FILTERS (Library, Diary and Export all use this)
  // ------------------------------------------------------------------------------------------
  function emptyFilters() {
    return { q: '', fandoms: [], pairings: [], kinds: [], ratings: [], categories: [], tagsInc: [], tagsExc: [], author: '', enjoyment: [], from: '', to: '', est: 'all' };
  }
  function filterCount(f) {
    return f.fandoms.length + (f.pairings || []).length + f.kinds.length + f.ratings.length + f.categories.length + f.tagsInc.length + f.tagsExc.length +
      (f.author ? 1 : 0) + f.enjoyment.length + (f.from ? 1 : 0) + (f.to ? 1 : 0) + (f.est !== 'all' ? 1 : 0);
  }
  function filterReadings(readings, f, opts) {
    const q = (f.q || '').trim().toLowerCase();
    const author = (f.author || '').trim().toLowerCase();
    return readings.filter(r => {
      const fic = r.fic;
      if (opts && opts.excludeE && fic.rating === 'E') return false;
      if (f.fandoms.length && !f.fandoms.includes(r.fandom)) return false;
      if (f.pairings && f.pairings.length && !f.pairings.includes(r.pairingKey)) return false;
      if (f.kinds.length && !f.kinds.includes(r.kind)) return false;
      if (f.ratings.length && !f.ratings.includes(fic.rating || '—')) return false;
      if (f.categories.length && !fic.categories.some(c => f.categories.includes(c))) return false;
      if (f.tagsInc.length && !f.tagsInc.every(t => fic.tags.includes(t) || fic.ships.includes(t))) return false;
      if (f.tagsExc.length && f.tagsExc.some(t => fic.tags.includes(t) || fic.ships.includes(t))) return false;
      if (author && !fic.authors.some(a => a.toLowerCase() === author)) return false;
      if (f.enjoyment.length && !f.enjoyment.includes(fic.enjoyment)) return false;
      if (f.from && !(r.date && r.date >= f.from)) return false;
      if (f.to && !(r.date && r.date <= f.to)) return false;
      if (f.est === 'est' && !r.est) return false;
      if (f.est === 'logged' && r.est) return false;
      if (q) {
        const hit = fic.title.toLowerCase().includes(q) || fic.authors.some(a => a.toLowerCase().includes(q)) ||
          fic.tags.some(t => t.toLowerCase().includes(q)) || fic.ships.some(t => t.toLowerCase().includes(q));
        if (!hit) return false;
      }
      return true;
    });
  }
  // Newest first; undated readings go last.
  function sortDiary(readings) {
    return readings.slice().sort((a, b) => {
      if (a.date && b.date) return b.date.localeCompare(a.date) || b.readNumber - a.readNumber || a.fic.title.localeCompare(b.fic.title);
      if (a.date) return -1; if (b.date) return 1;
      return a.fic.title.localeCompare(b.fic.title);
    });
  }

  // ------------------------------------------------------------------------------------------
  // 6. EXPORT rows (a flat diary: one row per reading)
  // ------------------------------------------------------------------------------------------
  function exportRow(r) {
    const f = r.fic;
    return {
      'Date': r.date || '', 'Fandom': f.fandom, 'Pairing': f.pairing, 'Title': f.title, 'Author': f.authors.join(', '),
      'Result': r.kind === 'Read' ? 'Finished' : 'DNF', 'Read #': r.readNumber, 'Estimated': r.est ? 'Y' : '',
      'Words read': r.words === null ? '' : r.words, 'Words': f.words, 'Chapters': f.chapters,
      'DNF chapters read': r.dnfChapters || '', 'Enjoyment': f.enjoyment || '', 'K': f.kg ? 'Y' : '', 'B': f.bk ? 'Y' : '',
      'Rating': f.rating, 'Category': f.category, 'Tags': f.tags.join(', '), 'Relationships': f.ships.join(', '),
      'Date Published': f.datePublished, 'Status now': f.status, 'Times Read': f.timesRead || '', 'Link': f.link, 'Work ID': f.id,
    };
  }
  function toCSV(rows) {
    if (!rows.length) return '';
    const cols = Object.keys(rows[0]);
    const esc = (v) => { const s = String(v ?? ''); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    return [cols.join(','), ...rows.map(r => cols.map(c => esc(r[c])).join(','))].join('\r\n');
  }

  // ------------------------------------------------------------------------------------------
  // 7. MODEL: everything the screens need, built once per sync.
  // ------------------------------------------------------------------------------------------
  const REQUIRED_COLS = ['Status', 'Title', 'Link', 'Author', 'Words', 'Chapters', 'Date Read', 'Last Read', 'Chapters Read', 'Times Read'];
  // sourceData: { [source id]: loaded sheet }. sources: the SOURCES list.
  function buildModel(sourceData, sources) {
    const fics = [], events = [], notes = [];
    for (const src of sources) {
      const d = sourceData[src.id];
      const name = `${sourceLabel(src, sources)} sheet`;
      if (!d) { notes.push(`${name}: not loaded yet.`); continue; }
      assignGroups(d.fics, src);
      fics.push(...d.fics); events.push(...d.log);
      if (d.logMissing) notes.push(`${name}: no "Reading Log" tab, so every reading there counts as estimated.`);
      if (d.missingCols && d.missingCols.length) notes.push(`${name}: no column named ${d.missingCols.map(c => `"${c}"`).join(', ')}.`);
      if (src.pairingMode === 'perFic' && d.header && !d.header.includes('Relationships')) notes.push(`${name}: pairings come from a "Relationships" column, but there isn't one, so every fic shows "${NO_PAIRING}".`);
      if (d.duplicateHeaders && d.duplicateHeaders.length) notes.push(`${name}: more than one column is headed ${d.duplicateHeaders.map(c => `"${c}"`).join(', ')}; Shelf Life uses the right-most one, like the fandom apps.`);
      if (d.stale) notes.push(`${name}: the last sync failed, so this is the copy from the sync before.`);
    }
    const ficByKey = new Map(fics.map(f => [f.key, f]));
    const eventsByKey = new Map();
    let unmatched = 0;
    for (const e of events) {
      if (!ficByKey.has(e.key)) { unmatched++; continue; }
      if (!eventsByKey.has(e.key)) eventsByKey.set(e.key, []);
      eventsByKey.get(e.key).push(e);
    }
    for (const list of eventsByKey.values()) list.sort((a, b) => a.seq - b.seq);
    const readings = buildReadings(fics, events.filter(e => ficByKey.has(e.key)));
    const inProgress = fics.filter(f => IN_PROGRESS.has(f.status))
      .sort((a, b) => (b.lastRead || '').localeCompare(a.lastRead || '') || (b.dateStarted || '').localeCompare(a.dateStarted || ''));

    // Data notes (shown under Export, so it's always clear what the numbers rest on).
    const undatedRead = readings.filter(r => r.kind === 'Read' && !r.date).length;
    const undatedDnf = readings.filter(r => r.kind === 'DNF' && !r.date).length;
    const dnfNoWords = readings.filter(r => r.kind === 'DNF' && r.words === null).length;
    const est = readings.filter(r => r.est).length;
    const badDates = fics.flatMap(f => f.badDates.map(b => ({ ...b, title: f.title })));
    const statusCounts = {};
    for (const f of fics) { const s = f.status || '(blank)'; statusCounts[s] = (statusCounts[s] || 0) + 1; }
    const unknown = Object.keys(statusCounts).filter(s => s !== '(blank)' && !KNOWN_STATUSES.includes(s));
    if (est) notes.push(`${est} reading${est === 1 ? ' has' : 's have'} no matching Finished or DNF event in the Reading Log (backfilled), so ${est === 1 ? "it's" : "they're"} marked est.`);
    if (undatedRead) notes.push(`${undatedRead} finished reading${undatedRead === 1 ? ' has' : 's have'} no date, so ${undatedRead === 1 ? 'it counts' : 'they count'} in All time only.`);

function Sparkline({ values, color }) {
  const vs = values.map(v => v === null ? 0 : v);
  const max = Math.max(...vs), min = Math.min(...vs);
  const w = 64, h = 20;
  if (!vs.length || max === min && max === 0) return html`<svg width=${w} height=${h} aria-hidden="true"><line x1="0" y1=${h - 1} x2=${w} y2=${h - 1} stroke="var(--surface-3)" strokeWidth="2" strokeLinecap="round" /></svg>`;
  const pts = vs.map((v, i) => [i * (w - 4) / Math.max(1, vs.length - 1) + 2, h - 2 - (max === min ? (h - 4) / 2 : (v - min) / (max - min) * (h - 4))]);
  const last = pts[pts.length - 1];
  return html`<svg width=${w} height=${h} aria-hidden="true">
    <polyline points=${pts.map(p => p.join(',')).join(' ')} fill="none" stroke=${color || 'var(--ink-3)'} strokeWidth="1.6" strokeLinejoin="round" strokeLinecap="round" />
    <circle cx=${last[0]} cy=${last[1]} r="2.6" fill=${color || 'var(--ink)'} />
  </svg>`;
}

// Chart.js wrapper. Configs are rebuilt when data or theme changes.
function ChartBox({ config, height }) {
  const ref = useRef(null);
  useEffect(() => {
    if (!ref.current || !window.Chart) return;
    const chart = new Chart(ref.current.getContext('2d'), config);
    return () => chart.destroy();
  }, [config]);
  return html`<div style=${{ position: 'relative', height: height || 220 }}><canvas ref=${ref} role="img"></canvas></div>`;
}
function chartTheme() {
  return { ink: cssVar('--ink'), ink2: cssVar('--ink-2'), ink3: cssVar('--ink-3'), line: cssVar('--line'), surface: cssVar('--surface'), accent: cssVar('--accent'), pos: cssVar('--pos'), dnf: cssVar('--dnf') };
}
function baseScales(t, yFmt) {
  return {
    x: { stacked: true, grid: { display: false }, border: { display: false }, ticks: { color: t.ink3, maxRotation: 0, autoSkip: true, autoSkipPadding: 10, font: { size: 11 } } },
    y: { stacked: true, beginAtZero: true, grid: { color: t.line }, border: { display: false }, ticks: { color: t.ink3, maxTicksLimit: 4, font: { size: 11 }, callback: yFmt || (v => v) } },
  };
}
// Stacked bars: round only the top-most non-empty segment of each bar.
function topRadius(wordsByGroup, keys, i) {
  return (ctx) => {
    const j = ctx.dataIndex;
    const top = keys.map(k => wordsByGroup[k][j]).reduce((acc, v, k) => v > 0 ? k : acc, -1);
    return i === top ? { topLeft: 5, topRight: 5, bottomLeft: 0, bottomRight: 0 } : 0;
  };
}
function tooltip(t, label) {
  return { backgroundColor: t.ink, titleColor: t.surface, bodyColor: t.surface, padding: 10, cornerRadius: 10, displayColors: true, boxPadding: 4, callbacks: label ? { label } : {} };
}

// ---------- auth ----------
function readCachedToken() {
  try { const c = JSON.parse(localStorage.getItem(TOKEN_KEY) || 'null'); if (c && c.token && Date.now() < c.expiresAt) return c; } catch (e) {}
  return null;
}
function useAuth() {
  const [tok, setTok] = useState(readCachedToken);
  const [ready, setReady] = useState(false);
  const [error, setError] = useState('');
  const clientRef = useRef(null);
  const waiters = useRef([]);
  const tokRef = useRef(tok);
  useEffect(() => { tokRef.current = tok; }, [tok]);
  useEffect(() => {
    let cancelled = false;
    const settle = (fn) => { const w = waiters.current; waiters.current = []; w.forEach(fn); };
    (function init() {
      if (cancelled) return;
      if (!window.google || !window.google.accounts || !window.google.accounts.oauth2) { setTimeout(init, 200); return; }
      clientRef.current = window.google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPE,
        callback: (resp) => {
          if (resp.error) { setError(resp.error_description || resp.error); settle(w => w.reject(new Error(resp.error))); return; }
          const t = { token: resp.access_token, expiresAt: Date.now() + (Number(resp.expires_in) || 3600) * 1000 - 60000 };
          try { localStorage.setItem(TOKEN_KEY, JSON.stringify(t)); } catch (e) {}
          setError(''); tokRef.current = t; setTok(t);
          settle(w => w.resolve(t.token));
        },
        error_callback: (err) => { setError((err && (err.message || err.type)) || 'Sign-in was cancelled.'); settle(w => w.reject(new Error('cancelled'))); },
      });
      setReady(true);
    })();
    return () => { cancelled = true; };
  }, []);
  const getToken = useCallback(() => { const t = tokRef.current; return t && Date.now() < t.expiresAt ? t.token : null; }, []);
  const signIn = useCallback(() => new Promise((resolve, reject) => {
    if (!clientRef.current) { reject(new Error('Google sign-in is still loading.')); return; }
    waiters.current.push({ resolve, reject });
    clientRef.current.requestAccessToken();
  }), []);
  const expire = useCallback(() => { try { localStorage.removeItem(TOKEN_KEY); } catch (e) {} tokRef.current = null; setTok(null); }, []);
  const signOut = useCallback(() => {
    const t = getToken();
    if (t && window.google && window.google.accounts) window.google.accounts.oauth2.revoke(t, () => {});
    expire();
  }, [getToken, expire]);
  return { signedIn: !!(tok && Date.now() < tok.expiresAt), ready, error, getToken, signIn, signOut, expire };
}

// ---------- theme ----------
function useTheme() {
  const [mode, setMode] = useState(() => { try { return localStorage.getItem(THEME_KEY) || 'system'; } catch (e) { return 'system'; } });
  const [tick, setTick] = useState(0);
  useEffect(() => {
    const root = document.documentElement;
    if (mode === 'system') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', mode);
    try { localStorage.setItem(THEME_KEY, mode); } catch (e) {}
    const meta = document.querySelector('meta[name="theme-color"]');
    requestAnimationFrame(() => { if (meta) meta.setAttribute('content', cssVar('--bg')); setTick(t => t + 1); });
  }, [mode]);
  useEffect(() => {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const on = () => setTick(t => t + 1);
    mq.addEventListener ? mq.addEventListener('change', on) : mq.addListener(on);
    return () => { mq.removeEventListener ? mq.removeEventListener('change', on) : mq.removeListener(on); };
  }, []);
  const cycle = () => setMode(m => m === 'system' ? 'light' : m === 'light' ? 'dark' : 'system');
  return { mode, cycle, tick };
}

const PERIOD_OPTIONS = [['thisMonth', 'This month'], ['lastMonth', 'Last month'], ['thisQuarter', 'This quarter'], ['thisYear', 'This year'], ['lastYear', 'Last year'], ['all', 'All time'], ['custom', 'Custom']];

function headline(cur, prev, p, cp, today, level, model) {
  const name = R.periodName(p, today);
  const when = p.unit === 'all' ? 'in total' : (p.unit === 'days' ? `from ${name}` : `in ${name}`) + (p.partial ? ' so far' : '');
  if (!cur.finished && !cur.dnfs) return p.unit === 'all' ? 'No finished reads yet.' : `Nothing finished ${when} yet.`;
  let s = `You read ${fmtWords(cur.words)} words ${when}`;
  if (prev && cp) {
    const cname = R.periodName(cp, today);
    if (prev.words > 0) {
      const d = (cur.words - prev.words) / prev.words, pct = Math.round(Math.abs(d) * 100);
      s += pct === 0 ? `, about the same as ${cname}` : `, ${pct}% ${d > 0 ? 'more' : 'fewer'} than ${cname}`;
    } else if (cur.words > 0) s += `, up from none in ${cname}`;
  }
  // "mostly …" names the biggest fandom (or pairing, when the breakdown is set to Pairing).
  const byPairing = level === 'pairing';
  const nameOf = (k) => byPairing ? ((model.pairingByKey.get(k) || {}).name || k) : R.shortFandom(k);
  const parts = Object.entries(byPairing ? cur.byPairing : cur.byFandom).filter(([, w]) => w > 0).sort((a, b) => b[1] - a[1]);
  const total = parts.reduce((t, [, w]) => t + w, 0);
  if (parts.length === 1 && total > 0) s += `, all ${nameOf(parts[0][0])}`;
  else if (parts.length > 1) s += parts[0][1] / total >= 0.6 ? `, mostly ${nameOf(parts[0][0])}` : `, split between ${nameOf(parts[0][0])} and ${nameOf(parts[1][0])}`;
  return s + '.';
}

function delta(cur, prev, kind) {
  if (prev === null || prev === undefined || cur === null || cur === undefined) return null;
  if (kind === 'pts') {
    const d = Math.round((cur - prev) * 100);
    return { text: d === 0 ? '±0 pts' : `${d > 0 ? '+' : '−'}${Math.abs(d)} pts`, dir: Math.sign(d) };
  }
  if (prev === 0) return cur === 0 ? { text: '±0', dir: 0 } : { text: 'new', dir: 1 };
  const d = (cur - prev) / prev, pct = Math.round(Math.abs(d) * 100);
  return { text: pct === 0 ? '±0%' : `${d > 0 ? '↑' : '↓'} ${pct}%`, dir: pct === 0 ? 0 : Math.sign(d) };
}

function StatTile({ label, value, d, good, spark, note, cmpLabel }) {

    <div className="tile-value serif num">${value}</div>
    ${note ? html`<div className="tile-note">${note}</div>` : null}

}

function CurrentlyReading({ model, onOpen }) {

        return html`<button key=${f.key} className="mini" onClick=${() => onOpen(f.key)}>

function WordsPerMonth({ model, p, today, themeTick, level }) {
  const { config, groups } = useMemo(() => {
    const t = chartTheme();
    let from, to;
    const nowKey = today.slice(0, 7);
    if (p.unit === 'all') { from = (model.firstDate || today).slice(0, 7); to = nowKey; }
    else {
      const endKey = p.end.slice(0, 7) > nowKey ? nowKey : p.end.slice(0, 7);
      const spanMonths = R.monthKeys(p.start.slice(0, 7), p.end.slice(0, 7)).length;
      if (spanMonths >= 3) { from = p.start.slice(0, 7); to = endKey; }
      else { const [y, m] = endKey.split('-').map(Number); const [sy, sm] = R.monthShift(y, m, -11); from = `${sy}-${String(sm).padStart(2, '0')}`; to = endKey; }
    }
    if (from > to) from = to;
    const keys = R.monthKeys(from, to);
    const totals = {}, present = new Set();
    for (const r of model.readings) {
      if (!r.date) continue; const mk = r.date.slice(0, 7); if (mk < from || mk > to) continue;
      present.add(r.pairingKey); if (r.words !== null) totals[r.pairingKey] = (totals[r.pairingKey] || 0) + r.words;
    }
    const groups = makeGroups(model, level, totals, present);
    const s = R.monthlySeries(model.readings, keys, groups.keys, groups.of);
    const multiYear = keys[0].slice(0, 4) !== keys[keys.length - 1].slice(0, 4);
    return { groups, config: {
      type: 'bar',
      data: { labels: keys.map(k => R.monthLabel(k, multiYear)), datasets: groups.keys.map((k, i) => ({ label: groups.short(k), data: s.words[k], backgroundColor: groups.color(k), borderRadius: topRadius(s.words, groups.keys, i), borderSkipped: false, maxBarThickness: 26, stack: 'w' })) },
      options: { responsive: true, maintainAspectRatio: false, animation: { duration: 250 }, interaction: { mode: 'index', intersect: false },
        plugins: { legend: { display: false }, tooltip: { ...tooltip(t, c => ` ${c.dataset.label}: ${fmtWords(c.parsed.y)}`), filter: c => c.parsed.y > 0 } },
        scales: baseScales(t, v => fmtWords(v)) },
    } };
  }, [model, p.start, p.end, p.unit, today, themeTick, level]);
  return html`<div className="card">
    <${ChartBox} config=${config} height=${200} />
    <${GroupLegend} groups=${groups} />
  </div>`;
}

// Legend for a fandom/pairing breakdown. In pairing view, pairings sit under their fandom.
function GroupLegend({ groups, suffix }) {
  if (groups.level === 'fandom') return html`<div className="legend">${groups.keys.map(k => html`<span key=${k}><i style=${{ background: groups.color(k) }}></i>${groups.label(k)}${suffix || ''}</span>`)}</div>`;
  const byFandom = [];
  for (const k of groups.keys) {
    const f = groups.fandomOf(k);
    let e = byFandom.find(x => x.f === f); if (!e) { e = { f, keys: [] }; byFandom.push(e); }
    e.keys.push(k);
  }
  if (!byFandom.length) return html`<div className="legend faint">No readings in this range.</div>`;
  return html`<div style=${{ marginTop: 10, display: 'flex', flexDirection: 'column', gap: 8 }}>${byFandom.map(e => html`<div key=${e.f}>
    <div className="tiny faint" style=${{ fontWeight: 700, marginBottom: 3 }}>${e.f}</div>
    <div className="legend" style=${{ marginTop: 0 }}>${e.keys.map(k => html`<span key=${k}><i style=${{ background: groups.color(k) }}></i>${groups.label(k)}${suffix || ''}</span>`)}</div>
  </div>`)}</div>`;
}

function TopTags({ readings, dnfNoWords, onTag, limit }) {
  const ctx = useContext(TagCtx);
  const tags = useMemo(() => R.topTags(readings, ctx.isVisible, limit || 10), [readings, ctx.isVisible, limit]);
  const max = tags.length ? tags[0].words : 1;
  return html`<div className="card">
    <div style=${{ marginBottom: 6 }}><${SexTagToggle} compact /></div>
    ${!tags.length ? html`<div className="empty">No tagged words in this period.</div>` : tags.map(t => html`<div className="hbar-row" key=${t.tag} onClick=${() => onTag(t.tag)} style=${{ cursor: 'pointer' }}>
      <span className="hbar-label">${t.tag}</span>

      <div className="hbar-track"><div style=${{ width: Math.max(2, t.words / max * 100) + '%', background: 'var(--accent)', borderRadius: 99 }}></div></div>
    </div>`)}

  </div>`;
}

// Share of words read by fandom, or by pairing within each fandom.
function GroupSplit({ model, stats, themeTick, level }) {
  const { groups, words, counts } = useMemo(() => {
    const groups = makeGroups(model, level, stats.byPairing, new Set(Object.keys(stats.countPairing)));
    const words = {}, counts = {};
    for (const r of stats.readings) {
      const g = groups.of(r); if (g === undefined) continue;
      counts[g] = (counts[g] || 0) + 1; if (r.words !== null) words[g] = (words[g] || 0) + r.words;
    }
    return { groups, words, counts };
  }, [model, stats, level]);
  const keys = groups.level === 'fandom' ? groups.keys : groups.keys.filter(k => counts[k]);
  const config = useMemo(() => {
    const t = chartTheme();
    return {
      type: 'doughnut',
      data: { labels: keys.map(groups.short), datasets: [{ data: keys.map(k => words[k] || 0), backgroundColor: keys.map(groups.color), borderColor: t.surface, borderWidth: 3, hoverOffset: 4 }] },
      options: { responsive: true, maintainAspectRatio: false, cutout: '70%', animation: { duration: 250 }, plugins: { legend: { display: false }, tooltip: tooltip(t, c => ` ${c.label}: ${fmtWords(c.parsed)}`) } },
    };
  }, [groups, words, themeTick]);
  const total = Object.values(words).reduce((a, b) => a + b, 0);
  // Pairing view has more (and longer) rows, so the doughnut sits above the list instead of beside it.
  const stacked = groups.level === 'pairing';
  const ring = stacked ? 150 : 112;
  return html`<div className="card" style=${{ display: 'grid', gridTemplateColumns: stacked ? 'minmax(0, 1fr)' : '112px minmax(0, 1fr)', gap: 16, alignItems: 'start' }}>
    <div style=${{ width: ring, justifySelf: stacked ? 'center' : 'start' }}>${total ? html`<${ChartBox} config=${config} height=${ring} />` : html`<div style=${{ width: ring, height: ring, borderRadius: '50%', border: '14px solid var(--surface-2)' }}></div>`}</div>
    <div>
      ${!keys.length ? html`<div className="small faint">No readings in this period.</div>` : null}
      ${keys.map((k, i) => {
        const w = words[k] || 0, n = counts[k] || 0;
        const fandomHead = groups.level === 'pairing' && (i === 0 || groups.fandomOf(keys[i - 1]) !== groups.fandomOf(k));
        return html`<div key=${k}>
          ${fandomHead ? html`<div className="tiny faint" style=${{ fontWeight: 700, margin: i ? '8px 0 0' : 0 }}>${groups.fandomOf(k)}</div>` : null}
          <div style=${{ padding: '4px 0' }}>
            <div className="row" style=${{ gap: 8, flexWrap: 'nowrap', justifyContent: 'space-between', alignItems: 'flex-start' }}>
              <span className="row" style=${{ gap: 8, flexWrap: 'nowrap', alignItems: 'flex-start', minWidth: 0 }}><i style=${{ width: 10, height: 10, borderRadius: 3, background: groups.color(k), display: 'inline-block', flexShrink: 0, marginTop: 5 }}></i><b style=${{ fontWeight: 600 }}>${groups.label(k)}</b></span>
              <span className="num" style=${{ fontWeight: 600 }}>${total ? Math.round(w / total * 100) : 0}%</span>
            </div>
            <div className="tiny muted num" style=${{ paddingLeft: 18 }}>${fmtWords(w)} words · ${n} read${n === 1 ? '' : 's'}</div>
          </div>
        </div>`;
      })}
    </div>
  </div>`;
}

function RecentlyFinished({ stats, onOpen, today }) {
  const recent = R.sortDiary(stats.readings.filter(r => r.kind === 'Read')).slice(0, 12);
  if (!recent.length) return html`<div className="card empty">No finished fics in this period.</div>`;
  return html`<div className="hscroll">
    ${recent.map(r => html`<button key=${r.id} className="mini" style=${{ width: 196 }} onClick=${() => onOpen(r.ficKey)}>
      <div className="mini-title">${r.fic.title}</div>
      <div className="small muted" style=${{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>${r.fic.authors.join(', ')}</div>
      <${SourceLine} fic=${r.fic} />
      <div className="row" style=${{ justifyContent: 'space-between', marginTop: 'auto' }}>
        <span className="small faint">${r.date ? R.fmtDay(r.date, today) : 'No date'} · ${fmtWords(r.fic.words)}</span>
        ${r.est ? html`<${EstBadge} />` : null}
        ${r.fic.enjoyment ? html`<${Enjoy} n=${r.fic.enjoyment} />` : html`<span className="tiny faint">unrated</span>`}
      </div>
    </button>`)}
