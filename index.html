<style>
  :root {

    --f-hollanov: #2C79BE; --f-drarry: #1F8C66; --f-asoiaf: #C24E36;
    --shadow: 0 1px 2px rgba(24, 20, 40, .05), 0 6px 20px rgba(24, 20, 40, .05);
    --radius: 18px; --radius-sm: 12px;

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111114; --surface: #1B1B20; --surface-2: #24242B; --surface-3: #2E2E36;
      --ink: #F1F0F4; --ink-2: #ADA9B6; --ink-3: #7D7987; --line: #2C2C34;
      --accent: #A08FFF; --accent-soft: #2A2547; --accent-ink: #15131F;
      --pos: #52C690; --pos-soft: #183326; --neg: #F07D66; --neg-soft: #3A1E19; --neutral-soft: #26262D;
      --est: #E8B654; --est-soft: #3A2E12;
      --dnf: #A797CC;
      --f-hollanov: #64A9E8; --f-drarry: #4CC79B; --f-asoiaf: #EF8068;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111114; --surface: #1B1B20; --surface-2: #24242B; --surface-3: #2E2E36;
    --ink: #F1F0F4; --ink-2: #ADA9B6; --ink-3: #7D7987; --line: #2C2C34;
    --accent: #A08FFF; --accent-soft: #2A2547; --accent-ink: #15131F;
    --pos: #52C690; --pos-soft: #183326; --neg: #F07D66; --neg-soft: #3A1E19; --neutral-soft: #26262D;
    --est: #E8B654; --est-soft: #3A2E12;
    --dnf: #A797CC;
    --f-hollanov: #64A9E8; --f-drarry: #4CC79B; --f-asoiaf: #EF8068;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); }
  body { font-family: 'DM Sans', system-ui, -apple-system, sans-serif; font-size: 15px; line-height: 1.45; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; }

  .serif { font-family: 'Fraunces', Georgia, serif; font-optical-sizing: auto; letter-spacing: -0.01em; }

  .tiny { font-size: 11.5px; }

  .sync { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2); }
  .icon-btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: inline-grid; place-items: center; color: var(--ink-2); flex-shrink: 0; }
  .icon-btn:active { transform: scale(.96); }
  .pill-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 12px; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
  .pill-btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  .nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 30; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  .nav-inner { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }

  .section { margin-top: 22px; }
  .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 0 2px 10px; }
  .section-title { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); margin: 0; }
  .card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }
  .banner { border-radius: var(--radius-sm); padding: 10px 12px; font-size: 13px; margin-top: 10px; }
  .banner.warn { background: var(--est-soft); color: var(--est); }
  .banner.err { background: var(--neg-soft); color: var(--neg); }

  .headline { font-size: 25px; line-height: 1.22; font-weight: 500; margin: 8px 2px 4px; text-wrap: balance; }

  .tile-foot { display: flex; align-items: center; justify-content: space-between; gap: 6px; min-height: 22px; }

  .wrap-chips { display: flex; flex-wrap: wrap; gap: 6px; }

  .sheet-back { position: fixed; inset: 0; z-index: 50; background: rgba(10, 8, 20, .42); display: flex; align-items: flex-end; justify-content: center; animation: fade .18s ease; }
  .sheet { background: var(--bg); width: 100%; max-width: 760px; max-height: 92vh; overflow-y: auto; border-radius: 24px 24px 0 0; padding: 8px 16px calc(28px + env(safe-area-inset-bottom)); animation: up .22s cubic-bezier(.2,.8,.2,1); }
  @media (min-width: 760px) { .sheet-back { align-items: center; } .sheet { border-radius: 24px; max-height: 88vh; } }
  .grab { width: 40px; height: 5px; border-radius: 9px; background: var(--surface-3); margin: 4px auto 10px; }

  .meta-grid div b { display: block; font-size: 11.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); }
  .tagchip { display: inline-block; font-size: 12.5px; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); margin: 0 6px 6px 0; }
  .tagchip.ship { background: color-mix(in srgb, var(--fc) 15%, transparent); color: var(--ink); }

  .tl-item.fin::before { background: var(--pos); border-color: var(--pos); }
  .tl-item.dnf::before { background: var(--dnf); border-color: var(--dnf); }

  .check input { width: 20px; height: 20px; accent-color: var(--accent); }
  .center-screen { min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center; }

<body>
<div id="root"></div>
<script>
// ============================================================================================
// <shelf-rules>
// SHELF LIFE DATA RULES
// Everything that decides what a "reading" is, which day it counts on, how many words it adds
// and whether it gets the "est." badge lives in this one module. Every screen, chart and export
// calls into it, so the numbers always agree with each other. Plain JS (no DOM, no React) so it
// can be run and tested on its own in Node.
// ============================================================================================
const ShelfRules = (() => {
  const TZ = 'Australia/Melbourne';
  const MONTH_MAP = { Jan: 0, Feb: 1, Mar: 2, Apr: 3, May: 4, Jun: 5, Jul: 6, Aug: 7, Sep: 8, Oct: 9, Nov: 10, Dec: 11 };
  const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  // ------------------------------------------------------------------------------------------
  // 1. CELL PARSING — copied from the fandom apps so every cell reads exactly as it does there.
  // ------------------------------------------------------------------------------------------

  // Numbers (Words, Kudos, Chapters...): strip commas, then parseInt. "24,200 " -> 24200.
  const num = (v) => { const n = parseInt(String(v ?? '').replace(/,/g, ''), 10); return isNaN(n) ? 0 : n; };
  // Comma-separated cells (Tags, Author, Category, Relationships).
  const splitList = (s) => { const t = String(s || '').trim(); return t ? t.split(',').map(x => x.trim()).filter(Boolean) : []; };

  // Same as the apps' normIsoDate: ISO, d/m/yyyy (Australian order) or d-Mon-yy; anything else is kept as typed.
  function normIsoDate(raw) {
    const s = String(raw || '').trim();
    if (!s) return '';
    let m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s);
    if (m) return `${m[1]}-${m[2]}-${m[3]}`;
    m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(s);
    if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
    m = /^(\d{1,2})-([A-Za-z]{3})-(\d{2,4})$/.exec(s);
    if (m) {
      const mon = m[2][0].toUpperCase() + m[2].slice(1).toLowerCase();
      if (MONTH_MAP[mon] !== undefined) {
        let y = parseInt(m[3], 10);
        if (y < 100) y += 2000;
        return `${y}-${String(MONTH_MAP[mon] + 1).padStart(2, '0')}-${m[1].padStart(2, '0')}`;
      }
    }
    return s;
  }
  const isIso = (s) => /^\d{4}-\d{2}-\d{2}$/.test(s || '');
  // A cell as a date, or null. Last Read holds "YYYY-MM-DD HH:MM", so only the first token is the date.
  // Dates are plain Melbourne calendar dates already (the apps write Melbourne time), so no timezone maths here.
  function cellDate(raw) {
    const s = String(raw || '').trim();
    if (!s) return null;
    const d = normIsoDate(s.split(/\s+/)[0]);
    return isIso(d) ? d : null;
  }
  // Same as the apps' parseFicDate, for Date Published ("30-Oct-25").
  function parseFicDate(str) {
    if (!str) return 0;
    const s = String(str).trim();
    const m = /^(\d{1,2})-([A-Za-z]{3})-(\d{2,4})$/.exec(s);
    if (m) {
      const month = MONTH_MAP[m[2]];
      let year = parseInt(m[3], 10);
      if (year < 100) year += 2000;
      if (month === undefined) return 0;
      return new Date(year, month, parseInt(m[1], 10)).getTime();
    }
    const t = Date.parse(s);
    return isNaN(t) ? 0 : t;
  }
  // The AO3 work ID is the key. Same fallback as the apps for a missing link.
  function workIdFromLink(link, rowNumber) {
    const m = /\/works\/(\d+)/.exec(link || '');
    return m ? m[1] : 'row-' + rowNumber;
  }
  const ANONYMOUS_AUTHORS = new Set(['anonymous', 'orphan_account', 'orphan account']);
  const realAuthors = (authors) => (authors || []).filter(a => !ANONYMOUS_AUTHORS.has(a.trim().toLowerCase()));

  // Chapters: the apps use parseInt, so "14/22" reads as 14 published chapters (the total used for DNF words).
  // Right now the column holds one number for complete works, so planned = published (shown as "14 / 14").
  function parseChapters(raw) {
    const s = String(raw || '').trim();
    const m = /^([\d,]+)\s*\/\s*([\d,]+|\?)$/.exec(s);
    if (m) return { published: num(m[1]) || 1, planned: m[2] === '?' ? null : num(m[2]) };
    const p = num(s) || 1;
    return { published: p, planned: p };
  }

  // The statuses the apps know about. Anything else is kept as its own status, never treated as an error.
  const KNOWN_STATUSES = ['Read', 'DNF', 'Currently Reading', 'Paused', 'TBR', 'Skipped', 'Not Interested'];
  const IN_PROGRESS = new Set(['Currently Reading', 'Paused']);

  // One Data List row -> one fic. Columns are found by header name only, never by position.
  // Rows with no Title are skipped, exactly as the apps skip them.
  function ficFromRow(headerIndex, row, rowNumber, fandom) {
    const get = (name) => { const i = headerIndex[name]; return i !== undefined ? String(row[i] ?? '') : ''; };
    const title = get('Title').trim();
    if (!title) return null;
    const link = get('Link').trim();
    const id = workIdFromLink(link, rowNumber);
    const ch = parseChapters(get('Chapters'));
    const enjoymentRaw = parseInt(get('Enjoyment').trim(), 10);
    const badDates = [];
    const dateCol = (col, raw) => { const d = cellDate(raw); if (!d && String(raw).trim()) badDates.push({ col, value: String(raw).trim() }); return d; };
    const lastReadRaw = get('Last Read').trim();
    return {
      key: fandom + '|' + id, fandom, id, rowNumber, title, link,
      authors: splitList(get('Author')),
      datePublished: get('Date Published').trim(),
      publishedMs: parseFicDate(get('Date Published')),
      rating: get('Rating (S)').trim(),
      category: get('Category').trim() || 'Uncategorized',
      categories: splitList(get('Category')).length ? splitList(get('Category')) : ['Uncategorized'],
      words: num(get('Words')),
      chapters: ch.published,
      chaptersPlanned: ch.planned,
      tags: splitList(get('Tags')),
      ships: splitList(get('Relationships')),
      kudos: num(get('Kudos')), bookmarks: num(get('Bookmarks')), hits: num(get('Hits')), comments: num(get('Comments')),
      status: get('Status').trim(),              // raw text: '' (unread) or any status, known or not
      dnrReason: get('DNR Reason').trim(),
      enjoyment: (enjoymentRaw >= 1 && enjoymentRaw <= 5) ? enjoymentRaw : 0,
      kg: get('K').trim().toUpperCase() === 'Y',
      bk: get('B').trim().toUpperCase() === 'Y',
      dateStarted: dateCol('Date Started', get('Date Started')),
      dateRead: dateCol('Date Read', get('Date Read')),            // "Date Read (old)" is never read
      lastRead: lastReadRaw,
      lastReadDate: dateCol('Last Read', lastReadRaw),
      chaptersRead: num(get('Chapters Read')),   // blank and 0 both read as 0, as in the apps
      timesRead: num(get('Times Read')),
      badDates,
    };
  }

  // Reading Log rows -> events. Columns found by header name when there's a header row; otherwise the
  // apps' own write order (Timestamp, Link, Title, Event, Chapters Read, Read Number).
  function parseLogRows(rows, fandom) {
    if (!rows || !rows.length) return [];
    let start = 0;
    let col = { ts: 0, link: 1, title: 2, event: 3, ch: 4, rn: 5 };
    const h = (rows[0] || []).map(x => String(x || '').trim().toLowerCase());
    if (h.includes('timestamp') || h.includes('event')) {
      start = 1;
      const f = (n, d) => { const i = h.indexOf(n); return i >= 0 ? i : d; };
      col = { ts: f('timestamp', 0), link: f('link', 1), title: f('title', 2), event: f('event', 3), ch: f('chapters read', 4), rn: f('read number', 5) };
    }
    const out = [];
    for (let i = start; i < rows.length; i++) {
      const r = rows[i] || [];
      const link = String(r[col.link] ?? '').trim();
      const event = String(r[col.event] ?? '').trim();
      const m = /\/works\/(\d+)/.exec(link);
      if (!m || !event) continue;
      const ts = String(r[col.ts] ?? '').trim();
      const chRaw = String(r[col.ch] ?? '').trim();
      out.push({
        fandom, key: fandom + '|' + m[1], seq: i, ts, date: cellDate(ts), event,
        title: String(r[col.title] ?? '').trim(),
        chaptersRead: chRaw === '' ? null : num(chRaw),
        readNumber: num(r[col.rn]) || 1,
      });
    }
    return out;
  }

  // ------------------------------------------------------------------------------------------
  // 2. READINGS
  // A "reading" is one time through a fic that ended in Read or DNF.
  //   - Data List Status says how the CURRENT read (read number = Times Read, min 1) ended:
  //       Read -> a finished reading dated by Date Read.
  //       DNF  -> a DNF reading dated by Last Read.
  //       Currently Reading / Paused -> still in progress, no reading yet.
  //   - EARLIER reads (read numbers below the current one) come from the Reading Log where it shows
  //     them (dated by their Finished / DNF event). Where Times Read says a read happened but the log
  //     doesn't show it, it's a finished read with no date: it counts in "all time", never in a period.
  //     The one exception: the read just before an in-progress or DNF'd re-read still has its finish
  //     date in Date Read (the apps only overwrite it at the next finish), so that date is used.
  //   - A fic whose Status isn't Read/DNF but whose log shows the current read ending still counts,
  //     from the log ("a fic ... with Reading Log events").
  // Fallbacks: a Read with no Date Read uses its Finished event's date; a DNF with no Last Read uses its
  // DNF event's date. Anything still undated is "all time" only.
  // est. badge: a finished reading (Read) with no Finished event for that read number. DNFs never get it.
  // Words: Read = full Words. DNF = Words × Chapters Read ÷ chapters (capped at 100%) when Chapters Read
  //   is filled in (above 0); otherwise words = null and the reading is left out of word totals.
  // ------------------------------------------------------------------------------------------
  const TERMINAL = { Finished: 'Read', DNF: 'DNF' };
  const REOPENS = new Set(['Started', 'Progress', 'Paused', 'Re-read started']);

  function makeReading(fic, readNumber, kind, date, est, dnfChapters, source) {
    let words = null;
    if (kind === 'Read') words = fic.words;
    else if (dnfChapters && dnfChapters > 0 && fic.chapters > 0) words = Math.round(fic.words * Math.min(1, dnfChapters / fic.chapters));
    return {
      id: fic.key + '#' + readNumber, ficKey: fic.key, fandom: fic.fandom, fic, readNumber, kind,
      date: date || null, est: !!est, dnfChapters: kind === 'DNF' ? (dnfChapters || null) : null,
      words, source,
    };
  }

  function buildReadings(fics, events) {
    const byKey = new Map();
    for (const e of events) { if (!byKey.has(e.key)) byKey.set(e.key, []); byKey.get(e.key).push(e); }
    const readings = [];
    let logOnly = 0;
    for (const fic of fics) {
      const evs = (byKey.get(fic.key) || []).slice().sort((a, b) => a.seq - b.seq);
      if (!evs.length && fic.status !== 'Read' && fic.status !== 'DNF' && !(fic.timesRead > 1)) continue;
      // Per read number, the last Finished/DNF event — unless the same read was picked up again afterwards.
      const terminal = new Map();
      const finishedFor = new Set();
      let maxLogRead = 0;
      for (const e of evs) {
        maxLogRead = Math.max(maxLogRead, e.readNumber);
        if (e.event === 'Finished') finishedFor.add(e.readNumber);
        if (TERMINAL[e.event]) terminal.set(e.readNumber, e);
        else if (REOPENS.has(e.event)) terminal.delete(e.readNumber);
      }
      const current = Math.max(fic.timesRead || 1, maxLogRead || 1);
      const inProgress = IN_PROGRESS.has(fic.status);

      // Earlier reads.
      for (let r = 1; r < current; r++) {
        const t = terminal.get(r);
        const usesDateRead = r === current - 1 && fic.status !== 'Read' && fic.dateRead;
        if (t) {
          const kind = TERMINAL[t.event];
          const date = kind === 'Read' && usesDateRead ? fic.dateRead : t.date;
          readings.push(makeReading(fic, r, kind, date, kind === 'Read' && !finishedFor.has(r), kind === 'DNF' ? t.chaptersRead : null, 'log'));
        } else {
          readings.push(makeReading(fic, r, 'Read', usesDateRead ? fic.dateRead : null, !finishedFor.has(r), null, usesDateRead ? 'dateRead' : 'timesRead'));
        }
      }

      // The current read.
      const tc = terminal.get(current);
      if (fic.status === 'Read') {
        const finEvent = [...evs].reverse().find(e => e.event === 'Finished' && e.readNumber === current);
        readings.push(makeReading(fic, current, 'Read', fic.dateRead || (finEvent && finEvent.date), !finishedFor.has(current), null, 'status'));
      } else if (fic.status === 'DNF') {
        const dnfEvent = tc && tc.event === 'DNF' ? tc : null;
        readings.push(makeReading(fic, current, 'DNF', fic.lastReadDate || (dnfEvent && dnfEvent.date), false, fic.chaptersRead || null, 'status'));
      } else if (!inProgress && tc) {
        logOnly++;
        const kind = TERMINAL[tc.event];
        readings.push(makeReading(fic, current, kind, tc.date, false, kind === 'DNF' ? tc.chaptersRead : null, 'logOnly'));
      }
    }
    readings.logOnly = logOnly;
    return readings;
  }

  // ------------------------------------------------------------------------------------------
  // 3. PERIODS — calendar periods in Australia/Melbourne. A reading counts toward the period that
  // contains its date. Undated readings only appear in "All time".
  // ------------------------------------------------------------------------------------------
  function melbourneToday(d) {
    const p = {};
    new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' })
      .formatToParts(d || new Date()).forEach(x => { if (x.type !== 'literal') p[x.type] = x.value; });
    return `${p.year}-${p.month}-${p.day}`;
  }
  const pad = (n) => String(n).padStart(2, '0');
  const ymd = (y, m, d) => `${y}-${pad(m)}-${pad(d)}`;
  const isoToUTC = (s) => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); };
  const utcToIso = (t) => new Date(t).toISOString().slice(0, 10);
  const addDays = (s, n) => utcToIso(isoToUTC(s) + n * 86400000);
  const dim = (y, m) => new Date(Date.UTC(y, m, 0)).getUTCDate();
  const monthShift = (y, m, k) => { const t = y * 12 + (m - 1) + k; return [Math.floor(t / 12), (t % 12 + 12) % 12 + 1]; };
  function monthsPeriod(y, m, len, unit) {
    const [ey, em] = monthShift(y, m, len - 1);
    return { unit, y, m, len, start: ymd(y, m, 1), end: ymd(ey, em, dim(ey, em)) };
  }
  // type: thisMonth | lastMonth | thisQuarter | thisYear | lastYear | all | custom
  function makePeriod(type, today, custom) {
    const [y, m] = today.split('-').map(Number);
    if (type === 'thisMonth') return { ...monthsPeriod(y, m, 1, 'month'), type, partial: true };
    if (type === 'lastMonth') { const [py, pm] = monthShift(y, m, -1); return { ...monthsPeriod(py, pm, 1, 'month'), type }; }
    if (type === 'thisQuarter') return { ...monthsPeriod(y, Math.floor((m - 1) / 3) * 3 + 1, 3, 'quarter'), type, partial: true };
    if (type === 'thisYear') return { ...monthsPeriod(y, 1, 12, 'year'), type, partial: true };
    if (type === 'lastYear') return { ...monthsPeriod(y - 1, 1, 12, 'year'), type };
    if (type === 'custom') {
      let start = custom && isIso(custom.start) ? custom.start : ymd(y, m, 1);
      let end = custom && isIso(custom.end) ? custom.end : today;
      if (start > end) [start, end] = [end, start];
      return { unit: 'days', type, start, end };
    }
    return { unit: 'all', type: 'all', start: null, end: null };
  }
  function shiftPeriod(p, k) {
    if (!p || p.unit === 'all') return null;
    if (p.unit === 'days') {
      const n = Math.round((isoToUTC(p.end) - isoToUTC(p.start)) / 86400000) + 1;
      return { ...p, start: addDays(p.start, k * n), end: addDays(p.end, k * n), partial: false };
    }
    const [ny, nm] = monthShift(p.y, p.m, k * p.len);
    return { ...monthsPeriod(ny, nm, p.len, p.unit), type: p.type, partial: false };
  }
  function sameLastYear(p) {
    if (!p || p.unit === 'all') return null;
    if (p.unit === 'days') {
      const back = (s) => { const [y, m, d] = s.split('-').map(Number); return ymd(y - 1, m, Math.min(d, dim(y - 1, m))); };
      return { ...p, start: back(p.start), end: back(p.end), partial: false };
    }
    return { ...monthsPeriod(p.y - 1, p.m, p.len, p.unit), type: p.type, partial: false };
  }
  const inPeriod = (date, p) => !p || p.unit === 'all' ? true : !!date && date >= p.start && date <= p.end;

  function fmtDay(iso, today) {
    if (!isIso(iso)) return '';
    const [y, m, d] = iso.split('-').map(Number);
    return `${d} ${MON[m - 1]}${today && String(y) === today.slice(0, 4) ? '' : ' ' + y}`;
  }
  function periodName(p, today) {
    if (!p) return '';
    const cy = today ? +today.slice(0, 4) : 0;
    if (p.unit === 'all') return 'all time';
    if (p.unit === 'month') return MONTHS[p.m - 1] + (p.y !== cy ? ' ' + p.y : '');
    if (p.unit === 'quarter') return `Q${Math.floor((p.m - 1) / 3) + 1} ${p.y}`;
    if (p.unit === 'year') return String(p.y);
    return `${fmtDay(p.start, today)} – ${fmtDay(p.end, today)}`;
  }

  // ------------------------------------------------------------------------------------------
  // 4. STATS for a period
  //   words     = sum of reading words (DNFs without Chapters Read add nothing; counted in dnfNoWords)
  //   finished  = Read readings; dnfs = DNF readings
  //   completion = finished ÷ (finished + dnfs), for readings dated in the period
  //   median    = median full length (Words) of finished readings — shown instead of a mean
  //   newAuthors = authors whose first dated reading falls in the period (all time: every author read)
  // ------------------------------------------------------------------------------------------
  function median(values) {
    if (!values.length) return null;
    const s = values.slice().sort((a, b) => a - b);
    const mid = Math.floor(s.length / 2);
    return s.length % 2 ? s[mid] : Math.round((s[mid - 1] + s[mid]) / 2);
  }
  function authorFirstDates(readings) {
    const first = new Map();
    for (const r of readings) for (const a of realAuthors(r.fic.authors)) {
      if (!first.has(a)) first.set(a, null);
      if (r.date && (first.get(a) === null || r.date < first.get(a))) first.set(a, r.date);
    }
    return first;
  }
  function periodStats(readings, p, authorFirst) {
    const rs = readings.filter(r => inPeriod(r.date, p));
    let words = 0, finished = 0, dnfs = 0, dnfNoWords = 0, est = 0;
    const lens = [], byFandom = {};
    for (const r of rs) {
      if (r.words !== null) { words += r.words; byFandom[r.fandom] = (byFandom[r.fandom] || 0) + r.words; }
      if (r.kind === 'Read') { finished++; lens.push(r.fic.words); if (r.est) est++; }
      else { dnfs++; if (r.words === null) dnfNoWords++; }
    }
    let newAuthors = 0;
    if (authorFirst) for (const [, d] of authorFirst) if (p && p.unit === 'all' ? true : (d && inPeriod(d, p))) newAuthors++;
    return {
      readings: rs, words, finished, dnfs, dnfNoWords, est, byFandom,
      completion: finished + dnfs ? finished / (finished + dnfs) : null,
      median: median(lens), newAuthors,
    };
  }

  // Month keys "YYYY-MM" from a to b inclusive.
  function monthKeys(a, b) {
    const out = [];
    let [y, m] = a.split('-').map(Number);
    const [by, bm] = b.split('-').map(Number);
    while (y < by || (y === by && m <= bm)) { out.push(`${y}-${pad(m)}`); [y, m] = monthShift(y, m, 1); }
    return out;
  }
  // Per-month totals across all dated readings (for charts). Undated readings are left out.
  function monthlySeries(readings, keys, fandomKeys) {
    const idx = new Map(keys.map((k, i) => [k, i]));
    const words = {}; fandomKeys.forEach(f => { words[f] = keys.map(() => 0); });
    const finished = keys.map(() => 0), dnfs = keys.map(() => 0);
    for (const r of readings) {
      if (!r.date) continue;
      const i = idx.get(r.date.slice(0, 7));
      if (i === undefined) continue;
      if (r.words !== null && words[r.fandom]) words[r.fandom][i] += r.words;
      if (r.kind === 'Read') finished[i]++; else dnfs[i]++;
    }
    const completion = keys.map((_, i) => finished[i] + dnfs[i] ? finished[i] / (finished[i] + dnfs[i]) : null);
    return { keys, words, finished, dnfs, completion };
  }
  function monthLabel(key, withYear) { const [y, m] = key.split('-').map(Number); return MON[m - 1] + (withYear ? ' ' + String(y).slice(2) : ''); }

  // AO3 archive warnings, excluded from "top tags" by default.
  const WARNING_TAGS = new Set([
    'No Archive Warnings Apply', 'Creator Chose Not To Use Archive Warnings', 'Author Chose Not To Use Archive Warnings',
    'Graphic Depictions Of Violence', 'Major Character Death', 'Rape/Non-Con', 'Underage', 'Underage Sex',
  ]);
  // Tags ranked by words read (DNFs without Chapters Read add no words).
  function topTags(readings, includeWarnings, limit) {
    const m = new Map();
    for (const r of readings) {
      if (r.words === null) continue;
      for (const t of new Set(r.fic.tags)) {
        if (!includeWarnings && WARNING_TAGS.has(t)) continue;
        const e = m.get(t) || { tag: t, words: 0, fics: new Set() };
        e.words += r.words; e.fics.add(r.ficKey); m.set(t, e);
      }
    }
    return [...m.values()].map(e => ({ tag: e.tag, words: e.words, fics: e.fics.size }))
      .sort((a, b) => b.words - a.words || b.fics - a.fics).slice(0, limit || 10);
  }
  // Authors ranked by distinct fics read, then words. Anonymous / orphan_account are left out.
  function authorRanking(readings) {
    const m = new Map();
    for (const r of readings) for (const a of realAuthors(r.fic.authors)) {
      const e = m.get(a) || { author: a, fics: new Set(), words: 0, readings: 0 };
      e.fics.add(r.ficKey); e.readings++; if (r.words !== null) e.words += r.words; m.set(a, e);
    }
    const list = [...m.values()].map(e => ({ author: e.author, fics: e.fics.size, words: e.words, readings: e.readings }));
    list.sort((a, b) => b.fics - a.fics || b.words - a.words || a.author.localeCompare(b.author));
    // Rank by fics read; authors with the same number of fics share a rank (1, 2, 2, 4).
    list.forEach((e, i) => { e.rank = i > 0 && list[i - 1].fics === e.fics ? list[i - 1].rank : i + 1; });
    return list;
  }

  // ------------------------------------------------------------------------------------------
  // 5. FILTERS (Library, Diary and Export all use this)
  // ------------------------------------------------------------------------------------------
  function emptyFilters() {
    return { q: '', fandoms: [], kinds: [], ratings: [], categories: [], tagsInc: [], tagsExc: [], author: '', enjoyment: [], from: '', to: '', est: 'all' };
  }
  function filterCount(f) {
    return f.fandoms.length + f.kinds.length + f.ratings.length + f.categories.length + f.tagsInc.length + f.tagsExc.length +
      (f.author ? 1 : 0) + f.enjoyment.length + (f.from ? 1 : 0) + (f.to ? 1 : 0) + (f.est !== 'all' ? 1 : 0);
  }
  function filterReadings(readings, f, opts) {
    const q = (f.q || '').trim().toLowerCase();
    const author = (f.author || '').trim().toLowerCase();
    return readings.filter(r => {
      const fic = r.fic;
      if (opts && opts.excludeE && fic.rating === 'E') return false;
      if (f.fandoms.length && !f.fandoms.includes(r.fandom)) return false;
      if (f.kinds.length && !f.kinds.includes(r.kind)) return false;
      if (f.ratings.length && !f.ratings.includes(fic.rating || '—')) return false;
      if (f.categories.length && !fic.categories.some(c => f.categories.includes(c))) return false;
      if (f.tagsInc.length && !f.tagsInc.every(t => fic.tags.includes(t) || fic.ships.includes(t))) return false;
      if (f.tagsExc.length && f.tagsExc.some(t => fic.tags.includes(t) || fic.ships.includes(t))) return false;
      if (author && !fic.authors.some(a => a.toLowerCase() === author)) return false;
      if (f.enjoyment.length && !f.enjoyment.includes(fic.enjoyment)) return false;
      if (f.from && !(r.date && r.date >= f.from)) return false;
      if (f.to && !(r.date && r.date <= f.to)) return false;
      if (f.est === 'est' && !r.est) return false;
      if (f.est === 'logged' && r.est) return false;
      if (q) {
        const hit = fic.title.toLowerCase().includes(q) || fic.authors.some(a => a.toLowerCase().includes(q)) ||
          fic.tags.some(t => t.toLowerCase().includes(q)) || fic.ships.some(t => t.toLowerCase().includes(q));
        if (!hit) return false;
      }
      return true;
    });
  }
  // Newest first; undated readings go last.
  function sortDiary(readings) {
    return readings.slice().sort((a, b) => {
      if (a.date && b.date) return b.date.localeCompare(a.date) || b.readNumber - a.readNumber || a.fic.title.localeCompare(b.fic.title);
      if (a.date) return -1; if (b.date) return 1;
      return a.fic.title.localeCompare(b.fic.title);
    });
  }

  // ------------------------------------------------------------------------------------------
  // 6. EXPORT rows (a flat diary: one row per reading)
  // ------------------------------------------------------------------------------------------
  function exportRow(r, fandomName) {
    const f = r.fic;
    return {
      'Date': r.date || '', 'Fandom': fandomName || r.fandom, 'Title': f.title, 'Author': f.authors.join(', '),
      'Result': r.kind === 'Read' ? 'Finished' : 'DNF', 'Read #': r.readNumber, 'Estimated': r.est ? 'Y' : '',
      'Words read': r.words === null ? '' : r.words, 'Words': f.words, 'Chapters': f.chapters,
      'DNF chapters read': r.dnfChapters || '', 'Enjoyment': f.enjoyment || '', 'K': f.kg ? 'Y' : '', 'B': f.bk ? 'Y' : '',
      'Rating': f.rating, 'Category': f.category, 'Tags': f.tags.join(', '), 'Relationships': f.ships.join(', '),
      'Date Published': f.datePublished, 'Status now': f.status, 'Times Read': f.timesRead || '', 'Link': f.link, 'Work ID': f.id,
    };
  }
  function toCSV(rows) {
    if (!rows.length) return '';
    const cols = Object.keys(rows[0]);
    const esc = (v) => { const s = String(v ?? ''); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    return [cols.join(','), ...rows.map(r => cols.map(c => esc(r[c])).join(','))].join('\r\n');
  }

  // ------------------------------------------------------------------------------------------
  // 7. MODEL: everything the screens need, built once per sync.
  // ------------------------------------------------------------------------------------------
  const REQUIRED_COLS = ['Status', 'Title', 'Link', 'Author', 'Words', 'Chapters', 'Date Read', 'Last Read', 'Chapters Read', 'Times Read'];
  function buildModel(fandomData, fandomList) {
    const fics = [], events = [], notes = [];
    for (const fd of fandomList) {
      const d = fandomData[fd.key];
      if (!d) { notes.push(`${fd.name}: not loaded yet.`); continue; }
      fics.push(...d.fics); events.push(...d.log);
      if (d.logMissing) notes.push(`${fd.name}: no "Reading Log" tab, so every Read fic there counts as estimated.`);

  }, [mode]);
  useEffect(() => {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const on = () => setTick(t => t + 1);
    mq.addEventListener ? mq.addEventListener('change', on) : mq.addListener(on);
    return () => { mq.removeEventListener ? mq.removeEventListener('change', on) : mq.removeListener(on); };
  }, []);
  const cycle = () => setMode(m => m === 'system' ? 'light' : m === 'light' ? 'dark' : 'system');
  return { mode, cycle, tick };
}

const PERIOD_OPTIONS = [['thisMonth', 'This month'], ['lastMonth', 'Last month'], ['thisQuarter', 'This quarter'], ['thisYear', 'This year'], ['lastYear', 'Last year'], ['all', 'All time'], ['custom', 'Custom']];

function headline(cur, prev, p, cp, today) {
  const name = R.periodName(p, today);
  const when = p.unit === 'all' ? 'in total' : (p.unit === 'days' ? `from ${name}` : `in ${name}`) + (p.partial ? ' so far' : '');
  if (!cur.finished && !cur.dnfs) return p.unit === 'all' ? 'No finished reads yet.' : `Nothing finished ${when} yet.`;
  let s = `You read ${fmtWords(cur.words)} words ${when}`;
  if (prev && cp) {
    const cname = R.periodName(cp, today);
    if (prev.words > 0) {
      const d = (cur.words - prev.words) / prev.words, pct = Math.round(Math.abs(d) * 100);
      s += pct === 0 ? `, about the same as ${cname}` : `, ${pct}% ${d > 0 ? 'more' : 'fewer'} than ${cname}`;
    } else if (cur.words > 0) s += `, up from none in ${cname}`;
  }
  const parts = Object.entries(cur.byFandom).filter(([, w]) => w > 0).sort((a, b) => b[1] - a[1]);
  const total = parts.reduce((t, [, w]) => t + w, 0);
  if (parts.length === 1 && total > 0) s += `, all ${fname(parts[0][0])}`;
  else if (parts.length > 1) s += parts[0][1] / total >= 0.6 ? `, mostly ${fname(parts[0][0])}` : `, split between ${fname(parts[0][0])} and ${fname(parts[1][0])}`;
  return s + '.';
}

function delta(cur, prev, kind) {
  if (prev === null || prev === undefined || cur === null || cur === undefined) return null;
  if (kind === 'pts') {
    const d = Math.round((cur - prev) * 100);
    return { text: d === 0 ? '±0 pts' : `${d > 0 ? '+' : '−'}${Math.abs(d)} pts`, dir: Math.sign(d) };
  }
  if (prev === 0) return cur === 0 ? { text: '±0', dir: 0 } : { text: 'new', dir: 1 };
  const d = (cur - prev) / prev, pct = Math.round(Math.abs(d) * 100);
  return { text: pct === 0 ? '±0%' : `${d > 0 ? '↑' : '↓'} ${pct}%`, dir: pct === 0 ? 0 : Math.sign(d) };
}

function StatTile({ label, value, d, good, spark, note, cmpLabel }) {
  const cls = !d ? '' : d.dir === 0 || good === null ? 'flat' : (d.dir > 0) === good ? 'pos' : 'neg';
  return html`<div className="tile">
    <div className="tile-label">${label}</div>
    <div className="tile-value serif num">${value}</div>
    ${note ? html`<div className="tile-note">${note}</div>` : null}
    <div className="tile-foot">
      ${d ? html`<span className=${'delta ' + cls} title=${cmpLabel ? 'vs ' + cmpLabel : ''}>${d.text}</span>` : html`<span></span>`}
      <${Sparkline} values=${spark} color=${cls === 'neg' ? 'var(--neg)' : 'var(--accent)'} />
    </div>
  </div>`;
}

function PeriodPicker({ period, setPeriod, custom, setCustom, compare, setCompare, today }) {

function CurrentlyReading({ model, onOpen }) {

function WordsPerMonth({ model, p, today, themeTick }) {
  const config = useMemo(() => {
    const t = chartTheme();
    let from, to;
    const nowKey = today.slice(0, 7);
    if (p.unit === 'all') { from = (model.firstDate || today).slice(0, 7); to = nowKey; }
    else {
      const endKey = p.end.slice(0, 7) > nowKey ? nowKey : p.end.slice(0, 7);
      const spanMonths = R.monthKeys(p.start.slice(0, 7), p.end.slice(0, 7)).length;
      if (spanMonths >= 3) { from = p.start.slice(0, 7); to = endKey; }
      else { const [y, m] = endKey.split('-').map(Number); const [sy, sm] = R.monthShift(y, m, -11); from = `${sy}-${String(sm).padStart(2, '0')}`; to = endKey; }
    }
    if (from > to) from = to;
    const keys = R.monthKeys(from, to);
    const s = R.monthlySeries(model.readings, keys, FANDOMS.map(f => f.key));
    const multiYear = keys[0].slice(0, 4) !== keys[keys.length - 1].slice(0, 4);
    return {
      type: 'bar',
      data: { labels: keys.map(k => R.monthLabel(k, multiYear)), datasets: FANDOMS.map((f, i) => ({ label: f.name, data: s.words[f.key], backgroundColor: t.fandom[f.key], borderRadius: topRadius(s.words, i), borderSkipped: false, maxBarThickness: 26, stack: 'w' })) },
      options: { responsive: true, maintainAspectRatio: false, animation: { duration: 250 }, interaction: { mode: 'index', intersect: false },
        plugins: { legend: { display: false }, tooltip: tooltip(t, c => ` ${c.dataset.label}: ${fmtWords(c.parsed.y)}`) },
        scales: baseScales(t, v => fmtWords(v)) },
    };
  }, [model, p.start, p.end, p.unit, today, themeTick]);
  return html`<div className="card">
    <${ChartBox} config=${config} height=${200} />
    <div className="legend">${FANDOMS.map(f => html`<span key=${f.key}><i style=${{ background: fcolor(f.key) }}></i>${f.name}</span>`)}</div>
  </div>`;
}

function TopTags({ stats, onTag }) {
  const [withWarnings, setWithWarnings] = useState(false);
  const tags = useMemo(() => R.topTags(stats.readings, withWarnings, 10), [stats, withWarnings]);
  const max = tags.length ? tags[0].words : 1;
  return html`<div className="card">
    <label className="check small" style=${{ marginBottom: 6, fontSize: 13 }}>
      <input type="checkbox" checked=${withWarnings} onChange=${e => setWithWarnings(e.target.checked)} /> Include AO3 warning tags
    </label>
    ${!tags.length ? html`<div className="empty">No tagged words in this period.</div>` : tags.map(t => html`<div className="hbar-row" key=${t.tag} onClick=${() => onTag(t.tag)} style=${{ cursor: 'pointer' }}>
      <span className="hbar-label">${t.tag}</span>
      <span className="hbar-val num">${fmtWords(t.words)} · ${t.fics} fic${t.fics === 1 ? '' : 's'}</span>
      <div className="hbar-track"><div style=${{ width: Math.max(2, t.words / max * 100) + '%', background: 'var(--accent)', borderRadius: 99 }}></div></div>
    </div>`)}
    ${stats.dnfNoWords ? html`<div className="tiny faint" style=${{ marginTop: 8 }}>${stats.dnfNoWords} DNF${stats.dnfNoWords === 1 ? '' : 's'} with no Chapters Read add no words here.</div>` : null}
  </div>`;
}

function FandomSplit({ stats, themeTick }) {
  const config = useMemo(() => {
    const t = chartTheme();
    const data = FANDOMS.map(f => stats.byFandom[f.key] || 0);
    return {
      type: 'doughnut',
      data: { labels: FANDOMS.map(f => f.name), datasets: [{ data, backgroundColor: FANDOMS.map(f => t.fandom[f.key]), borderColor: t.surface, borderWidth: 3, hoverOffset: 4 }] },
      options: { responsive: true, maintainAspectRatio: false, cutout: '70%', animation: { duration: 250 }, plugins: { legend: { display: false }, tooltip: tooltip(t, c => ` ${c.label}: ${fmtWords(c.parsed)}`) } },
    };
  }, [stats, themeTick]);
  const total = Object.values(stats.byFandom).reduce((a, b) => a + b, 0);
  const counts = {};
  stats.readings.forEach(r => { counts[r.fandom] = (counts[r.fandom] || 0) + 1; });
  return html`<div className="card" style=${{ display: 'grid', gridTemplateColumns: '120px 1fr', gap: 16, alignItems: 'center' }}>
    ${total ? html`<${ChartBox} config=${config} height=${120} />` : html`<div style=${{ width: 120, height: 120, borderRadius: '50%', border: '14px solid var(--surface-2)' }}></div>`}
    <div>
      ${FANDOMS.map(f => {
        const w = stats.byFandom[f.key] || 0;
        return html`<div key=${f.key} style=${{ padding: '4px 0' }}>
          <div className="row" style=${{ gap: 8, flexWrap: 'nowrap', justifyContent: 'space-between' }}>
            <span className="row" style=${{ gap: 8, flexWrap: 'nowrap' }}><i style=${{ width: 10, height: 10, borderRadius: 3, background: fcolor(f.key), display: 'inline-block' }}></i><b style=${{ fontWeight: 600 }}>${f.name}</b></span>
            <span className="num" style=${{ fontWeight: 600 }}>${total ? Math.round(w / total * 100) : 0}%</span>
          </div>
          <div className="tiny muted num" style=${{ paddingLeft: 18 }}>${fmtWords(w)} words · ${counts[f.key] || 0} read${(counts[f.key] || 0) === 1 ? '' : 's'}</div>

      })}

}

function RecentlyFinished({ stats, onOpen, today }) {

  if (!recent.length) return html`<div className="card empty">No finished fics in this period.</div>`;
  return html`<div className="hscroll">

      <div className="row" style=${{ gap: 6, justifyContent: 'space-between' }}><${FandomBadge} k=${r.fandom} />${r.est ? html`<${EstBadge} />` : null}</div>

      <div className="small muted" style=${{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>${r.fic.authors.join(', ')}</div>
      <div className="row" style=${{ justifyContent: 'space-between', marginTop: 'auto' }}>
        <span className="small faint">${r.date ? R.fmtDay(r.date, today) : 'No date'} · ${fmtWords(r.fic.words)}</span>
        ${r.fic.enjoyment ? html`<${Enjoy} n=${r.fic.enjoyment} />` : html`<span className="tiny faint">unrated</span>`}

}

function Dashboard({ model, today, themeTick, onOpen, onTag, dash, setDash }) {
  const { period, custom, compare } = dash;
  const p = useMemo(() => R.makePeriod(period, today, custom), [period, today, custom.start, custom.end]);
  const cp = useMemo(() => p.unit === 'all' ? null : compare === 'year' ? R.sameLastYear(p) : R.shiftPeriod(p, -1), [p, compare]);
  const cur = useMemo(() => R.periodStats(model.readings, p, model.authorFirst), [model, p]);
  const prev = useMemo(() => cp ? R.periodStats(model.readings, cp, model.authorFirst) : null, [model, cp]);
  // Sparklines: the 12 periods ending with this one (months for All time).
  const spark = useMemo(() => {
    const base = p.unit === 'all' ? R.makePeriod('thisMonth', today) : p;
    const list = [];
    for (let k = -11; k <= 0; k++) list.push(R.periodStats(model.readings, k === 0 ? base : R.shiftPeriod(base, k), model.authorFirst));
    return list;
  }, [model, p, today]);
  const sp = (fn) => spark.map(fn);
  const cmpLabel = cp ? R.periodName(cp, today) : '';
  const set = (patch) => setDash(d => ({ ...d, ...patch }));
  return html`<div>
    <h1 className="headline serif">${headline(cur, prev, p, cp, today)}</h1>
    <div className="small faint" style=${{ margin: '0 2px 14px' }}>${p.unit === 'all' ? 'Everything you’ve read, including undated reads.' : `${R.fmtDay(p.start, today)} – ${R.fmtDay(p.end, today)}${cp ? ` · compared with ${cmpLabel}` : ''}`}</div>
    <${PeriodPicker} period=${period} setPeriod=${v => set({ period: v })} custom=${custom} setCustom=${fn => setDash(d => ({ ...d, custom: fn(d.custom) }))} compare=${compare} setCompare=${v => set({ compare: v })} today=${today} />

    <div className="tiles" style=${{ marginTop: 16 }}>
      <${StatTile} label="Words read" value=${fmtWords(cur.words)} d=${prev && delta(cur.words, prev.words)} good=${true} spark=${sp(s => s.words)} cmpLabel=${cmpLabel}
        note=${cur.dnfNoWords ? `Leaves out ${cur.dnfNoWords} DNF${cur.dnfNoWords === 1 ? '' : 's'} with no chapters read` : null} />
      <${StatTile} label="Fics finished" value=${fmtInt(cur.finished)} d=${prev && delta(cur.finished, prev.finished)} good=${true} spark=${sp(s => s.finished)} cmpLabel=${cmpLabel}
        note=${cur.est ? `${cur.est} est.` : null} />
      <${StatTile} label="DNFs" value=${fmtInt(cur.dnfs)} d=${prev && delta(cur.dnfs, prev.dnfs)} good=${null} spark=${sp(s => s.dnfs)} cmpLabel=${cmpLabel} />
      <${StatTile} label="Completion rate" value=${fmtPct(cur.completion)} d=${prev && cur.completion !== null && prev.completion !== null ? delta(cur.completion, prev.completion, 'pts') : null} good=${true} spark=${sp(s => s.completion)} cmpLabel=${cmpLabel} />
      <${StatTile} label="New authors" value=${fmtInt(cur.newAuthors)} d=${prev && delta(cur.newAuthors, prev.newAuthors)} good=${true} spark=${sp(s => s.newAuthors)} cmpLabel=${cmpLabel} />
      <${StatTile} label="Median fic length" value=${cur.median === null ? '—' : fmtWords(cur.median)} d=${prev && cur.median !== null && prev.median !== null ? delta(cur.median, prev.median) : null} good=${null} spark=${sp(s => s.median)} cmpLabel=${cmpLabel}
        note="Words, finished fics" />
    </div>

    <${CurrentlyReading} model=${model} onOpen=${onOpen} />

    <div className="section">
      <div className="section-head"><h2 className="section-title">Words per month</h2></div>
      <${WordsPerMonth} model=${model} p=${p} today=${today} themeTick=${themeTick} />
    </div>
    <div className="section">
      <div className="section-head"><h2 className="section-title">Top tags by words read</h2></div>
      <${TopTags} stats=${cur} onTag=${onTag} />
    </div>
    <div className="section">
      <div className="section-head"><h2 className="section-title">Fandom split</h2><span className="small faint">by words</span></div>
      <${FandomSplit} stats=${cur} themeTick=${themeTick} />
    </div>
    <div className="section">
      <div className="section-head"><h2 className="section-title">Recently finished</h2></div>
      <${RecentlyFinished} stats=${cur} onOpen=${onOpen} today=${today} />
    </div>
  </div>`;
}

function TagPicker({ label, chosen, onAdd, onRemove, vocab, exclude, tone }) {
  const [q, setQ] = useState('');
  const sugg = useMemo(() => {
    const ql = q.trim().toLowerCase();
    const all = [...vocab.tags.entries()].filter(([t]) => !chosen.includes(t) && !exclude.includes(t) && (!ql || t.toLowerCase().includes(ql)));
    all.sort((a, b) => b[1] - a[1]);
    return all.slice(0, 6);
  }, [q, vocab, chosen, exclude]);
  return html`<div>
    <div className="flabel">${label}</div>
    ${chosen.length ? html`<div className="wrap-chips" style=${{ marginBottom: 8 }}>${chosen.map(t => html`<button key=${t} className="chip sm on" style=${tone ? { background: 'var(--neg)', borderColor: 'var(--neg)', color: '#fff' } : null} onClick=${() => onRemove(t)}>${t}<span className="x">✕</span></button>`)}</div>` : null}

    <div className="wrap-chips" style=${{ marginTop: 8 }}>${sugg.map(([t, n]) => html`<button key=${t} className="chip sm" onClick=${() => { onAdd(t); setQ(''); }}>${t} <span className="faint">${n}</span></button>`)}</div>

  const cats = [...model.vocab.categories].sort();

  const ChipSet = (field, items, labelOf) => html`<div className="wrap-chips">${items.map(v => html`<button key=${String(v)} className=${'chip sm' + (filters[field].includes(v) ? ' on' : '')} onClick=${() => toggle(field, v)}>${labelOf ? labelOf(v) : v}</button>`)}</div>`;
  return html`<div className="panel">
    <div><div className="flabel">Fandom</div>${ChipSet('fandoms', FANDOMS.map(f => f.key), fname)}</div>
    <div><div className="flabel">Status</div>${ChipSet('kinds', ['Read', 'DNF'], k => k === 'Read' ? 'Finished' : 'DNF')}</div>
    <div><div className="flabel">Logged or estimated</div>
      <div className="seg">${[['all', 'All'], ['logged', 'Logged'], ['est', 'Estimated']].map(([k, l]) => html`<button key=${k} className=${filters.est === k ? 'on' : ''} onClick=${() => setFilters(f => ({ ...f, est: k }))}>${l}</button>`)}</div>
    </div>
    <div><div className="flabel">Rating</div>${ChipSet('ratings', ratings)}</div>
    <div><div className="flabel">Category</div>${ChipSet('categories', cats)}</div>
    <div><div className="flabel">Enjoyment</div>${ChipSet('enjoyment', [5, 4, 3, 2, 1, 0], n => n ? `${n}/5` : 'Unrated')}</div>
    <div><div className="flabel">Date range</div>
      <div className="row">
        <input type="date" className="date-input" value=${filters.from} onChange=${e => setFilters(f => ({ ...f, from: e.target.value }))} aria-label="From date" />
        <span className="faint">to</span>

      <div className="small muted" style=${{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>${r.fic.authors.join(', ') || '—'} · ${fname(r.fandom)}</div>
      <div className="dmeta">
        <span className="num">${r.kind === 'DNF' ? (r.words === null ? `${fmtWords(r.fic.words)} · words not counted` : `${fmtWords(r.words)} of ${fmtWords(r.fic.words)}`) : fmtWords(r.words)}</span>
        <${Enjoy} n=${r.fic.enjoyment} />
        <${KB} fic=${r.fic} />
        ${r.kind === 'DNF' ? html`<span className="badge dnf">DNF</span>` : null}
        ${r.readNumber > 1 ? html`<span className="badge plain">${ordinal(r.readNumber)} read</span>` : null}
        ${r.est ? html`<${EstBadge} />` : null}
      </div>
    </div>
  </button>`;
}

function Diary({ readings, onOpen, today }) {
  const [limit, setLimit] = useState(60);
  useEffect(() => setLimit(60), [readings]);
  const sorted = useMemo(() => R.sortDiary(readings), [readings]);
  const shown = sorted.slice(0, limit);
  const groups = [];
  for (const r of shown) {
    const key = r.date ? r.date.slice(0, 7) : 'undated';
    if (!groups.length || groups[groups.length - 1].key !== key) groups.push({ key, items: [] });
    groups[groups.length - 1].items.push(r);
  }
  const counts = useMemo(() => { const c = {}; sorted.forEach(r => { const k = r.date ? r.date.slice(0, 7) : 'undated'; c[k] = (c[k] || 0) + 1; }); return c; }, [sorted]);
  if (!sorted.length) return html`<div className="card empty" style=${{ marginTop: 14 }}>Nothing matches these filters.</div>`;
  return html`<div>
    ${groups.map(g => html`<div key=${g.key}>
      <div className="month-head"><span>${g.key === 'undated' ? 'No date' : `${R.MONTHS[+g.key.slice(5) - 1]} ${g.key.slice(0, 4)}`}</span><span className="faint">${counts[g.key]}</span></div>
      <div className="diary">${g.items.map(r => html`<${DiaryRow} key=${r.id} r=${r} onOpen=${onOpen} />`)}</div>
    </div>`)}
    ${limit < sorted.length ? html`<button className="big-btn ghost" style=${{ marginTop: 14 }} onClick=${() => setLimit(l => l + 80)}>Show more (${sorted.length - limit} left)</button>` : null}
  </div>`;
}

function Library({ readings, onOpen, today, view, setView }) {
  const [limit, setLimit] = useState(48);
  useEffect(() => setLimit(48), [readings]);
  const fics = useMemo(() => {
    const m = new Map();
    for (const r of readings) {
      const e = m.get(r.ficKey) || { fic: r.fic, n: 0, last: null, kinds: new Set(), est: false };
      e.n++; e.kinds.add(r.kind); if (r.est) e.est = true;
      if (r.date && (!e.last || r.date > e.last)) e.last = r.date;
      m.set(r.ficKey, e);
    }
    return [...m.values()].sort((a, b) => (b.last || '').localeCompare(a.last || '') || a.fic.title.localeCompare(b.fic.title));
  }, [readings]);
  const shown = fics.slice(0, limit);
  const statusOf = (e) => e.fic.status === 'Read' || e.fic.status === 'DNF' ? e.fic.status : (e.kinds.has('Read') ? 'Read' : 'DNF');
  if (!fics.length) return html`<div className="card empty" style=${{ marginTop: 14 }}>Nothing matches these filters.</div>`;
  return html`<div>
    <div className="row" style=${{ justifyContent: 'space-between', margin: '14px 2px 10px' }}>
      <span className="small muted">${fmtInt(fics.length)} fic${fics.length === 1 ? '' : 's'}</span>
      <div className="seg">
        <button className=${view === 'cards' ? 'on' : ''} onClick=${() => setView('cards')} aria-label="Cards"><${Icon} name="grid" size=${15} /></button>
        <button className=${view === 'table' ? 'on' : ''} onClick=${() => setView('table')} aria-label="Table"><${Icon} name="table" size=${15} /></button>
      </div>
    </div>
    ${view === 'cards' ? html`<div className="lib-grid">${shown.map(e => html`<button key=${e.fic.key} className="lcard" style=${{ '--fc': fcolor(e.fic.fandom) }} onClick=${() => onOpen(e.fic.key)}>
        <div className="row" style=${{ gap: 6 }}><${FandomBadge} k=${e.fic.fandom} /><span className="badge rating">${e.fic.rating || '—'}</span>${statusOf(e) === 'DNF' ? html`<span className="badge dnf">DNF</span>` : null}${e.est ? html`<${EstBadge} />` : null}</div>
        <div className="mini-title">${e.fic.title}</div>
        <div className="small muted" style=${{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>${e.fic.authors.join(', ')}</div>
        <div className="row small faint" style=${{ gap: 8, marginTop: 'auto' }}>
          <span className="num">${fmtWords(e.fic.words)}</span><span>${e.fic.chapters} ch</span>
          ${e.n > 1 ? html`<span>${e.n}× read</span>` : null}
          <span>${e.last ? R.fmtDay(e.last, today) : 'no date'}</span>
          <${Enjoy} n=${e.fic.enjoyment} />
        </div>
      </button>`)}</div>`
    : html`<div className="table-wrap"><table>
        <thead><tr><th>Title</th><th>Fandom</th><th>Status</th><th>Last</th><th>Words</th><th>Enjoy</th><th>Rating</th><th>Reads</th></tr></thead>
        <tbody>${shown.map(e => html`<tr key=${e.fic.key} className="click" onClick=${() => onOpen(e.fic.key)}>
          <td className="t">${e.fic.title}<div className="tiny faint" style=${{ fontWeight: 400 }}>${e.fic.authors.join(', ')}</div></td>
          <td><span className="row" style=${{ gap: 6, flexWrap: 'nowrap' }}><i style=${{ width: 8, height: 8, borderRadius: 4, background: fcolor(e.fic.fandom), display: 'inline-block' }}></i>${fname(e.fic.fandom)}</span></td>
          <td>${statusOf(e) === 'Read' ? 'Finished' : 'DNF'}${e.est ? ' · est.' : ''}</td>
          <td className="num">${e.last ? R.fmtDay(e.last, today) : '—'}</td>
          <td className="num">${fmtWords(e.fic.words)}</td>
          <td>${e.fic.enjoyment ? e.fic.enjoyment + '/5' : '—'}</td>
          <td>${e.fic.rating || '—'}</td>
          <td className="num">${e.n}</td>
        </tr>`)}</tbody>
      </table></div>`}
    ${limit < fics.length ? html`<button className="big-btn ghost" style=${{ marginTop: 14 }} onClick=${() => setLimit(l => l + 60)}>Show more (${fics.length - limit} left)</button>` : null}
  </div>`;
}

function DiaryScreen({ model, filters, setFilters, onOpen, today, ui, setUi }) {
  const readings = useMemo(() => R.filterReadings(model.readings, filters), [model, filters]);
  const words = readings.reduce((t, r) => t + (r.words || 0), 0);
  const dnfNo = readings.filter(r => r.kind === 'DNF' && r.words === null).length;
  return html`<div>
    <div className="row" style=${{ justifyContent: 'space-between', margin: '10px 0 14px' }}>
      <div className="seg">
        <button className=${ui.sub === 'diary' ? 'on' : ''} onClick=${() => setUi(u => ({ ...u, sub: 'diary' }))}>Diary</button>
        <button className=${ui.sub === 'library' ? 'on' : ''} onClick=${() => setUi(u => ({ ...u, sub: 'library' }))}>Library</button>

      <span className="small faint num">${fmtInt(readings.length)} reads · ${fmtWords(words)} words</span>

function FicDetail({ ficKey, model, onClose, loadSummary, onAuthor, today }) {
  const fic = model.ficByKey.get(ficKey);
  const [sum, setSum] = useState({ state: 'loading', text: '' });
  useEffect(() => {
    let live = true;
    setSum({ state: 'loading', text: '' });
    if (fic) loadSummary(fic).then(t => live && setSum({ state: 'ok', text: t }), e => live && setSum({ state: e.needsAuth ? 'auth' : 'err', text: e.message }));
    return () => { live = false; };
  }, [ficKey]);
  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', onKey);
    document.body.style.overflow = 'hidden';
    return () => { document.removeEventListener('keydown', onKey); document.body.style.overflow = ''; };
  }, []);
  if (!fic) return null;
  const readings = model.readings.filter(r => r.ficKey === ficKey).sort((a, b) => a.readNumber - b.readNumber);
  const events = model.eventsByKey.get(ficKey) || [];
  const authorCtx = R.realAuthors(fic.authors).map(a => model.authors.find(x => x.author === a)).filter(Boolean);
  const meta = [
    ['Published', fic.datePublished || '—'], ['Words', fmtInt(fic.words)],
    ['Chapters', fic.chaptersPlanned === fic.chapters ? String(fic.chapters) : `${fic.chapters} / ${fic.chaptersPlanned ?? '?'}`], ['Rating', fic.rating || '—'],
    ['Category', fic.category], ['Status', fic.status || 'Unread'],
    ['Kudos', fmtInt(fic.kudos)], ['Bookmarks', fmtInt(fic.bookmarks)], ['Hits', fmtInt(fic.hits)], ['Comments', fmtInt(fic.comments)],
    ['Enjoyment', fic.enjoyment ? `${fic.enjoyment} / 5` : '—'], ['Kudos left · Bookmarked', `${fic.kg ? 'Yes' : 'No'} · ${fic.bk ? 'Yes' : 'No'}`],
    ['Date started', fic.dateStarted ? R.fmtDay(fic.dateStarted, today) : '—'], ['Date read', fic.dateRead ? R.fmtDay(fic.dateRead, today) : '—'],
    ['Last read', fic.lastRead || '—'], ['Times read', fic.timesRead ? String(fic.timesRead) : '—'],
  ];
  if (fic.dnrReason) meta.splice(6, 0, ['DNR reason', fic.dnrReason]);
  return html`<div className="sheet-back" onClick=${onClose}>
    <div className="sheet" onClick=${e => e.stopPropagation()} role="dialog" aria-modal="true" aria-label=${fic.title} style=${{ '--fc': fcolor(fic.fandom) }}>
      <div className="grab"></div>
      <div className="row" style=${{ justifyContent: 'space-between', flexWrap: 'nowrap' }}>
        <div className="row" style=${{ gap: 6 }}><${FandomBadge} k=${fic.fandom} /><span className="badge rating">${fic.rating || '—'}</span>${readings.some(r => r.est) ? html`<${EstBadge} />` : null}</div>
        <button className="icon-btn" onClick=${onClose} aria-label="Close"><${Icon} name="close" size=${16} /></button>
      </div>
      <h2 className="serif" style=${{ fontSize: 26, lineHeight: 1.18, margin: '14px 0 4px', fontWeight: 600 }}>${fic.title}</h2>
      <div className="muted">by ${fic.authors.length ? fic.authors.map((a, i) => html`<span key=${a}>${i ? ', ' : ''}<button className="link-btn" style=${{ fontSize: 15 }} onClick=${() => onAuthor(a)}>${a}</button></span>`) : '—'}</div>

      ${authorCtx.length ? html`<div className="card" style=${{ marginTop: 14, padding: 14 }}>
        ${authorCtx.map(a => html`<div key=${a.author} className="row" style=${{ justifyContent: 'space-between', flexWrap: 'nowrap', padding: '2px 0' }}>
          <span>${a.fics === 1 ? 'The only fic you’ve read by them' : a.rank === 1 ? 'Your most-read author' : `Your ${ordinal(a.rank)} most-read author`}${authorCtx.length > 1 ? html` <span className="faint">(${a.author})</span>` : null}</span>
          ${a.fics > 1 ? html`<button className="link-btn" onClick=${() => onAuthor(a.author)}>${a.fics} fics →</button>` : null}
        </div>`)}
      </div>` : null}

      <a className="big-btn" href=${fic.link} target="_blank" rel="noopener noreferrer" style=${{ marginTop: 14 }}>Open on AO3 <${Icon} name="ext" size=${16} /></a>

      <div className="section">
        <div className="section-head"><h3 className="section-title">Your reads</h3></div>
        <div className="card" style=${{ padding: '6px 16px' }}>
          ${readings.length ? readings.map(r => html`<div key=${r.id} className="row" style=${{ justifyContent: 'space-between', padding: '9px 0', borderTop: '1px solid var(--line)' }}>
            <span className="row" style=${{ gap: 8 }}><b style=${{ fontWeight: 600 }}>${ordinal(r.readNumber)} read</b>${r.kind === 'DNF' ? html`<span className="badge dnf">DNF</span>` : html`<span className="badge plain">Finished</span>`}${r.est ? html`<${EstBadge} />` : null}</span>
            <span className="small muted num">${r.date ? R.fmtDay(r.date, today) : 'no date'} · ${r.words === null ? 'words not counted' : fmtWords(r.words) + ' words'}${r.dnfChapters ? ` (${r.dnfChapters}/${fic.chapters} ch)` : ''}</span>
          </div>`) : html`<div className="empty" style=${{ padding: 14 }}>Not finished or DNF'd yet.</div>`}
        </div>
      </div>

      <div className="section"><div className="section-head"><h3 className="section-title">Details</h3></div>
        <div className="card"><div className="meta-grid">${meta.map(([k, v]) => html`<div key=${k}><b>${k}</b><span className="num">${v}</span></div>`)}</div></div>
      </div>

      ${fic.ships.length || fic.tags.length ? html`<div className="section"><div className="section-head"><h3 className="section-title">Tags</h3></div>
        <div>${fic.ships.map(t => html`<span key=${'s' + t} className="tagchip ship">${t}</span>`)}${fic.tags.map(t => html`<span key=${t} className="tagchip">${t}</span>`)}</div>
      </div>` : null}

      <div className="section"><div className="section-head"><h3 className="section-title">Summary</h3></div>
        <div className="card">
          ${sum.state === 'loading' ? html`<span className="faint">Loading summary…</span>` : sum.state === 'ok' ? (sum.text ? html`<div className="summary">${sum.text}</div>` : html`<span className="faint">No summary in the sheet.</span>`) : html`<span className="faint">${sum.text}</span>`}
        </div>
      </div>

      <div className="section"><div className="section-head"><h3 className="section-title">Reading Log</h3><span className="small faint">${events.length} event${events.length === 1 ? '' : 's'}</span></div>
        ${events.length ? html`<div className="card"><div className="timeline">${events.map(e => html`<div key=${e.seq} className=${'tl-item' + (e.event === 'Finished' ? ' fin' : e.event === 'DNF' ? ' dnf' : '')}>
            <div style=${{ fontWeight: 600 }}>${e.event}${e.readNumber > 1 ? html` <span className="faint" style=${{ fontWeight: 400 }}>· ${ordinal(e.readNumber)} read</span>` : null}</div>
            <div className="small muted num">${e.ts || 'no time'}${e.chaptersRead !== null ? ` · ${e.chaptersRead} / ${fic.chapters} ch` : ''}</div>
          </div>`)}</div></div>`
          : html`<div className="card small faint">No Reading Log events for this fic${readings.some(r => r.est) ? ' — it was backfilled from AO3, so its date is an estimate.' : '.'}</div>`}
      </div>
    </div>
  </div>`;
}

function TrendsScreen({ model, today, themeTick, onAuthor }) {
  const [by, setBy] = useState('fics');
  const keys = useMemo(() => R.monthKeys((model.firstDate || today).slice(0, 7), today.slice(0, 7)), [model, today]);
  const s = useMemo(() => R.monthlySeries(model.readings, keys, FANDOMS.map(f => f.key)), [model, keys]);
  const multiYear = keys[0].slice(0, 4) !== keys[keys.length - 1].slice(0, 4);
  const labels = keys.map(k => R.monthLabel(k, multiYear));
  const wordsCfg = useMemo(() => {
    const t = chartTheme();
    const sc = baseScales(t, v => fmtWords(v));
    sc.y1 = { position: 'right', beginAtZero: true, grid: { display: false }, border: { display: false }, ticks: { color: t.ink3, maxTicksLimit: 4, precision: 0, font: { size: 11 } } };
    return {
      type: 'bar',
      data: { labels, datasets: [
        ...FANDOMS.map((f, i) => ({ label: f.name, data: s.words[f.key], backgroundColor: t.fandom[f.key], borderRadius: topRadius(s.words, i), borderSkipped: false, stack: 'w', maxBarThickness: 26, order: 2 })),
        { type: 'line', label: 'Fics finished', data: s.finished, yAxisID: 'y1', borderColor: t.ink, backgroundColor: t.ink, borderWidth: 2, pointRadius: 2.5, cubicInterpolationMode: 'monotone', order: 1 },
      ] },
      options: { responsive: true, maintainAspectRatio: false, animation: { duration: 250 }, interaction: { mode: 'index', intersect: false },
        plugins: { legend: { display: false }, tooltip: tooltip(t, c => c.dataset.yAxisID === 'y1' ? ` Fics finished: ${c.parsed.y}` : ` ${c.dataset.label}: ${fmtWords(c.parsed.y)}`) }, scales: sc },
    };
  }, [s, themeTick]);
  const compCfg = useMemo(() => {
    const t = chartTheme();
    const sc = baseScales(t, v => Math.round(v * 100) + '%');
    sc.y.min = 0; sc.y.max = 1; sc.x.stacked = false; sc.y.stacked = false;
    return {
      type: 'line',
      data: { labels, datasets: [{ label: 'Completion', data: s.completion, borderColor: t.accent, backgroundColor: t.accent, pointRadius: 3, borderWidth: 2, cubicInterpolationMode: 'monotone', spanGaps: true }] },
      options: { responsive: true, maintainAspectRatio: false, animation: { duration: 250 },
        plugins: { legend: { display: false }, tooltip: tooltip(t, c => ` ${Math.round(c.parsed.y * 100)}% · ${s.finished[c.dataIndex]} finished, ${s.dnfs[c.dataIndex]} DNF`) }, scales: sc },
    };
  }, [s, themeTick]);
  const top = useMemo(() => model.authors.slice().sort((a, b) => by === 'fics' ? b.fics - a.fics || b.words - a.words : b.words - a.words || b.fics - a.fics).slice(0, 10), [model, by]);
  const max = top.length ? (by === 'fics' ? top[0].fics : top[0].words) : 1;
  const undated = model.readings.filter(r => !r.date).length;
  return html`<div>
    <h1 className="headline serif" style=${{ marginTop: 10 }}>Trends</h1>
    <div className="small faint" style=${{ margin: '0 2px' }}>Every dated read since ${model.firstDate ? R.fmtDay(model.firstDate, today) : '—'}.${undated ? ` ${undated} undated read${undated === 1 ? ' isn’t' : 's aren’t'} shown by month.` : ''}</div>
    <div className="section">
      <div className="section-head"><h2 className="section-title">Words and fics per month</h2></div>
      <div className="card">
        <${ChartBox} config=${wordsCfg} height=${230} />
        <div className="legend">${FANDOMS.map(f => html`<span key=${f.key}><i style=${{ background: fcolor(f.key) }}></i>${f.name} words</span>`)}<span><i style=${{ background: 'var(--ink)', height: 3, borderRadius: 2 }}></i>Fics finished</span></div>
      </div>
    </div>
    <div className="section">
      <div className="section-head"><h2 className="section-title">Completion rate by month</h2></div>
      <div className="card"><${ChartBox} config=${compCfg} height=${180} /></div>
    </div>
    <div className="section">
      <div className="section-head"><h2 className="section-title">Top authors</h2>
        <div className="seg"><button className=${by === 'fics' ? 'on' : ''} onClick=${() => setBy('fics')}>By fics</button><button className=${by === 'words' ? 'on' : ''} onClick=${() => setBy('words')}>By words</button></div>
      </div>
      <div className="card">
        ${top.length ? top.map((a, i) => html`<div className="hbar-row" key=${a.author} onClick=${() => onAuthor(a.author)} style=${{ cursor: 'pointer' }}>
          <span className="hbar-label"><span className="faint num" style=${{ display: 'inline-block', width: 22 }}>${i + 1}</span>${a.author}</span>
          <span className="hbar-val num">${by === 'fics' ? `${a.fics} fic${a.fics === 1 ? '' : 's'} · ${fmtWords(a.words)}` : `${fmtWords(a.words)} · ${a.fics} fic${a.fics === 1 ? '' : 's'}`}</span>
          <div className="hbar-track"><div style=${{ width: Math.max(2, (by === 'fics' ? a.fics : a.words) / max * 100) + '%', background: 'var(--accent)', borderRadius: 99 }}></div></div>
        </div>`) : html`<div className="empty">No authors yet.</div>`}
      </div>
    </div>
    <div className="section">
      <div className="section-head"><h2 className="section-title">Shelves by status</h2></div>
      <div className="table-wrap"><table>
        <thead><tr><th>Status</th>${FANDOMS.map(f => html`<th key=${f.key}>${f.name}</th>`)}</tr></thead>
        <tbody>${Object.keys(model.statusCounts).sort((a, b) => model.statusCounts[b] - model.statusCounts[a]).map(st => html`<tr key=${st}>
          <td>${st}${st !== '(blank)' && !R.KNOWN_STATUSES.includes(st) ? html` <span className="badge est">other</span>` : null}</td>
          ${FANDOMS.map(f => html`<td key=${f.key} className="num">${fmtInt(model.fics.filter(x => x.fandom === f.key && (x.status || '(blank)') === st).length)}</td>`)}
        </tr>`)}</tbody>
      </table></div>
    </div>
  </div>`;
}
