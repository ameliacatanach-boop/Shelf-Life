function GoalForm({ model, today, initial, onSave, onCancel, busy }) {
  const editing = !!(initial && initial.id);
  const [type, setType] = useState(initial ? initial.type : 'finished');
  const [scope, setScope] = useState(initial ? initial.scope : '');
  const [target, setTarget] = useState(initial ? String(initial.target) : '');
  const [kind, setKind] = useState(editing ? 'custom' : 'month');
  const [custom, setCustom] = useState({ start: initial ? initial.start : today, end: initial ? initial.end : today });
  const scopes = useMemo(() => model.fandomList.flatMap(f => [{ key: 'f:' + f.name, label: f.short + ' (all pairings)' }, ...f.pairings.filter(p => p.readings).map(p => ({ key: 'p:' + p.key, label: `${f.short} › ${p.name}` }))]), [model]);
  const per = kind === 'custom' ? { start: custom.start, end: custom.end } : R.goalPeriod(kind, today);
  const n = Number(target);
  const valid = n > 0 && (type !== 'completion' || n <= 100) && (type !== 'scoped' || scope) && per.start && per.end && per.start <= per.end;
  const save = () => valid && onSave({ ...(initial || {}), type, scope: type === 'scoped' ? scope : '', target: n, start: per.start, end: per.end });
  return html`<div className="card goal-form">
    <div className="flabel">${editing ? 'Edit goal' : 'New goal'}</div>
    ${editing ? html`<div className="small muted">${(R.GOAL_TYPES.find(t => t.key === type) || {}).label}</div>` : html`<select className="plain-input" value=${type} onChange=${e => setType(e.target.value)} aria-label="Goal type">
      ${R.GOAL_TYPES.map(t => html`<option key=${t.key} value=${t.key}>${t.label}</option>`)}</select>`}
    ${type === 'scoped' && !editing ? html`<select className="plain-input" value=${scope} onChange=${e => setScope(e.target.value)} aria-label="Fandom or pairing">
      <option value="">Choose a fandom or pairing…</option>${scopes.map(s => html`<option key=${s.key} value=${s.key}>${s.label}</option>`)}</select>` : null}
    <label className="small" style=${{ fontWeight: 700 }}>Target ${type === 'completion' ? '(%)' : `(${GOAL_UNIT[type]})`}
      <input className="plain-input" style=${{ marginTop: 6 }} type="number" inputMode="numeric" min="1" max=${type === 'completion' ? 100 : null} value=${target} onChange=${e => setTarget(e.target.value)} placeholder=${type === 'words' ? 'e.g. 1000000' : type === 'completion' ? 'e.g. 70' : 'e.g. 40'} aria-label="Target" />
      ${type === 'words' && n > 0 ? html`<span className="tiny faint">${fmtWords(n)} words</span>` : null}</label>
    ${editing ? null : html`<div className="seg full" role="group" aria-label="Period">${[['month', 'This month'], ['quarter', 'This quarter'], ['year', 'This year'], ['custom', 'Dates']].map(([k, l]) => html`<button key=${k} className=${kind === k ? 'on' : ''} onClick=${() => setKind(k)}>${l}</button>`)}</div>`}
    ${kind === 'custom' ? html`<div className="row" style=${{ flexWrap: 'nowrap' }}>
      <input type="date" className="date-input" style=${{ flex: 1, minWidth: 0 }} value=${custom.start} onChange=${e => setCustom(c => ({ ...c, start: e.target.value }))} aria-label="Start date" />
      <input type="date" className="date-input" style=${{ flex: 1, minWidth: 0 }} value=${custom.end} onChange=${e => setCustom(c => ({ ...c, end: e.target.value }))} aria-label="End date" />
    </div>` : html`<div className="tiny faint">${per.start ? R.rangeLabel(per.start, per.end, today) : ''}</div>`}
    <div className="row" style=${{ flexWrap: 'nowrap' }}>
      <button className="big-btn" disabled=${!valid || busy} onClick=${save}>${busy ? 'Saving…' : editing ? 'Save changes' : 'Add goal'}</button>
      <button className="big-btn ghost" onClick=${onCancel}>Cancel</button>
    </div>
  </div>`;
}

function GoalCard({ g, model, today, store, onEdit, past }) {
  const pr = R.goalProgress(g, model, today);
  const tone = pr.status === 'met' || pr.status === 'done' ? 'lime' : pr.status === 'missed' ? 'coral' : pr.status === 'behind pace' ? 'pink' : null;
  return html`<div className="card goal-card">
    <${Ring} pct=${pr.pct} color=${goalColor(g, model)} size=${70} faded=${past && !pr.met}><span className="num">${ringInner(g, pr)}</span></${Ring}>
    <div style=${{ minWidth: 0, flex: 1 }}>
      <div className="row" style=${{ justifyContent: 'space-between', flexWrap: 'nowrap', alignItems: 'flex-start' }}>
        <div className="goal-name" style=${{ fontSize: 15 }}>${R.describeGoal(g, model)}</div>
        ${tone ? html`<span className="badge" style=${{ background: `var(--${tone})`, color: 'var(--on-bright)' }}>${pr.status}</span>` : html`<span className="badge plain">${pr.status}</span>`}
      </div>
      <div className="tiny faint" style=${{ marginTop: 2 }}>${goalPeriodLabel(g, today)}${g.archived ? ' · archived' : ''}</div>
      <div className="small" style=${{ marginTop: 6, fontWeight: 600 }}>${goalPace(g, pr, today)}</div>
      ${store.editable ? html`<div className="row" style=${{ marginTop: 4 }}>
        ${!past ? html`<button className="link-btn" onClick=${() => onEdit(g)}>Edit</button>` : null}
        <button className="link-btn" onClick=${() => store.archiveGoal(g.id, !g.archived)}>${g.archived ? 'Restore' : 'Archive'}</button>
        ${past ? html`<button className="link-btn" onClick=${() => store.deleteGoal(g.id)}>Delete</button>` : null}
      </div>` : null}
    </div>
  </div>`;
}

function GoalsScreen({ model, today, store, onBack, p4 }) {
  const placeN = p4 ? p4.nudges.filter(n => n.where.includes('goals') && R.nudgeVisible(n, store.nudgeTypes, store.dismissed, today)) : [];
  const [form, setForm] = useState(null);   // null | {} (new) | goal (edit)
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const current = store.goals.filter(g => !g.archived && g.end >= today).sort((a, b) => a.end.localeCompare(b.end));
  const past = store.goals.filter(g => g.archived || g.end < today).sort((a, b) => b.end.localeCompare(a.end));
  const save = async (g) => { setBusy(true); setErr(''); try { await store.saveGoal(g); setForm(null); } catch (e) { setErr('Couldn’t save: ' + (e.message || e)); } finally { setBusy(false); } };
  return html`<div>
    <${BackHead} title="Goals" onBack=${onBack} label="Back to Dashboard" />
    <div className="small faint" style=${{ margin: '8px 2px 12px' }}>Progress uses the same numbers as the dashboard. Each goal has fixed dates. Pace compares your progress with how much of the period has gone.</div>
    <${StorageNotice} store=${store} />
    <${NudgeList} list=${placeN} store=${store} today=${today} />
    ${err ? html`<div className="banner err">${err}</div>` : null}
    ${form ? html`<div style=${{ marginTop: 12 }}><${GoalForm} model=${model} today=${today} initial=${form.id ? form : null} onSave=${save} onCancel=${() => setForm(null)} busy=${busy} /></div>`
      : store.editable ? html`<button className="big-btn" style=${{ marginTop: 12 }} onClick=${() => setForm({})}><span aria-hidden="true">+</span> Add a goal</button>` : null}
    <div className="section">
      <div className="section-head"><h2 className="section-title">Current</h2><span className="small faint">${current.length}</span></div>
      ${current.length ? html`<div className="goal-list">${current.map(g => html`<${GoalCard} key=${g.id} g=${g} model=${model} today=${today} store=${store} onEdit=${setForm} />`)}</div>` : html`<div className="card empty">No current goals.</div>`}
    </div>
    ${past.length ? html`<div className="section">
      <div className="section-head"><h2 className="section-title">Past and archived</h2><span className="small faint">${past.length}</span></div>
      <div className="goal-list">${past.map(g => html`<${GoalCard} key=${g.id} g=${g} model=${model} today=${today} store=${store} past=${true} />`)}</div>
    </div>` : null}
  </div>`;
}

// ---------- Badges ----------
function BadgesScreen({ model, today, onBack, p4 }) {
  const b = useMemo(() => R.badges(model, today), [model, today]);
  const placeN = p4 ? p4.nudges.filter(n => n.where.includes('badges') && R.nudgeVisible(n, p4.store.nudgeTypes, p4.store.dismissed, today)) : [];
  const groups = [];
  b.list.forEach(x => { let g = groups.find(y => y.name === x.group); if (!g) groups.push(g = { name: x.group, items: [] }); g.items.push(x); });
  const earned = b.list.filter(x => x.earned).length;
  const TONE = ['lime', 'pink', 'coral', 'blue'];
  return html`<div>
    <${BackHead} title="Badges" onBack=${onBack} label="Back to Dashboard" />
    <${Finding} text=${`You’ve earned ${earned} of ${b.list.length} badges.${b.recent.length ? ` New this week: ${b.recent.map(x => x.title).join(', ')}.` : ''}`} />
    ${placeN.length ? html`<div className="nudge-list" style=${{ marginBottom: 12 }}>${placeN.map(n => html`<${NudgeCard} key=${n.id} n=${n} store=${p4.store} today=${today} />`)}</div>` : null}
    <div className="tiny faint" style=${{ margin: '-4px 2px 4px' }}>Progress counts every read, like All time. The date is when you crossed the line, from your dated reads; est. means that read’s date was backfilled.</div>
    ${groups.map((g, gi) => html`<div key=${g.name} className="section">
      <div className="section-head"><h2 className="section-title">${g.name}</h2><span className="small faint">${g.items.filter(x => x.earned).length} of ${g.items.length}</span></div>
      <div className="badge-grid">${g.items.map((x, i) => x.earned
        ? html`<div key=${x.key} className="badge-card">
            <div className="row" style=${{ justifyContent: 'space-between', flexWrap: 'nowrap' }}><span className=${'value-chip' + (TONE[(gi + i) % 4] === 'blue' ? ' blue' : '')} style=${{ background: `var(--${TONE[(gi + i) % 4]})` }}>${x.title}</span>${x.est ? html`<${EstBadge} />` : null}</div>
            <div className="small muted">${x.rule}</div>
            <div className="tiny faint">${x.dateUnknown ? 'Date unknown (undated reads)' : x.date ? 'Earned ' + R.fmtDay(x.date, today) : ''}</div>
          </div>`
        : html`<div key=${x.key} className="badge-card locked">
            <div className="badge-lock-title">${x.title}</div>
            <div className="small muted">${x.rule}</div>
            ${x.threshold > 1 && x.value !== undefined && x.group !== 'Range' && x.key !== 'allyear' && !String(x.key).startsWith('streak') && !String(x.key).startsWith('month80') ? html`<div className="bar-track" style=${{ marginTop: 2 }}><div className="bar-fill" style=${{ width: Math.min(100, x.value / x.threshold * 100) + '%', background: 'var(--ink-2)' }}></div></div>` : null}
            <div className="tiny faint">${x.progressText}</div>
          </div>`)}</div>
    </div>`)}
  </div>`;
}

// ---------- Notes: monthly reflection card + editor ----------
function NoteEditor({ store, period, prompt, onDone, autoFocus, cancelLabel }) {
  const existing = store.notes.find(n => n.period === period);
  const [text, setText] = useState(existing ? existing.text : '');
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const save = async () => { setBusy(true); setErr(''); try { await store.saveNote(period, text); onDone && onDone(); } catch (e) { setErr('Couldn’t save: ' + (e.message || e)); } finally { setBusy(false); } };
  return html`<div className="note-editor">
    <textarea className="note-input" rows="4" value=${text} onChange=${e => setText(e.target.value)} placeholder=${prompt} aria-label=${prompt} autoFocus=${autoFocus} disabled=${!store.editable && !busy}></textarea>
    <div className="row" style=${{ flexWrap: 'nowrap' }}>
      <button className="big-btn" disabled=${busy || !store.editable || (!text.trim() && !existing)} onClick=${save}>${busy ? 'Saving…' : !text.trim() && existing ? 'Delete note' : 'Save note'}</button>
      ${onDone ? html`<button className="big-btn ghost" onClick=${onDone}>${cancelLabel || 'Cancel'}</button>` : null}
    </div>
    ${err ? html`<div className="tiny" style=${{ color: 'var(--dnf-strike)' }}>${err}</div>` : null}
  </div>`;
}
function ReflectionCard({ model, today, store }) {
  const month = R.reflectionWindow(today);
  const info = useMemo(() => month ? R.reflectionFor(model, month) : null, [model, month]);
  const [editing, setEditing] = useState(false);
  if (!month || !info) return null;
  const note = store.notes.find(n => n.period === month);
  return html`<div className="card reflect">
    <div className="tiny" style=${{ letterSpacing: '.06em', textTransform: 'uppercase', fontWeight: 800 }}>Reflect on ${R.monthName(month)}</div>
    <div className="small" style=${{ fontWeight: 700, marginTop: 6 }}>${info.stat}</div>
    <div style=${{ fontSize: 19, fontWeight: 800, letterSpacing: '-0.3px', marginTop: 4 }}>${info.prompt}</div>
    ${note && !editing ? html`<div className="note-quote">“${R.noteExcerpt(note.text)}”</div>
        ${store.editable ? html`<button className="link-btn" onClick=${() => setEditing(true)}>Edit note</button>` : null}`
      : store.status === 'ready' ? html`<div style=${{ marginTop: 10 }}><${NoteEditor} store=${store} period=${month} prompt=${info.prompt} onDone=${note ? () => setEditing(false) : null} /></div>`
      : html`<div style=${{ marginTop: 10 }}><${StorageNotice} store=${store} compact=${true} /></div>`}
  </div>`;
}
function NotesList({ store, today }) {
  const [edit, setEdit] = useState(null);
  const notes = store.notes.slice().sort((a, b) => String(b.period).localeCompare(String(a.period)));
  const label = (p) => String(p).length === 4 ? `${p} (year)` : R.monthName(p);
  return html`<div className="card">
    ${notes.length ? notes.map(n => html`<div key=${n.period} className="set-row" style=${{ display: 'block' }}>
      <div className="row" style=${{ justifyContent: 'space-between', flexWrap: 'nowrap' }}><b style=${{ fontWeight: 700 }}>${label(n.period)}</b>
        ${store.editable && edit !== n.period ? html`<button className="link-btn" onClick=${() => setEdit(n.period)}>Edit</button>` : null}</div>
      ${edit === n.period ? html`<${NoteEditor} store=${store} period=${n.period} prompt=${String(n.period).length === 4 ? R.yearPrompt(n.period) : 'Your note'} onDone=${() => setEdit(null)} />`
        : html`<div className="small muted" style=${{ marginTop: 2 }}>${R.noteExcerpt(n.text)}</div>`}
    </div>`) : html`<div className="small muted">No notes yet. The dashboard asks for one at the end of each month, and a year’s recap asks for one too.</div>`}
  </div>`;
}

// ---------- Diversity (Trends tab) ----------
function DiversityTab({ model, today, themeTick }) {
  const ctx = useContext(TagCtx);
  const all = useMemo(() => R.diversityByYear(model.readings, ctx.isVisible, model), [model, ctx.isVisible]);
  const years = all.map(d => d.year);
  const [year, setYear] = useState(() => years.includes(+today.slice(0, 4)) ? +today.slice(0, 4) : years[years.length - 1]);
  const [dim, setDim] = useState('author');
  const cur = all.find(d => d.year === year);
  const finding = cur ? R.diversityFinding(cur, all.find(d => d.year === year - 1) || null, model) : 'No dated reads yet.';
  const scored = all.filter(d => d.enough);
  const cfg = useMemo(() => {
    if (scored.length < 2) return null;
    const t = chartTheme(); const sc = baseScales(t); sc.x.stacked = false; sc.y.stacked = false; sc.y.min = 0; sc.y.max = 100;
    return { type: 'line', data: { labels: scored.map(d => String(d.year)), datasets: R.DIVERSITY_DIMS.map((dd, i) => ({ label: dd.label, data: scored.map(d => d.dims[i].score), borderColor: CAT(i), backgroundColor: CAT(i), borderDash: i >= 5 ? [5, 4] : undefined, pointStyle: i >= 5 ? 'rectRot' : 'circle', tension: .3, pointRadius: i >= 5 ? 4 : 3 })) },
      options: { responsive: true, maintainAspectRatio: false, animation: { duration: 250 }, plugins: { legend: { display: true, position: 'bottom', labels: { boxWidth: 10, boxHeight: 10, usePointStyle: true, color: t.ink2 } }, tooltip: tooltip(t, c => ` ${c.dataset.label}: ${c.parsed.y}`) }, scales: sc } };
  }, [all, themeTick]);
  if (!cur) return html`<div className="card empty">Variety scores appear once you have dated reads.</div>`;
  const d = cur.dims.find(x => x.key === dim);
  const prevDim = (k) => { const p = all.find(x => x.year === year - 1); return p && p.enough ? p.dims.find(x => x.key === k) : null; };
  const tones = ['c-blue', 'c-lime', 'c-coral', 'c-pink', '', ''];
  return html`<div>
    <${TSection} title="Variety" right=${html`<span className="small faint">0 = all one thing · 100 = evenly spread</span>`} finding=${finding}>
      ${years.length > 1 ? html`<div style=${{ marginBottom: 8 }}><${YearChips} years=${years} value=${year} onChange=${setYear} /></div>` : null}
      ${!cur.enough ? html`<div className="card logged-empty"><div className="title">Not enough reads in ${year} to score</div>
          <div className="small muted" style=${{ marginTop: 6 }}>Variety needs ${R.MIN_DIVERSITY} dated reads in a year.</div>
          <div className="tiny faint" style=${{ marginTop: 8 }}>Based on ${cur.readings} dated read${cur.readings === 1 ? '' : 's'} in ${year}</div></div>`
      : html`<div className="tiles">${cur.dims.map((x, i) => { const p = prevDim(x.key); const dd = p ? x.score - p.score : null;
          return html`<button key=${x.key} className=${'tile div-tile ' + tones[i] + (dim === x.key ? ' picked' : '')} onClick=${() => setDim(x.key)} aria-pressed=${dim === x.key}>
            <div className="tile-label">${x.label}</div>
            <div className="tile-value num">${x.score}<span className="small" style=${{ fontWeight: 700, letterSpacing: 0, opacity: .75 }}> /100</span></div>
            <div className="tile-foot"><span className="tile-note">${x.k <= 1 ? `Only one ${x.label.toLowerCase()}` : `${fmtInt(x.k)} ${x.key === 'length' ? 'bands' : x.key === 'tag' ? 'tags' : x.label.toLowerCase() + 's'}`}</span>
              ${dd !== null ? html`<span className="delta">${dd > 0 ? '▲ ' + dd : dd < 0 ? '▼ ' + Math.abs(dd) : '='}</span>` : null}</div>
          </button>`; })}</div>
        <div className="tiny faint" style=${{ marginTop: 8 }}>Scores weigh each ${'category'} by words read (normalised Shannon entropy). Based on ${cur.readings} dated reads in ${year}${prevDim('author') ? `; arrows compare with ${year - 1}` : ''}.${ctx.include ? '' : ' Sex-related tags are left out of the tag score.'}</div>`}
    </${TSection}>
    ${cur.enough ? html`<${TSection} title=${`${d.label} breakdown, ${year}`} finding=${d.breakdown}>
      <div className="card">${d.rows.map(r => html`<div key=${r.key} className="hbar-row">
        <span className="hbar-label">${r.name}</span><span className="hbar-val num">${Math.round(r.share * 100)}% · ${fmtWords(Math.round(r.words))}</span>
        <div className="hbar-track"><div style=${{ width: Math.max(2, r.share / (d.rows[0].share || 1) * 100) + '%', background: 'var(--blue)', borderRadius: 99 }}></div></div>
      </div>`)}
      ${d.k > d.rows.length ? html`<div className="tiny faint" style=${{ marginTop: 6 }}>Top ${d.rows.length} of ${fmtInt(d.k)}</div>` : null}</div>
    </${TSection}>` : null}
    <${TSection} title="Variety by year" finding=${cfg ? '' : 'The year-by-year chart appears once two years each have ' + R.MIN_DIVERSITY + '+ dated reads.'}>
      ${cfg ? html`<div className="card"><${ChartBox} config=${cfg} height=${240} /></div>` : null}
    </${TSection}>
  </div>`;
}

      </div>

          <b style=${{ fontWeight: 600 }}>${b.label}</b><span className="small muted num">${b.wpm === null ? `${b.n} session${b.n === 1 ? '' : 's'} · not enough` : `${fmtInt(b.wpm)} wpm · ${b.n} sessions`}</span></div>`)}

// ============================================================================================
// PHASE 4: UP NEXT, NUDGES, MORE
// Rankings and nudges come from ShelfRules (upNextRank, pageNudges, ficNudges). Snoozes and
// dismissals are saved only through useShelfStore → writeShelfData() (Settings tab). Shelf Life
// never changes a fic's status: "Open in app" sends you to the fandom app for that.
// ============================================================================================
const SNOOZE_DAYS = 30, DISMISS_DAYS = 14;
const appFor = (fic) => SOURCE_BY_ID[fic.source] || {};
const appLabel = (fic) => `Open in ${shortName(appFor(fic).fandom)} app`;
const shortName = (fandom) => R.shortFandom(fandom || '');

// ---------- nudges ----------
function NudgeCard({ n, store, today, onOpen, compact }) {
  const [why, setWhy] = useState(false);
  const [busy, setBusy] = useState(false);
  const canDismiss = store.status === 'ready';
  const dismiss = async () => { setBusy(true); try { await store.dismiss(n.id, R.addDays(today, DISMISS_DAYS)); } catch (e) {} finally { setBusy(false); } };
  return html`<div className=${'nudge t-' + n.type + (compact ? ' compact' : '')}>
    <div className="nudge-text">${n.text}</div>
    <div className="nudge-nums">${n.numbers.map((x, i) => html`<span key=${i}><b>${x.label}</b> ${x.value}</span>`)}</div>
    ${n.pick ? html`<button className="nudge-pick" onClick=${() => onOpen && onOpen(n.pick.key)}><span className="tiny" style=${{ fontWeight: 800 }}>${n.type === 'fandom-gap' ? 'Top pick' : 'The fic'}</span> ${n.pick.fic.title}</button>` : null}
    <div className="row nudge-actions">
      ${n.link ? html`<a className="link-btn" href=${n.link.href} target="_blank" rel="noopener">${n.link.label}</a>` : null}
      <button className="link-btn" onClick=${() => setWhy(w => !w)} aria-expanded=${why}>Why am I seeing this?</button>
      ${canDismiss ? html`<button className="link-btn" disabled=${busy} onClick=${dismiss}>Dismiss</button>` : null}
    </div>
    ${why ? html`<div className="tiny nudge-why">${n.why}${canDismiss ? ` Dismissing hides it for ${DISMISS_DAYS} days.` : ' Dismissing needs goals and notes turned on (Settings), since it’s saved to Shelf Life Data.'}</div>` : null}
  </div>`;
}
function NudgeList({ list, store, today, onOpen, title }) {
  if (!list.length) return null;
  return html`<div className="section">

// Card nudges (long-fic, dnf-tag) for one fic, filtered by switches and dismissals.
function useFicNudges(fic, p4) {
  return useMemo(() => fic ? R.ficNudges(fic, p4.nctx).filter(n => R.nudgeVisible(n, p4.store.nudgeTypes, p4.store.dismissed, p4.today)) : [], [fic, p4.nctx, p4.store.nudgeTypes, p4.store.dismissed, p4.today]);
}

// ---------- Up Next cards ----------
function whyChips(p) {
  const extras = p.reasons.filter(r => r.key === 'rec');
  if (p.goToAuthor) extras.push({ key: 'goto', text: `A ${p.goToAuthor.author} fic (you’ve read ${p.goToAuthor.read})` });
  extras.push(...p.reasons.filter(r => r.key === 'rotation'));
  return [...p.reasons.filter(r => r.key === 'top' || r.key === 'length'), ...extras].slice(0, 3);
}
function UpNextCard({ p, p4, onOpen, rank }) {
  const f = p.fic, store = p4.store;
  const nn = useFicNudges(f, p4);
  const [busy, setBusy] = useState(false);

  const app = appFor(f);
  const snooze = async () => {
    if (store.status !== 'ready') { setMsg('“Not now” needs goals and notes turned on (Settings), because snoozes are saved to Shelf Life Data.'); return; }
    setBusy(true); try { await store.snooze(f.key, R.addDays(p4.today, SNOOZE_DAYS)); } catch (e) { setMsg('Couldn’t snooze: ' + (e.message || e)); } finally { setBusy(false); }
  };
  const unsnooze = async () => { setBusy(true); try { await store.unsnooze(f.key); } catch (e) {} finally { setBusy(false); } };
  return html`<div className="up-card">
    <button className="up-main" onClick=${() => onOpen(f.key)}>
      <div className="row" style=${{ justifyContent: 'space-between', flexWrap: 'nowrap', alignItems: 'flex-start' }}>
        <div style=${{ minWidth: 0 }}>
          <div className="dtitle">${rank ? html`<span className="up-rank num">${rank}</span>` : null}${f.title}</div>
          <div className="small muted" style=${{ marginTop: 2 }}>${f.authors.join(', ') || 'Anonymous'}</div>
        </div>
        <span className="up-score num" title="Up Next score">${Math.round(p.upNextScore)}</span>
      </div>
      <${SourceLine} fic=${f} mode="one" style=${{ marginTop: 6 }} />
      <div className="dmeta">
        <span className="num">${fmtWords(f.words)} words</span><span className="num">${f.chapters}/${f.chaptersPlanned === null ? '?' : f.chaptersPlanned} ch</span>
        ${f.rating ? html`<span className="badge rating">${f.rating}</span>` : null}
        ${f.status === 'TBR' ? html`<span className="badge" style=${{ background: 'var(--blue)', color: 'var(--on-blue)' }}>TBR</span>` : null}
        ${f.recommended ? html`<span className="badge" style=${{ background: 'var(--lime)', color: 'var(--on-bright)' }}>Recommended</span>` : null}
        ${p.snoozedUntil ? html`<span className="badge est">Snoozed until ${R.fmtDay(p.snoozedUntil, p4.today)}</span>` : null}
      </div>
      <div className="why-chips">${whyChips(p).map(r => html`<span key=${r.key} className=${'why why-' + r.key}>${r.text}</span>`)}</div>
    </button>

    <div className="up-actions">
      <a className="pill-btn" href=${f.link} target="_blank" rel="noopener">Open on AO3 <${Icon} name="ext" size=${13} /></a>
      ${app.appUrl ? html`<a className="pill-btn" href=${app.appUrl} target="_blank" rel="noopener">${appLabel(f)}</a>` : null}
      ${p.snoozedUntil ? html`<button className="pill-btn" disabled=${busy} onClick=${unsnooze}>Bring back</button>`
        : html`<button className="pill-btn" disabled=${busy} onClick=${snooze} title=${store.status === 'ready' ? `Hide for ${SNOOZE_DAYS} days` : 'Needs goals and notes turned on'}>Not now</button>`}
    </div>
    ${msg ? html`<div className="tiny faint" style=${{ marginTop: 6 }}>${msg}</div>` : null}

}
function UpNextStrip({ p4, onOpen, openUpNext }) {

// ---------- Up Next screen ----------
const UP_PAGE = 20;
function UpNextScreen({ p4, model, onOpen }) {
  const ctx = useContext(TagCtx);
  const [flt, setFlt] = useState({ scope: null, length: null, tbrOnly: false, tagsInc: [], tagsExc: [], showSnoozed: false });
  const [open, setOpen] = useState(false);
  const [limit, setLimit] = useState(UP_PAGE);
  const set = (patch) => { setFlt(f => ({ ...f, ...patch })); setLimit(UP_PAGE); };
  const list = useMemo(() => R.filterUpNext(p4.up.picks, flt), [p4.up, flt]);
  const nSnoozed = p4.up.picks.filter(p => p.snoozedUntil).length;
  const scopes = useMemo(() => {
    const byF = new Map();
    for (const p of p4.up.picks) { const f = p.fic; if (!byF.has(f.fandom)) byF.set(f.fandom, new Map()); const m = byF.get(f.fandom); m.set(f.pairingKey, (m.get(f.pairingKey) || 0) + 1); }
    const out = [];
    for (const [fandom, pairs] of byF) {
      out.push({ key: 'f:' + fandom, label: shortName(fandom), color: fandomColor(fandom) });
      if (pairs.size > 1) [...pairs].sort((a, b) => b[1] - a[1]).slice(0, 8).forEach(([pk]) => out.push({ key: 'p:' + pk, label: (model.pairingByKey.get(pk) || {}).name || pk, color: pairingColor(model, pk), sub: true }));
    }
    return out;
  }, [p4.up, model]);
  const vocab = useMemo(() => { const tags = new Map(); for (const p of p4.up.picks) for (const t of p.fic.tags) tags.set(t, (tags.get(t) || 0) + 1); return { tags }; }, [p4.up]);
  const pageN = p4.nudges.filter(n => n.where.includes('upnext') && R.nudgeVisible(n, p4.store.nudgeTypes, p4.store.dismissed, p4.today));
  const nf = (flt.tagsInc.length ? 1 : 0) + (flt.tagsExc.length ? 1 : 0);
  const ls = p4.up.lengthStats;
  return html`<div>
    <h1 className="page-title">Up Next</h1>
    <div className="small faint" style=${{ margin: '0 2px 10px' }}>Unread and TBR fics from all your fandoms, ranked by each app’s own score (as a percentile within its fandom) and how often you finish fics that long. Shelf Life never changes a status; use the fandom app for that.</div>
    <${NudgeList} list=${pageN} store=${p4.store} today=${p4.today} onOpen=${onOpen} />
    <div className="chips" style=${{ marginTop: 6 }}>
      <button className=${'chip sm' + (!flt.scope ? ' on' : '')} onClick=${() => set({ scope: null })}>All fandoms</button>
      ${scopes.map(o => html`<button key=${o.key} className=${'chip sm' + (flt.scope === o.key ? ' on' : '')} onClick=${() => set({ scope: flt.scope === o.key ? null : o.key })}><span className="cdot" style=${{ background: o.color }}></span>${o.label}</button>`)}
    </div>
    <div className="seg full" role="group" aria-label="Length" style=${{ marginTop: 4 }}>
      ${[[null, 'Any length'], ['short', 'Short tonight'], ['medium', 'Medium'], ['long', 'Long haul']].map(([k, l]) => html`<button key=${String(k)} className=${flt.length === k ? 'on' : ''} onClick=${() => set({ length: k })}>${l}</button>`)}
    </div>
    <div className="chips" style=${{ marginTop: 6 }}>
      <button className=${'chip sm' + (flt.tbrOnly ? ' on' : '')} onClick=${() => set({ tbrOnly: !flt.tbrOnly })}>TBR only</button>
      <button className=${'chip sm' + (open || nf ? ' on' : '')} onClick=${() => setOpen(o => !o)}><${Icon} name="filter" size=${14} /><span style=${{ marginLeft: 6 }}>Tags</span>${nf ? ` · ${flt.tagsInc.length + flt.tagsExc.length}` : ''}</button>
      ${nSnoozed ? html`<button className=${'chip sm' + (flt.showSnoozed ? ' on' : '')} onClick=${() => set({ showSnoozed: !flt.showSnoozed })}>Show snoozed (${nSnoozed})</button>` : null}
    </div>
    ${open ? html`<div className="panel">
      <${TagPicker} label="Must have" chosen=${flt.tagsInc} vocab=${vocab} exclude=${flt.tagsExc} onAdd=${t => set({ tagsInc: [...flt.tagsInc, t] })} onRemove=${t => set({ tagsInc: flt.tagsInc.filter(x => x !== t) })} />
      <${TagPicker} label="Leave out" tone="dark" chosen=${flt.tagsExc} vocab=${vocab} exclude=${flt.tagsInc} onAdd=${t => set({ tagsExc: [...flt.tagsExc, t] })} onRemove=${t => set({ tagsExc: flt.tagsExc.filter(x => x !== t) })} />
      <${SexTagToggle} compact=${true} />
    </div>` : null}
    <div className="row" style=${{ justifyContent: 'space-between', margin: '12px 2px 8px' }}>
      <span className="small faint num">${fmtInt(list.length)} pick${list.length === 1 ? '' : 's'}</span>
      <span className="tiny faint">You finish ${Math.round(ls.overall * 100)}% of fics overall</span>
    </div>
    ${list.length ? html`<div className="up-list">${list.slice(0, limit).map((p, i) => html`<${UpNextCard} key=${p.key} p=${p} p4=${p4} onOpen=${onOpen} rank=${i + 1} />`)}</div>
      <${ShowMore} total=${list.length} shown=${Math.min(limit, list.length)} onMore=${() => setLimit(l => l + UP_PAGE * 2)} />`
      : html`<div className="card empty">${p4.up.picks.length ? 'Nothing matches these filters.' : 'No unread or TBR fics with an app score yet.'}</div>`}
    <details className="card tiny faint up-how" style=${{ marginTop: 16 }}><summary style=${{ fontWeight: 800, cursor: 'pointer' }}>How the ranking works</summary>
      <p>Each fic’s app score is the score its fandom app shows. Shelf Life turns it into a percentile among that fandom’s unread and TBR fics, so the fandoms are comparable.</p>
      <p>That percentile is multiplied by 0.6 + 0.4 × (how often you finish fics this length ÷ how often you finish fics overall) and capped at 100. Your length rate is pulled towards your overall rate when a length has few closed reads: (finished + 5 × overall) ÷ (closed + 5).</p>
      <p>Then +5 if the fic is Recommended in its app, and +5 if you haven’t read in its fandom for 21+ days. There’s no author boost, because the app score already includes the authors you like.</p>
    </details>
  </div>`;
}

}

function ScoreCheck({ model, scores, onBack }) {
  // The fandom apps open on Unread fics sorted by Score, so the first 5 here are the first 5 there.
  const bySource = useMemo(() => SOURCES.map(src => {
    const fics = model.fics.filter(f => f.source === src.id && !['Read', 'DNF', 'Skipped', 'Not Interested', 'Currently Reading', 'TBR', 'Paused'].includes(f.status) && scores.has(f.key));
    fics.sort((a, b) => scores.get(b.key).score - scores.get(a.key).score);

  }), [model, scores]);
  return html`<div>
    <${BackHead} title="Score check" onBack=${onBack} label="Back to Settings" />

          <span className="value-chip" style=${{ background: 'var(--lime)', fontSize: 15, padding: '4px 10px' }}>${Math.round(scores.get(f.key).score)}</span>
        </div>`)}<div className="tiny faint" style=${{ marginTop: 6 }}>Scored across all ${fmtInt(total)} rows of this Sheet, as the app does.</div></div>`
        : html`<div className="card empty">${total ? 'No Unread fics in this Sheet.' : 'This Sheet hasn’t loaded yet.'}</div>`}
    </div>`)}
  </div>`;
}

// Export / import overrides as a JSON file, to carry them between devices.
function OverrideFileButtons() {
  const ctx = useContext(TagCtx);
  const fileRef = useRef(null);
  const [msg, setMsg] = useState('');
  const doExport = () => {
    const out = { app: 'shelf-life', kind: 'tag-overrides', version: 1, exportedAt: new Date().toISOString(), overrides: ctx.overrides };
    download(`shelf-life-tag-overrides-${R.melbourneToday()}.json`, JSON.stringify(out, null, 2), 'application/json');
    setMsg(`Exported ${Object.keys(ctx.overrides).length} override${Object.keys(ctx.overrides).length === 1 ? '' : 's'}.`);
  };
  const doImport = (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(String(reader.result));
        const src = data && typeof data === 'object' && data.overrides && typeof data.overrides === 'object' ? data.overrides : data;
        const clean = {};
        for (const [k, v] of Object.entries(src || {})) if (['sexual', 'unsure', 'general'].includes(v) && String(k).trim()) clean[String(k).trim().toLowerCase()] = v;
        const n = Object.keys(clean).length;
        if (!n) { setMsg('No overrides found in that file.'); return; }
        ctx.saveOverrides({ ...ctx.overrides, ...clean });
        setMsg(`Imported ${n} override${n === 1 ? '' : 's'} (merged with the ones already here; the file wins on clashes).`);
      } catch (err) { setMsg('That file isn’t a Shelf Life overrides file.'); }
    };
    reader.readAsText(file);
  };
  return html`<div>
    <div className="row">
      <button className="pill-btn" onClick=${doExport}>Export overrides</button>
      <button className="pill-btn" onClick=${() => fileRef.current && fileRef.current.click()}>Import overrides</button>
      <input ref=${fileRef} type="file" accept="application/json,.json" style=${{ display: 'none' }} onChange=${doImport} aria-label="Import overrides file" />
    </div>
    ${msg ? html`<div className="tiny muted" style=${{ marginTop: 8 }}>${msg}</div>` : null}
  </div>`;
}

// Every tag the rules class as sexual or unsure (plus any you've changed), most frequent first.
function TagReview({ model, onBack }) {
  const ctx = useContext(TagCtx);
  const [q, setQ] = useState('');
  const [show, setShow] = useState('all');
  const [limit, setLimit] = useState(80);
  const list = useMemo(() => [...model.tagInfo.values()]
    .filter(i => i.cls !== 'general' || ctx.overrides[i.tag.toLowerCase()])
    .sort((a, b) => b.count - a.count || a.tag.localeCompare(b.tag)), [model, ctx.overrides]);
  const ql = q.trim().toLowerCase();
  const rows = list.filter(i => {
    const eff = effectiveClass(i, ctx.overrides), changed = !!ctx.overrides[i.tag.toLowerCase()];
    if (show === 'changed' ? !changed : show !== 'all' && eff !== show) return false;
    return !ql || i.tag.toLowerCase().includes(ql);
  });
  useEffect(() => setLimit(80), [q, show]);
  const setClass = (info, cls) => {
    const key = info.tag.toLowerCase(), next = { ...ctx.overrides };
    if (cls === info.cls) delete next[key]; else next[key] = cls;   // only differences from the rules are stored
    ctx.saveOverrides(next);
  };
  const LABEL = { sexual: 'Sexual', unsure: 'Unsure', general: 'General' };
  return html`<div>
    <div className="row" style=${{ marginTop: 10, gap: 10, flexWrap: 'nowrap' }}>
      <button className="icon-btn" onClick=${onBack} aria-label="Back to Settings"><${Icon} name="back" size=${18} /></button>
      <h1 className="page-title" style=${{ margin: 0 }}>Tag review</h1>
    </div>
    <div className="small faint" style=${{ margin: '8px 2px 12px' }}>Your choice beats the rules. Unsure tags count as general until you decide. ${ctx.synced ? 'Synced to Shelf Life Data, so every device gets them. Export / Import still work as a backup.' : 'Saved on this device; turn on goals and notes to sync them, or use Export / Import to copy them.'}</div>
    <div className="search-wrap"><${Icon} name="search" size=${17} /><input className="text-input" value=${q} onChange=${e => setQ(e.target.value)} placeholder="Search tags" aria-label="Search tags" /></div>
    <div className="chips" style=${{ marginTop: 10 }}>
      ${[['all', 'All'], ['sexual', 'Sexual'], ['unsure', 'Unsure'], ['general', 'General'], ['changed', 'Changed by you']].map(([k, l]) => html`<button key=${k} className=${'chip sm' + (show === k ? ' on' : '')} onClick=${() => setShow(k)}>${l}</button>`)}
    </div>
    <div className="card" style=${{ marginTop: 12, padding: '4px 16px' }}>
      ${!rows.length ? html`<div className="empty">No tags here.</div>` : rows.slice(0, limit).map(i => {
        const eff = effectiveClass(i, ctx.overrides), changed = !!ctx.overrides[i.tag.toLowerCase()];
        return html`<div className="tr-row" key=${i.tag}>
          <div className="tr-tag">${i.tag}</div>
          <div className="tiny faint">${fmtInt(i.count)} fic${i.count === 1 ? '' : 's'} · ${i.rule || 'no rule matched'}${changed ? html` · <span style=${{ color: 'var(--blue)', fontWeight: 700 }}>changed (rule says ${LABEL[i.cls].toLowerCase()})</span>` : ''}</div>
          <div className="row" style=${{ gap: 10 }}>
            <div className="seg sm" role="radiogroup" aria-label=${`Class for ${i.tag}`}>
              ${['sexual', 'unsure', 'general'].map(c => html`<button key=${c} role="radio" aria-checked=${eff === c} className=${(eff === c ? 'on ' : '') + 'cls-' + c} onClick=${() => setClass(i, c)}>${LABEL[c]}</button>`)}
            </div>
            ${changed ? html`<button className="link-btn" onClick=${() => setClass(i, i.cls)}>Reset</button>` : null}
          </div>
        </div>`;
      })}
    </div>
    ${limit < rows.length ? html`<button className="big-btn ghost" style=${{ marginTop: 14 }} onClick=${() => setLimit(l => l + 120)}>Show more (${fmtInt(rows.length - limit)} left)</button>` : null}
    <div className="card" style=${{ marginTop: 14 }}><${OverrideFileButtons} /></div>
  </div>`;
}

function Mark({ size }) {
  const s = size || 22;
  const fandoms = [...new Set(SOURCES.map(x => x.fandom))];
  const three = [0, 1, 2].map(i => fandoms[i % fandoms.length]);
  return html`<span className="mark" style=${{ width: s, height: s, borderRadius: s * 0.32 }}>${three.map((f, i) => html`<span key=${i} style=${{ background: fandomColor(f) }}></span>`)}</span>`;
}

// ============================================================================================
// ROOT
// ============================================================================================
// ---------- Shelf Life Data (goals, notes, synced tag overrides) ----------
// status: 'off' (never switched on here) | 'connecting' | 'ready' | 'unavailable' (switched on,
// but storage can't be reached: goals and notes show the copy on this device, read-only).
const MERGED_LOCAL_KEY = 'shelflife-overrides-merged';
const NUDGE_TYPES_LOCAL_KEY = 'shelflife-nudge-types';   // nudge on/off when Shelf Life Data isn't connected
// Settings keys "snoozes" and "dismissed" hold { key: until date }; expired entries are dropped on save.
const pruneUntil = (m, today) => Object.fromEntries(Object.entries(m || {}).filter(([, v]) => typeof v === 'string' && v >= today));
const nowStamp = () => new Date().toISOString();
const newId = () => 'g' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function useShelfStore(auth, localOverrides) {
  const [st, setSt] = useState(() => {
    let on = false; try { on = localStorage.getItem(STORAGE_FLAG_KEY) === '1'; } catch (e) {}
    let localTypes = {}; try { localTypes = JSON.parse(localStorage.getItem(NUDGE_TYPES_LOCAL_KEY) || '{}') || {}; } catch (e) {}
    return { status: on ? 'unavailable' : 'off', message: on ? 'Connecting to Shelf Life Data…' : '', id: null, goals: [], notes: [], overrides: null, saving: false, cachedAt: null, created: false,
      snoozes: {}, dismissed: {}, nudgeTypes: localTypes };
  });
  const stRef = useRef(st); useEffect(() => { stRef.current = st; }, [st]);
  const localRef = useRef(localOverrides); useEffect(() => { localRef.current = localOverrides; }, [localOverrides]);
  const queue = useRef(Promise.resolve());
  const busy = useRef(false);

  const cache = (d) => idb.put(SHELF_CACHE_KEY, { goals: d.goals, notes: d.notes, overrides: d.overrides, snoozes: d.snoozes, dismissed: d.dismissed, nudgeTypes: d.nudgeTypes, at: Date.now(), id: d.id });
  useEffect(() => { idb.get(SHELF_CACHE_KEY).then(c => { if (c && stRef.current.status !== 'ready') setSt(s => ({ ...s, goals: c.goals || [], notes: c.notes || [], snoozes: c.snoozes || {}, dismissed: c.dismissed || {}, nudgeTypes: c.nudgeTypes || s.nudgeTypes, cachedAt: c.at || null })); }); }, []);

  const fail = (e) => {
    if (e && e.isAuthError) { auth.expire(); setSt(s => ({ ...s, status: 'unavailable', saving: false, message: 'Your Google sign-in expired. Sign in again to use goals and notes.' })); return; }
    setSt(s => ({ ...s, status: 'unavailable', saving: false, message: 'Goals and notes are unavailable right now (' + ((e && e.message) || 'storage could not be reached') + '). Everything else still works.' }));
  };

  const connect = useCallback(async (interactive) => {
    if (busy.current) return;
    busy.current = true;
    try {
      let tok = auth.hasDrive() ? auth.getToken() : null;
      if (!tok) {
        if (!interactive) { if (stRef.current.status !== 'off') setSt(s => ({ ...s, status: 'unavailable', message: 'Sign in to use goals and notes.' })); return; }
        try { localStorage.setItem(STORAGE_FLAG_KEY, '1'); } catch (e) {}
        setSt(s => ({ ...s, status: 'connecting', message: '' }));
        try { await auth.signIn({ withDrive: true }); } catch (e) { setSt(s => ({ ...s, status: 'unavailable', message: 'Sign-in didn’t finish, so goals and notes are off for now.' })); return; }
        if (!auth.hasDrive()) { setSt(s => ({ ...s, status: 'unavailable', message: 'Google didn’t grant access to Shelf Life’s own files, so goals and notes are off. Try again and tick that permission.' })); return; }
        tok = auth.getToken();
      }
      setSt(s => ({ ...s, status: 'connecting', message: '' }));
      const { id, created } = await connectShelfData(tok);
      let d = parseShelfData(await readShelfData(tok, id));
      // First connect on this device: fold in the overrides saved here (only tags the Sheet lacks).
      let merged = false; try { merged = localStorage.getItem(MERGED_LOCAL_KEY) === id; } catch (e) {}
      if (!merged) {
        const local = localRef.current || {};
        const add = Object.keys(local).filter(k => !(k in d.overrides));
        if (add.length) {
          const next = { ...d.overrides }; add.forEach(k => { next[k] = local[k]; });
          await writeSettings(tok, id, d.settingsRows, { tagOverrides: JSON.stringify(next) });
          d = { ...d, overrides: next };
        }
        try { localStorage.setItem(MERGED_LOCAL_KEY, id); } catch (e) {}
      }
      // Nudge on/off choices made on this device before connecting are kept unless the Sheet has its own.
      if (!Object.keys(d.nudgeTypes).length && Object.keys(stRef.current.nudgeTypes || {}).length) {
        await writeSettings(tok, id, d.settingsRows, { nudgeTypes: JSON.stringify(stRef.current.nudgeTypes) });
        d = { ...d, nudgeTypes: { ...stRef.current.nudgeTypes } };
      }
      const next = { status: 'ready', message: '', id, goals: d.goals, notes: d.notes, overrides: d.overrides, snoozes: d.snoozes, dismissed: d.dismissed, nudgeTypes: d.nudgeTypes, saving: false, cachedAt: Date.now(), created };
      setSt(next); cache(next);
    } catch (e) { fail(e); }
    finally { busy.current = false; }
  }, [auth.hasDrive, auth.getToken, auth.signIn, auth.expire]);

  // Reconnect quietly whenever a sign-in with drive.file is available.
  const tokKey = auth.tok && auth.tok.token;
  useEffect(() => { if (stRef.current.status !== 'off' && stRef.current.status !== 'ready' && auth.hasDrive()) connect(false); }, [tokKey]);

  // Each save re-reads the tab, applies the change to the fresh rows (merge by row), then writes.
  const mutate = useCallback((fn) => {
    const run = async () => {
      const s0 = stRef.current;
      if (s0.status !== 'ready' || !s0.id) throw new Error('Goals and notes are unavailable right now.');
      const tok = auth.hasDrive() ? auth.getToken() : null;
      if (!tok) { const e = new Error('expired'); e.isAuthError = true; throw e; }
      setSt(s => ({ ...s, saving: true }));
      const fresh = parseShelfData(await readShelfData(tok, s0.id));
      const res = await fn(tok, s0.id, fresh);
      const next = { ...stRef.current, snoozes: fresh.snoozes, dismissed: fresh.dismissed, nudgeTypes: fresh.nudgeTypes, ...res, saving: false, status: 'ready', cachedAt: Date.now() };
      setSt(next); cache(next);
    };
    const p = queue.current.then(run, run);
    queue.current = p.catch(() => {});
    return p.catch(e => { fail(e); throw e; });
  }, [auth.hasDrive, auth.getToken]);

  const saveGoal = useCallback((goal) => mutate(async (tok, id, fresh) => {
    const g = { ...goal, id: goal.id || newId(), created: goal.created || nowStamp(), updated: nowStamp() };
    const goals = fresh.goals.some(x => x.id === g.id) ? fresh.goals.map(x => x.id === g.id ? g : x) : [...fresh.goals, g];
    await writeShelfData(tok, id, { type: 'replaceTab', tab: 'Goals', rows: goals.map(goalToRow) });
    return { goals, notes: fresh.notes, overrides: fresh.overrides };
  }), [mutate]);
  const archiveGoal = useCallback((gid, archived) => mutate(async (tok, id, fresh) => {
    const goals = fresh.goals.map(x => x.id === gid ? { ...x, archived, updated: nowStamp() } : x);
    await writeShelfData(tok, id, { type: 'replaceTab', tab: 'Goals', rows: goals.map(goalToRow) });
    return { goals, notes: fresh.notes, overrides: fresh.overrides };
  }), [mutate]);
  const deleteGoal = useCallback((gid) => mutate(async (tok, id, fresh) => {
    const goals = fresh.goals.filter(x => x.id !== gid);
    await writeShelfData(tok, id, { type: 'replaceTab', tab: 'Goals', rows: goals.map(goalToRow) });
    return { goals, notes: fresh.notes, overrides: fresh.overrides };
  }), [mutate]);
  // A note per period ('2026-09' or '2026'). Saving empty text deletes it.
  const saveNote = useCallback((period, text) => mutate(async (tok, id, fresh) => {
    const t = String(text || '').trim();
    const old = fresh.notes.find(n => n.period === period);
    const notes = !t ? fresh.notes.filter(n => n.period !== period)
      : old ? fresh.notes.map(n => n.period === period ? { ...n, text: t, updated: nowStamp() } : n)
      : [...fresh.notes, { period, kind: String(period).length === 4 ? 'year' : 'month', text: t, created: nowStamp(), updated: nowStamp() }];
    notes.sort((a, b) => String(a.period).localeCompare(String(b.period)));
    await writeShelfData(tok, id, { type: 'replaceTab', tab: 'Notes', rows: notes });
    return { goals: fresh.goals, notes, overrides: fresh.overrides };
  }), [mutate]);
  // Tag overrides: apply just what changed (by tag) on top of the Sheet's current copy.
  const saveOverridesRemote = useCallback((prev, nextLocal) => mutate(async (tok, id, fresh) => {
    const out = { ...fresh.overrides };
    new Set([...Object.keys(prev || {}), ...Object.keys(nextLocal || {})]).forEach(k => {
      if ((prev || {})[k] === (nextLocal || {})[k]) return;
      if (nextLocal && k in nextLocal) out[k] = nextLocal[k]; else delete out[k];
    });
    await writeSettings(tok, id, fresh.settingsRows, { tagOverrides: JSON.stringify(out) });
    return { goals: fresh.goals, notes: fresh.notes, overrides: out };
  }), [mutate]);

  // Snoozes, dismissals and nudge switches: one key of the Settings tab each, merged by entry.
  const setSettingEntry = useCallback((key, entry, value) => mutate(async (tok, id, fresh) => {
    const today = R.melbourneToday(new Date());
    const cur = key === 'nudgeTypes' ? { ...fresh.nudgeTypes } : pruneUntil(fresh[key], today);
    if (value === null) delete cur[entry]; else cur[entry] = value;
    await writeSettings(tok, id, fresh.settingsRows, { [key]: JSON.stringify(cur) });
    return { goals: fresh.goals, notes: fresh.notes, overrides: fresh.overrides, [key]: cur };
  }), [mutate]);
  const snooze = useCallback((ficKey, until) => setSettingEntry('snoozes', ficKey, until), [setSettingEntry]);
  const unsnooze = useCallback((ficKey) => setSettingEntry('snoozes', ficKey, null), [setSettingEntry]);
  const dismiss = useCallback((nudgeId, until) => setSettingEntry('dismissed', nudgeId, until), [setSettingEntry]);
  const setNudgeType = useCallback((type, on) => {
    if (stRef.current.status === 'ready') { setSt(s => ({ ...s, nudgeTypes: { ...s.nudgeTypes, [type]: !!on } })); return setSettingEntry('nudgeTypes', type, on ? true : false); }   // shown at once, then saved
    const next = { ...stRef.current.nudgeTypes, [type]: !!on };
    try { localStorage.setItem(NUDGE_TYPES_LOCAL_KEY, JSON.stringify(next)); } catch (e) {}
    setSt(s => ({ ...s, nudgeTypes: next }));
    return Promise.resolve();
  }, [setSettingEntry]);

  const sheetUrl = st.id ? `https://docs.google.com/spreadsheets/d/${st.id}/edit` : null;
  return { ...st, sheetUrl, connect, saveGoal, archiveGoal, deleteGoal, saveNote, saveOverridesRemote, snooze, unsnooze, dismiss, setNudgeType, editable: st.status === 'ready' && !st.saving };
}
// Settings rows are key/value; replace the given keys, keep the rest.
async function writeSettings(tok, id, rows, changes) {
  const map = new Map((rows || []).map(r => [r.key, r]));
  Object.entries(changes).forEach(([k, v]) => map.set(k, { key: k, value: v, updated: nowStamp() }));
  return writeShelfData(tok, id, { type: 'replaceTab', tab: 'Settings', rows: [...map.values()] });
}

function App() {
  const auth = useAuth();
  const theme = useTheme();
  const [data, setData] = useState(null);
  const [booted, setBooted] = useState(false);
  const [sync, setSync] = useState({ state: 'idle' });
  const [tab, setTab] = useState('home');
  const [detail, setDetail] = useState(null);
  const [filters, setFilters] = useState(R.emptyFilters);
  const [ui, setUi] = useState({ sub: 'diary', filtersOpen: false, libView: 'cards' });
  const [groupBy, setGroupBy] = useState('fandom');
  const [settingsView, setSettingsView] = useState('main');
  const [trendsTab, setTrendsTab] = useState('volume');
  const [recapScope, setRecapScope] = useState(null);
  // Sex-related tag toggle (remembered on this device; default off) and your tag overrides (IndexedDB).
  const [includeSex, setIncludeSexState] = useState(() => { try { return localStorage.getItem(SEXTAG_KEY) === '1'; } catch (e) { return false; } });
  const setIncludeSex = useCallback((v) => { setIncludeSexState(!!v); try { localStorage.setItem(SEXTAG_KEY, v ? '1' : '0'); } catch (e) {} }, []);
  const [overrides, setOverrides] = useState({});
  useEffect(() => { idb.get(OVERRIDES_KEY).then(o => { if (o && typeof o === 'object') setOverrides(o); }); }, []);
  const overridesRef = useRef(overrides); useEffect(() => { overridesRef.current = overrides; }, [overrides]);
  const store = useShelfStore(auth, overrides);
  const storeRef = useRef(store); storeRef.current = store;
  // Once Shelf Life Data is connected, its tag overrides are the shared copy; this device keeps an offline copy.
  useEffect(() => { if (store.status === 'ready' && store.overrides) { setOverrides(store.overrides); idb.put(OVERRIDES_KEY, store.overrides); } }, [store.overrides, store.status]);
  const saveOverrides = useCallback((next) => {
    const prev = overridesRef.current;
    setOverrides(next); idb.put(OVERRIDES_KEY, next);
    if (storeRef.current.status === 'ready') storeRef.current.saveOverridesRemote(prev, next).catch(() => {});
  }, []);
  const [dash, setDash] = useState({ period: 'thisMonth', compare: 'prev', custom: { start: '', end: '' } });
  const [now, setNow] = useState(Date.now());
  const dataRef = useRef(null);
  const syncingRef = useRef(false);
  const today = R.melbourneToday(new Date(now));

  useEffect(() => { const t = setInterval(() => setNow(Date.now()), 30000); return () => clearInterval(t); }, []);

  const doSync = useCallback(async (interactive) => {
    if (syncingRef.current) return;
    let tok = auth.getToken();
    if (!tok) {
      if (!interactive) { setSync({ state: 'needsAuth' }); return; }
      try { tok = await auth.signIn(); } catch (e) { setSync({ state: 'error', message: 'Sign-in didn’t finish.' }); return; }
    }
    syncingRef.current = true;
    setSync({ state: 'syncing' });
    try {
      const results = await Promise.allSettled(SOURCES.map(src => loadSource(tok, src)));
      const prev = dataRef.current;
      const sources = {}, errors = [];
      let authFailed = false;
      results.forEach((r, i) => {
        const src = SOURCES[i];
        if (r.status === 'fulfilled') sources[src.id] = r.value;
        else {
          if (r.reason && r.reason.isAuthError) authFailed = true;
          errors.push(`${R.sourceLabel(src, SOURCES)}: ${(r.reason && r.reason.message) || r.reason}`);
          if (prev && prev.sources && prev.sources[src.id]) sources[src.id] = { ...prev.sources[src.id], stale: true };
        }
      });
      if (authFailed) auth.expire();
      if (!results.some(r => r.status === 'fulfilled')) {
        setSync(authFailed ? { state: 'needsAuth', message: 'Your Google sign-in expired. Sign in again to sync.' } : { state: 'error', message: errors.join(' · ') });
        return;
      }
      const next = { version: DATA_VERSION, syncedAt: Date.now(), sources };
      dataRef.current = next;
      setData(next);
      setNow(Date.now());
      idb.put('dataset', next);
      setSync(errors.length ? { state: 'partial', message: errors.join(' · ') } : { state: 'ok' });
    } finally { syncingRef.current = false; }
  }, [auth.getToken, auth.signIn, auth.expire]);

  // Open instantly from the cache, then refresh in the background when there's a valid sign-in.
  useEffect(() => {
    (async () => {
      const cached = await idb.get('dataset');
      if (cached && cached.version === DATA_VERSION && cached.sources) { dataRef.current = cached; setData(cached); }
      setBooted(true);
      if (auth.getToken()) doSync(false);
      else if (cached) setSync({ state: 'needsAuth' });
    })();
  }, []);
  // Coming back to the app after a while: refresh quietly if signed in.
  useEffect(() => {
    const on = () => {
      if (document.visibilityState !== 'visible') return;
      setNow(Date.now());
      const d = dataRef.current;
      if (auth.getToken() && (!d || Date.now() - d.syncedAt > 15 * 60000)) doSync(false);
    };
    document.addEventListener('visibilitychange', on);
    return () => document.removeEventListener('visibilitychange', on);
  }, [doSync]);

  const model = useMemo(() => data ? R.buildModel(data.sources, SOURCES) : null, [data]);
  const hiddenTags = useMemo(() => {
    const set = new Set();
    if (model) for (const i of model.tagInfo.values()) if (effectiveClass(i, overrides) === 'sexual') set.add(i.tag);
    return set;
  }, [model, overrides]);
  const tagCtx = useMemo(() => ({
    include: includeSex, setInclude: setIncludeSex, hidden: hiddenTags,
    isVisible: (t) => includeSex || !hiddenTags.has(t), overrides, saveOverrides, synced: store.status === 'ready',
  }), [includeSex, setIncludeSex, hiddenTags, overrides, saveOverrides, store.status]);

  // Phase 4: app scores, Up Next ranking and nudges, shared by Home, Up Next, Goals, Badges and fic pages.
  const scores = useMemo(() => model ? R.appScores(model) : new Map(), [model]);
  const up = useMemo(() => model ? R.upNextRank(model, { today, snoozes: store.snoozes, scores }) : null, [model, today, store.snoozes, scores]);
  const nctx = useMemo(() => model && up ? R.nudgeContext(model, tagCtx.isVisible, up.lengthStats) : null, [model, up, tagCtx.isVisible]);
  const nudges = useMemo(() => model && up ? R.pageNudges(model, { today, goals: store.goals, up, sources: SOURCES }) : [], [model, up, today, store.goals]);
  const p4 = { up, nctx, nudges, store, today, scores };
  const backRef = useRef('home');

  const loadSummary = useCallback(async (fic) => {
    const ck = 'summary:' + fic.key;
    const cached = await idb.get(ck);
    if (typeof cached === 'string') return cached;
    const tok = auth.getToken();
    if (!tok) { const e = new Error('Sign in to load the summary.'); e.needsAuth = true; throw e; }
    const meta = dataRef.current && dataRef.current.sources[fic.source];
    try {
      const text = await fetchSummary(tok, SOURCE_BY_ID[fic.source], meta, fic);
      idb.put(ck, text);
      return text;
    } catch (e) {
      if (e.isAuthError) { auth.expire(); const x = new Error('Your sign-in expired. Sign in again to load the summary.'); x.needsAuth = true; throw x; }
      throw new Error(e.moved ? e.message : 'Couldn’t load the summary. ' + e.message);
    }
  }, [auth.getToken, auth.expire]);

  const openAuthor = (a) => { setDetail(null); setFilters({ ...R.emptyFilters(), author: a }); setUi(u => ({ ...u, sub: 'library', filtersOpen: true })); setTab('diary'); window.scrollTo(0, 0); };
  const openRange = (start, end) => { setDetail(null); setFilters({ ...R.emptyFilters(), from: start, to: end }); setUi(u => ({ ...u, sub: 'diary', filtersOpen: true })); setTab('diary'); window.scrollTo(0, 0); };
  const openTag = (t) => { setFilters({ ...R.emptyFilters(), tagsInc: [t] }); setUi(u => ({ ...u, sub: 'diary', filtersOpen: true })); setTab('diary'); window.scrollTo(0, 0); };
  const reset = async () => { await idb.clearExcept([OVERRIDES_KEY, SHELF_CACHE_KEY]); dataRef.current = null; setData(null); setSync({ state: auth.signedIn ? 'idle' : 'needsAuth' }); if (auth.getToken()) doSync(false); };
  const MORE_TABS = ['more', 'goals', 'badges', 'notes', 'export', 'settings'];
  // Goals and Badges open from Home or More; their back button returns there.
  const switchTab = (t) => { if (t === 'goals' || t === 'badges') backRef.current = tab === 'more' ? 'more' : 'home'; setTab(t); if (t !== 'settings') setSettingsView('main'); window.scrollTo(0, 0); };

  if (!booted) return html`<div className="center-screen faint">Opening your shelf…</div>`;
  if (!model) return html`<${SignInScreen} onSignIn=${() => doSync(true)} ready=${auth.ready || auth.signedIn} error=${auth.error || (sync.state === 'error' ? sync.message : '')} busy=${sync.state === 'syncing'} />`;

  const syncing = sync.state === 'syncing';
  const themeIcon = theme.mode === 'system' ? 'auto' : theme.mode === 'light' ? 'sun' : 'moon';
  return html`<${TagCtx.Provider} value=${tagCtx}><div>
    <header className="topbar"><div className="topbar-inner">
      <div className="wordmark"><${Mark} />Shelf Life</div>
      <div className="sync">
        <span className="num">${syncing ? 'Syncing…' : `Synced ${ago(data.syncedAt, now)}`}</span>
        <button className="icon-btn" onClick=${() => doSync(true)} disabled=${syncing} aria-label="Sync now" title="Sync now">
          <span className=${syncing ? 'spin' : ''} style=${{ display: 'inline-grid' }}><${Icon} name="sync" size=${16} /></span>
        </button>
        <button className="icon-btn" onClick=${theme.cycle} aria-label=${`Theme: ${theme.mode}`} title=${`Theme: ${theme.mode}`}><${Icon} name=${themeIcon} size=${16} /></button>
      </div>
    </div></header>

    <main className="shell">
      ${sync.state === 'needsAuth' ? html`<div className="banner warn row" style=${{ justifyContent: 'space-between' }}>
        <span>${sync.message || 'Showing your saved copy.'}</span><button className="pill-btn" onClick=${() => doSync(true)}>Sign in to sync</button></div>` : null}
      ${sync.state === 'error' || sync.state === 'partial' ? html`<div className="banner err">Sync ${sync.state === 'partial' ? 'partly ' : ''}failed — showing the last copy. ${sync.message}</div>` : null}

      ${tab === 'home' ? html`<${Dashboard} model=${model} today=${today} themeTick=${theme.tick} onOpen=${setDetail} onTag=${openTag} dash=${dash} setDash=${setDash} groupBy=${groupBy} setGroupBy=${setGroupBy} openRecap=${setRecapScope} store=${store} openGoals=${() => switchTab('goals')} openBadges=${() => switchTab('badges')} p4=${p4} openUpNext=${() => switchTab('upnext')} />` : null}
      ${tab === 'upnext' ? html`<${UpNextScreen} p4=${p4} model=${model} onOpen=${setDetail} />` : null}
      ${tab === 'more' ? html`<${MoreScreen} model=${model} today=${today} store=${store} p4=${p4} go=${switchTab} />` : null}
      ${tab === 'notes' ? html`<${NotesScreen} model=${model} today=${today} store=${store} onBack=${() => switchTab('more')} />` : null}
      ${tab === 'goals' ? html`<${GoalsScreen} model=${model} today=${today} store=${store} p4=${p4} onBack=${() => switchTab(backRef.current)} />` : null}
      ${tab === 'badges' ? html`<${BadgesScreen} model=${model} today=${today} p4=${p4} onBack=${() => switchTab(backRef.current)} />` : null}
      ${tab === 'diary' ? html`<${DiaryScreen} model=${model} filters=${filters} setFilters=${setFilters} onOpen=${setDetail} today=${today} ui=${ui} setUi=${setUi} />` : null}
      ${tab === 'trends' ? html`<${TrendsScreen} model=${model} today=${today} themeTick=${theme.tick} onAuthor=${openAuthor} onTag=${openTag} onOpen=${setDetail} onRange=${openRange} groupBy=${groupBy} setGroupBy=${setGroupBy} tab=${trendsTab} setTab=${setTrendsTab} openRecap=${setRecapScope} p4=${p4} />` : null}
      ${tab === 'export' ? html`<${ExportScreen} model=${model} filters=${filters} today=${today} onBack=${() => switchTab('more')}
        goFilters=${() => { setUi(u => ({ ...u, filtersOpen: true })); switchTab('diary'); }} />` : null}
      ${tab === 'settings' ? html`<${SettingsScreen} model=${model} syncedAt=${data.syncedAt} auth=${auth} store=${store} today=${today} onSignIn=${() => doSync(true)} onReset=${reset} view=${settingsView} setView=${setSettingsView} scores=${scores} onBack=${() => switchTab('more')} />` : null}
    </main>

    <nav className="nav"><div className="nav-inner">
      ${[['home', 'home', 'Home'], ['upnext', 'upnext', 'Up Next'], ['diary', 'diary', 'Diary'], ['trends', 'trends', 'Trends'], ['more', 'more', 'More']].map(([k, ic, label]) => { const on = k === 'more' ? MORE_TABS.includes(tab) : tab === k;
        const attn = k === 'more' && moreNeedsAttention(store, model, today);
        return html`<button key=${k} className=${on ? 'on' : ''} onClick=${() => switchTab(k)} aria-current=${on ? 'page' : null} aria-label=${label} title=${attn ? 'More: something needs attention' : null}><span className="nav-ic"><${Icon} name=${ic} size=${20} sw=${ic === 'more' ? 3.2 : 2} />${attn ? html`<span className="nav-dot" aria-hidden="true"></span>` : null}</span>${label}</button>`; })}
    </div></nav>

    ${detail ? html`<${FicDetail} ficKey=${detail} model=${model} onClose=${() => setDetail(null)} loadSummary=${loadSummary} onAuthor=${openAuthor} today=${today} p4=${p4} />` : null}
    ${recapScope ? html`<${RecapStory} model=${model} scope=${recapScope} today=${today} store=${store} onClose=${() => setRecapScope(null)} />` : null}
  </div></${TagCtx.Provider}>`;
}

if (window.Chart) {
  Chart.defaults.font.family = "'Plus Jakarta Sans', sans-serif";
  Chart.defaults.font.weight = '600';
  Chart.defaults.font.size = 12;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
</body>
</html>
