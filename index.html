    return out.sort((a, b) => a.date.localeCompare(b.date) || a.startMin - b.startMin);
  }
  function sessionStats(ss) {
    const total = ss.reduce((t, s) => t + s.minutes, 0);
    const timed = ss.filter(s => s.minutes >= 5 && s.words > 0);   // speed needs time and progress
    const wpm = (list) => list.length ? Math.round(median(list.map(s => Math.round(s.words / s.minutes * 10))) / 10) : null;
    const bands = LENGTH_BANDS.map(b => { const l = timed.filter(s => s.fic.words >= b.min && s.fic.words < b.max); return { ...b, n: l.length, wpm: l.length >= MIN_RANK ? wpm(l) : null }; });
    const grid = Array.from({ length: 7 }, () => Array(24).fill(0));
    for (const s of ss) { let m = s.startMin, left = s.minutes; const d = weekdayOf(s.date); while (left > 0 && m < 1440) { const h = Math.floor(m / 60), take = Math.min(left, 60 - (m % 60)); grid[d][h] += take; m += take; left -= take; } }
    const enough = ss.length >= MIN_SESSIONS;
    let peak = null; grid.forEach((row, d) => row.forEach((v, h) => { if (v && (!peak || v > peak.v)) peak = { d, h, v }; }));
    const finding = !enough ? '' : `You've read for ${Math.round(total / 60 * 10) / 10} hours across ${ss.length} sessions, at about ${wpm(timed) ?? '—'} words a minute.`;
    return { count: ss.length, totalMinutes: total, avgMinutes: ss.length ? Math.round(total / ss.length) : 0, wpm: wpm(timed), timedCount: timed.length, bands, grid, peak, enough, finding };
  }

  // ---- REFLECTIONS --------------------------------------------------------------------------
  // The monthly reflection card shows from the last 3 days of a month until the 7th of the next.
  function reflectionWindow(today) {
    const [y, m, d] = today.split('-').map(Number);
    const last = new Date(Date.UTC(y, m, 0)).getUTCDate();
    if (d >= last - 2) return `${y}-${String(m).padStart(2, '0')}`;
    if (d <= 7) { const [py, pm] = monthShift(y, m, -1); return `${py}-${String(pm).padStart(2, '0')}`; }
    return null;
  }
  // Headline stat + prompt for a month: a bigger month than the one before asks what made it big.
  function reflectionFor(model, month) {
    const [y, m] = month.split('-').map(Number);
    const p = { unit: 'days', start: `${month}-01`, end: `${month}-${new Date(Date.UTC(y, m, 0)).getUTCDate()}` };
    const [py, pm] = monthShift(y, m, -1);
    const prevKey = `${py}-${String(pm).padStart(2, '0')}`;
    const pp = { unit: 'days', start: `${prevKey}-01`, end: `${prevKey}-${new Date(Date.UTC(py, pm, 0)).getUTCDate()}` };
    const cur = periodStats(model.readings, p, model.authorFirst), prev = periodStats(model.readings, pp, model.authorFirst);
    const mn = MONTHS[m - 1];
    const stat = cur.finished || cur.dnfs ? `You read ${fmtK(cur.words)} words and finished ${cur.finished} fic${cur.finished === 1 ? '' : 's'} in ${mn}.` : `No finished reads in ${mn}.`;
    const prompt = cur.words > 0 && cur.words >= prev.words ? `What made ${mn} a big month?` : 'Anything you want more of next month?';
    return { period: month, stat, prompt };
  }
  const yearPrompt = (year) => `Looking back on ${year}, what stood out?`;
  // A short excerpt of a note: the first sentences up to ~180 characters.
  function noteExcerpt(text, max = 180) {
    const t = String(text || '').replace(/\s+/g, ' ').trim();
    if (t.length <= max) return t;
    const cut = t.slice(0, max), dot = Math.max(cut.lastIndexOf('. '), cut.lastIndexOf('! '), cut.lastIndexOf('? '));
    return (dot > 60 ? cut.slice(0, dot + 1) : cut.replace(/\s+\S*$/, '') + '…');
  }

  // ==========================================================================================
  // 10. APP_SCORES: the fandom apps' own recommendation score, ported (not reinvented)
  // ------------------------------------------------------------------------------------------
  // Each scorer takes ALL of one Sheet's fics (as Shelf Life parsed them) and returns a Map of
  // fic key -> { score, qScore } that matches what that app shows (the app shows score rounded).
  // Inputs are the raw Data List fields the apps read, kept on fic.app (raw tags with AO3
  // warnings and duplicates, raw DNR fields, chapters by parseInt) plus Kudos, Hits, Bookmarks,
  // Comments, Status, DNR Reason, K, B, Enjoyment and Author.
  //
  // The algorithm (identical in all three apps except where noted):
  //   qScore   popularity: percentile ranks (ties share the average rank, scaled 0-100) across
  //            EVERY titled row in the Sheet, of kudos/(hits+1) x1, kudos per chapter x1,
  //            bookmarks x1.5 and comments x1; weighted mean (÷ 4.5).
  //   evidence per tag / ship / category / author, from Read, DNF and Not Interested rows:
  //            Read adds readW = 1 + 0.5·K + 1·B (author readW also × ENJOYMENT_MULTIPLIER);
  //            DNF adds 1 to dnf; Not Interested adds 1 to notInt. Which tags/ships/category a
  //            DNF or Not Interested penalises depends on DNR Reason (contentTargets below);
  //            the author is penalised unless the reason is a Content one.
  //   affinity (readW − dnf·dnfWeight − notInt) ÷ total, × confidence total ÷ (total + 3).
  //            dnfWeight 0.5 (ships: 0.15).
  //   per fic  each dimension = Σ a·|a| ÷ Σ |a| over its rated items (strength-weighted mean).
  //            Category and author are floored at 0 (boost only); tags and ships can be negative.
  //   blend    weighted mean of the dimensions that have data: tags 0.6, ships 0.6 (ASOIAF),
  //            category 0.3, author 0.9.   score = qScore × (1 + blend).
  // ==========================================================================================
  const APP_STATUS = { '': 0, 'Read': 1, 'DNF': 2, 'Skipped': 3, 'Not Interested': 4, 'Currently Reading': 5, 'TBR': 6, 'Paused': 7 };
  const APP_ENJOYMENT_MULTIPLIER = { 0: 1, 1: 0.25, 2: 0.6, 3: 1, 4: 1.5, 5: 2 };
  const APP_ANON = new Set(['anonymous', 'orphan_account', 'orphan account']);
  const appRealAuthors = (f) => f.authors.filter(a => !APP_ANON.has(a.trim().toLowerCase()));
  function appPercentileRanks(values) {
    const n = values.length;
    const sorted = values.map((v, i) => [v, i]).sort((a, b) => a[0] - b[0]);
    const ranks = new Array(n);
    let i = 0;
    while (i < n) {
      let j = i;
      while (j + 1 < n && sorted[j + 1][0] === sorted[i][0]) j++;
      const avg = (i + j) / 2;
      for (let k = i; k <= j; k++) ranks[sorted[k][1]] = avg;
      i = j + 1;
    }
    const denom = n > 1 ? n - 1 : 1;
    return ranks.map(r => (r / denom) * 100);
  }
  // opts.ships: false (Hollanov, Drarry) | true (ASOIAF). dnrCodes: the app's DNR_CODE_MAP.
  function appScoreCore(fics, opts) {
    const n = fics.length, out = new Map();
    if (!n) return out;
    const DNR = opts.dnrCodes;
    const status = fics.map(f => APP_STATUS[String(f.status || '').trim()] ?? 0);
    const dnr = fics.map(f => DNR[String(f.dnrReason || '').trim()] ?? 0);
    const pKH = appPercentileRanks(fics.map(f => f.kudos / (f.hits + 1)));
    const pKC = appPercentileRanks(fics.map(f => f.kudos / Math.max(1, f.app.chapters)));
    const pBM = appPercentileRanks(fics.map(f => f.bookmarks));
    const pCO = appPercentileRanks(fics.map(f => f.comments));
    const q = fics.map((_, i) => (pKH[i] * 1 + pKC[i] * 1 + pBM[i] * 1.5 + pCO[i] * 1) / 4.5);
    const tagS = new Map(), shipS = new Map(), catS = new Map(), auS = new Map();
    const bump = (m, k, field, amt) => { if (!m.has(k)) m.set(k, { readW: 0, dnf: 0, notInt: 0 }); m.get(k)[field] += amt; };
    // DNR Reason codes: 1 Writing/Pacing, 2 Content, 3 Other, 10 Content/Tags, 11 Content/Ships (ASOIAF), 12 Content/Category.
    const contentTargets = (f, d) => {
      if (d === 2) return { tags: f.app.dnrTags.length ? f.app.dnrTags : [], ships: opts.ships && f.app.dnrShips.length ? f.app.dnrShips : [], category: !!f.app.dnrCategory };
      if (d === 10) return { tags: f.app.tags, ships: [], category: false };
      if (opts.ships && d === 11) return { tags: [], ships: f.app.ships, category: false };
      if (d === 12) return { tags: [], ships: [], category: true };
      if (d === 3) return { tags: f.app.tags, ships: opts.ships ? f.app.ships : [], category: true };
      return { tags: [], ships: [], category: false };
    };
    const authorExcluded = (d) => d === 2 || d === 10 || d === 12 || (opts.ships && d === 11);
    for (let i = 0; i < n; i++) {
      const f = fics[i], s = status[i], d = dnr[i];
      if (s === 1) {
        const w = 1 + 0.5 * (f.kg ? 1 : 0) + 1 * (f.bk ? 1 : 0);
        for (const t of f.app.tags) bump(tagS, t, 'readW', w);
        if (opts.ships) for (const sh of f.app.ships) bump(shipS, sh, 'readW', w);
        bump(catS, f.app.category, 'readW', w);
        const aw = w * (APP_ENJOYMENT_MULTIPLIER[f.enjoyment] ?? 1);
        for (const a of appRealAuthors(f)) bump(auS, a, 'readW', aw);
      } else if (s === 2 || s === 4) {
        const field = s === 2 ? 'dnf' : 'notInt', tg = contentTargets(f, d);
        for (const t of tg.tags) bump(tagS, t, field, 1);
        for (const sh of tg.ships) bump(shipS, sh, field, 1);
        if (tg.category) bump(catS, f.app.category, field, 1);
        if (!authorExcluded(d)) for (const a of appRealAuthors(f)) bump(auS, a, field, 1);
      }
    }
    const affinityOf = (m, k, dnfW) => {
      const s = m.get(k); if (!s) return { affinity: 0, total: 0 };
      const total = s.readW + s.dnf + s.notInt;
      const raw = total === 0 ? 0 : (s.readW - s.dnf * dnfW - s.notInt) / total;
      return { affinity: raw * (total / (total + 3)), total };
    };
    const dim = (m, keys, dnfW) => {
      let sum = 0, wt = 0, cnt = 0;
      for (const k of keys) { const { affinity, total } = affinityOf(m, k, dnfW); if (total > 0) { cnt++; sum += affinity * Math.abs(affinity); wt += Math.abs(affinity); } }
      return { has: cnt > 0, v: wt > 0 ? sum / wt : 0 };
    };
    for (let i = 0; i < n; i++) {
      const f = fics[i];
      const t = dim(tagS, f.app.tags, 0.5);
      const sh = opts.ships ? dim(shipS, f.app.ships, 0.15) : { has: false, v: 0 };
      const c = affinityOf(catS, f.app.category, 0.5);
      const au = dim(auS, appRealAuthors(f), 0.5);
      let ws = 0, as = 0;
      if (t.has) { ws += 0.6; as += 0.6 * t.v; }
      if (sh.has) { ws += 0.6; as += 0.6 * sh.v; }
      if (c.total > 0) { ws += 0.3; as += 0.3 * Math.max(0, c.affinity); }
      if (au.has) { ws += 0.9; as += 0.9 * Math.max(0, au.v); }
      const adj = ws > 0 ? as / ws : 0;
      out.set(f.key, { score: q[i] * (1 + adj), qScore: q[i] });
    }
    return out;
  }
  const APP_DNR_CODES = { '': 0, 'Writing/Pacing': 1, 'Content': 2, 'Other': 3, 'Content/Tags': 10, 'Content/Category': 12 };
  const APP_DNR_CODES_SHIPS = { ...APP_DNR_CODES, 'Content/Ships': 11 };
  const APP_SCORES = {
    // last synced with the Hollanov app (hollanov-fics-list-sync.html, useComputedScores) on 2026-10-12
    hollanov: (fics) => appScoreCore(fics, { ships: false, dnrCodes: APP_DNR_CODES }),
    // last synced with the ASOIAF app (asoiaf-fics-list-sync.html, useComputedScores) on 2026-10-12
    // Differs from the others: ships (Relationships) as a 4th dimension, weight 0.6, DNF weight 0.15,
    // DNR Ships for Content reasons, and the legacy "Content/Ships" reason.
    asoiaf: (fics) => appScoreCore(fics, { ships: true, dnrCodes: APP_DNR_CODES_SHIPS }),
    // last synced with the Drarry app (drarry-fics-list-sync.html, useComputedScores) on 2026-10-12
    drarry: (fics) => appScoreCore(fics, { ships: false, dnrCodes: APP_DNR_CODES }),
  };
  // All sources: Map fic key -> { score, qScore }. A Sheet with no scorer gets none.
  function appScores(model) {
    const all = new Map();
    for (const src of new Set(model.fics.map(f => f.source))) {
      const scorer = APP_SCORES[src]; if (!scorer) continue;
      for (const [k, v] of scorer(model.fics.filter(f => f.source === src))) all.set(k, v);
    }
    return all;
  }

  // ==========================================================================================
  // 11. UP NEXT: a cross-fandom "what to read next" ranking
  // ------------------------------------------------------------------------------------------
  // Candidates: Status blank or TBR (Recommended is a column, so a recommended fic is a candidate
  // when its Status is blank or TBR). Everything else is left out: Read, DNF, Skipped, Not
  // Interested, Currently Reading, Paused and any status the apps don't know. Snoozed fics
  // (snoozes[fic key] >= today) are left out of the list but still count for percentiles.
  //
  //   appPercentile = percentile of the fic's APP_SCORES score among the candidates in ITS OWN
  //                   Sheet (0-100, ties share a rank), so the three Sheets are comparable even
  //                   if their raw scores run on different scales. "Top N%" = 100 − percentile.
  //   overall       = your all-time completion rate: finished readings ÷ closed readings.
  //   lengthFit     = your completion rate in the fic's length band (Phase 2 bands), shrunk
  //                   towards overall when the band has few closed reads:
  //                   (finished in band + 5 × overall) ÷ (closed in band + 5).
  //   base          = appPercentile × (0.6 + 0.4 × lengthFit ÷ overall), capped to 0–100.
  //   boosts        = +5 if Recommended in its app; +5 if its fandom's last read was 21+ days ago
  //                   (fandom rotation; a fandom with no dated read gets no boost).
  //                   No author boost: Author Affinity is already in the app score.
  //   upNextScore   = base + boosts (so up to 110). Ties: the uncapped base, then the app score.
  // Every pick carries `reasons` (the "why" chips, most useful first).
  // ==========================================================================================
  const UP_NEXT_STATUSES = ['', 'TBR'];
  const LENGTH_FILTERS = { short: { label: 'Short tonight', min: 0, max: 20000 }, medium: { label: 'Medium', min: 20000, max: 100000 }, long: { label: 'Long haul', min: 100000, max: Infinity } };
  function lengthStats(readings) {
    const closed = readings.filter(r => r.kind === 'Read' || r.kind === 'DNF');
    const fin = closed.filter(r => r.kind === 'Read').length;
    const overall = closed.length ? fin / closed.length : 0;
    const bands = LENGTH_BANDS.map(b => {
      const rs = closed.filter(r => r.fic.words >= b.min && r.fic.words < b.max);
      const f = rs.filter(r => r.kind === 'Read').length;
      return { ...b, closed: rs.length, finished: f, rate: rs.length ? f / rs.length : null, fit: (f + 5 * overall) / (rs.length + 5) };
    });
    return { overall, closedTotal: closed.length, bands, bandOf: (w) => bands.find(b => w >= b.min && w < b.max) || bands[0] };
  }
  function fandomLastRead(model) {
    const last = new Map();
    for (const r of model.readings) if (r.date && (!last.has(r.fandom) || r.date > last.get(r.fandom))) last.set(r.fandom, r.date);
    return last;
  }
  // Authors with 3+ finished fics (distinct fics), for the go-to-author chip and nudge.
  function goToAuthorCounts(model) {
    const m = new Map();
    for (const r of model.readings) if (r.kind === 'Read') for (const a of realAuthors(r.fic.authors)) { if (!m.has(a)) m.set(a, new Set()); m.get(a).add(r.ficKey); }
    return new Map([...m].filter(([, s]) => s.size >= 3).map(([a, s]) => [a, s.size]));
  }
  // opts: { scores (from appScores), snoozes, today }
  function upNextRank(model, opts) {
    const today = opts.today, snoozes = opts.snoozes || {};
    const scores = opts.scores || appScores(model);
    const ls = lengthStats(model.readings);
    const lastRead = fandomLastRead(model);
    const goTo = goToAuthorCounts(model);
    const cands = model.fics.filter(f => UP_NEXT_STATUSES.includes(f.status) && scores.has(f.key));
    const pctOf = new Map();
    for (const src of new Set(cands.map(f => f.source))) {
      const list = cands.filter(f => f.source === src);
      const p = appPercentileRanks(list.map(f => scores.get(f.key).score));
      list.forEach((f, i) => pctOf.set(f.key, list.length === 1 ? 100 : p[i]));
    }
    const out = [];
    for (const f of cands) {
      const s = scores.get(f.key), pct = pctOf.get(f.key), band = ls.bandOf(f.words);
      const ratio = ls.overall > 0 ? band.fit / ls.overall : 1;
      const raw = pct * (0.6 + 0.4 * ratio);
      const base = Math.max(0, Math.min(100, raw));
      const reasons = [];
      const top = Math.max(1, Math.ceil(100 - pct));
      const fandomShort = shortFandom(f.fandom);
      reasons.push({ key: 'top', text: `Top ${top}% in ${fandomShort}`, value: pct });
      if (band.closed > 0) reasons.push({ key: 'length', text: `You finish ${Math.round((band.rate ?? band.fit) * 100)}% of fics this length`, value: band.fit });
      let boost = 0;
      if (f.recommended) { boost += 5; reasons.push({ key: 'rec', text: f.recSource ? `Recommended · ${f.recSource}` : 'Recommended', boost: 5 }); }
      const lr = lastRead.get(f.fandom);
      const gap = lr ? dayDiff(lr, today) : null;
      if (gap !== null && gap >= 21) { boost += 5; reasons.push({ key: 'rotation', text: `Haven’t read ${fandomShort} in ${gap >= 35 ? Math.floor(gap / 7) + ' weeks' : gap + ' days'}`, boost: 5 }); }
      const ga = realAuthors(f.authors).filter(a => goTo.has(a)).sort((a, b) => goTo.get(b) - goTo.get(a))[0];
      const snoozedUntil = snoozes[f.key] && snoozes[f.key] >= today ? snoozes[f.key] : null;
      out.push({ fic: f, key: f.key, appScore: s.score, appPercentile: pct, topPct: top, lengthFit: band.fit, band, overall: ls.overall, base, boost,
        upNextScore: base + boost, raw, reasons, goToAuthor: ga ? { author: ga, read: goTo.get(ga) } : null, snoozedUntil });
    }
    // Ties (several picks capped at 100): the uncapped value, then the app score, then title.
    out.sort((a, b) => b.upNextScore - a.upNextScore || b.raw - a.raw || b.appScore - a.appScore || a.fic.title.localeCompare(b.fic.title));
    return { picks: out, lengthStats: ls, lastRead, goTo };
  }
  // Quick filters: { scope: 'f:<fandom>' | 'p:<pairing key>' | null, length: 'short'|'medium'|'long'|null,
  // tbrOnly, tagsInc: [], tagsExc: [], showSnoozed }. Tags match the cleaned tags (AO3 warnings removed).
  function filterUpNext(picks, flt) {
    const F = flt || {};
    return picks.filter(p => {
      const f = p.fic;
      if (p.snoozedUntil && !F.showSnoozed) return false;
      if (F.scope && (F.scope.startsWith('p:') ? f.pairingKey !== F.scope.slice(2) : f.fandom !== F.scope.slice(2))) return false;
      if (F.length) { const L = LENGTH_FILTERS[F.length]; if (!(f.words >= L.min && f.words < L.max)) return false; }
      if (F.tbrOnly && f.status !== 'TBR') return false;
      if (F.tagsInc && F.tagsInc.length && !F.tagsInc.every(t => f.tags.includes(t))) return false;
      if (F.tagsExc && F.tagsExc.length && F.tagsExc.some(t => f.tags.includes(t))) return false;
      return true;
    });
  }

  // ==========================================================================================
  // 12. NUDGES: pattern-based prompts
  // ------------------------------------------------------------------------------------------
  // Each nudge: { id (unique; dismissals are keyed by it), type, priority (higher first),
  //   text, numbers [{label, value}], why (the rule, for "Why am I seeing this?"),
  //   where (['dashboard', 'card', 'upnext', 'goals', 'badges']), expires (ISO date it lapses
  //   on its own; it is recomputed every time anyway), link?, ficKey?, pick? }.
  // The Dashboard shows at most 3 (highest priority first) of those with 'dashboard' in where.
  // Dismissed nudges (dismissed[id] >= today) and switched-off types are left out by the caller.
  // ==========================================================================================
  const NUDGE_TYPES = [
    { id: 'long-fic', label: 'Long fics you rarely finish', where: 'Up Next and fic cards', priority: 30,
      rule: 'Shown on a fic in a length band where you finish under 40% of fics, once that band has 5+ closed reads.' },
    { id: 'dnf-tag', label: 'Tags you often DNF', where: 'Up Next and fic cards', priority: 30,
      rule: 'Shown on a fic with a tag you DNF at least 15 points more often than overall, with 10+ readings (as in “Tags that predict a DNF”).' },
    { id: 'stalled', label: 'Stalled reads', where: 'Dashboard (Currently reading)', priority: 70,
      rule: 'A Currently Reading or Paused fic you haven’t touched (Last Read or a Reading Log event) in over 14 days.' },
    { id: 'fandom-gap', label: 'Fandom gaps', where: 'Dashboard and Up Next', priority: 50,
      rule: 'A fandom you read in the last 6 months but not in the last 21 days.' },
    { id: 'goal-pace', label: 'Goals behind pace', where: 'Dashboard and Goals', priority: 80,
      rule: 'An active goal whose progress is behind the share of its period that has gone.' },
    { id: 'streak-risk', label: 'Streak at risk', where: 'Dashboard and Habits', priority: 90,
      rule: 'Your weekly streak is 4+ weeks, it’s Friday or later (Melbourne time) and this week has no reading day yet.' },
    { id: 'go-to-author', label: 'Go-to authors', where: 'Up Next chips; Dashboard once a week', priority: 40,
      rule: 'An unread or TBR fic by an author you’ve finished 3+ fics by.' },
    { id: 'badge-close', label: 'Close to a badge', where: 'Dashboard and Badges', priority: 60,
      rule: 'You’re within 5% of the next badge in a group.' },
  ];
  const NUDGE_BY_ID = Object.fromEntries(NUDGE_TYPES.map(t => [t.id, t]));
  const BADGE_UNITS = { words: 'words', finished: 'fics', authors: 'authors', logged: 'logged reads', fives: '5/5 ratings', fandoms: 'fandoms' };
  const fmtWordsShort = (n) => n >= 1e6 ? fmtK(n) : n >= 1000 ? Math.round(n / 1000) + 'k' : String(n);

  // Card-level nudges for one fic (long-fic, dnf-tag). ctx: { lengthStats, dnfTags (Map tag -> row), overallDnf }.
  function ficNudges(fic, ctx) {
    const out = [];
    const b = ctx.lengthStats.bandOf(fic.words);
    if (b.closed >= 5 && b.rate !== null && b.rate < 0.4)
      out.push({ id: `long-fic:${fic.key}`, type: 'long-fic', priority: 30, where: ['card'], ficKey: fic.key,
        text: `You finish ${Math.round(b.rate * 100)}% of ${b.label} fics; this one is ${fmtWordsShort(fic.words)}.`,
        numbers: [{ label: `${b.label} finished`, value: `${b.finished} of ${b.closed}` }, { label: 'This fic', value: fmtWordsShort(fic.words) + ' words' }],
        why: NUDGE_BY_ID['long-fic'].rule, expires: null });
    const hit = fic.tags.map(t => ctx.dnfTags.get(t)).filter(Boolean).sort((x, y) => y.rate - x.rate)[0];
    if (hit)
      out.push({ id: `dnf-tag:${fic.key}`, type: 'dnf-tag', priority: 30, where: ['card'], ficKey: fic.key,
        text: `You DNF ${Math.round(hit.rate * 100)}% of fics tagged ${hit.tag}.`,
        numbers: [{ label: 'DNFs', value: `${hit.dnfs} of ${hit.readings}` }, { label: 'Overall DNF rate', value: Math.round(ctx.overallDnf * 100) + '%' }],
        why: NUDGE_BY_ID['dnf-tag'].rule, expires: null });
    return out;
  }
  function nudgeContext(model, isVisible, lengthStatsIn) {
    const d = dnfPredictorTags(model.readings, isVisible);
    return { lengthStats: lengthStatsIn || lengthStats(model.readings), dnfTags: new Map(d.rows.map(r => [r.tag, r])), overallDnf: d.overall };
  }
  // Page-level nudges. opts: { today, goals, up (from upNextRank), sources (SOURCES, for app links) }
  function pageNudges(model, opts) {
    const today = opts.today, out = [];
    const appOf = (src) => (opts.sources || []).find(s => s.id === src) || {};
    const appName = (src) => { const s = appOf(src); return s.fandom ? `the ${shortFandom(s.fandom)} app` : 'the fandom app'; };
    // 3. stalled
    for (const f of model.fics.filter(x => x.status === 'Currently Reading' || x.status === 'Paused')) {
      const evs = model.eventsByKey.get(f.key) || [];
      const dates = [f.lastReadDate, ...evs.map(e => e.date)].filter(Boolean).sort();
      const last = dates[dates.length - 1];
      if (!last) continue;
      const gap = dayDiff(last, today);
      if (gap > 14) out.push({ id: `stalled:${f.key}:${last}`, type: 'stalled', priority: 70, where: ['dashboard', 'reading'], ficKey: f.key,
        text: `You haven’t opened ${f.title} in ${gap} days. Pick it back up, pause it or DNF it in ${appName(f.source)}.`,
        numbers: [{ label: 'Status', value: f.status }, { label: 'Last activity', value: last }, { label: 'Days since', value: gap }],
        link: appOf(f.source).appUrl ? { href: appOf(f.source).appUrl, label: `Open ${appName(f.source)}` } : null,
        why: NUDGE_BY_ID['stalled'].rule, expires: null });
    }
    // 4. fandom-gap
    const lastRead = opts.up ? opts.up.lastRead : fandomLastRead(model);
    for (const [fandom, last] of lastRead) {
      const gap = dayDiff(last, today);
      if (last >= addDays(today, -183) && gap >= 21) {
        const pick = opts.up ? opts.up.picks.find(p => p.fic.fandom === fandom && !p.snoozedUntil) : null;
        out.push({ id: `fandom-gap:${fandom}:${last}`, type: 'fandom-gap', priority: 50, where: ['dashboard', 'upnext'], pick: pick || null,
          text: `It’s been ${gap >= 35 ? Math.floor(gap / 7) + ' weeks' : gap + ' days'} since your last ${shortFandom(fandom)} read.`,
          numbers: [{ label: 'Last read', value: last }, { label: 'Days since', value: gap }],
          why: NUDGE_BY_ID['fandom-gap'].rule, expires: null });
      }
    }
    // 5. goal-pace
    for (const g of (opts.goals || []).filter(x => !x.archived && x.start <= today && x.end >= today)) {
      const pr = goalProgress(g, model, today);
      if (pr.status !== 'behind pace') continue;
      const unit = { words: 'words', finished: 'fics', newAuthors: 'new authors', scoped: 'fics', long: 'long fics', weeks: 'weeks' }[g.type];
      const text = g.type === 'completion'
        ? `Your completion rate is ${pr.value}%, under your ${pr.target}% goal for ${describeGoal(g, model).replace(/^Keep completion at \d+%\+$/, 'this period')}.`
        : `You need ${g.type === 'words' ? fmtWordsShort(pr.needed) : pr.needed} more ${unit} a week to hit “${describeGoal(g, model)}”.`;
      out.push({ id: `goal-pace:${g.id}`, type: 'goal-pace', priority: 80, where: ['dashboard', 'goals'], goalId: g.id, text,
        numbers: [{ label: 'Progress', value: `${g.type === 'words' ? fmtWordsShort(pr.value) : pr.value} of ${g.type === 'words' ? fmtWordsShort(pr.target) : pr.target}${g.type === 'completion' ? '%' : ''}` },
          { label: 'Period gone', value: Math.round(pr.share * 100) + '%' }, { label: 'Days left', value: pr.daysLeft }],
        why: NUDGE_BY_ID['goal-pace'].rule, expires: g.end });
    }
    // 6. streak-risk
    const st = streaks(model, today);
    const wk = weekStart(today), dow = weekdayOf(today);
    const daysThisWeek = [...readingDays(model, today).keys()].filter(d => d >= wk && d <= today).length;
    if (st.currentWeekly.len >= 4 && dow >= 4 && daysThisWeek === 0)
      out.push({ id: `streak-risk:${wk}`, type: 'streak-risk', priority: 90, where: ['dashboard', 'habits'],
        text: `Read anything this weekend to keep your ${st.currentWeekly.len}-week streak.`,
        numbers: [{ label: 'Weekly streak', value: st.currentWeekly.len + ' weeks' }, { label: 'Reading days this week', value: 0 }],
        why: NUDGE_BY_ID['streak-risk'].rule, expires: addDays(wk, 6) });
    // 7. go-to-author (Dashboard: one per week, the top-ranked such pick; Up Next shows chips instead)
    if (opts.up) {
      const p = opts.up.picks.find(x => x.goToAuthor && !x.snoozedUntil);
      if (p) out.push({ id: `go-to-author:${wk}`, type: 'go-to-author', priority: 40, where: ['dashboard'], pick: p, ficKey: p.key,
        text: `A ${p.goToAuthor.author} fic you haven’t read (you’ve read ${p.goToAuthor.read}).`,
        numbers: [{ label: `${p.goToAuthor.author} fics finished`, value: p.goToAuthor.read }],
        why: NUDGE_BY_ID['go-to-author'].rule, expires: addDays(wk, 6) });
    }
    // 8. badge-close
    const bl = badges(model, today).list;
    const seen = new Set();
    for (const b of bl) {
      if (b.earned || seen.has(b.group)) continue;
      seen.add(b.group);   // only the next locked badge in each group
      const prefix = String(b.key).split('-')[0];
      const unit = BADGE_UNITS[prefix];
      if (!unit || !(b.threshold > 1)) continue;
      const left = b.threshold - b.value;
      if (left > 0 && left <= 0.05 * b.threshold)
        out.push({ id: `badge-close:${b.key}`, type: 'badge-close', priority: 60, where: ['dashboard', 'badges'],
          text: `${prefix === 'words' ? fmtWordsShort(left) : left} more ${left === 1 && unit.endsWith('s') ? unit.slice(0, -1) : unit} until your ${b.title} badge.`,
          numbers: [{ label: 'So far', value: prefix === 'words' ? fmtWordsShort(b.value) : b.value }, { label: 'Badge at', value: prefix === 'words' ? fmtWordsShort(b.threshold) : b.threshold }, { label: 'Left', value: `${Math.round(left / b.threshold * 1000) / 10}%` }],
          why: NUDGE_BY_ID['badge-close'].rule, expires: null });
    }
    return out.sort((a, b) => b.priority - a.priority);
  }
  const nudgeVisible = (n, off, dismissed, today) => !(off && off[n.type] === false) && !(dismissed && dismissed[n.id] && dismissed[n.id] >= today);
  function dashboardNudges(list, off, dismissed, today) {
    return list.filter(n => n.where.includes('dashboard') && nudgeVisible(n, off, dismissed, today)).slice(0, 3);
  }

  return {
    APP_SCORES, appScores, appPercentileRanks,
    UP_NEXT_STATUSES, LENGTH_FILTERS, lengthStats, fandomLastRead, goToAuthorCounts, upNextRank, filterUpNext,
    NUDGE_TYPES, NUDGE_BY_ID, ficNudges, nudgeContext, pageNudges, nudgeVisible, dashboardNudges,
    TZ, MONTHS, MON, KNOWN_STATUSES, NO_PAIRING,
    pairingKey, pairingFor, assignGroups, shortFandom, sourceLabel,
    num, splitList, normIsoDate, cellDate, serialToIso, serialToStamp, parseFicDate, workIdFromLink, realAuthors, parseChapters,
    ficFromRow, parseLogRows, buildReadings, makeReading,
    melbourneToday, makePeriod, shiftPeriod, sameLastYear, likeForLike, rangeLabel, inPeriod, periodName, fmtDay, addDays, monthShift, isIso,
    median, authorFirstDates, periodStats, monthKeys, monthlySeries, monthLabel, topTags, authorRanking,
    emptyFilters, filterCount, filterReadings, sortDiary, exportRow, toCSV, buildModel, REQUIRED_COLS,
    // Phase 2
    MIN_RANK, MIN_RATE, MIN_LOGGED, MIN_PREDICT, isPlaceholderTag, LENGTH_BANDS, WEEKDAYS, DNF_REASONS, lengthBand, weekdayOf, weekStart, quarterKey, quarterLabel, quarterKeys,
    monthName, yearsWithReads, tagTotals, tagBump, tagDrift, completionByBand, dnfReasonOf, dnfReasonsByQuarter, dnfPredictorTags, abandonPoints,
    goToAuthors, loyaltyByYear, rereadList, weekdayCounts, readingClock, readingDays, streaks, calendarYear, paceByBand, monthTotals,
    personalBests, persona, availableRecaps, recap, yardstick, volumeFindings, completionMonthFinding, statusFinding, fmtK,
    // Phase 3
    MIN_DIVERSITY, DIVERSITY_DIMS, categoryWords, entropyScore, diversityYear, diversityByYear, diversityFinding,
    GOAL_TYPES, goalPeriod, goalProgress, describeGoal, badges, MIN_SESSIONS, sessions, sessionStats,
    reflectionWindow, reflectionFor, yearPrompt, noteExcerpt,
  };
})();
if (typeof module !== 'undefined' && module.exports) module.exports = ShelfRules;
// </shelf-rules>
</script>

<script>
// ============================================================================================
// SHEETS (READ-ONLY) + CACHE
// Every request that READS goes through readOnlyGet(), which only ever sends GET. The fandom
// Sheets are only ever read: the Sheets scope is spreadsheets.readonly, so Google refuses any write
// to them. Shelf Life's own goals/notes Sheet is written only by writeShelfData() (next script).
// ============================================================================================
const CLIENT_ID = '765897251156-e328g6jmu2obg8l0855km0iqsps062n5.apps.googleusercontent.com';
const SCOPE = 'https://www.googleapis.com/auth/spreadsheets.readonly';
const TOKEN_KEY = 'shelflife-gtoken';
const THEME_KEY = 'shelflife-theme';
const DATA_VERSION = 4;   // 4: fics carry the raw fields the app scores use
const SHEETS_API = 'https://sheets.googleapis.com/v4/spreadsheets/';
// The Sheets themselves are listed in SOURCES at the top of the file.
const SOURCE_BY_ID = Object.fromEntries(SOURCES.map(s => [s.id, s]));

function colLetter(index) {
  let s = '', i = index + 1;
  while (i > 0) { const rem = (i - 1) % 26; s = String.fromCharCode(65 + rem) + s; i = Math.floor((i - 1) / 26); }
  return s;
}

async function readOnlyGet(url, token, timeoutMs) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs || 60000);
  let res;
  try {
    res = await fetch(url, { method: 'GET', headers: { Authorization: 'Bearer ' + token }, signal: controller.signal });
  } catch (e) {
    throw new Error(e.name === 'AbortError' ? 'Timed out. Check your connection and try again.' : 'Network error. Check your connection.');
  } finally { clearTimeout(timer); }
  if (!res.ok) {
    const body = await res.text();
    const err = new Error(`HTTP ${res.status}: ${body.slice(0, 200)}`);
    err.status = res.status;
    if (res.status === 401) err.isAuthError = true;
    if (res.status === 400 && /unable to parse range|not found/i.test(body)) err.isRangeError = true;
    throw err;
  }
  return res.json();
}

// One source Sheet: header row first (to find columns by name), then a single values.batchGet for
// every Data List column except Summary, plus the Reading Log.
async function loadSource(token, source) {
  const base = SHEETS_API + source.sheetId;
  const hdr = await readOnlyGet(`${base}/values/${encodeURIComponent("'Data List'!1:1")}`, token, 20000);
  const header = ((hdr.values || [])[0] || []).map(h => String(h).trim());
  if (!header.length) throw new Error('The "Data List" tab has no header row.');
  const headerIndex = {}, seen = new Set(), duplicateHeaders = [];
  header.forEach((h, i) => { if (!h) return; if (seen.has(h) && !duplicateHeaders.includes(h)) duplicateHeaders.push(h); seen.add(h); headerIndex[h] = i; });
  const summaryIdx = headerIndex['Summary'];
  const blocks = [];
  let a = 0;
  for (let i = 0; i <= header.length; i++) {
    if (i === header.length || i === summaryIdx) { if (i > a) blocks.push([a, i - 1]); a = i + 1; }
  }
  const dataRanges = blocks.map(([s, e]) => `'Data List'!${colLetter(s)}2:${colLetter(e)}`);
  const batch = (ranges) => readOnlyGet(`${base}/values:batchGet?majorDimension=ROWS&` + ranges.map(r => 'ranges=' + encodeURIComponent(r)).join('&'), token, 90000);
  let res, logMissing = false;
  try {
    res = await batch([...dataRanges, "'Reading Log'!A:F"]);
  } catch (e) {
    if (!e.isRangeError) throw e;
    res = await batch(dataRanges);
    logMissing = true;
  }
  const vr = res.valueRanges || [];
  // Date columns again, unformatted: a real date cell comes back as a serial number, so the sheet's
  // display format (d/m vs m/d, "8 Dec 2025"...) can never stop a date being read. Text cells the
  // apps wrote ("2026-10-10 19:17") come back unchanged.
  const dateCols = ['Date Started', 'Date Read', 'Last Read'].filter(c => headerIndex[c] !== undefined);
  let serials = [];
  if (dateCols.length) {
    const r2 = await readOnlyGet(`${base}/values:batchGet?majorDimension=ROWS&valueRenderOption=UNFORMATTED_VALUE&dateTimeRenderOption=SERIAL_NUMBER&` +
      dateCols.map(c => 'ranges=' + encodeURIComponent(`'Data List'!${colLetter(headerIndex[c])}2:${colLetter(headerIndex[c])}`)).join('&'), token, 60000);
    serials = (r2.valueRanges || []).map(x => x.values || []);
  }
  const nRows = Math.max(0, ...blocks.map((_, j) => ((vr[j] || {}).values || []).length));
  const fics = [];
  for (let i = 0; i < nRows; i++) {
    const row = new Array(header.length).fill('');
    blocks.forEach(([s], j) => { const vals = ((vr[j] || {}).values || [])[i] || []; for (let k = 0; k < vals.length; k++) row[s + k] = vals[k]; });
    dateCols.forEach((c, j) => {
      const v = ((serials[j] || [])[i] || [])[0];
      if (typeof v === 'number') row[headerIndex[c]] = c === 'Last Read' ? ShelfRules.serialToStamp(v) : ShelfRules.serialToIso(v);
    });
    const fic = ShelfRules.ficFromRow(headerIndex, row, i + 2, source.id);
    if (fic) { delete fic.summary; fics.push(fic); }
  }
  const log = logMissing ? [] : ShelfRules.parseLogRows((vr[blocks.length] || {}).values || [], source.id);
  return {
    key: source.id, syncedAt: Date.now(), header, fics, log, logMissing, duplicateHeaders,
    missingCols: ShelfRules.REQUIRED_COLS.filter(c => headerIndex[c] === undefined),
    summaryCol: summaryIdx !== undefined ? colLetter(summaryIdx) : null,
    linkCol: headerIndex['Link'] !== undefined ? colLetter(headerIndex['Link']) : null,
  };
}

// A fic's summary, fetched only when its detail opens. The Link cell is fetched alongside it: if the
// row no longer holds this fic (rows sorted or inserted since the last sync), we say so instead of
// showing someone else's summary.
async function fetchSummary(token, source, meta, fic) {
  if (!meta.summaryCol) throw new Error('This sheet has no "Summary" column.');
  const ranges = [`'Data List'!${meta.summaryCol}${fic.rowNumber}`, `'Data List'!${meta.linkCol}${fic.rowNumber}`];
  const res = await readOnlyGet(`${SHEETS_API}${source.sheetId}/values:batchGet?` + ranges.map(r => 'ranges=' + encodeURIComponent(r)).join('&'), token, 20000);
  const cell = (j) => String((((res.valueRanges || [])[j] || {}).values || [[]])[0]?.[0] ?? '');
  if (ShelfRules.workIdFromLink(cell(1).trim(), fic.rowNumber) !== fic.id) {
    const e = new Error('The sheet has changed since the last sync. Sync now, then open this fic again.'); e.moved = true; throw e;
  }
  return cell(0).trim();
}

// IndexedDB: a single key-value store. Holds the synced data and any summaries already opened.
const idb = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((resolve, reject) => {
    try {
      const req = indexedDB.open('shelf-life', 1);
      req.onupgradeneeded = () => req.result.createObjectStore('kv');
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    } catch (e) { reject(e); }
  }));
  const run = (mode, fn) => open().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction('kv', mode); const req = fn(tx.objectStore('kv'));
    tx.oncomplete = () => resolve(req && req.result); tx.onerror = () => reject(tx.error); tx.onabort = () => reject(tx.error);
  }));
  return {
    get: (k) => run('readonly', s => s.get(k)).catch(() => undefined),
    put: (k, v) => run('readwrite', s => s.put(v, k)).catch(() => undefined),
    clear: () => run('readwrite', s => s.clear()).catch(() => undefined),
    // Clear everything except the listed keys (used so "Clear cached data" keeps tag overrides).
    clearExcept: async (keep) => {
      const keys = await run('readonly', s => s.getAllKeys()).catch(() => []);
      for (const k of keys || []) if (!keep.includes(k)) await run('readwrite', s => s.delete(k)).catch(() => undefined);
    },
  };
})();
</script>

<script>
// ============================================================================================
// SHELF LIFE DATA: goals, notes and settings (the ONLY place Shelf Life writes)
// --------------------------------------------------------------------------------------------
// The fandom Sheets stay read-only. Shelf Life's own data lives in one spreadsheet it creates,
// "Shelf Life Data", tagged with a hidden Drive marker (appProperties shelfLife=data-v1).
//   * Permissions: spreadsheets.readonly (as before) + drive.file, which only reaches files this
//     app created. drive.file is asked for the first time goals or notes are used.
//   * include_granted_scopes is false, so a sign-in never picks up the write access the fandom
//     apps hold on the same OAuth client. Google itself then refuses any fandom-Sheet write.
//   * Reads go through readOnlyGet() (GET only).
//   * Writes go through writeShelfData() and nothing else. It refuses:
//       - any spreadsheet ID listed in SOURCES;
//       - any write before a Shelf Life Data ID has been confirmed (found by its marker, or just
//         created by this app);
//       - any spreadsheet ID other than that confirmed one.
//   * The one other non-GET request is createShelfDataFile(): a Drive "create file" call whose
//     body is fixed here. It makes a new empty spreadsheet and cannot touch an existing file.
// ============================================================================================
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
const DRIVE_API = 'https://www.googleapis.com/drive/v3/files';
const SHELF_DATA_NAME = 'Shelf Life Data';
const SHELF_MARKER = { key: 'shelfLife', value: 'data-v1' };
const STORAGE_FLAG_KEY = 'shelflife-storage-on';   // localStorage: '1' once goals/notes were switched on
const SHELF_ID_KEY = 'shelflife-data-id';          // localStorage: the Shelf Life Data ID on this device
const SHELF_CACHE_KEY = 'shelfData';               // IndexedDB: offline copy of goals, notes, settings
const SHELF_TABS = {
  Goals: ['id', 'type', 'scope', 'target', 'start', 'end', 'created', 'archived', 'updated'],
  Notes: ['period', 'kind', 'text', 'created', 'updated'],
  Settings: ['key', 'value', 'updated'],
};
const FANDOM_SHEET_IDS = new Set(SOURCES.map(s => s.sheetId));

// The confirmed Shelf Life Data ID lives in this closure. Only confirmShelfDataId() sets it, and
// only with a file that carries the marker (or that this app just created).
const shelfIdGuard = (() => {
  let confirmed = null;
  return {
    get: () => confirmed,
    set: (id, file) => {
      if (!id || FANDOM_SHEET_IDS.has(id)) throw new Error('Refused: that is a fandom Sheet, not Shelf Life Data.');
      const ap = (file && file.appProperties) || {};
      if (ap[SHELF_MARKER.key] !== SHELF_MARKER.value) throw new Error('Refused: that file is not marked as Shelf Life Data.');
      confirmed = id;
      try { localStorage.setItem(SHELF_ID_KEY, id); } catch (e) {}
    },
    clear: () => { confirmed = null; },
  };
})();

function assertShelfWritable(spreadsheetId) {
  if (typeof spreadsheetId !== 'string' || !spreadsheetId) throw new Error('Refused: no spreadsheet ID.');
  if (FANDOM_SHEET_IDS.has(spreadsheetId)) throw new Error('Refused: Shelf Life never writes to a fandom Sheet.');
  const confirmed = shelfIdGuard.get();
  if (!confirmed) throw new Error('Refused: Shelf Life Data has not been confirmed yet.');
  if (spreadsheetId !== confirmed) throw new Error('Refused: writes only go to the Shelf Life Data sheet.');
}

// THE write path. op is one of:
//   { type: 'setup' }                      rename the first tab to Goals, add Notes and Settings, write headers
//   { type: 'replaceTab', tab, rows }      clear a tab and write its header plus rows
async function writeShelfData(token, spreadsheetId, op) {
  assertShelfWritable(spreadsheetId);
  if (!op || !['setup', 'replaceTab'].includes(op.type)) throw new Error('Refused: unknown write.');
  const base = SHEETS_API + encodeURIComponent(spreadsheetId);
  const send = async (url, method, body) => {
    assertShelfWritable(spreadsheetId);                  // checked again right before every request
    if (!url.startsWith(base)) throw new Error('Refused: request is not for Shelf Life Data.');
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 30000);
    let res;
    try {
      res = await fetch(url, { method, headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' }, body: JSON.stringify(body), signal: controller.signal });
    } catch (e) { throw new Error(e.name === 'AbortError' ? 'Timed out saving.' : 'Network error while saving.'); }
    finally { clearTimeout(timer); }

    return res.json();
  };
  if (op.type === 'setup') {
    const meta = await readOnlyGet(`${base}?fields=sheets.properties`, token, 20000);
    const sheets = (meta.sheets || []).map(s => s.properties);
    const have = new Set(sheets.map(p => p.title));
    const requests = [];
    const tabs = Object.keys(SHELF_TABS);
    if (!have.has('Goals') && sheets[0] && !tabs.includes(sheets[0].title)) { requests.push({ updateSheetProperties: { properties: { sheetId: sheets[0].sheetId, title: 'Goals' }, fields: 'title' } }); have.add('Goals'); }
    tabs.forEach(t => { if (!have.has(t)) requests.push({ addSheet: { properties: { title: t } } }); });
    if (requests.length) await send(`${base}:batchUpdate`, 'POST', { requests });
    await send(`${base}/values:batchUpdate`, 'POST', { valueInputOption: 'RAW', data: tabs.map(t => ({ range: `'${t}'!A1`, values: [SHELF_TABS[t]] })) });
    return { ok: true };
  }

  if (!head) throw new Error('Refused: unknown tab.');
  const rows = (op.rows || []).map(r => head.map(h => r[h] === undefined || r[h] === null ? '' : String(r[h])));

}

// Drive look-ups (GET). The query matches the name AND the hidden marker; drive.file means only
// files this app created can come back anyway.
async function findShelfDataFile(token) {
  const q = `name = '${SHELF_DATA_NAME}' and appProperties has { key='${SHELF_MARKER.key}' and value='${SHELF_MARKER.value}' } and trashed = false`;
  const res = await readOnlyGet(`${DRIVE_API}?q=${encodeURIComponent(q)}&orderBy=createdTime&fields=${encodeURIComponent('files(id,name,appProperties,createdTime)')}&spaces=drive`, token, 20000);
  return (res.files || []).find(f => f.appProperties && f.appProperties[SHELF_MARKER.key] === SHELF_MARKER.value) || null;
}
async function getShelfDataFile(token, id) {
  try { const f = await readOnlyGet(`${DRIVE_API}/${encodeURIComponent(id)}?fields=${encodeURIComponent('id,name,appProperties,trashed')}`, token, 20000); return f && !f.trashed ? f : null; }
  catch (e) { if (e.isAuthError) throw e; return null; }
}

async function createShelfDataFile(token) {
  const res = await fetch(`${DRIVE_API}?fields=${encodeURIComponent('id,name,appProperties')}`, {
    method: 'POST', headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: SHELF_DATA_NAME, mimeType: 'application/vnd.google-apps.spreadsheet', appProperties: { [SHELF_MARKER.key]: SHELF_MARKER.value } }),
  });
  if (!res.ok) { const t = await res.text(); const err = new Error(`HTTP ${res.status}: ${t.slice(0, 200)}`); err.status = res.status; if (res.status === 401) err.isAuthError = true; throw err; }
  return res.json();
}

// Find (or create) Shelf Life Data and confirm its ID for writes. Returns the ID.
async function connectShelfData(token) {
  let cachedId = null;
  try { cachedId = localStorage.getItem(SHELF_ID_KEY); } catch (e) {}
  let file = cachedId && !FANDOM_SHEET_IDS.has(cachedId) ? await getShelfDataFile(token, cachedId) : null;
  if (file && !(file.appProperties && file.appProperties[SHELF_MARKER.key] === SHELF_MARKER.value)) file = null;
  if (!file) file = await findShelfDataFile(token);
  if (file) { shelfIdGuard.set(file.id, file); return { id: file.id, created: false }; }
  const made = await createShelfDataFile(token);
  shelfIdGuard.set(made.id, made);
  await writeShelfData(token, made.id, { type: 'setup' });
  return { id: made.id, created: true };
}

// Read every tab of Shelf Life Data (GET). Rows come back as objects keyed by header.
async function readShelfData(token, id) {
  const tabs = Object.keys(SHELF_TABS);
  const res = await readOnlyGet(`${SHEETS_API}${encodeURIComponent(id)}/values:batchGet?majorDimension=ROWS&` + tabs.map(t => 'ranges=' + encodeURIComponent(`'${t}'!A:I`)).join('&'), token, 20000);
  const out = {};
  tabs.forEach((t, i) => {
    const vr = (res.valueRanges || [])[i] || {};
    const rows = vr.values || [];
    const head = (rows[0] || SHELF_TABS[t]).map(h => String(h).trim());
    out[t] = rows.slice(1).filter(r => r.some(c => String(c).trim() !== '')).map(r => Object.fromEntries(head.map((h, j) => [h, r[j] === undefined ? '' : String(r[j])])));
  });
  return out;
}

function parseShelfData(raw) {
  const settings = Object.fromEntries((raw.Settings || []).map(r => [r.key, r.value]));
  let overrides = {};
  try { overrides = settings.tagOverrides ? JSON.parse(settings.tagOverrides) : {}; } catch (e) { overrides = {}; }
  const json = (k) => { try { const v = settings[k] ? JSON.parse(settings[k]) : {}; return v && typeof v === 'object' ? v : {}; } catch (e) { return {}; } };
  return {
    snoozes: json('snoozes'), dismissed: json('dismissed'), nudgeTypes: json('nudgeTypes'),
    goals: (raw.Goals || []).filter(r => r.id).map(goalFromRow),
    notes: (raw.Notes || []).filter(r => r.period).map(noteFromRow),
    settingsRows: raw.Settings || [], overrides: overrides && typeof overrides === 'object' ? overrides : {},
  };
}

    y: { stacked: true, beginAtZero: true, grid: { color: t.line }, border: { display: false }, ticks: { color: t.ink3, maxTicksLimit: 4, font: { size: 11 }, callback: yFmt || (v => v) } },
  };
}
// Stacked bars: round only the top-most non-empty segment of each bar.
function topRadius(wordsByGroup, keys, i) {
  return (ctx) => {
    const j = ctx.dataIndex;
    const top = keys.map(k => wordsByGroup[k][j]).reduce((acc, v, k) => v > 0 ? k : acc, -1);
    return i === top ? { topLeft: 8, topRight: 8, bottomLeft: 0, bottomRight: 0 } : 0;
  };
}
function tooltip(t, label) {
  return { backgroundColor: '#111111', titleColor: '#FFFFFF', bodyColor: '#FFFFFF', padding: 10, cornerRadius: 12, displayColors: true, boxPadding: 4,
    titleFont: { family: "'Plus Jakarta Sans', sans-serif", weight: '700' }, bodyFont: { family: "'Plus Jakarta Sans', sans-serif", weight: '600' }, callbacks: label ? { label } : {} };
}

// ---------- auth ----------
function readCachedToken() {
  try { const c = JSON.parse(localStorage.getItem(TOKEN_KEY) || 'null'); if (c && c.token && Date.now() < c.expiresAt) return c; } catch (e) {}
  return null;
}
function useAuth() {
  const [tok, setTok] = useState(readCachedToken);
  const [ready, setReady] = useState(false);
  const [error, setError] = useState('');
  const clientRef = useRef(null);
  const waiters = useRef([]);
  const tokRef = useRef(tok);
  useEffect(() => { tokRef.current = tok; }, [tok]);
  useEffect(() => {
    let cancelled = false;
    const settle = (fn) => { const w = waiters.current; waiters.current = []; w.forEach(fn); };
    (function init() {
      if (cancelled) return;
      if (!window.google || !window.google.accounts || !window.google.accounts.oauth2) { setTimeout(init, 200); return; }
      clientRef.current = window.google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPE,
        // Never fold in permissions granted to this client elsewhere (the fandom apps share it and
        // hold write access to their Sheets). Shelf Life only ever gets the scopes it asks for.
        include_granted_scopes: false,
        callback: (resp) => {
          if (resp.error) { setError(resp.error_description || resp.error); settle(w => w.reject(new Error(resp.error))); return; }
          const t = { token: resp.access_token, scope: resp.scope || '', expiresAt: Date.now() + (Number(resp.expires_in) || 3600) * 1000 - 60000 };
          try { localStorage.setItem(TOKEN_KEY, JSON.stringify(t)); } catch (e) {}
          setError(''); tokRef.current = t; setTok(t);
          settle(w => w.resolve(t.token));
        },
        error_callback: (err) => { setError((err && (err.message || err.type)) || 'Sign-in was cancelled.'); settle(w => w.reject(new Error('cancelled'))); },
      });
      setReady(true);
    })();
    return () => { cancelled = true; };
  }, []);
  const getToken = useCallback(() => { const t = tokRef.current; return t && Date.now() < t.expiresAt ? t.token : null; }, []);
  // withDrive (or goals/notes already switched on): also ask for drive.file, for Shelf Life Data.
  const signIn = useCallback((opts) => new Promise((resolve, reject) => {
    if (!clientRef.current) { reject(new Error('Google sign-in is still loading.')); return; }
    let on = false; try { on = localStorage.getItem(STORAGE_FLAG_KEY) === '1'; } catch (e) {}
    const scope = (opts && opts.withDrive) || on ? `${SCOPE} ${DRIVE_SCOPE}` : SCOPE;
    waiters.current.push({ resolve, reject });
    clientRef.current.requestAccessToken({ scope, include_granted_scopes: false });
  }), []);
  const hasDrive = useCallback(() => { const t = tokRef.current; return !!(t && Date.now() < t.expiresAt && String(t.scope || '').split(/\s+/).includes(DRIVE_SCOPE)); }, []);
  const expire = useCallback(() => { try { localStorage.removeItem(TOKEN_KEY); } catch (e) {} tokRef.current = null; setTok(null); }, []);
  const signOut = useCallback(() => {
    const t = getToken();
    if (t && window.google && window.google.accounts) window.google.accounts.oauth2.revoke(t, () => {});
    expire();
  }, [getToken, expire]);
  return { signedIn: !!(tok && Date.now() < tok.expiresAt), ready, error, getToken, signIn, signOut, expire, hasDrive, tok };
}

// ---------- theme ----------
function useTheme() {
  const [mode, setMode] = useState(() => { try { return localStorage.getItem(THEME_KEY) || 'system'; } catch (e) { return 'system'; } });
  const [tick, setTick] = useState(0);
  useEffect(() => {
    const root = document.documentElement;
    if (mode === 'system') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', mode);
    try { localStorage.setItem(THEME_KEY, mode); } catch (e) {}
    const meta = document.querySelector('meta[name="theme-color"]');
    requestAnimationFrame(() => { if (meta) meta.setAttribute('content', cssVar('--bg')); setTick(t => t + 1); });
  }, [mode]);
  useEffect(() => {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const on = () => setTick(t => t + 1);
    mq.addEventListener ? mq.addEventListener('change', on) : mq.addListener(on);
    return () => { mq.removeEventListener ? mq.removeEventListener('change', on) : mq.removeListener(on); };
  }, []);
  const cycle = () => setMode(m => m === 'system' ? 'light' : m === 'light' ? 'dark' : 'system');
  return { mode, cycle, tick };
}

const PERIOD_OPTIONS = [['thisMonth', 'This month'], ['lastMonth', 'Last month'], ['thisQuarter', 'This quarter'], ['thisYear', 'This year'], ['lastYear', 'Last year'], ['all', 'All time'], ['custom', 'Custom']];

function headline(cur, prev, p, cp, today, level, model) {
  const name = R.periodName(p, today);
  const when = p.unit === 'all' ? 'in total' : (p.unit === 'days' ? `from ${name}` : `in ${name}`) + (p.partial ? ' so far' : '');
  if (!cur.finished && !cur.dnfs) return p.unit === 'all' ? 'No finished reads yet.' : `Nothing finished ${when} yet.`;
  // Built as parts so the words figure and the fandom/pairing names can carry the highlighter.
  const s = ['You read ', { hl: 'lime', t: `${fmtWords(cur.words)} words` }, ` ${when}`];
  if (prev && cp) {
    const cname = R.periodName(cp, today);
    if (prev.words > 0) {
      const d = (cur.words - prev.words) / prev.words, pct = Math.round(Math.abs(d) * 100);
      s.push(pct === 0 ? `, about the same as ${cname}` : `, ${pct}% ${d > 0 ? 'more' : 'fewer'} than ${cname}`);
    } else if (cur.words > 0) s.push(cp.type === 'likeForLike' ? `, up from none over ${cname}` : `, up from none in ${cname}`);
  }
  // "mostly …" names the biggest fandom (or pairing, when the breakdown is set to Pairing).
  const byPairing = level === 'pairing';
  const nameOf = (k) => byPairing ? ((model.pairingByKey.get(k) || {}).name || k) : R.shortFandom(k);
  const parts = Object.entries(byPairing ? cur.byPairing : cur.byFandom).filter(([, w]) => w > 0).sort((a, b) => b[1] - a[1]);
  const total = parts.reduce((t, [, w]) => t + w, 0);
  if (parts.length === 1 && total > 0) s.push(', all ', { hl: 'pink', t: nameOf(parts[0][0]) });
  else if (parts.length > 1) {
    if (parts[0][1] / total >= 0.6) s.push(', mostly ', { hl: 'pink', t: nameOf(parts[0][0]) });
    else s.push(', split between ', { hl: 'pink', t: nameOf(parts[0][0]) }, ' and ', { hl: 'lime', t: nameOf(parts[1][0]) });
  }
  s.push('.');
  return s.map((x, i) => typeof x === 'string' ? x : html`<span key=${i} className=${'hl ' + x.hl}>${x.t}</span>`);
}

function delta(cur, prev, kind) {
  if (prev === null || prev === undefined || cur === null || cur === undefined) return null;
  if (kind === 'pts') {
    const d = Math.round((cur - prev) * 100);
    return { text: d === 0 ? '±0 pts' : `${d > 0 ? '+' : '−'}${Math.abs(d)} pts`, dir: Math.sign(d) };
  }
  if (prev === 0) return cur === 0 ? { text: '±0', dir: 0 } : { text: 'new', dir: 1 };
  const d = (cur - prev) / prev, pct = Math.round(Math.abs(d) * 100);
  return { text: pct === 0 ? '±0%' : `${d > 0 ? '↑' : '↓'} ${pct}%`, dir: pct === 0 ? 0 : Math.sign(d) };
}

function WordsPerMonth({ model, p, today, themeTick, level }) {
  const { config, groups } = useMemo(() => {
    const t = chartTheme();
    let from, to;
    const nowKey = today.slice(0, 7);
    if (p.unit === 'all') { from = (model.firstDate || today).slice(0, 7); to = nowKey; }
    else {
      const endKey = p.end.slice(0, 7) > nowKey ? nowKey : p.end.slice(0, 7);
      const spanMonths = R.monthKeys(p.start.slice(0, 7), p.end.slice(0, 7)).length;
      if (spanMonths >= 3) { from = p.start.slice(0, 7); to = endKey; }
      else { const [y, m] = endKey.split('-').map(Number); const [sy, sm] = R.monthShift(y, m, -11); from = `${sy}-${String(sm).padStart(2, '0')}`; to = endKey; }
    }
    if (from > to) from = to;
    const keys = R.monthKeys(from, to);
    const totals = {}, present = new Set();
    for (const r of model.readings) {
      if (!r.date) continue; const mk = r.date.slice(0, 7); if (mk < from || mk > to) continue;
      present.add(r.pairingKey); if (r.words !== null) totals[r.pairingKey] = (totals[r.pairingKey] || 0) + r.words;
    }
    const groups = makeGroups(model, level, totals, present);
    const s = R.monthlySeries(model.readings, keys, groups.keys, groups.of);
    const multiYear = keys[0].slice(0, 4) !== keys[keys.length - 1].slice(0, 4);
    return { groups, config: {
      type: 'bar',
      data: { labels: keys.map(k => R.monthLabel(k, multiYear)), datasets: groups.keys.map((k, i) => ({ label: groups.short(k), data: s.words[k], backgroundColor: groups.color(k), borderRadius: topRadius(s.words, groups.keys, i), borderSkipped: false, maxBarThickness: 26, stack: 'w' })) },
      options: { responsive: true, maintainAspectRatio: false, animation: { duration: 250 }, interaction: { mode: 'index', intersect: false },
        plugins: { legend: { display: false }, tooltip: { ...tooltip(t, c => ` ${c.dataset.label}: ${fmtWords(c.parsed.y)}`), filter: c => c.parsed.y > 0 } },
        scales: baseScales(t, v => fmtWords(v)) },
    } };
  }, [model, p.start, p.end, p.unit, today, themeTick, level]);
  return html`<div className="card">
    <${ChartBox} config=${config} height=${200} />
    <${GroupLegend} groups=${groups} />
  </div>`;
}

// Legend for a fandom/pairing breakdown. In pairing view, pairings sit under their fandom.
function GroupLegend({ groups, suffix }) {
  if (groups.level === 'fandom') return html`<div className="legend">${groups.keys.map(k => html`<span key=${k}><i style=${{ background: groups.color(k) }}></i>${groups.label(k)}${suffix || ''}</span>`)}</div>`;
  const byFandom = [];
  for (const k of groups.keys) {
    const f = groups.fandomOf(k);
    let e = byFandom.find(x => x.f === f); if (!e) { e = { f, keys: [] }; byFandom.push(e); }
    e.keys.push(k);
  }
  if (!byFandom.length) return html`<div className="legend faint">No readings in this range.</div>`;
  return html`<div style=${{ marginTop: 10, display: 'flex', flexDirection: 'column', gap: 8 }}>${byFandom.map(e => html`<div key=${e.f}>
    <div className="tiny faint" style=${{ fontWeight: 700, marginBottom: 3 }}>${e.f}</div>
    <div className="legend" style=${{ marginTop: 0 }}>${e.keys.map(k => html`<span key=${k}><i style=${{ background: groups.color(k) }}></i>${groups.label(k)}${suffix || ''}</span>`)}</div>
  </div>`)}</div>`;
}

// Share of words read by fandom, or by pairing within each fandom.
function GroupSplit({ model, stats, themeTick, level }) {
  const { groups, words, counts } = useMemo(() => {
    const groups = makeGroups(model, level, stats.byPairing, new Set(Object.keys(stats.countPairing)));
    const words = {}, counts = {};
    for (const r of stats.readings) {
      const g = groups.of(r); if (g === undefined) continue;
      counts[g] = (counts[g] || 0) + 1; if (r.words !== null) words[g] = (words[g] || 0) + r.words;
    }
    return { groups, words, counts };
  }, [model, stats, level]);
  const keys = groups.level === 'fandom' ? groups.keys : groups.keys.filter(k => counts[k]);
  const config = useMemo(() => {
    const t = chartTheme();
    return {
      type: 'doughnut',
      data: { labels: keys.map(groups.short), datasets: [{ data: keys.map(k => words[k] || 0), backgroundColor: keys.map(groups.color), borderColor: t.surface, borderWidth: 3, hoverOffset: 4 }] },
      options: { responsive: true, maintainAspectRatio: false, cutout: '70%', animation: { duration: 250 }, plugins: { legend: { display: false }, tooltip: tooltip(t, c => ` ${c.label}: ${fmtWords(c.parsed)}`) } },
    };
  }, [groups, words, themeTick]);
  const total = Object.values(words).reduce((a, b) => a + b, 0);
  // Pairing view has more (and longer) rows, so the doughnut sits above the list instead of beside it.
  const stacked = groups.level === 'pairing';
  const ring = stacked ? 150 : 112;
  return html`<div className="card" style=${{ display: 'grid', gridTemplateColumns: stacked ? 'minmax(0, 1fr)' : '112px minmax(0, 1fr)', gap: 16, alignItems: 'start' }}>
    <div style=${{ width: ring, justifySelf: stacked ? 'center' : 'start' }}>${total ? html`<${ChartBox} config=${config} height=${ring} />` : html`<div style=${{ width: ring, height: ring, borderRadius: '50%', boxShadow: 'inset 0 0 0 14px var(--surface-2)' }}></div>`}</div>
    <div>
      ${!keys.length ? html`<div className="small faint">No readings in this period.</div>` : null}
      ${keys.map((k, i) => {
        const w = words[k] || 0, n = counts[k] || 0;
        const fandomHead = groups.level === 'pairing' && (i === 0 || groups.fandomOf(keys[i - 1]) !== groups.fandomOf(k));
        return html`<div key=${k}>
          ${fandomHead ? html`<div className="tiny faint" style=${{ fontWeight: 700, margin: i ? '8px 0 0' : 0 }}>${groups.fandomOf(k)}</div>` : null}
          <div style=${{ padding: '4px 0' }}>
            <div className="row" style=${{ gap: 8, flexWrap: 'nowrap', justifyContent: 'space-between', alignItems: 'flex-start' }}>
              <span className="row" style=${{ gap: 8, flexWrap: 'nowrap', alignItems: 'flex-start', minWidth: 0 }}><i style=${{ width: 10, height: 10, borderRadius: 3, background: groups.color(k), display: 'inline-block', flexShrink: 0, marginTop: 5 }}></i><b style=${{ fontWeight: 600 }}>${groups.label(k)}</b></span>
              <span className="num" style=${{ fontWeight: 600 }}>${total ? Math.round(w / total * 100) : 0}%</span>
            </div>
            <div className="tiny muted num" style=${{ paddingLeft: 18 }}>${fmtWords(w)} words · ${n} read${n === 1 ? '' : 's'}</div>
          </div>
        </div>`;
      })}
    </div>
  </div>`;
}

function Dashboard({ model, today, themeTick, onOpen, onTag, dash, setDash, groupBy, setGroupBy, openRecap, store, openGoals, openBadges, p4, openUpNext }) {

  const { period, custom, compare } = dash;
  const p = useMemo(() => R.makePeriod(period, today, custom), [period, today, custom.start, custom.end]);
  // Comparison period: previous period or same time last year, trimmed to the same number of days
  // while the selected period is still in progress (R.likeForLike). Sparklines below use full periods.
  const cp = useMemo(() => {
    if (p.unit === 'all') return null;
    const full = compare === 'year' ? R.sameLastYear(p) : R.shiftPeriod(p, -1);
    return R.likeForLike(p, full, today);
  }, [p, compare, today]);
  const cur = useMemo(() => R.periodStats(model.readings, p, model.authorFirst), [model, p]);
  const prev = useMemo(() => cp ? R.periodStats(model.readings, cp, model.authorFirst) : null, [model, cp]);
  // Sparklines: the 12 periods ending with this one (months for All time).
  const spark = useMemo(() => {
    const base = p.unit === 'all' ? R.makePeriod('thisMonth', today) : p;
    const list = [];
    for (let k = -11; k <= 0; k++) list.push(R.periodStats(model.readings, k === 0 ? base : R.shiftPeriod(base, k), model.authorFirst));
    return list;
  }, [model, p, today]);
  const sp = (fn) => spark.map(fn);
  const cmpLabel = cp ? R.periodName(cp, today) : '';
  const set = (patch) => setDash(d => ({ ...d, ...patch }));
  return html`<div>

      : `${p.partial ? R.rangeLabel(p.start, today < p.end ? today : p.end, today) + ' so far' : R.rangeLabel(p.start, p.end, today)}${cp ? ` · compared with ${cmpLabel}` : ''}`}</div>
    <${PeriodPicker} period=${period} setPeriod=${v => set({ period: v })} custom=${custom} setCustom=${fn => setDash(d => ({ ...d, custom: fn(d.custom) }))} compare=${compare} setCompare=${v => set({ compare: v })} today=${today} />

      <${StatTile} tone="lime" label="Fics finished" value=${fmtInt(cur.finished)} d=${prev && delta(cur.finished, prev.finished)} good=${true} spark=${sp(s => s.finished)} cmpLabel=${cmpLabel}

      <${StatTile} tone="coral" label="DNFs" value=${fmtInt(cur.dnfs)} d=${prev && delta(cur.dnfs, prev.dnfs)} good=${null} spark=${sp(s => s.dnfs)} cmpLabel=${cmpLabel} />
      <${StatTile} tone="pink" label="Completion rate" value=${fmtPct(cur.completion)} d=${prev && cur.completion !== null && prev.completion !== null ? delta(cur.completion, prev.completion, 'pts') : null} good=${true} spark=${sp(s => s.completion)} cmpLabel=${cmpLabel} />
      <${StatTile} label="New authors" value=${fmtInt(cur.newAuthors)} d=${prev && delta(cur.newAuthors, prev.newAuthors)} good=${true} spark=${sp(s => s.newAuthors)} cmpLabel=${cmpLabel} />

        note="Words, finished fics" />
    </div>

    <${NudgeList} list=${dashN} store=${store} today=${today} onOpen=${onOpen} />
    <${ReflectionCard} model=${model} today=${today} store=${store} />
    <${GoalRings} model=${model} today=${today} store=${store} openGoals=${openGoals} />

function TagPicker({ label, chosen, onAdd, onRemove, vocab, exclude, tone }) {
  const [q, setQ] = useState('');
  const ctx = useContext(TagCtx);
  // Options leave out hidden (sex-related) tags while the toggle is off. Tags already chosen stay visible.
  const sugg = useMemo(() => {
    const ql = q.trim().toLowerCase();
    const all = [...vocab.tags.entries()].filter(([t]) => ctx.isVisible(t) && !chosen.includes(t) && !exclude.includes(t) && (!ql || t.toLowerCase().includes(ql)));
    all.sort((a, b) => b[1] - a[1]);
    return all.slice(0, 6);
  }, [q, vocab, chosen, exclude, ctx.isVisible]);
  return html`<div>
    <div className="flabel">${label}</div>
    ${chosen.length ? html`<div className="wrap-chips" style=${{ marginBottom: 8 }}>${chosen.map(t => html`<button key=${t} className="chip sm on" style=${tone ? { background: '#111111', color: '#FFFFFF' } : null} onClick=${() => onRemove(t)}>${t}<span className="x">✕</span></button>`)}</div>` : null}
    <input className="plain-input" value=${q} onChange=${e => setQ(e.target.value)} placeholder=${q ? 'Search tags…' : 'Most common shown — or search…'} />
    <div className="wrap-chips" style=${{ marginTop: 8 }}>${sugg.map(([t, n]) => html`<button key=${t} className="chip sm" onClick=${() => { onAdd(t); setQ(''); }}>${t} <span className="faint">${n}</span></button>`)}</div>
  </div>`;
}

function FilterPanel({ filters, setFilters, model }) {
  const toggle = (field, v) => setFilters(f => ({ ...f, [field]: f[field].includes(v) ? f[field].filter(x => x !== v) : [...f[field], v] }));
  const ratingOrder = ['G', 'T', 'M', 'E', 'NR'];
  const ratings = [...model.vocab.ratings].sort((a, b) => (ratingOrder.indexOf(a) + 1 || 99) - (ratingOrder.indexOf(b) + 1 || 99));
  const cats = [...model.vocab.categories].sort();
  const authors = useMemo(() => [...model.vocab.authors].sort((a, b) => a.localeCompare(b)), [model]);
  const ChipSet = (field, items, labelOf) => html`<div className="wrap-chips">${items.map(v => html`<button key=${String(v)} className=${'chip sm' + (filters[field].includes(v) ? ' on' : '')} onClick=${() => toggle(field, v)}>${labelOf ? labelOf(v) : v}</button>`)}</div>`;
  // Fandom, then Pairing. Pairing options follow the fandoms picked (all fandoms when none are).
  const [allPairings, setAllPairings] = useState(false);
  const fandomsRead = model.fandomList.filter(f => f.pairings.some(p => p.readings));
  const toggleFandom = (name) => setFilters(f => {
    const fandoms = f.fandoms.includes(name) ? f.fandoms.filter(x => x !== name) : [...f.fandoms, name];
    const allowed = new Set(model.fandomList.filter(x => !fandoms.length || fandoms.includes(x.name)).flatMap(x => x.pairings.map(p => p.key)));
    return { ...f, fandoms, pairings: f.pairings.filter(k => allowed.has(k)) };
  });
  const pairingOpts = model.fandomList.filter(f => !filters.fandoms.length || filters.fandoms.includes(f.name))
    .flatMap(f => f.pairings.filter(p => p.readings)).sort((a, b) => b.readings - a.readings || a.name.localeCompare(b.name));
  const PAIRING_LIMIT = 12;
  const shownPairings = allPairings ? pairingOpts : pairingOpts.slice(0, PAIRING_LIMIT).concat(pairingOpts.slice(PAIRING_LIMIT).filter(p => filters.pairings.includes(p.key)));
  const multiFandom = new Set(pairingOpts.map(p => p.fandom)).size > 1;
  return html`<div className="panel">
    <div><div className="flabel">Fandom</div>
      <div className="wrap-chips">${fandomsRead.map(f => html`<button key=${f.name} className=${'chip sm' + (filters.fandoms.includes(f.name) ? ' on' : '')} style=${filters.fandoms.includes(f.name) ? chipOn(fandomColor(f.name)) : null} onClick=${() => toggleFandom(f.name)}><span className="cdot" style=${{ background: fandomColor(f.name) }}></span>${f.name}</button>`)}</div>
    </div>
    <div><div className="flabel">Pairing</div>
      <div className="wrap-chips">${shownPairings.map(pr => html`<button key=${pr.key} className=${'chip sm' + (filters.pairings.includes(pr.key) ? ' on' : '')} style=${filters.pairings.includes(pr.key) ? chipOn(fandomColor(pr.fandom)) : null} onClick=${() => toggle('pairings', pr.key)} title=${pr.fandom}>
        ${multiFandom ? html`<span className="cdot" style=${{ background: pairingColor(model, pr.key) }}></span>` : null}${pr.name} <span className="faint">${pr.readings}</span></button>`)}</div>
      ${pairingOpts.length > PAIRING_LIMIT ? html`<button className="link-btn" style=${{ marginTop: 8 }} onClick=${() => setAllPairings(v => !v)}>${allPairings ? 'Show fewer' : `Show all ${pairingOpts.length} pairings`}</button>` : null}
    </div>
    <div><div className="flabel">Status</div>${ChipSet('kinds', ['Read', 'DNF'], k => k === 'Read' ? 'Finished' : 'DNF')}</div>
    <div><div className="flabel">Logged or estimated</div>
      <div className="seg">${[['all', 'All'], ['logged', 'Logged'], ['est', 'Estimated']].map(([k, l]) => html`<button key=${k} className=${filters.est === k ? 'on' : ''} onClick=${() => setFilters(f => ({ ...f, est: k }))}>${l}</button>`)}</div>
    </div>
    <div><div className="flabel">Rating</div>${ChipSet('ratings', ratings)}</div>
    <div><div className="flabel">Category</div>${ChipSet('categories', cats)}</div>
    <div><div className="flabel">Enjoyment</div>${ChipSet('enjoyment', [5, 4, 3, 2, 1, 0], n => n ? `${n}/5` : 'Unrated')}</div>
    <div><div className="flabel">Date range</div>
      <div className="row">
        <input type="date" className="date-input" value=${filters.from} onChange=${e => setFilters(f => ({ ...f, from: e.target.value }))} aria-label="From date" />
        <span className="faint">to</span>
        <input type="date" className="date-input" value=${filters.to} onChange=${e => setFilters(f => ({ ...f, to: e.target.value }))} aria-label="To date" />
      </div>
      <div className="tiny faint" style=${{ marginTop: 5 }}>A date range hides undated reads.</div>
    </div>
    <div><div className="flabel">Author</div>
      <input className="plain-input" list="sl-authors" value=${filters.author} onChange=${e => setFilters(f => ({ ...f, author: e.target.value }))} placeholder="Any author" />
      <datalist id="sl-authors">${authors.map(a => html`<option key=${a} value=${a} />`)}</datalist>
    </div>
    <${SexTagToggle} />
    <${TagPicker} label="Include tags" chosen=${filters.tagsInc} exclude=${filters.tagsExc} vocab=${model.vocab}
      onAdd=${t => setFilters(f => ({ ...f, tagsInc: [...f.tagsInc, t] }))} onRemove=${t => setFilters(f => ({ ...f, tagsInc: f.tagsInc.filter(x => x !== t) }))} />
    <${TagPicker} label="Exclude tags" chosen=${filters.tagsExc} exclude=${filters.tagsInc} vocab=${model.vocab} tone="neg"
      onAdd=${t => setFilters(f => ({ ...f, tagsExc: [...f.tagsExc, t] }))} onRemove=${t => setFilters(f => ({ ...f, tagsExc: f.tagsExc.filter(x => x !== t) }))} />
    <button className="pill-btn" style=${{ alignSelf: 'flex-start' }} onClick=${() => setFilters(f => ({ ...R.emptyFilters(), q: f.q }))}>Clear filters</button>
  </div>`;
}

function SearchAndFilters({ filters, setFilters, model, open, setOpen }) {
  const n = R.filterCount(filters);
  return html`<div>
    <div className="row" style=${{ flexWrap: 'nowrap' }}>
      <div className="search-wrap"><${Icon} name="search" size=${17} />
        <input className="text-input" value=${filters.q} onChange=${e => setFilters(f => ({ ...f, q: e.target.value }))} placeholder="Title, author or tag" aria-label="Search" />
      </div>
      <button className=${'pill-btn' + (open || n ? ' primary' : '')} style=${{ padding: '10px 14px' }} onClick=${() => setOpen(!open)} aria-expanded=${open}><${Icon} name="filter" size=${16} />${n ? n : 'Filter'}</button>
    </div>
    ${open ? html`<${FilterPanel} filters=${filters} setFilters=${setFilters} model=${model} />` : null}
