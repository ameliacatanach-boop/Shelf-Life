}

function Dashboard({ model, today, themeTick, onOpen, onTag, dash, setDash, groupBy, setGroupBy }) {
  const { period, custom, compare } = dash;
  const p = useMemo(() => R.makePeriod(period, today, custom), [period, today, custom.start, custom.end]);
  const cp = useMemo(() => p.unit === 'all' ? null : compare === 'year' ? R.sameLastYear(p) : R.shiftPeriod(p, -1), [p, compare]);
  const cur = useMemo(() => R.periodStats(model.readings, p, model.authorFirst), [model, p]);
  const prev = useMemo(() => cp ? R.periodStats(model.readings, cp, model.authorFirst) : null, [model, cp]);
  // Sparklines: the 12 periods ending with this one (months for All time).
  const spark = useMemo(() => {
    const base = p.unit === 'all' ? R.makePeriod('thisMonth', today) : p;
    const list = [];
    for (let k = -11; k <= 0; k++) list.push(R.periodStats(model.readings, k === 0 ? base : R.shiftPeriod(base, k), model.authorFirst));
    return list;
  }, [model, p, today]);
  const sp = (fn) => spark.map(fn);
  const cmpLabel = cp ? R.periodName(cp, today) : '';
  const set = (patch) => setDash(d => ({ ...d, ...patch }));
  return html`<div>
    <h1 className="headline serif">${headline(cur, prev, p, cp, today, groupBy, model)}</h1>
    <div className="small faint" style=${{ margin: '0 2px 14px' }}>${p.unit === 'all' ? 'Everything you’ve read, including undated reads.' : `${R.fmtDay(p.start, today)} – ${R.fmtDay(p.end, today)}${cp ? ` · compared with ${cmpLabel}` : ''}`}</div>
    <${PeriodPicker} period=${period} setPeriod=${v => set({ period: v })} custom=${custom} setCustom=${fn => setDash(d => ({ ...d, custom: fn(d.custom) }))} compare=${compare} setCompare=${v => set({ compare: v })} today=${today} />

    <div className="tiles" style=${{ marginTop: 16 }}>
      <${StatTile} label="Words read" value=${fmtWords(cur.words)} d=${prev && delta(cur.words, prev.words)} good=${true} spark=${sp(s => s.words)} cmpLabel=${cmpLabel}
        note=${cur.dnfNoWords ? `Leaves out ${cur.dnfNoWords} DNF${cur.dnfNoWords === 1 ? '' : 's'} with no chapters read` : null} />
      <${StatTile} label="Fics finished" value=${fmtInt(cur.finished)} d=${prev && delta(cur.finished, prev.finished)} good=${true} spark=${sp(s => s.finished)} cmpLabel=${cmpLabel}
        note=${cur.est ? `${cur.est} est.` : null} />
      <${StatTile} label="DNFs" value=${fmtInt(cur.dnfs)} d=${prev && delta(cur.dnfs, prev.dnfs)} good=${null} spark=${sp(s => s.dnfs)} cmpLabel=${cmpLabel} />
      <${StatTile} label="Completion rate" value=${fmtPct(cur.completion)} d=${prev && cur.completion !== null && prev.completion !== null ? delta(cur.completion, prev.completion, 'pts') : null} good=${true} spark=${sp(s => s.completion)} cmpLabel=${cmpLabel} />
      <${StatTile} label="New authors" value=${fmtInt(cur.newAuthors)} d=${prev && delta(cur.newAuthors, prev.newAuthors)} good=${true} spark=${sp(s => s.newAuthors)} cmpLabel=${cmpLabel} />
      <${StatTile} label="Median fic length" value=${cur.median === null ? '—' : fmtWords(cur.median)} d=${prev && cur.median !== null && prev.median !== null ? delta(cur.median, prev.median) : null} good=${null} spark=${sp(s => s.median)} cmpLabel=${cmpLabel}
        note="Words, finished fics" />
    </div>

    <${CurrentlyReading} model=${model} onOpen=${onOpen} />

    <div className="group-row"><span className="small faint">Break down by</span><${GroupToggle} value=${groupBy} onChange=${setGroupBy} /></div>
    <div className="section" style=${{ marginTop: 14 }}>
      <div className="section-head"><h2 className="section-title">Words per month</h2></div>
      <${WordsPerMonth} model=${model} p=${p} today=${today} themeTick=${themeTick} level=${groupBy} />
    </div>
    <div className="section">
      <div className="section-head"><h2 className="section-title">Split by ${groupBy}</h2><span className="small faint">by words</span></div>
      <${GroupSplit} model=${model} stats=${cur} themeTick=${themeTick} level=${groupBy} />
    </div>
    <div className="section">
      <div className="section-head"><h2 className="section-title">Top tags by words read</h2></div>
      <${TopTags} readings=${cur.readings} dnfNoWords=${cur.dnfNoWords} onTag=${onTag} />
    </div>
    <div className="section">
      <div className="section-head"><h2 className="section-title">Recently finished</h2></div>
      <${RecentlyFinished} stats=${cur} onOpen=${onOpen} today=${today} />
    </div>
  </div>`;
}

function TagPicker({ label, chosen, onAdd, onRemove, vocab, exclude, tone }) {
  const [q, setQ] = useState('');
  const ctx = useContext(TagCtx);
  // Options leave out hidden (sex-related) tags while the toggle is off. Tags already chosen stay visible.
  const sugg = useMemo(() => {
    const ql = q.trim().toLowerCase();
    const all = [...vocab.tags.entries()].filter(([t]) => ctx.isVisible(t) && !chosen.includes(t) && !exclude.includes(t) && (!ql || t.toLowerCase().includes(ql)));
    all.sort((a, b) => b[1] - a[1]);
    return all.slice(0, 6);
  }, [q, vocab, chosen, exclude, ctx.isVisible]);
  return html`<div>
    <div className="flabel">${label}</div>
    ${chosen.length ? html`<div className="wrap-chips" style=${{ marginBottom: 8 }}>${chosen.map(t => html`<button key=${t} className="chip sm on" style=${tone ? { background: 'var(--neg)', borderColor: 'var(--neg)', color: '#fff' } : null} onClick=${() => onRemove(t)}>${t}<span className="x">✕</span></button>`)}</div>` : null}
    <input className="plain-input" value=${q} onChange=${e => setQ(e.target.value)} placeholder=${q ? 'Search tags…' : 'Most common shown — or search…'} />
    <div className="wrap-chips" style=${{ marginTop: 8 }}>${sugg.map(([t, n]) => html`<button key=${t} className="chip sm" onClick=${() => { onAdd(t); setQ(''); }}>${t} <span className="faint">${n}</span></button>`)}</div>
  </div>`;
}

function FilterPanel({ filters, setFilters, model }) {
  const toggle = (field, v) => setFilters(f => ({ ...f, [field]: f[field].includes(v) ? f[field].filter(x => x !== v) : [...f[field], v] }));
  const ratingOrder = ['G', 'T', 'M', 'E', 'NR'];
  const ratings = [...model.vocab.ratings].sort((a, b) => (ratingOrder.indexOf(a) + 1 || 99) - (ratingOrder.indexOf(b) + 1 || 99));
  const cats = [...model.vocab.categories].sort();
  const authors = useMemo(() => [...model.vocab.authors].sort((a, b) => a.localeCompare(b)), [model]);
  const ChipSet = (field, items, labelOf) => html`<div className="wrap-chips">${items.map(v => html`<button key=${String(v)} className=${'chip sm' + (filters[field].includes(v) ? ' on' : '')} onClick=${() => toggle(field, v)}>${labelOf ? labelOf(v) : v}</button>`)}</div>`;
  // Fandom, then Pairing. Pairing options follow the fandoms picked (all fandoms when none are).
  const [allPairings, setAllPairings] = useState(false);
  const fandomsRead = model.fandomList.filter(f => f.pairings.some(p => p.readings));
  const toggleFandom = (name) => setFilters(f => {
    const fandoms = f.fandoms.includes(name) ? f.fandoms.filter(x => x !== name) : [...f.fandoms, name];
    const allowed = new Set(model.fandomList.filter(x => !fandoms.length || fandoms.includes(x.name)).flatMap(x => x.pairings.map(p => p.key)));
    return { ...f, fandoms, pairings: f.pairings.filter(k => allowed.has(k)) };
  });
  const pairingOpts = model.fandomList.filter(f => !filters.fandoms.length || filters.fandoms.includes(f.name))
    .flatMap(f => f.pairings.filter(p => p.readings)).sort((a, b) => b.readings - a.readings || a.name.localeCompare(b.name));
  const PAIRING_LIMIT = 12;
  const shownPairings = allPairings ? pairingOpts : pairingOpts.slice(0, PAIRING_LIMIT).concat(pairingOpts.slice(PAIRING_LIMIT).filter(p => filters.pairings.includes(p.key)));
  const multiFandom = new Set(pairingOpts.map(p => p.fandom)).size > 1;
  return html`<div className="panel">
    <div><div className="flabel">Fandom</div>
      <div className="wrap-chips">${fandomsRead.map(f => html`<button key=${f.name} className=${'chip sm' + (filters.fandoms.includes(f.name) ? ' on' : '')} onClick=${() => toggleFandom(f.name)}><span className="cdot" style=${{ background: fandomColor(f.name) }}></span>${f.name}</button>`)}</div>
    </div>
    <div><div className="flabel">Pairing</div>
      <div className="wrap-chips">${shownPairings.map(pr => html`<button key=${pr.key} className=${'chip sm' + (filters.pairings.includes(pr.key) ? ' on' : '')} onClick=${() => toggle('pairings', pr.key)} title=${pr.fandom}>
        ${multiFandom ? html`<span className="cdot" style=${{ background: pairingColor(model, pr.key) }}></span>` : null}${pr.name} <span className="faint">${pr.readings}</span></button>`)}</div>
      ${pairingOpts.length > PAIRING_LIMIT ? html`<button className="link-btn" style=${{ marginTop: 8 }} onClick=${() => setAllPairings(v => !v)}>${allPairings ? 'Show fewer' : `Show all ${pairingOpts.length} pairings`}</button>` : null}
    </div>
    <div><div className="flabel">Status</div>${ChipSet('kinds', ['Read', 'DNF'], k => k === 'Read' ? 'Finished' : 'DNF')}</div>
    <div><div className="flabel">Logged or estimated</div>
      <div className="seg">${[['all', 'All'], ['logged', 'Logged'], ['est', 'Estimated']].map(([k, l]) => html`<button key=${k} className=${filters.est === k ? 'on' : ''} onClick=${() => setFilters(f => ({ ...f, est: k }))}>${l}</button>`)}</div>
    </div>
    <div><div className="flabel">Rating</div>${ChipSet('ratings', ratings)}</div>
    <div><div className="flabel">Category</div>${ChipSet('categories', cats)}</div>
    <div><div className="flabel">Enjoyment</div>${ChipSet('enjoyment', [5, 4, 3, 2, 1, 0], n => n ? `${n}/5` : 'Unrated')}</div>
    <div><div className="flabel">Date range</div>
      <div className="row">
        <input type="date" className="date-input" value=${filters.from} onChange=${e => setFilters(f => ({ ...f, from: e.target.value }))} aria-label="From date" />
        <span className="faint">to</span>
        <input type="date" className="date-input" value=${filters.to} onChange=${e => setFilters(f => ({ ...f, to: e.target.value }))} aria-label="To date" />
      </div>
      <div className="tiny faint" style=${{ marginTop: 5 }}>A date range hides undated reads.</div>
    </div>
    <div><div className="flabel">Author</div>
      <input className="plain-input" list="sl-authors" value=${filters.author} onChange=${e => setFilters(f => ({ ...f, author: e.target.value }))} placeholder="Any author" />
      <datalist id="sl-authors">${authors.map(a => html`<option key=${a} value=${a} />`)}</datalist>
    </div>
    <${SexTagToggle} />
    <${TagPicker} label="Include tags" chosen=${filters.tagsInc} exclude=${filters.tagsExc} vocab=${model.vocab}
      onAdd=${t => setFilters(f => ({ ...f, tagsInc: [...f.tagsInc, t] }))} onRemove=${t => setFilters(f => ({ ...f, tagsInc: f.tagsInc.filter(x => x !== t) }))} />
    <${TagPicker} label="Exclude tags" chosen=${filters.tagsExc} exclude=${filters.tagsInc} vocab=${model.vocab} tone="neg"
      onAdd=${t => setFilters(f => ({ ...f, tagsExc: [...f.tagsExc, t] }))} onRemove=${t => setFilters(f => ({ ...f, tagsExc: f.tagsExc.filter(x => x !== t) }))} />
    <button className="pill-btn" style=${{ alignSelf: 'flex-start' }} onClick=${() => setFilters(f => ({ ...R.emptyFilters(), q: f.q }))}>Clear filters</button>
  </div>`;
}

function SearchAndFilters({ filters, setFilters, model, open, setOpen }) {
  const n = R.filterCount(filters);
  return html`<div>
    <div className="row" style=${{ flexWrap: 'nowrap' }}>
      <div className="search-wrap"><${Icon} name="search" size=${17} />
        <input className="text-input" value=${filters.q} onChange=${e => setFilters(f => ({ ...f, q: e.target.value }))} placeholder="Title, author or tag" aria-label="Search" />
      </div>
      <button className=${'pill-btn' + (open || n ? ' primary' : '')} style=${{ padding: '10px 14px' }} onClick=${() => setOpen(!open)} aria-expanded=${open}><${Icon} name="filter" size=${16} />${n ? n : 'Filter'}</button>
    </div>

const WEEKDAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
function DiaryRow({ r, onOpen }) {
  const d = r.date ? r.date.split('-').map(Number) : null;
  const wd = d ? WEEKDAYS[new Date(Date.UTC(d[0], d[1] - 1, d[2])).getUTCDay()] : '';
  return html`<button className="drow" onClick=${() => onOpen(r.ficKey)}>
    <div className="dday">${d ? html`<b className="num">${d[2]}</b><span>${wd}</span>` : html`<span>—</span>`}</div>
    <div className="dstripe" style=${{ background: fandomColor(r.fandom) }}></div>
    <div style=${{ minWidth: 0 }}>
      <div className="dtitle">${r.fic.title}</div>
      <div className="small muted" style=${{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>${r.fic.authors.join(', ') || '—'}</div>
      <${SourceLine} fic=${r.fic} mode="one" style=${{ marginTop: 2 }} />
      <div className="dmeta">
        <span className="num">${r.kind === 'DNF' ? (r.words === null ? `${fmtWords(r.fic.words)} · words not counted` : `${fmtWords(r.words)} of ${fmtWords(r.fic.words)}`) : fmtWords(r.words)}</span>
        <${Enjoy} n=${r.fic.enjoyment} />
        <${KB} fic=${r.fic} />
        ${r.kind === 'DNF' ? html`<span className="badge dnf">DNF</span>` : null}
        ${r.readNumber > 1 ? html`<span className="badge plain">${ordinal(r.readNumber)} read</span>` : null}
        ${r.origin === 'dataList' && r.fic.timesRead > r.readNumber ? html`<span className="badge plain">Read ${r.fic.timesRead} times</span>` : null}
        ${r.est ? html`<${EstBadge} />` : null}
      </div>
    </div>
  </button>`;
}

function Diary({ readings, onOpen, today }) {
  const [limit, setLimit] = useState(60);
  useEffect(() => setLimit(60), [readings]);
  const sorted = useMemo(() => R.sortDiary(readings), [readings]);
  const shown = sorted.slice(0, limit);
  const groups = [];
  for (const r of shown) {
    const key = r.date ? r.date.slice(0, 7) : 'undated';
    if (!groups.length || groups[groups.length - 1].key !== key) groups.push({ key, items: [] });
    groups[groups.length - 1].items.push(r);
  }
  const counts = useMemo(() => { const c = {}; sorted.forEach(r => { const k = r.date ? r.date.slice(0, 7) : 'undated'; c[k] = (c[k] || 0) + 1; }); return c; }, [sorted]);
  if (!sorted.length) return html`<div className="card empty" style=${{ marginTop: 14 }}>Nothing matches these filters.</div>`;
  return html`<div>
    ${groups.map(g => html`<div key=${g.key}>
      <div className="month-head"><span>${g.key === 'undated' ? 'No date' : `${R.MONTHS[+g.key.slice(5) - 1]} ${g.key.slice(0, 4)}`}</span><span className="faint">${counts[g.key]}</span></div>
      <div className="diary">${g.items.map(r => html`<${DiaryRow} key=${r.id} r=${r} onOpen=${onOpen} />`)}</div>
    </div>`)}
    ${limit < sorted.length ? html`<button className="big-btn ghost" style=${{ marginTop: 14 }} onClick=${() => setLimit(l => l + 80)}>Show more (${sorted.length - limit} left)</button>` : null}
  </div>`;
}

function Library({ readings, onOpen, today, view, setView }) {
  const [limit, setLimit] = useState(48);
  useEffect(() => setLimit(48), [readings]);
  const fics = useMemo(() => {
    const m = new Map();
    for (const r of readings) {
      const e = m.get(r.ficKey) || { fic: r.fic, n: 0, last: null, kinds: new Set(), est: false };
      e.n++; e.kinds.add(r.kind); if (r.est) e.est = true;
      if (r.date && (!e.last || r.date > e.last)) e.last = r.date;
      m.set(r.ficKey, e);
    }
    return [...m.values()].sort((a, b) => (b.last || '').localeCompare(a.last || '') || a.fic.title.localeCompare(b.fic.title));
  }, [readings]);
  const shown = fics.slice(0, limit);
  const statusOf = (e) => e.fic.status === 'Read' || e.fic.status === 'DNF' ? e.fic.status : (e.kinds.has('Read') ? 'Read' : 'DNF');
  if (!fics.length) return html`<div className="card empty" style=${{ marginTop: 14 }}>Nothing matches these filters.</div>`;
  return html`<div>
    <div className="row" style=${{ justifyContent: 'space-between', margin: '14px 2px 10px' }}>
      <span className="small muted">${fmtInt(fics.length)} fic${fics.length === 1 ? '' : 's'}</span>
      <div className="seg">
        <button className=${view === 'cards' ? 'on' : ''} onClick=${() => setView('cards')} aria-label="Cards"><${Icon} name="grid" size=${15} /></button>
        <button className=${view === 'table' ? 'on' : ''} onClick=${() => setView('table')} aria-label="Table"><${Icon} name="table" size=${15} /></button>
      </div>
    </div>
    ${view === 'cards' ? html`<div className="lib-grid">${shown.map(e => html`<button key=${e.fic.key} className="lcard" style=${{ '--fc': fandomColor(e.fic.fandom) }} onClick=${() => onOpen(e.fic.key)}>
        <div className="row" style=${{ gap: 6 }}><span className="badge rating">${e.fic.rating || '—'}</span>${statusOf(e) === 'DNF' ? html`<span className="badge dnf">DNF</span>` : null}${e.est ? html`<${EstBadge} />` : null}</div>
        <div className="mini-title">${e.fic.title}</div>
        <div className="small muted" style=${{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>${e.fic.authors.join(', ')}</div>
        <${SourceLine} fic=${e.fic} />
        <div className="row small faint" style=${{ gap: 8, marginTop: 'auto' }}>
          <span className="num">${fmtWords(e.fic.words)}</span><span>${e.fic.chapters} ch</span>
          ${Math.max(e.n, e.fic.timesRead) > 1 ? html`<span>Read ${Math.max(e.n, e.fic.timesRead)} times</span>` : null}
          <span>${e.last ? R.fmtDay(e.last, today) : 'no date'}</span>
          <${Enjoy} n=${e.fic.enjoyment} />
        </div>
      </button>`)}</div>`
    : html`<div className="table-wrap"><table>
        <thead><tr><th>Title</th><th>Fandom · Pairing</th><th>Status</th><th>Last</th><th>Words</th><th>Enjoy</th><th>Rating</th><th>Reads</th></tr></thead>
        <tbody>${shown.map(e => html`<tr key=${e.fic.key} className="click" onClick=${() => onOpen(e.fic.key)}>
          <td className="t">${e.fic.title}<div className="tiny faint" style=${{ fontWeight: 400 }}>${e.fic.authors.join(', ')}</div></td>
          <td style=${{ whiteSpace: 'normal', minWidth: 190 }}><${SourceLine} fic=${e.fic} mode="full" /></td>
          <td>${statusOf(e) === 'Read' ? 'Finished' : 'DNF'}${e.est ? ' · est.' : ''}</td>
          <td className="num">${e.last ? R.fmtDay(e.last, today) : '—'}</td>
          <td className="num">${fmtWords(e.fic.words)}</td>
          <td>${e.fic.enjoyment ? e.fic.enjoyment + '/5' : '—'}</td>
          <td>${e.fic.rating || '—'}</td>
          <td className="num">${Math.max(e.n, e.fic.timesRead || 0)}</td>
        </tr>`)}</tbody>
      </table></div>`}
    ${limit < fics.length ? html`<button className="big-btn ghost" style=${{ marginTop: 14 }} onClick=${() => setLimit(l => l + 60)}>Show more (${fics.length - limit} left)</button>` : null}
  </div>`;
}

function DiaryScreen({ model, filters, setFilters, onOpen, today, ui, setUi }) {
  const readings = useMemo(() => R.filterReadings(model.readings, filters), [model, filters]);
  const words = readings.reduce((t, r) => t + (r.words || 0), 0);
  const dnfNo = readings.filter(r => r.kind === 'DNF' && r.words === null).length;
  return html`<div>
    <div className="row" style=${{ justifyContent: 'space-between', margin: '10px 0 14px' }}>
      <div className="seg">
        <button className=${ui.sub === 'diary' ? 'on' : ''} onClick=${() => setUi(u => ({ ...u, sub: 'diary' }))}>Diary</button>
        <button className=${ui.sub === 'library' ? 'on' : ''} onClick=${() => setUi(u => ({ ...u, sub: 'library' }))}>Library</button>
      </div>
      <span className="small faint num">${fmtInt(readings.length)} reads · ${fmtWords(words)} words</span>
    </div>
    <${SearchAndFilters} filters=${filters} setFilters=${setFilters} model=${model} open=${ui.filtersOpen} setOpen=${v => setUi(u => ({ ...u, filtersOpen: v }))} />
    ${dnfNo ? html`<div className="tiny faint" style=${{ margin: '8px 4px 0' }}>Word totals leave out ${dnfNo} DNF${dnfNo === 1 ? '' : 's'} with no chapters read.</div>` : null}
    ${ui.sub === 'diary' ? html`<${Diary} readings=${readings} onOpen=${onOpen} today=${today} />`
      : html`<${Library} readings=${readings} onOpen=${onOpen} today=${today} view=${ui.libView} setView=${v => setUi(u => ({ ...u, libView: v }))} />`}
  </div>`;
}

// Relationship tags, then freeform tags. Hidden (sex-related) tags sit behind a "+N hidden" chip.
function DetailTags({ fic }) {
  const ctx = useContext(TagCtx);
  const [reveal, setReveal] = useState(false);
  const shown = fic.tags.filter(ctx.isVisible), hidden = fic.tags.filter(t => !ctx.isVisible(t));
  return html`<div className="section">

function FicDetail({ ficKey, model, onClose, loadSummary, onAuthor, today }) {
  const fic = model.ficByKey.get(ficKey);
  const [sum, setSum] = useState({ state: 'loading', text: '' });
  useEffect(() => {
    let live = true;
    setSum({ state: 'loading', text: '' });
    if (fic) loadSummary(fic).then(t => live && setSum({ state: 'ok', text: t }), e => live && setSum({ state: e.needsAuth ? 'auth' : 'err', text: e.message }));
    return () => { live = false; };
  }, [ficKey]);
  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', onKey);
    document.body.style.overflow = 'hidden';
    return () => { document.removeEventListener('keydown', onKey); document.body.style.overflow = ''; };
  }, []);
  if (!fic) return null;
  const readings = model.readings.filter(r => r.ficKey === ficKey).sort((a, b) => a.readNumber - b.readNumber);
  const events = model.eventsByKey.get(ficKey) || [];
  const authorCtx = R.realAuthors(fic.authors).map(a => model.authors.find(x => x.author === a)).filter(Boolean);
  const meta = [
    ['Published', fic.datePublished || '—'], ['Words', fmtInt(fic.words)],
    ['Chapters', fic.chaptersPlanned === fic.chapters ? String(fic.chapters) : `${fic.chapters} / ${fic.chaptersPlanned ?? '?'}`], ['Rating', fic.rating || '—'],
    ['Category', fic.category], ['Status', fic.status || 'Unread'],
    ['Kudos', fmtInt(fic.kudos)], ['Bookmarks', fmtInt(fic.bookmarks)], ['Hits', fmtInt(fic.hits)], ['Comments', fmtInt(fic.comments)],
    ['Enjoyment', fic.enjoyment ? `${fic.enjoyment} / 5` : '—'], ['Kudos left · Bookmarked', `${fic.kg ? 'Yes' : 'No'} · ${fic.bk ? 'Yes' : 'No'}`],
    ['Date started', fic.dateStarted ? R.fmtDay(fic.dateStarted, today) : '—'], ['Date read', fic.dateRead ? R.fmtDay(fic.dateRead, today) : '—'],
    ['Last read', fic.lastRead || '—'], ['Times read', fic.timesRead ? String(fic.timesRead) : '—'],
  ];
  if (fic.dnrReason) meta.splice(6, 0, ['DNR reason', fic.dnrReason]);
  return html`<div className="sheet-back" onClick=${onClose}>
    <div className="sheet" onClick=${e => e.stopPropagation()} role="dialog" aria-modal="true" aria-label=${fic.title} style=${{ '--fc': fandomColor(fic.fandom) }}>
      <div className="grab"></div>
      <div className="row" style=${{ justifyContent: 'space-between', flexWrap: 'nowrap' }}>
        <div className="row" style=${{ gap: 6 }}><span className="badge rating">${fic.rating || '—'}</span>${readings.some(r => r.est) ? html`<${EstBadge} />` : null}</div>
        <button className="icon-btn" onClick=${onClose} aria-label="Close"><${Icon} name="close" size=${16} /></button>
      </div>
      <${SourceLine} fic=${fic} mode="full" style=${{ marginTop: 14, fontSize: 13.5 }} />
      <h2 className="serif" style=${{ fontSize: 26, lineHeight: 1.18, margin: '8px 0 4px', fontWeight: 600 }}>${fic.title}</h2>
      <div className="muted">by ${fic.authors.length ? fic.authors.map((a, i) => html`<span key=${a}>${i ? ', ' : ''}<button className="link-btn" style=${{ fontSize: 15 }} onClick=${() => onAuthor(a)}>${a}</button></span>`) : '—'}</div>

      ${authorCtx.length ? html`<div className="card" style=${{ marginTop: 14, padding: 14 }}>
        ${authorCtx.map(a => html`<div key=${a.author} className="row" style=${{ justifyContent: 'space-between', flexWrap: 'nowrap', padding: '2px 0' }}>
          <span>${a.fics === 1 ? 'The only fic you’ve read by them' : a.rank === 1 ? 'Your most-read author' : `Your ${ordinal(a.rank)} most-read author`}${authorCtx.length > 1 ? html` <span className="faint">(${a.author})</span>` : null}</span>
          ${a.fics > 1 ? html`<button className="link-btn" onClick=${() => onAuthor(a.author)}>${a.fics} fics →</button>` : null}

      <a className="big-btn" href=${fic.link} target="_blank" rel="noopener noreferrer" style=${{ marginTop: 14 }}>Open on AO3 <${Icon} name="ext" size=${16} /></a>

      <div className="section">
        <div className="section-head"><h3 className="section-title">Your reads</h3></div>
        <div className="card" style=${{ padding: '6px 16px' }}>
          ${readings.length ? readings.map(r => html`<div key=${r.id} className="row" style=${{ justifyContent: 'space-between', padding: '9px 0', borderTop: '1px solid var(--line)' }}>
            <span className="row" style=${{ gap: 8 }}><b style=${{ fontWeight: 600 }}>${ordinal(r.readNumber)} read</b>${r.kind === 'DNF' ? html`<span className="badge dnf">DNF</span>` : html`<span className="badge plain">Finished</span>`}${r.est ? html`<${EstBadge} />` : null}</span>
            <span className="small muted num">${r.started && r.started !== r.date ? `${R.fmtDay(r.started, today)} → ` : ''}${r.date ? R.fmtDay(r.date, today) : 'no date'} · ${r.words === null ? 'words not counted' : fmtWords(r.words) + ' words'}${r.dnfChapters ? ` (${r.dnfChapters}/${fic.chapters} ch)` : ''}</span>

        <div className="card">
          ${sum.state === 'loading' ? html`<span className="faint">Loading summary…</span>` : sum.state === 'ok' ? (sum.text ? html`<div className="summary">${sum.text}</div>` : html`<span className="faint">No summary in the sheet.</span>`) : html`<span className="faint">${sum.text}</span>`}

function TrendsScreen({ model, today, themeTick, onAuthor, onTag, groupBy, setGroupBy }) {
  const [by, setBy] = useState('fics');
  const keys = useMemo(() => R.monthKeys((model.firstDate || today).slice(0, 7), today.slice(0, 7)), [model, today]);
  const groups = useMemo(() => {
    const totals = {}, present = new Set();
    for (const r of model.readings) { if (!r.date) continue; present.add(r.pairingKey); if (r.words !== null) totals[r.pairingKey] = (totals[r.pairingKey] || 0) + r.words; }
    return makeGroups(model, groupBy, totals, present);
  }, [model, groupBy, themeTick]);
  const s = useMemo(() => R.monthlySeries(model.readings, keys, groups.keys, groups.of), [model, keys, groups]);
  const multiYear = keys[0].slice(0, 4) !== keys[keys.length - 1].slice(0, 4);
  const labels = keys.map(k => R.monthLabel(k, multiYear));
  const wordsCfg = useMemo(() => {
    const t = chartTheme();
    const sc = baseScales(t, v => fmtWords(v));
    sc.y1 = { position: 'right', beginAtZero: true, grid: { display: false }, border: { display: false }, ticks: { color: t.ink3, maxTicksLimit: 4, precision: 0, font: { size: 11 } } };
    return {
      type: 'bar',
      data: { labels, datasets: [
        ...groups.keys.map((k, i) => ({ label: groups.short(k), data: s.words[k], backgroundColor: groups.color(k), borderRadius: topRadius(s.words, groups.keys, i), borderSkipped: false, stack: 'w', maxBarThickness: 26, order: 2 })),
        { type: 'line', label: 'Fics finished', data: s.finished, yAxisID: 'y1', borderColor: t.ink, backgroundColor: t.ink, borderWidth: 2, pointRadius: 2.5, cubicInterpolationMode: 'monotone', order: 1 },
      ] },
      options: { responsive: true, maintainAspectRatio: false, animation: { duration: 250 }, interaction: { mode: 'index', intersect: false },
        plugins: { legend: { display: false }, tooltip: { ...tooltip(t, c => c.dataset.yAxisID === 'y1' ? ` Fics finished: ${c.parsed.y}` : ` ${c.dataset.label}: ${fmtWords(c.parsed.y)}`), filter: c => c.dataset.yAxisID === 'y1' || c.parsed.y > 0 } }, scales: sc },
    };
  }, [s, groups, themeTick]);
  const compCfg = useMemo(() => {
    const t = chartTheme();
    const sc = baseScales(t, v => Math.round(v * 100) + '%');
    sc.y.min = 0; sc.y.max = 1; sc.x.stacked = false; sc.y.stacked = false;
    return {
      type: 'line',
      data: { labels, datasets: [{ label: 'Completion', data: s.completion, borderColor: t.accent, backgroundColor: t.accent, pointRadius: 3, borderWidth: 2, cubicInterpolationMode: 'monotone', spanGaps: true }] },
      options: { responsive: true, maintainAspectRatio: false, animation: { duration: 250 },
        plugins: { legend: { display: false }, tooltip: tooltip(t, c => ` ${Math.round(c.parsed.y * 100)}% · ${s.finished[c.dataIndex]} finished, ${s.dnfs[c.dataIndex]} DNF`) }, scales: sc },
    };
  }, [s, themeTick]);
  const top = useMemo(() => model.authors.slice().sort((a, b) => by === 'fics' ? b.fics - a.fics || b.words - a.words : b.words - a.words || b.fics - a.fics).slice(0, 10), [model, by]);
  const max = top.length ? (by === 'fics' ? top[0].fics : top[0].words) : 1;
  const undated = model.readings.filter(r => !r.date).length;
  return html`<div>
    <h1 className="headline serif" style=${{ marginTop: 10 }}>Trends</h1>
    <div className="small faint" style=${{ margin: '0 2px' }}>Every dated read since ${model.firstDate ? R.fmtDay(model.firstDate, today) : '—'}.${undated ? ` ${undated} undated read${undated === 1 ? ' isn’t' : 's aren’t'} shown by month.` : ''}</div>
    <div className="section">
      <div className="section-head"><h2 className="section-title">Words and fics per month</h2><${GroupToggle} value=${groupBy} onChange=${setGroupBy} /></div>
      <div className="card">
        <${ChartBox} config=${wordsCfg} height=${230} />
        <${GroupLegend} groups=${groups} />
        <div className="legend"><span><i style=${{ background: 'var(--ink)', height: 3, borderRadius: 2 }}></i>Fics finished</span></div>
      </div>
    </div>
    <div className="section">
      <div className="section-head"><h2 className="section-title">Completion rate by month</h2></div>
      <div className="card"><${ChartBox} config=${compCfg} height=${180} /></div>
    </div>
    <div className="section">
      <div className="section-head"><h2 className="section-title">Top authors</h2>
        <div className="seg"><button className=${by === 'fics' ? 'on' : ''} onClick=${() => setBy('fics')}>By fics</button><button className=${by === 'words' ? 'on' : ''} onClick=${() => setBy('words')}>By words</button></div>
      </div>
      <div className="card">
        ${top.length ? top.map((a, i) => html`<div className="hbar-row" key=${a.author} onClick=${() => onAuthor(a.author)} style=${{ cursor: 'pointer' }}>
          <span className="hbar-label"><span className="faint num" style=${{ display: 'inline-block', width: 22 }}>${i + 1}</span>${a.author}</span>
          <span className="hbar-val num">${by === 'fics' ? `${a.fics} fic${a.fics === 1 ? '' : 's'} · ${fmtWords(a.words)}` : `${fmtWords(a.words)} · ${a.fics} fic${a.fics === 1 ? '' : 's'}`}</span>
          <div className="hbar-track"><div style=${{ width: Math.max(2, (by === 'fics' ? a.fics : a.words) / max * 100) + '%', background: 'var(--accent)', borderRadius: 99 }}></div></div>
        </div>`) : html`<div className="empty">No authors yet.</div>`}
      </div>
    </div>
    <div className="section">
      <div className="section-head"><h2 className="section-title">Top tags by words read</h2><span className="small faint">all time</span></div>
      <${TopTags} readings=${model.readings} dnfNoWords=${model.readings.filter(r => r.kind === 'DNF' && r.words === null).length} onTag=${onTag} limit=${15} />
    </div>
    <div className="section">
      <div className="section-head"><h2 className="section-title">Shelves by status</h2></div>
      <div className="table-wrap wrap-th"><table>
        <thead><tr><th>Status</th>${model.fandomList.map(f => html`<th key=${f.name}>${f.short}</th>`)}</tr></thead>
        <tbody>${Object.keys(model.statusCounts).sort((a, b) => model.statusCounts[b] - model.statusCounts[a]).map(st => html`<tr key=${st}>
          <td>${st}${st !== '(blank)' && !R.KNOWN_STATUSES.includes(st) ? html` <span className="badge est">other</span>` : null}</td>
          ${model.fandomList.map(f => html`<td key=${f.name} className="num">${fmtInt(model.fics.filter(x => x.fandom === f.name && (x.status || '(blank)') === st).length)}</td>`)}
        </tr>`)}</tbody>
      </table></div>
    </div>
  </div>`;
}

// Export / import overrides as a JSON file, to carry them between devices.
function OverrideFileButtons() {
  const ctx = useContext(TagCtx);
  const fileRef = useRef(null);
  const [msg, setMsg] = useState('');
  const doExport = () => {
    const out = { app: 'shelf-life', kind: 'tag-overrides', version: 1, exportedAt: new Date().toISOString(), overrides: ctx.overrides };
    download(`shelf-life-tag-overrides-${R.melbourneToday()}.json`, JSON.stringify(out, null, 2), 'application/json');
    setMsg(`Exported ${Object.keys(ctx.overrides).length} override${Object.keys(ctx.overrides).length === 1 ? '' : 's'}.`);
  };
  const doImport = (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(String(reader.result));
        const src = data && typeof data === 'object' && data.overrides && typeof data.overrides === 'object' ? data.overrides : data;
        const clean = {};
        for (const [k, v] of Object.entries(src || {})) if (['sexual', 'unsure', 'general'].includes(v) && String(k).trim()) clean[String(k).trim().toLowerCase()] = v;
        const n = Object.keys(clean).length;
        if (!n) { setMsg('No overrides found in that file.'); return; }
        ctx.saveOverrides({ ...ctx.overrides, ...clean });
        setMsg(`Imported ${n} override${n === 1 ? '' : 's'} (merged with the ones already here; the file wins on clashes).`);
      } catch (err) { setMsg('That file isn’t a Shelf Life overrides file.'); }
    };
    reader.readAsText(file);
  };
  return html`<div>
    <div className="row">
      <button className="pill-btn" onClick=${doExport}>Export overrides</button>
      <button className="pill-btn" onClick=${() => fileRef.current && fileRef.current.click()}>Import overrides</button>
      <input ref=${fileRef} type="file" accept="application/json,.json" style=${{ display: 'none' }} onChange=${doImport} aria-label="Import overrides file" />
    </div>
    ${msg ? html`<div className="tiny muted" style=${{ marginTop: 8 }}>${msg}</div>` : null}
  </div>`;
}

// Every tag the rules class as sexual or unsure (plus any you've changed), most frequent first.
function TagReview({ model, onBack }) {
  const ctx = useContext(TagCtx);
  const [q, setQ] = useState('');
  const [show, setShow] = useState('all');
  const [limit, setLimit] = useState(80);
  const list = useMemo(() => [...model.tagInfo.values()]
    .filter(i => i.cls !== 'general' || ctx.overrides[i.tag.toLowerCase()])
    .sort((a, b) => b.count - a.count || a.tag.localeCompare(b.tag)), [model, ctx.overrides]);
  const ql = q.trim().toLowerCase();
  const rows = list.filter(i => {
    const eff = effectiveClass(i, ctx.overrides), changed = !!ctx.overrides[i.tag.toLowerCase()];
    if (show === 'changed' ? !changed : show !== 'all' && eff !== show) return false;
    return !ql || i.tag.toLowerCase().includes(ql);
  });
  useEffect(() => setLimit(80), [q, show]);
  const setClass = (info, cls) => {
    const key = info.tag.toLowerCase(), next = { ...ctx.overrides };
    if (cls === info.cls) delete next[key]; else next[key] = cls;   // only differences from the rules are stored
    ctx.saveOverrides(next);
  };
  const LABEL = { sexual: 'Sexual', unsure: 'Unsure', general: 'General' };
  return html`<div>
    <div className="row" style=${{ marginTop: 10, gap: 10, flexWrap: 'nowrap' }}>
      <button className="icon-btn" onClick=${onBack} aria-label="Back to Settings"><${Icon} name="back" size=${18} /></button>
      <h1 className="headline serif" style=${{ margin: 0 }}>Tag review</h1>
    </div>
    <div className="small faint" style=${{ margin: '8px 2px 12px' }}>Your choice beats the rules. Unsure tags count as general until you decide. Saved on this device; use Export / Import to copy them to another.</div>
    <div className="search-wrap"><${Icon} name="search" size=${17} /><input className="text-input" value=${q} onChange=${e => setQ(e.target.value)} placeholder="Search tags" aria-label="Search tags" /></div>
    <div className="chips" style=${{ marginTop: 10 }}>
      ${[['all', 'All'], ['sexual', 'Sexual'], ['unsure', 'Unsure'], ['general', 'General'], ['changed', 'Changed by you']].map(([k, l]) => html`<button key=${k} className=${'chip sm' + (show === k ? ' on' : '')} onClick=${() => setShow(k)}>${l}</button>`)}
    </div>
    <div className="card" style=${{ marginTop: 12, padding: '4px 16px' }}>
      ${!rows.length ? html`<div className="empty">No tags here.</div>` : rows.slice(0, limit).map(i => {
        const eff = effectiveClass(i, ctx.overrides), changed = !!ctx.overrides[i.tag.toLowerCase()];
        return html`<div className="tr-row" key=${i.tag}>
          <div className="tr-tag">${i.tag}</div>
          <div className="tiny faint">${fmtInt(i.count)} fic${i.count === 1 ? '' : 's'} · ${i.rule || 'no rule matched'}${changed ? html` · <span style=${{ color: 'var(--accent)', fontWeight: 700 }}>changed (rule says ${LABEL[i.cls].toLowerCase()})</span>` : ''}</div>
          <div className="row" style=${{ gap: 10 }}>
            <div className="seg sm" role="radiogroup" aria-label=${`Class for ${i.tag}`}>
              ${['sexual', 'unsure', 'general'].map(c => html`<button key=${c} role="radio" aria-checked=${eff === c} className=${(eff === c ? 'on ' : '') + 'cls-' + c} onClick=${() => setClass(i, c)}>${LABEL[c]}</button>`)}
            </div>
            ${changed ? html`<button className="link-btn" onClick=${() => setClass(i, i.cls)}>Reset</button>` : null}
          </div>
        </div>`;
      })}
    </div>
    ${limit < rows.length ? html`<button className="big-btn ghost" style=${{ marginTop: 14 }} onClick=${() => setLimit(l => l + 120)}>Show more (${fmtInt(rows.length - limit)} left)</button>` : null}
    <div className="card" style=${{ marginTop: 14 }}><${OverrideFileButtons} /></div>
  </div>`;
}

function SignInScreen({ onSignIn, ready, error, busy }) {
  return html`<div className="center-screen">
    <div style=${{ maxWidth: 360 }}>
      <div className="wordmark serif" style=${{ justifyContent: 'center', fontSize: 34 }}><${Mark} size=${34} />Shelf Life</div>
      <p className="muted" style=${{ margin: '14px 0 22px' }}>Your fic reading history across ${[...new Set(SOURCES.map(s => R.shortFandom(s.fandom)))].join(', ').replace(/, ([^,]*)$/, ' and $1')}. Shelf Life only reads your Sheets; it never changes them.</p>
      <button className="big-btn" onClick=${onSignIn} disabled=${!ready || busy}>${busy ? 'Loading your reading…' : ready ? 'Sign in with Google' : 'Loading…'}</button>
      ${error ? html`<p className="small" style=${{ color: 'var(--neg)', marginTop: 12 }}>${error}</p>` : null}
      <p className="tiny faint" style=${{ marginTop: 16 }}>You may see an "unverified app" warning — that's expected for a personal project. Tap Advanced → Go to (unsafe) to continue.</p>
    </div>
  </div>`;
}

function Mark({ size }) {
  const s = size || 22;
  const fandoms = [...new Set(SOURCES.map(x => x.fandom))];
  const three = [0, 1, 2].map(i => fandoms[i % fandoms.length]);
  return html`<span className="mark" style=${{ width: s, height: s, borderRadius: s * 0.32 }}>${three.map((f, i) => html`<span key=${i} style=${{ background: fandomColor(f) }}></span>`)}</span>`;
}

// ============================================================================================
// ROOT
// ============================================================================================
function App() {
  const auth = useAuth();
  const theme = useTheme();
  const [data, setData] = useState(null);
  const [booted, setBooted] = useState(false);
  const [sync, setSync] = useState({ state: 'idle' });
  const [tab, setTab] = useState('home');
  const [detail, setDetail] = useState(null);
  const [filters, setFilters] = useState(R.emptyFilters);
  const [ui, setUi] = useState({ sub: 'diary', filtersOpen: false, libView: 'cards' });
  const [groupBy, setGroupBy] = useState('fandom');
  const [settingsView, setSettingsView] = useState('main');
  // Sex-related tag toggle (remembered on this device; default off) and your tag overrides (IndexedDB).
  const [includeSex, setIncludeSexState] = useState(() => { try { return localStorage.getItem(SEXTAG_KEY) === '1'; } catch (e) { return false; } });
  const setIncludeSex = useCallback((v) => { setIncludeSexState(!!v); try { localStorage.setItem(SEXTAG_KEY, v ? '1' : '0'); } catch (e) {} }, []);
  const [overrides, setOverrides] = useState({});
  useEffect(() => { idb.get(OVERRIDES_KEY).then(o => { if (o && typeof o === 'object') setOverrides(o); }); }, []);
  const saveOverrides = useCallback((next) => { setOverrides(next); idb.put(OVERRIDES_KEY, next); }, []);
  const [dash, setDash] = useState({ period: 'thisMonth', compare: 'prev', custom: { start: '', end: '' } });
  const [now, setNow] = useState(Date.now());
  const dataRef = useRef(null);
  const syncingRef = useRef(false);
  const today = R.melbourneToday(new Date(now));

  useEffect(() => { const t = setInterval(() => setNow(Date.now()), 30000); return () => clearInterval(t); }, []);

  const doSync = useCallback(async (interactive) => {
    if (syncingRef.current) return;
    let tok = auth.getToken();
    if (!tok) {
      if (!interactive) { setSync({ state: 'needsAuth' }); return; }
      try { tok = await auth.signIn(); } catch (e) { setSync({ state: 'error', message: 'Sign-in didn’t finish.' }); return; }
    }
    syncingRef.current = true;
    setSync({ state: 'syncing' });
    try {
      const results = await Promise.allSettled(SOURCES.map(src => loadSource(tok, src)));
      const prev = dataRef.current;
      const sources = {}, errors = [];
      let authFailed = false;
      results.forEach((r, i) => {
        const src = SOURCES[i];
        if (r.status === 'fulfilled') sources[src.id] = r.value;
        else {
          if (r.reason && r.reason.isAuthError) authFailed = true;
          errors.push(`${R.sourceLabel(src, SOURCES)}: ${(r.reason && r.reason.message) || r.reason}`);
          if (prev && prev.sources && prev.sources[src.id]) sources[src.id] = { ...prev.sources[src.id], stale: true };
        }
      });
      if (authFailed) auth.expire();
      if (!results.some(r => r.status === 'fulfilled')) {
        setSync(authFailed ? { state: 'needsAuth', message: 'Your Google sign-in expired. Sign in again to sync.' } : { state: 'error', message: errors.join(' · ') });
        return;
      }
      const next = { version: DATA_VERSION, syncedAt: Date.now(), sources };
      dataRef.current = next;
      setData(next);
      setNow(Date.now());
      idb.put('dataset', next);
      setSync(errors.length ? { state: 'partial', message: errors.join(' · ') } : { state: 'ok' });
    } finally { syncingRef.current = false; }
  }, [auth.getToken, auth.signIn, auth.expire]);

  // Open instantly from the cache, then refresh in the background when there's a valid sign-in.
  useEffect(() => {
    (async () => {
      const cached = await idb.get('dataset');
      if (cached && cached.version === DATA_VERSION && cached.sources) { dataRef.current = cached; setData(cached); }
      setBooted(true);
      if (auth.getToken()) doSync(false);
      else if (cached) setSync({ state: 'needsAuth' });
    })();
  }, []);
  // Coming back to the app after a while: refresh quietly if signed in.
  useEffect(() => {
    const on = () => {
      if (document.visibilityState !== 'visible') return;
      setNow(Date.now());
      const d = dataRef.current;
      if (auth.getToken() && (!d || Date.now() - d.syncedAt > 15 * 60000)) doSync(false);
    };
    document.addEventListener('visibilitychange', on);
    return () => document.removeEventListener('visibilitychange', on);
  }, [doSync]);

  const model = useMemo(() => data ? R.buildModel(data.sources, SOURCES) : null, [data]);
  const hiddenTags = useMemo(() => {
    const set = new Set();
    if (model) for (const i of model.tagInfo.values()) if (effectiveClass(i, overrides) === 'sexual') set.add(i.tag);
    return set;
  }, [model, overrides]);
  const tagCtx = useMemo(() => ({
    include: includeSex, setInclude: setIncludeSex, hidden: hiddenTags,
    isVisible: (t) => includeSex || !hiddenTags.has(t), overrides, saveOverrides,
  }), [includeSex, setIncludeSex, hiddenTags, overrides, saveOverrides]);

  const loadSummary = useCallback(async (fic) => {
    const ck = 'summary:' + fic.key;
    const cached = await idb.get(ck);
    if (typeof cached === 'string') return cached;
    const tok = auth.getToken();
    if (!tok) { const e = new Error('Sign in to load the summary.'); e.needsAuth = true; throw e; }
    const meta = dataRef.current && dataRef.current.sources[fic.source];
    try {
      const text = await fetchSummary(tok, SOURCE_BY_ID[fic.source], meta, fic);
      idb.put(ck, text);
      return text;
    } catch (e) {
      if (e.isAuthError) { auth.expire(); const x = new Error('Your sign-in expired. Sign in again to load the summary.'); x.needsAuth = true; throw x; }
      throw new Error(e.moved ? e.message : 'Couldn’t load the summary. ' + e.message);
    }
  }, [auth.getToken, auth.expire]);

  const openAuthor = (a) => { setDetail(null); setFilters({ ...R.emptyFilters(), author: a }); setUi(u => ({ ...u, sub: 'library', filtersOpen: true })); setTab('diary'); window.scrollTo(0, 0); };
  const openTag = (t) => { setFilters({ ...R.emptyFilters(), tagsInc: [t] }); setUi(u => ({ ...u, sub: 'diary', filtersOpen: true })); setTab('diary'); window.scrollTo(0, 0); };
  const reset = async () => { await idb.clearExcept([OVERRIDES_KEY]); dataRef.current = null; setData(null); setSync({ state: auth.signedIn ? 'idle' : 'needsAuth' }); if (auth.getToken()) doSync(false); };
  const switchTab = (t) => { setTab(t); if (t !== 'settings') setSettingsView('main'); window.scrollTo(0, 0); };

  if (!booted) return html`<div className="center-screen faint">Opening your shelf…</div>`;
  if (!model) return html`<${SignInScreen} onSignIn=${() => doSync(true)} ready=${auth.ready || auth.signedIn} error=${auth.error || (sync.state === 'error' ? sync.message : '')} busy=${sync.state === 'syncing'} />`;

  const syncing = sync.state === 'syncing';
  const themeIcon = theme.mode === 'system' ? 'auto' : theme.mode === 'light' ? 'sun' : 'moon';
  return html`<${TagCtx.Provider} value=${tagCtx}><div>
    <header className="topbar"><div className="topbar-inner">
      <div className="wordmark serif"><${Mark} />Shelf Life</div>
      <div className="sync">
        <span className="num">${syncing ? 'Syncing…' : `Synced ${ago(data.syncedAt, now)}`}</span>
        <button className="icon-btn" onClick=${() => doSync(true)} disabled=${syncing} aria-label="Sync now" title="Sync now">
          <span className=${syncing ? 'spin' : ''} style=${{ display: 'inline-grid' }}><${Icon} name="sync" size=${16} /></span>
        </button>
        <button className="icon-btn" onClick=${theme.cycle} aria-label=${`Theme: ${theme.mode}`} title=${`Theme: ${theme.mode}`}><${Icon} name=${themeIcon} size=${16} /></button>
      </div>
    </div></header>

    <main className="shell">
      ${sync.state === 'needsAuth' ? html`<div className="banner warn row" style=${{ justifyContent: 'space-between' }}>
        <span>${sync.message || 'Showing your saved copy.'}</span><button className="pill-btn" onClick=${() => doSync(true)}>Sign in to sync</button></div>` : null}
      ${sync.state === 'error' || sync.state === 'partial' ? html`<div className="banner err">Sync ${sync.state === 'partial' ? 'partly ' : ''}failed — showing the last copy. ${sync.message}</div>` : null}

      ${tab === 'home' ? html`<${Dashboard} model=${model} today=${today} themeTick=${theme.tick} onOpen=${setDetail} onTag=${openTag} dash=${dash} setDash=${setDash} groupBy=${groupBy} setGroupBy=${setGroupBy} />` : null}
      ${tab === 'diary' ? html`<${DiaryScreen} model=${model} filters=${filters} setFilters=${setFilters} onOpen=${setDetail} today=${today} ui=${ui} setUi=${setUi} />` : null}
      ${tab === 'trends' ? html`<${TrendsScreen} model=${model} today=${today} themeTick=${theme.tick} onAuthor=${openAuthor} onTag=${openTag} groupBy=${groupBy} setGroupBy=${setGroupBy} />` : null}
      ${tab === 'export' ? html`<${ExportScreen} model=${model} filters=${filters} today=${today}
        goFilters=${() => { setUi(u => ({ ...u, filtersOpen: true })); switchTab('diary'); }} />` : null}
      ${tab === 'settings' ? html`<${SettingsScreen} model=${model} syncedAt=${data.syncedAt} auth=${auth} onSignIn=${() => doSync(true)} onReset=${reset} view=${settingsView} setView=${setSettingsView} />` : null}
    </main>

    <nav className="nav"><div className="nav-inner">
      ${[['home', 'home', 'Dashboard'], ['diary', 'diary', 'Diary'], ['trends', 'trends', 'Trends'], ['export', 'export', 'Export'], ['settings', 'settings', 'Settings']].map(([k, ic, label]) => html`<button key=${k} className=${tab === k ? 'on' : ''} onClick=${() => switchTab(k)} aria-current=${tab === k ? 'page' : null}><${Icon} name=${ic} size=${21} />${label}</button>`)}
    </div></nav>

    ${detail ? html`<${FicDetail} ficKey=${detail} model=${model} onClose=${() => setDetail(null)} loadSummary=${loadSummary} onAuthor=${openAuthor} today=${today} />` : null}
  </div></${TagCtx.Provider}>`;
}

if (window.Chart) {
  Chart.defaults.font.family = "'DM Sans', system-ui, sans-serif";
  Chart.defaults.font.size = 12;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
</body>
</html>
